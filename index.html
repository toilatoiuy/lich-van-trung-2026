                                                    {!hasError && it.password && (
                                                        <div className="flex items-center justify-between mt-1 text-xs text-slate-600">
                                                            <span className="truncate font-mono">🔑 {visibleIds[it.id] ? it.password : '••••••••'}</span>
                                                            <div className="flex items-center gap-2 shrink-0 ml-2">
                                                                <button onClick={() => toggleVisible(it.id)} className="text-slate-400 hover:text-slate-700" title="Hiện/Ẩn">{visibleIds[it.id] ? <EyeOff size={12}/> : <Eye size={12}/>}</button>
                                                                <button onClick={() => handleCopy(it.password)} className="text-slate-400 hover:text-slate-700" title="Sao chép"><Copy size={12}/></button>
                                                            </div>
                                                        </div>
                                                    )}
                                                    {!hasError && it.note && <p className="mt-1.5 text-[11px] text-slate-500 whitespace-pre-wrap">{it.note}</p>}
                                                </li>
                                            );
                                        })}
                                    </ul>
                                </div>
                                <div className="p-3 border-t bg-gray-50 shrink-0 flex flex-col gap-2">
                                    <button onClick={startNew} className="w-full flex items-center justify-center gap-2 bg-slate-900 text-white py-2.5 rounded-lg text-sm font-bold hover:bg-black transition"><Plus size={16}/> Thêm mục mới</button>
                                    <div className="flex gap-2">
                                        <button onClick={handleExportVault} className="flex-1 flex items-center justify-center gap-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg text-xs font-bold transition"><Download size={14}/> Xuất</button>
                                        <div className="flex-1 relative">
                                            <input type="file" accept=".json" onChange={handleImportVault} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                            <button className="w-full flex items-center justify-center gap-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-xs font-bold transition"><FileUp size={14}/> Nhập</button>
                                        </div>
                                    </div>
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        // ==============================================================
        // APP CHÍNH
        // ==============================================================
        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('calendar');
            const [app, setApp] = useState(null);
            const [showSettings, setShowSettings] = useState(false);
            const [showMenu, setShowMenu] = useState(false);
            const moreMenuRef = useRef(null);
            useEffect(() => {
                if (!showMenu) return;
                const handleClickOutside = (e) => {
                    if (moreMenuRef.current && !moreMenuRef.current.contains(e.target)) {
                        setShowMenu(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                document.addEventListener('touchstart', handleClickOutside);
                return () => {
                    document.removeEventListener('mousedown', handleClickOutside);
                    document.removeEventListener('touchstart', handleClickOutside);
                };
            }, [showMenu]);
            const [connectionError, setConnectionError] = useState(false);
            const [syncStatus, setSyncStatus] = useState('idle'); // 'idle' | 'syncing' | 'success' | 'error'
            const [lastSyncTime, setLastSyncTime] = useState(null);
            
            const [isOffline, setIsOffline] = useState(!navigator.onLine);
            const [showOfflineBadge, setShowOfflineBadge] = useState(false);

            const [dailyDate, setDailyDate] = useState(new Date());
            const [calendarCurrentDate, setCalendarCurrentDate] = useState(new Date());
            const [calendarSelectedDate, setCalendarSelectedDate] = useState(new Date());

            const [activeAlerts, setActiveAlerts] = useState([]);
            const [showAlertModal, setShowAlertModal] = useState(false);

            const [editingAlertId, setEditingAlertId] = useState(null);
            const [editAlertTitle, setEditAlertTitle] = useState('');
            const [editAlertTimeStr, setEditAlertTimeStr] = useState('');

            const [showSearch, setShowSearch] = useState(false);
            const headerRef = React.useRef(null);

            const [avatarUrl, setAvatarUrl] = useState(() => {
                try { return localStorage.getItem('vt_avatar_url') || null; } catch(e) { return null; }
            });

            const avatarInputRef = React.useRef(null);

            const handleAvatarChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const dataUrl = ev.target.result;
                    setAvatarUrl(dataUrl);
                    try { localStorage.setItem('vt_avatar_url', dataUrl); } catch(err) { console.warn("Lưu avatar thất bại:", err); }
                };
                reader.readAsDataURL(file);
            };

            const [lockPasswordHash, setLockPasswordHash] = useState('');
            const [lockEnabled, setLockEnabled] = useState(false);
            const [unlockedTabs, setUnlockedTabs] = useState({ todo: false, notes: false });

            const [completedAlerts, setCompletedAlerts] = useState(() => {
                try {
                    const saved = localStorage.getItem('vt_completed_alerts');
                    return saved ? normalizeAndPruneCompletedAlerts(JSON.parse(saved)) : {};
                } catch (e) {
                    return {};
                }
            });
            // Không còn cần dọn định kỳ nữa — mục đã tích được nhớ vĩnh viễn, không tự hết hạn.

            const DEFAULT_THEME = { bgColor: '#f3f4f6', noteColor: '#FEFCE8', textColor: '#1F2937', darkMode: false, bgMode: 'fixed', weekdayColors: DEFAULT_WEEKDAY_BG_COLORS };
            const [theme, setTheme] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('app_theme'));
                    if (saved && typeof saved === 'object') {
                        if (saved.darkMode === undefined) saved.darkMode = false;
                        if (saved.bgMode === undefined) saved.bgMode = 'fixed'; // tương thích dữ liệu cũ chưa có chế độ nền
                        if (!saved.weekdayColors) saved.weekdayColors = DEFAULT_WEEKDAY_BG_COLORS;
                        return saved;
                    }
                    return DEFAULT_THEME;
                } catch(e) {
                    return DEFAULT_THEME;
                }
            });

            // Áp dụng dark mode
            useEffect(() => {
                if (theme.darkMode) {
                    document.body.classList.add('dark-mode');
                } else {
                    document.body.classList.remove('dark-mode');
                }
            }, [theme.darkMode]);

            // Đồng hồ ngày hiện tại: cập nhật mỗi phút để màu nền tự đổi đúng lúc khi sang ngày mới
            // (áp dụng cho chế độ "Ngẫu nhiên mỗi ngày" và "Theo thứ") mà không cần tải lại trang.
            const [bgNow, setBgNow] = useState(() => new Date());
            useEffect(() => {
                const timer = setInterval(() => setBgNow(new Date()), 60000);
                return () => clearInterval(timer);
            }, []);
            const effectiveBgColor = useMemo(() => getEffectiveBgColor(theme, bgNow), [theme.bgMode, theme.bgColor, theme.weekdayColors, bgNow]);

            useEffect(() => {
                localStorage.setItem('vt_completed_alerts', JSON.stringify(completedAlerts));
            }, [completedAlerts]);

            useEffect(() => {
                const handleOnline = () => {
                    setIsOffline(false);
                    setShowOfflineBadge(true);
                    toast.success("Đã khôi phục kết nối mạng! Dữ liệu đang được đồng bộ tự động.", { position: "top-center" });
                    setTimeout(() => setShowOfflineBadge(false), 3000);
                };
                const handleOffline = () => {
                    setIsOffline(true);
                    setShowOfflineBadge(true);
                    toast.warning("Mất kết nối mạng! Ứng dụng chuyển sang chế độ ngoại tuyến.", { position: "top-center" });
                };

                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);

                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);

            // (Đăng ký Service Worker: xem effect dùng sự kiện 'load' bên dưới — gộp lại thành 1 nơi
            // duy nhất, tránh đăng ký trùng lặp 2 lần như trước đây)

            // Bộ đếm kiểm tra nhắc nhở cục bộ: chạy ngay khi mở app, mỗi 20 giây khi app đang mở,
            // và mỗi lần app được mở lại/chuyển từ nền lên (để bắt các nhắc nhở đã tới hạn trong lúc app đóng).
            useEffect(() => {
                checkDueReminders();
                const intervalId = setInterval(checkDueReminders, 20000);
                const handleVisibility = () => { if (document.visibilityState === 'visible') checkDueReminders(); };
                document.addEventListener('visibilitychange', handleVisibility);
                window.addEventListener('focus', checkDueReminders);
                return () => {
                    clearInterval(intervalId);
                    document.removeEventListener('visibilitychange', handleVisibility);
                    window.removeEventListener('focus', checkDueReminders);
                };
            }, []);

            useEffect(() => {
                const init = async () => {
                    try {
                        const newApp = initializeApp(MANUAL_CONFIG);
                        setApp(newApp);
                        const auth = getAuth(newApp);
                        const db = getFirestore(newApp);
                        
                        try {
                            await enableIndexedDbPersistence(db);
                        } catch (err) {
                            if (err.code === 'failed-precondition') {
                                console.warn("Firebase Offline Persistence failed-precondition");
                            } else if (err.code === 'unimplemented') {
                                console.warn("Firebase Offline Persistence unimplemented");
                            } else {
                                console.error("Firebase Offline Persistence Error:", err);
                            }
                        }

                        // Không request quyền ở đây, để trong ReminderSettings

                        onAuthStateChanged(auth, async (u) => {
                            setUser(u);
                            if (u) {
                                const docSnap = await getDoc(doc(db, 'artifacts', MANUAL_CONFIG.projectId, 'users', u.uid, 'settings', 'theme'));
                                if (docSnap.exists()) {
                                    const loadedTheme = docSnap.data();
                                    setTheme(prev => ({ ...prev, ...loadedTheme }));
                                    localStorage.setItem('app_theme', JSON.stringify({ ...loadedTheme }));
                                }
                                
                                const lockSnap = await getDoc(doc(db, 'artifacts', MANUAL_CONFIG.projectId, 'users', u.uid, 'settings', 'lock'));
                                if (lockSnap.exists()) {
                                    const lockData = lockSnap.data();
                                    setLockPasswordHash(lockData.appPasswordHash || '');
                                    setLockEnabled(lockData.enableLock || false);
                                } else {
                                    setLockPasswordHash('');
                                    setLockEnabled(false);
                                }
                                sessionStorage.setItem('vt_enable_lock', String(lockEnabled));

                                checkDailyEvents(db, u.uid);
                            }
                            setLoading(false);
                        });
                        setConnectionError(false);
                    } catch (e) {
                        console.warn("Lỗi kết nối khởi tạo hệ thống Google Firebase:", e);
                        setIsOffline(true);
                        setLoading(false);
                    }
                };
                init();
            }, []);

            // "Đồng bộ ngay": ép Firestore bật lại kết nối mạng và đợi tất cả các lần ghi
            // đang chờ (do lúc mất mạng bị xếp hàng nhờ IndexedDB persistence) được đẩy lên server.
            const handleSyncNow = async () => {
                if (!app) return;
                if (isOffline || !navigator.onLine) {
                    toast.warning("Đang ngoại tuyến — sẽ tự đồng bộ khi có mạng trở lại.", { position: "top-center" });
                    return;
                }
                setSyncStatus('syncing');
                try {
                    const db = getFirestore(app);
                    await enableNetwork(db);
                    await waitForPendingWrites(db);
                    setSyncStatus('success');
                    setLastSyncTime(new Date());
                    toast.success("Đã đồng bộ xong toàn bộ dữ liệu!", { position: "top-center" });
                } catch (err) {
                    console.error("Lỗi đồng bộ thủ công:", err);
                    setSyncStatus('error');
                    toast.error("Đồng bộ thất bại: " + (err.message || 'Lỗi không xác định, thử lại sau.'), { position: "top-center" });
                } finally {
                    setTimeout(() => setSyncStatus('idle'), 3000);
                }
            };

            const handleSignOut = async () => {
                const keysToRemove = ['vt_app_password_hash', 'vt_enable_lock', 'vt_vault_password_hash', 'vt_completed_alerts', 'app_theme', 'vt_avatar_url'];
                for (const key of keysToRemove) {
                    localStorage.removeItem(key);
                }
                sessionStorage.removeItem('vt_enable_lock');
                await signOut(getAuth(app));
            };

            const checkDailyEvents = async (db, uid) => {
                const alreadyNotifiedInSession = sessionStorage.getItem('vt_notified_session');
                if (alreadyNotifiedInSession === 'true') return;
                if (isCheckingDaily) return;
                isCheckingDaily = true;

                const today = new Date();
                const todayStr = today.toDateString();
                const eventsRef = collection(db, 'artifacts', MANUAL_CONFIG.projectId, 'users', uid, 'events');
                const todosRef = collection(db, 'artifacts', MANUAL_CONFIG.projectId, 'users', uid, 'todos');
                const notesRef = collection(db, 'artifacts', MANUAL_CONFIG.projectId, 'users', uid, 'notes');

                try {
                    const eventsSnap = await getDocs(eventsRef);
                    const todosSnap = await getDocs(todosRef);
                    const notesSnap = await getDocs(notesRef);
                    const allEvents = eventsSnap.docs.map(d => ({ id: d.id, type: 'Sự kiện', ...d.data() }));
                    const allTodos = todosSnap.docs.map(d => ({ id: d.id, type: 'Công việc', ...d.data() }));
                    // Ghi chú chỉ được coi là "đến hạn" khi có đặt giờ nhắc (reminderTime) — ghi chú
                    // không có giờ nhắc thì không phải việc "đến hạn", không đưa vào bảng thông báo.
                    const allNotes = notesSnap.docs
                        .map(d => ({ id: d.id, type: 'Ghi chú', ...d.data() }))
                        .filter(n => n.reminderTime);

                    const combined = [...allEvents, ...allTodos, ...allNotes];
                    const lunar = getLunarDetails(today);
                    const validAlerts = [];

                    combined.forEach(item => {
                        if (item.completed === true) return;
                        const storageCompleted = localStorage.getItem('vt_completed_alerts');
                        if (storageCompleted) {
                            const parsedObj = JSON.parse(storageCompleted);
                            if (isAlertMarkedCompleted(parsedObj, item.id)) return;
                        }

                        let isToday = false;
                        let isOverdue = false;
                        let targetTime = null;
                        const timeSource = item.date || item.deadlineTime || item.reminderTime;
                        if (timeSource) {
                            targetTime = new Date(timeSource.seconds * 1000);
                        }

                        if (item.type === 'Sự kiện') {
                            if (!item.repeat || item.repeat === 'none') {
                                isToday = targetTime && targetTime.toDateString() === todayStr;
                            } else if (item.repeat === 'lunar') {
                                isToday = item.lunarDay === lunar.day && item.lunarMonth === lunar.month;
                            } else if (item.repeat === 'solar' && targetTime) {
                                isToday = targetTime.getDate() === today.getDate() && targetTime.getMonth() === today.getMonth();
                            } else if (item.repeat === 'weekly' && targetTime) {
                                isToday = targetTime.getDay() === today.getDay();
                            } else if (item.repeat === 'monthly' && targetTime) {
                                isToday = targetTime.getDate() === today.getDate();
                            } else if (item.repeat === 'yearly' && targetTime) {
                                isToday = targetTime.getDate() === today.getDate() && targetTime.getMonth() === today.getMonth();
                            }
                        } else {
                            isToday = targetTime && targetTime.toDateString() === todayStr;
                            isOverdue = targetTime && targetTime < today && targetTime.toDateString() !== todayStr;
                        }

                        if (isToday || isOverdue) {
                            if (item.type === 'Sự kiện' && (!item.repeat || item.repeat === 'none') && targetTime) {
                                const itemHours = targetTime.getHours();
                                const itemMinutes = targetTime.getMinutes();
                                if (itemHours !== 0 || itemMinutes !== 0) {
                                    const currentHours = today.getHours();
                                    const currentMinutes = today.getMinutes();
                                    if (itemHours < currentHours || (itemHours === currentHours && itemMinutes < currentMinutes)) {
                                        return;
                                    }
                                }
                            }

                            let timeLabel = 'Cả ngày';
                            if (targetTime) {
                                if (isOverdue) {
                                    const daysDiff = Math.floor((today - targetTime) / (1000 * 60 * 60 * 24));
                                    timeLabel = daysDiff > 0 
                                        ? `Trễ ${daysDiff} ngày (${targetTime.toLocaleDateString('vi-VN', {day: '2-digit', month: '2-digit'})})`
                                        : `Quá hạn (${targetTime.toLocaleDateString('vi-VN', {day: '2-digit', month: '2-digit'})})`;
                                } else if (targetTime.getHours() !== 0 || targetTime.getMinutes() !== 0) {
                                    timeLabel = targetTime.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
                                }
                            }

                            validAlerts.push({
                                id: item.id,
                                title: item.title || item.text || (item.content ? item.content.slice(0, 60) : '') || "Lịch hẹn chưa đặt tên",
                                type: item.type,
                                rawTime: timeSource,
                                time: timeLabel
                            });
                        }
                    });

                    if (validAlerts.length > 0) {
                        setActiveAlerts(validAlerts);
                        setShowAlertModal(true);
                        validAlerts.forEach(alertItem => {
                            sendNotification(`🔔 ${alertItem.type}: ${alertItem.title}`, `Thời gian: ${alertItem.time}`);
                        });
                    }
                    sessionStorage.setItem('vt_notified_session', 'true');
                } catch (err) {
                    console.error("Lỗi quét dữ liệu thông báo:", err);
                } finally {
                    isCheckingDaily = false;
                }
            };

            const handleCheckAlertCompleted = (id) => {
                setCompletedAlerts(prev => {
                    const updated = { ...prev, [id]: { done: true, ts: Date.now() } };
                    setActiveAlerts(curr => curr.filter(alert => alert.id !== id));
                    return updated;
                });
            };

            const handleStartEditAlert = (alert) => {
                setEditingAlertId(alert.id);
                setEditAlertTitle(alert.title);
                const rawDate = alert.rawTime ? new Date(alert.rawTime.seconds * 1000) : new Date();
                if (alert.type === 'Sự kiện') {
                    const yyyy = rawDate.getFullYear();
                    const mm = String(rawDate.getMonth() + 1).padStart(2, '0');
                    const dd = String(rawDate.getDate()).padStart(2, '0');
                    setEditAlertTimeStr(`${yyyy}-${mm}-${dd}`);
                } else {
                    setEditAlertTimeStr(formatDateTimeForInput(rawDate));
                }
            };

            const handleSaveAlertEdit = async (alert) => {
                if (!editAlertTitle.trim()) { toast.error("Vui lòng nhập tên.", { position: "top-center" }); return; }
                if (editAlertTimeStr && isNaN(new Date(editAlertTimeStr).getTime())) {
                    toast.error("Thời gian không hợp lệ, vui lòng kiểm tra lại.", { position: "top-center" });
                    return;
                }
                const db = getFirestore(app);
                const targetCollection = alert.type === 'Sự kiện' ? 'events' : (alert.type === 'Ghi chú' ? 'notes' : 'todos');
                const docRef = doc(db, 'artifacts', MANUAL_CONFIG.projectId, 'users', user.uid, targetCollection, alert.id);

                try {
                    // Tạo Timestamp bên trong try để không bao giờ có lỗi lọt ra ngoài khối bắt lỗi
                    const newTimestamp = editAlertTimeStr ? Timestamp.fromDate(new Date(editAlertTimeStr)) : null;

                    if (alert.type === 'Sự kiện') {
                        const updateData = { title: editAlertTitle };
                        if (newTimestamp) updateData.date = newTimestamp;
                        await updateDoc(docRef, updateData);
                    } else if (alert.type === 'Ghi chú') {
                        const updateData = { title: editAlertTitle };
                        if (newTimestamp) updateData.reminderTime = newTimestamp;
                        await updateDoc(docRef, updateData);
                    } else {
                        const updateData = { text: editAlertTitle };
                        if (newTimestamp) {
                            updateData.deadlineTime = newTimestamp;
                        }
                        await updateDoc(docRef, updateData);
                    }

                    setActiveAlerts(curr => curr.map(item => {
                        if (item.id === alert.id) {
                            const updatedDate = newTimestamp ? new Date(newTimestamp.seconds * 1000) : new Date();
                            const displayTime = updatedDate && (updatedDate.getHours() !== 0 || updatedDate.getMinutes() !== 0)
                                ? updatedDate.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
                                : 'Cả ngày';
                            return { ...item, title: editAlertTitle, rawTime: newTimestamp, time: displayTime };
                        }
                        return item;
                    }));
                    setEditingAlertId(null);
                    toast.info("Đã lưu thay đổi.", { position: "top-center" });
                } catch (e) {
                    console.error("Lỗi cập nhật dữ liệu từ Modal cảnh báo:", e);
                    toast.error("Không thể lưu thay đổi: " + (e.message || 'lỗi không xác định, vui lòng thử lại.'), { position: "top-center" });
                }
            };

            const handleSaveTheme = async (newTheme) => {
                setTheme(newTheme);
                // Lưu ý: KHÔNG gọi setShowSettings(false) ở đây nữa.
                // Hàm này được gọi mỗi khi tự động lưu & đồng bộ màu nền (chọn "Tùy chọn"/
                // "Ngẫu nhiên"/"Theo thứ", bấm ra ngoài bảng màu, bấm "Đặt và đồng bộ", bật/tắt
                // Dark Mode...) — nếu đóng Cài đặt ở đây thì mỗi lần thao tác sẽ bị thoát khỏi
                // khung Cài đặt ngay lập tức. Khung Cài đặt giờ chỉ đóng khi người dùng bấm nút "X".
                try {
                    localStorage.setItem('app_theme', JSON.stringify(newTheme));
                } catch (e) {
                    console.error("Lỗi lưu local theme:", e);
                }
                if (user) await setDoc(doc(getFirestore(app), 'artifacts', MANUAL_CONFIG.projectId, 'users', user.uid, 'settings', 'theme'), newTheme);
            };

            const [tkbResetKey, setTkbResetKey] = useState(0);

            const handleTabChange = (tab) => {
                if (tab === 'day') {
                    setDailyDate(new Date()); 
                } else if (tab === 'calendar') {
                    setCalendarCurrentDate(new Date()); 
                    setCalendarSelectedDate(new Date()); 
                } else if (tab === 'timetable') {
                    setTkbResetKey(k => k + 1);
                }
                setUnlockedTabs({ todo: false, notes: false });
                setActiveTab(tab);
            };

            const handleUnlockTab = (tab) => {
                setUnlockedTabs(prev => ({ ...prev, [tab]: true }));
            };

            const [searchTarget, setSearchTarget] = useState(null);

            const handleSearchNavigate = (type, item, keyword) => {
                if (type === 'calendar' && item.date) {
                    // Với "Sự kiện khác (có lặp)": ngày hiển thị trong kết quả tìm kiếm là ngày GỐC,
                    // nhưng bấm vào thì vẫn nên nhảy tới đúng lần lặp SẮP TỚI (hữu ích hơn là nhảy về
                    // ngày gốc có thể đã từ nhiều năm trước) — dùng __navSeconds nếu có.
                    const seconds = (typeof item.__navSeconds === 'number') ? item.__navSeconds : item.date.seconds;
                    const d = new Date(seconds * 1000);
                    setCalendarCurrentDate(new Date(d.getFullYear(), d.getMonth(), 1));
                    setCalendarSelectedDate(d);
                    setActiveTab('calendar');
                    setSearchTarget(null);
                } else if (type === 'todo') {
                    if (lockEnabled && lockPasswordHash && !unlockedTabs.todo) {
                        setSearchTarget({ tab: 'todo', itemId: item.id, keyword, pendingLock: true });
                    } else {
                        setSearchTarget({ tab: 'todo', itemId: item.id, keyword });
                    }
                    setActiveTab('todo');
                } else if (type === 'notes') {
                    if (lockEnabled && lockPasswordHash && !unlockedTabs.notes) {
                        setSearchTarget({ tab: 'notes', itemId: item.id, keyword, pendingLock: true });
                    } else {
                        setSearchTarget({ tab: 'notes', itemId: item.id, keyword });
                    }
                    setActiveTab('notes');
                } else if (type === 'timetable') {
                    setSearchTarget({ tab: 'timetable', itemId: item.id, weekDocId: item.weekDocId, keyword });
                    setActiveTab('timetable');
                } else {
                    setActiveTab(type);
                    setSearchTarget(null);
                }
            };

            useEffect(() => {
                if ('serviceWorker' in navigator) {
                    window.addEventListener('load', () => {
                        navigator.serviceWorker.register('./sw.js')
                            .then(reg => console.log('Đăng ký Service Worker thành công:', reg.scope))
                            .catch(err => console.log('Lỗi đăng ký Service Worker:', err));
                    });
                }
            }, []);

            // Lưới an toàn cho các lỗi Firestore/mạng không được try/catch bắt riêng ở nơi gọi:
            // thay vì im lặng thất bại, hiển thị 1 thông báo rõ ràng cho người dùng biết để thử lại.
            useEffect(() => {
                const handleUnhandledRejection = (event) => {
                    const msg = (event.reason && (event.reason.message || String(event.reason))) || '';
                    // Bỏ qua các lỗi không liên quan tới Firestore/mạng (vd lỗi cú pháp lập trình)
                    if (/firestore|network|offline|unavailable|permission-denied|deadline-exceeded/i.test(msg)) {
                        toast.error("Có lỗi xảy ra khi đồng bộ dữ liệu, vui lòng thử lại: " + msg, { position: "top-center" });
                    }
                };
                window.addEventListener('unhandledrejection', handleUnhandledRejection);
                return () => window.removeEventListener('unhandledrejection', handleUnhandledRejection);
            }, []);

            // Phím tắt toàn cục: tìm kiếm (Ctrl+K, /) và đóng menu/overlay đang mở bằng phím Esc
            useEffect(() => {
                const handleGlobalShortcut = (e) => {
                    if (e.key === 'Escape') {
                        // Ưu tiên đóng lần lượt các overlay cấp app đang mở (không đụng tới các modal con
                        // đã có onClose riêng của chúng, để tránh xung đột với logic đóng sẵn có)
                        if (showSearch) { setShowSearch(false); return; }
                        if (showMenu) { setShowMenu(false); return; }
                        if (showSettings) { setShowSettings(false); return; }
                        return;
                    }

                    const isCtrlK = (e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K');
                    const isSlash = e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey;
                    if (!isCtrlK && !isSlash) return;

                    const target = e.target;
                    const tag = target && target.tagName;
                    const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (target && target.isContentEditable);
                    if (isTyping) return;

                    e.preventDefault();
                    setShowSearch(true);
                };
                window.addEventListener('keydown', handleGlobalShortcut);
                return () => window.removeEventListener('keydown', handleGlobalShortcut);
            }, []);

            if (loading) return <AppSkeleton />;
            if (!user) return <div className="animate-fade-in"><AuthScreen auth={getAuth(app)} appId={MANUAL_CONFIG.projectId} /></div>;

            return (
                <div className="flex flex-col h-screen max-w-md mx-auto shadow-2xl overflow-hidden relative transition-colors duration-300 animate-fade-in" style={{
                    backgroundColor: effectiveBgColor,
                    color: theme.textColor,
                    fontFamily: theme.fontFamily || undefined,
                    fontWeight: theme.fontBold ? 'bold' : undefined,
                    fontStyle: theme.fontItalic ? 'italic' : undefined,
                    textDecoration: theme.fontUnderline ? 'underline' : undefined,
                    fontSize: theme.fontSize ? `${theme.fontSize}px` : undefined,
                }}>
                    <div ref={headerRef}>
                    {isOffline && (
                        <div className="bg-amber-500 text-white text-[10px] font-black uppercase text-center py-1 flex items-center justify-center gap-1.5 shrink-0 select-none animate-pulse">
                            <WifiOff size={10} /> Đang chạy ngoại tuyến (Offline Mode)
                        </div>
                    )}
                    {showOfflineBadge && !isOffline && (
                        <div className="bg-emerald-600 text-white text-[10px] font-black uppercase text-center py-1 flex items-center justify-center gap-1.5 shrink-0 select-none">
                            <Wifi size={10} /> Đã khôi phục kết nối trực tuyến (Online)
                        </div>
                    )}

                    <header className="bg-blue-600 text-white p-2 flex justify-between items-center shadow-md z-20 shrink-0">
                        <div className="flex items-center gap-2 shrink-0">
                            <button
                                onClick={() => avatarInputRef.current && avatarInputRef.current.click()}
                                className="relative shrink-0 w-9 h-9 rounded-full overflow-hidden border-2 border-blue-300 hover:border-white transition group"
                                title="Bấm để đổi ảnh đại diện"
                            >
                                {avatarUrl ? (
                                    <img src={avatarUrl} alt="Ảnh đại diện" loading="lazy" decoding="async" className="w-full h-full object-cover" />
                                ) : (
                                    <div className="w-full h-full bg-blue-500 flex items-center justify-center">
                                        <User size={18} className="text-blue-200 group-hover:text-white transition" />
                                    </div>
                                )}
                                <div className="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
                                    <span className="text-[8px] text-white font-bold leading-tight text-center">Đổi<br/>ảnh</span>
                                </div>
                            </button>
                            <input
                                ref={avatarInputRef}
                                type="file"
                                accept="image/*"
                                className="hidden"
                                onChange={handleAvatarChange}
                            />
                            <div className="flex flex-col overflow-hidden">
                                <h1 className="text-base font-bold whitespace-nowrap truncate font-sans leading-tight">Lịch đa năng</h1>
                                <span className="text-[10px] text-blue-100 opacity-80 font-sans">Thiết kế bởi Văn Trung</span>
                            </div>
                        </div>
                        <button
                            onClick={() => setShowSearch(true)}
                            className="flex-1 mx-3 flex items-center gap-2 bg-blue-500/50 hover:bg-blue-500/80 border border-blue-400/50 rounded-full px-3 py-1.5 transition min-w-0 max-w-[160px]"
                            title="Tìm kiếm toàn cục"
                            aria-label="Tìm kiếm toàn cục (Ctrl+K)"
                        >
                            <Search size={14} className="text-blue-200 shrink-0" />
                            <span className="text-[11px] text-blue-200 truncate font-sans">Tìm kiếm...</span>
                            <span className="flex items-center ml-auto text-blue-100 shrink-0" title="Có hỗ trợ tìm kiếm/ra lệnh bằng AI">
                                <Sparkles size={16}/>
                            </span>
                        </button>
                        <div className="flex gap-2 items-center shrink-0">
                            <button onClick={() => setShowSettings(true)} aria-label="Mở cài đặt" className="p-1.5 hover:bg-blue-700 rounded-full transition"><Settings size={18} /></button>
                        </div>
                    </header>
                    </div>

                    <main className="flex-1 overflow-y-auto relative flex flex-col" style={{ backgroundColor: effectiveBgColor }}>
                        <div className="tab-fade-in" style={{ display: activeTab === 'day' ? 'flex' : 'none', flex: 1, flexDirection: 'column' }}>
                            <DailyView 
                                user={user} 
                                db={getFirestore(app)} 
                                appId={MANUAL_CONFIG.projectId} 
                                today={dailyDate} 
                                setToday={setDailyDate} 
                                activeTab={activeTab}
                            />
                        </div>

                        <div className="tab-fade-in" style={{ display: activeTab === 'calendar' ? 'block' : 'none' }}>
                            <CalendarView 
                                user={user} 
                                db={getFirestore(app)} 
                                appId={MANUAL_CONFIG.projectId} 
                                currentDate={calendarCurrentDate} 
                                setCurrentDate={setCalendarCurrentDate} 
                                selectedDate={calendarSelectedDate} 
                                setSelectedDate={setCalendarSelectedDate}
                                onTabChange={handleTabChange}
                                theme={theme}
                                activeTab={activeTab}
                            />
                        </div>

                        <div className="tab-fade-in" style={{ display: activeTab === 'todo' ? 'block' : 'none', height: '100%' }}>
                            {lockEnabled && lockPasswordHash && !unlockedTabs.todo ? (
                                <LockScreen 
                                    correctPassword={lockPasswordHash} 
                                    lockKey="todo" 
                                    onUnlock={() => {
                                        handleUnlockTab('todo');
                                        if (searchTarget?.pendingLock && searchTarget?.tab === 'todo') {
                                            setSearchTarget(prev => ({ ...prev, pendingLock: false }));
                                        }
                                    }}
                                    db={getFirestore(app)}
                                    appId={MANUAL_CONFIG.projectId}
                                    user={user}
                                />
                            ) : (
                                <TodoView user={user} db={getFirestore(app)} appId={MANUAL_CONFIG.projectId} theme={theme} searchTarget={searchTarget} onSearchTargetClear={() => setSearchTarget(null)} activeTab={activeTab} />
                            )}
                        </div>

                        <div className="tab-fade-in" style={{ display: activeTab === 'notes' ? 'block' : 'none', height: '100%' }}>
                            {lockEnabled && lockPasswordHash && !unlockedTabs.notes ? (
                                <LockScreen 
                                    correctPassword={lockPasswordHash} 
                                    lockKey="notes" 
                                    onUnlock={() => {
                                        handleUnlockTab('notes');
                                        if (searchTarget?.pendingLock && searchTarget?.tab === 'notes') {
                                            setSearchTarget(prev => ({ ...prev, pendingLock: false }));
                                        }
                                    }}
                                    db={getFirestore(app)}
                                    appId={MANUAL_CONFIG.projectId}
                                    user={user}
                                />
                            ) : (
                                <NotesView user={user} db={getFirestore(app)} appId={MANUAL_CONFIG.projectId} theme={theme} searchTarget={searchTarget} onSearchTargetClear={() => setSearchTarget(null)} activeTab={activeTab} />
                            )}
                        </div>

                        <div className="tab-fade-in" style={{ display: activeTab === 'timetable' ? 'flex' : 'none', flex: 1, flexDirection: 'column' }}>
                            <TimeTableView key={tkbResetKey} user={user} db={getFirestore(app)} appId={MANUAL_CONFIG.projectId} theme={theme} searchTarget={searchTarget} onSearchTargetClear={() => setSearchTarget(null)} activeTab={activeTab} />
                        </div>
                    </main>

                    <nav className="w-full bg-white border-t flex justify-around py-3 shadow-lg z-20 relative shrink-0" role="navigation" aria-label="Điều hướng chính">
                        <button onClick={()=>handleTabChange('day')} aria-current={activeTab==='day' ? 'page' : undefined} aria-label="Hôm Nay" className={activeTab==='day'?'text-blue-600 font-semibold':'text-gray-400'}>
                            <div className="flex flex-col items-center"><CalendarDays size={22}/><span className="text-[9px] mt-1 text-slate-500 font-sans">Hôm Nay</span></div>
                        </button>
                        <button onClick={()=>handleTabChange('calendar')} aria-current={activeTab==='calendar' ? 'page' : undefined} aria-label="Lịch" className={activeTab==='calendar'?'text-blue-600 font-semibold':'text-gray-400'}>
                            <div className="flex flex-col items-center"><Calendar size={22}/><span className="text-[9px] mt-1 text-slate-500 font-sans">Lịch</span></div>
                        </button>
                        <button onClick={()=>handleTabChange('todo')} aria-current={activeTab==='todo' ? 'page' : undefined} aria-label="Việc làm" className={activeTab==='todo'?'text-blue-600 font-semibold':'text-gray-400'}>
                            <div className="flex flex-col items-center"><CheckSquare size={22}/><span className="text-[9px] mt-1 text-slate-500 font-sans">Việc làm</span></div>
                        </button>
                        <button onClick={()=>handleTabChange('notes')} aria-current={activeTab==='notes' ? 'page' : undefined} aria-label="Ghi chú" className={activeTab==='notes'?'text-blue-600 font-semibold':'text-gray-400'}>
                            <div className="flex flex-col items-center"><StickyNote size={22}/><span className="text-[9px] mt-1 text-slate-500 font-sans">Ghi chú</span></div>
                        </button>
                        
                        <div className="relative" ref={moreMenuRef}>
                            <button onClick={()=>setShowMenu(!showMenu)} aria-haspopup="true" aria-expanded={showMenu} aria-label="Thêm tùy chọn" className={`text-gray-400 ${showMenu ? 'text-blue-600' : ''}`}><div className="flex flex-col items-center"><MoreVertical size={22}/><span className="text-[9px] mt-1 text-slate-500 font-sans">Thêm</span></div></button>
                            {showMenu && (
                                <div className="absolute bottom-12 right-0 bg-white shadow-xl rounded-lg border w-56 overflow-hidden fade-in z-50" role="menu">
                                    <button onClick={()=>{handleTabChange('timetable'); setShowMenu(false);}} className="flex items-center gap-2 w-full px-4 py-3 hover:bg-gray-50 text-sm text-gray-700 text-left font-sans">
                                        <Table size={16}/> Lịch biểu
                                    </button>
                                    <button
                                        onClick={handleSyncNow}
                                        disabled={syncStatus === 'syncing' || isOffline}
                                        aria-label="Đồng bộ dữ liệu ngay bây giờ"
                                        className="flex items-center gap-2 w-full px-4 py-3 hover:bg-gray-50 text-sm text-gray-700 text-left font-sans border-t disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        {isOffline ? <WifiOff size={16} className="text-red-400"/> : <RefreshCw size={16} className={syncStatus === 'syncing' ? 'animate-spin text-blue-500' : ''}/>}
                                        <span className="flex-1 min-w-0">
                                            <span className="block truncate">
                                                {isOffline ? 'Đang ngoại tuyến' : syncStatus === 'syncing' ? 'Đang đồng bộ...' : syncStatus === 'success' ? 'Đã đồng bộ!' : syncStatus === 'error' ? 'Đồng bộ lỗi' : 'Đồng bộ ngay'}
                                            </span>
                                            {!isOffline && lastSyncTime && syncStatus === 'idle' && (
                                                <span className="block text-[10px] text-gray-400 font-normal">Lần cuối: {lastSyncTime.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'})}</span>
                                            )}
                                        </span>
                                    </button>
                                </div>
                            )}
                        </div>
                    </nav>

                    {showSettings && <SettingsModal theme={theme} onSave={handleSaveTheme} onClose={()=>setShowSettings(false)} auth={getAuth(app)} db={getFirestore(app)} appId={MANUAL_CONFIG.projectId} onSignOut={handleSignOut} user={user} />}
                    
                    {showSearch && app && user && (
                        <GlobalSearchModal
                            onClose={() => setShowSearch(false)}
                            db={getFirestore(app)}
                            user={user}
                            appId={MANUAL_CONFIG.projectId}
                            onNavigate={handleSearchNavigate}
                            headerRef={headerRef}
                        />
                    )}
                    
                    {showAlertModal && activeAlerts.length > 0 && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                                <div className="bg-blue-600 p-4 text-white flex items-center gap-3 shrink-0 font-sans">
                                    <Bell className="animate-bounce" size={24} />
                                    <div className="min-w-0 flex-1">
                                        <h3 className="font-bold text-base leading-tight">Lịch trình hôm nay</h3>
                                        <p className="text-[10px] opacity-80 font-medium text-slate-100">Bấm bút chì để sửa nhanh nội dung</p>
                                    </div>
                                </div>
                                <div className="p-5 max-h-[50vh] overflow-y-auto space-y-3 no-scrollbar bg-slate-50 font-sans">
                                    {activeAlerts.map((alert, index) => {
                                        const isEditingThis = editingAlertId === alert.id;
                                        return (
                                            <div key={alert.id || index} className="flex flex-col gap-2 bg-white p-3.5 rounded-xl border border-slate-100 shadow-sm">
                                                {isEditingThis ? (
                                                    <div className="flex flex-col gap-2 animate-in fade-in duration-200">
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-[9px] font-black uppercase tracking-wider px-1.5 py-0.5 rounded bg-blue-50 text-blue-600 border border-blue-100 shrink-0">{alert.type}</span>
                                                            <span className="text-[10px] text-slate-400 font-bold">Chỉnh sửa</span>
                                                        </div>
                                                        <input 
                                                            type="text"
                                                            value={editAlertTitle}
                                                            onChange={(ev) => setEditAlertTitle(ev.target.value)}
                                                            className="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-sm text-slate-800 focus:ring-1 focus:ring-blue-500 outline-none font-bold"
                                                            placeholder="Nhập tên mới..."
                                                        />
                                                        <div className="flex items-center gap-2">
                                                            {alert.type === 'Sự kiện' ? (
                                                                <input 
                                                                    type="date"
                                                                    value={editAlertTimeStr}
                                                                    onChange={(ev) => setEditAlertTimeStr(ev.target.value)}
                                                                    className="flex-1 px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs text-slate-800 focus:ring-1 focus:ring-blue-500 outline-none"
                                                                />
                                                            ) : (
                                                                <input 
                                                                    type="datetime-local"
                                                                    value={editAlertTimeStr}
                                                                    onChange={(ev) => setEditAlertTimeStr(ev.target.value)}
                                                                    className="flex-1 px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs text-slate-800 focus:ring-1 focus:ring-blue-500 outline-none font-sans"
                                                                />
                                                            )}
                                                            <div className="flex items-center gap-1 shrink-0">
                                                                <button 
                                                                    onClick={() => setEditingAlertId(null)}
                                                                    className="p-1.5 hover:bg-slate-100 text-slate-400 hover:text-slate-600 rounded-lg transition"
                                                                    title="Hủy"
                                                                >
                                                                    <X size={16} />
                                                                </button>
                                                                <button 
                                                                    onClick={() => handleSaveAlertEdit(alert)}
                                                                    className="p-1.5 bg-green-50 text-green-600 hover:bg-green-100 rounded-lg transition"
                                                                    title="Lưu thay đổi"
                                                                >
                                                                    <Check size={16} strokeWidth={2.5} />
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div className="flex items-start gap-3 transition-all">
                                                        <button 
                                                            onClick={() => handleCheckAlertCompleted(alert.id)}
                                                            className="w-5 h-5 rounded border border-slate-300 hover:border-green-500 bg-white flex items-center justify-center text-green-600 mt-1 shrink-0 transition"
                                                            title="Tích để hoàn thành"
                                                        >
                                                            <div className="w-2.5 h-2.5 rounded bg-transparent group-hover:bg-green-100 transition-colors"></div>
                                                        </button>
                                                        
                                                        <div className="flex-1 min-w-0">
                                                            <div className="flex items-center gap-2 mb-1">
                                                                <span className="text-[9px] font-black uppercase tracking-wider px-1.5 py-0.5 rounded bg-blue-50 text-blue-600 border border-blue-100 shrink-0">{alert.type}</span>
                                                                <p className="text-[10px] text-slate-400 font-medium flex items-center gap-1"><Clock size={11} /> {alert.time}</p>
                                                            </div>
                                                            <p className="font-bold text-slate-800 text-sm truncate">{alert.title}</p>
                                                        </div>

                                                        <button 
                                                            onClick={() => handleStartEditAlert(alert)}
                                                            className="p-1.5 hover:bg-slate-100 text-slate-400 hover:text-blue-600 rounded-lg transition shrink-0 self-center"
                                                            title="Sửa"
                                                        >
                                                            <Pencil size={14} />
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="p-4 border-t bg-slate-50 flex justify-end shrink-0">
                                    <button 
                                        onClick={() => setShowAlertModal(false)}
                                        className="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-2.5 px-6 rounded-xl shadow-md transition-all active:scale-95 font-sans"
                                    >
                                        Đã hiểu
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {connectionError && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white p-6 rounded-lg shadow-xl text-center max-w-xs w-full">
                                <WifiOff size={48} className="text-red-500 mx-auto mb-2" />
                                <h3 className="font-bold text-slate-800 text-base font-sans">Lỗi kết nối Firebase</h3>
                                <p className="text-xs text-gray-500 mb-4 font-sans">Chúng tôi tạm thời không kết nối được với dữ liệu đám mây. Bạn vẫn có thể tiếp tục sử dụng ứng dụng ở chế độ Offline.</p>
                                <div className="flex gap-2">
                                    <button onClick={() => setConnectionError(false)} className="flex-1 bg-gray-200 hover:bg-gray-300 text-slate-700 py-2 rounded-xl text-xs font-bold transition font-sans">Bỏ qua (Chạy Offline)</button>
                                    <button onClick={() => window.location.reload()} className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-xs font-bold transition font-sans">Thử lại</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    <ToastContainer 
                        position="top-center"
                        autoClose={3000}
                        hideProgressBar={false}
                        newestOnTop={false}
                        closeOnClick
                        rtl={false}
                    />
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
