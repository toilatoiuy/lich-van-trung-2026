<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lịch Vạn Niên & Trợ Lý Bảo Mật</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp, query } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        window.FirebaseSDK = { 
            initializeApp, getAuth, signInWithCustomToken, signInAnonymously, 
            onAuthStateChanged, getFirestore, collection, doc, addDoc, 
            updateDoc, deleteDoc, onSnapshot, serverTimestamp, query 
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .lunar-day { font-size: 0.65rem; color: #94a3b8; }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    </style>
</head>
<body class="bg-slate-50 overflow-x-hidden">
    <div id="root"></div>

    <script type="babel">
        const { useState, useEffect, useMemo } = React;
        const { 
            Calendar: CalendarIcon, StickyNote, Table, Settings, 
            ChevronLeft, ChevronRight, Plus, Trash2, CheckCircle2, 
            Menu, X, Bell, Shield, Moon, Sun, Info, WifiOff, Loader2 
        } = lucide;

        // --- Mock Lunar Conversion (Hàm giả lập âm lịch đơn giản) ---
        const getLunarDate = (d, m, y) => {
            const lunarDay = ((d + m * 2) % 30) || 1;
            return { day: lunarDay, month: m === 12 ? 1 : m + 1 };
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('calendar'); // 'calendar', 'notes', 'timetable'
            const [currentDate, setCurrentDate] = useState(new Date());
            const [notes, setNotes] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showMenu, setShowMenu] = useState(false);
            const [error, setError] = useState(null);

            // Firebase setup
            const firebaseConfig = JSON.parse(__firebase_config);
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

            useEffect(() => {
                const { initializeApp, getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, getFirestore } = window.FirebaseSDK;
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);

                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Auth Error:", err);
                        setError("Lỗi xác thực.");
                    }
                };

                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if (!u) setLoading(false);
                });

                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const { getFirestore, collection, onSnapshot } = window.FirebaseSDK;
                const db = getFirestore();
                
                // Rule 1: /artifacts/{appId}/users/{userId}/{collectionName}
                const notesRef = collection(db, 'artifacts', appId, 'users', user.uid, 'notes');
                
                const unsub = onSnapshot(notesRef, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setNotes(data.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
                    setLoading(false);
                }, (err) => {
                    console.error(err);
                    setError("Không thể tải dữ liệu.");
                    setLoading(false);
                });

                return () => unsub();
            }, [user]);

            const handleAddNote = async (text) => {
                if (!text.trim() || !user) return;
                const { getFirestore, collection, addDoc, serverTimestamp } = window.FirebaseSDK;
                const db = getFirestore();
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'notes'), {
                        text,
                        completed: false,
                        createdAt: serverTimestamp()
                    });
                } catch (e) { setError("Lỗi lưu trữ."); }
            };

            const toggleNote = async (id, status) => {
                const { getFirestore, doc, updateDoc } = window.FirebaseSDK;
                const db = getFirestore();
                await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'notes', id), { completed: !status });
            };

            const deleteNote = async (id) => {
                const { getFirestore, doc, deleteDoc } = window.FirebaseSDK;
                const db = getFirestore();
                await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'notes', id));
            };

            // Calendar Logic
            const daysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
            const firstDayOfMonth = (year, month) => new Date(year, month, 1).getDay();

            const renderCalendar = () => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const totalDays = daysInMonth(year, month);
                const startDay = firstDayOfMonth(year, month);
                const prevMonthDays = daysInMonth(year, month - 1);
                
                const days = [];
                // Days from prev month
                for (let i = startDay - 1; i >= 0; i--) {
                    days.push({ day: prevMonthDays - i, current: false });
                }
                // Days from current month
                for (let i = 1; i <= totalDays; i++) {
                    days.push({ day: i, current: true, today: i === new Date().getDate() && month === new Date().getMonth() && year === new Date().getFullYear() });
                }
                
                return days;
            };

            if (loading) return (
                <div className="h-screen flex flex-col items-center justify-center bg-white">
                    <div className="w-16 h-16 border-4 border-red-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p className="text-gray-500 font-medium">Đang khởi tạo ứng dụng...</p>
                </div>
            );

            return (
                <div className="min-h-screen pb-20">
                    {/* Header */}
                    <header className="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-100 px-4 py-3 flex items-center justify-between">
                        <div className="flex items-center gap-2">
                            <div className="bg-red-600 p-1.5 rounded-lg">
                                <CalendarIcon size={20} className="text-white" />
                            </div>
                            <h1 className="font-bold text-gray-800 tracking-tight">Văn Trung</h1>
                        </div>
                        <button onClick={() => setShowMenu(!showMenu)} className="p-2 hover:bg-gray-100 rounded-full">
                            {showMenu ? <X size={24} /> : <Menu size={24} />}
                        </button>
                    </header>

                    {/* Mobile Menu Overlay */}
                    {showMenu && (
                        <div className="fixed inset-0 z-30 bg-black/20" onClick={() => setShowMenu(false)}>
                            <div className="absolute top-16 right-4 w-56 bg-white rounded-2xl shadow-2xl p-2 animate-in slide-in-from-top-2" onClick={e => e.stopPropagation()}>
                                <button onClick={() => {setActiveTab('calendar'); setShowMenu(false)}} className={`w-full flex items-center gap-3 p-3 rounded-xl ${activeTab === 'calendar' ? 'bg-red-50 text-red-600' : 'text-gray-600'}`}>
                                    <CalendarIcon size={18} /> <span className="font-medium text-sm">Lịch Vạn Niên</span>
                                </button>
                                <button onClick={() => {setActiveTab('notes'); setShowMenu(false)}} className={`w-full flex items-center gap-3 p-3 rounded-xl ${activeTab === 'notes' ? 'bg-red-50 text-red-600' : 'text-gray-600'}`}>
                                    <StickyNote size={18} /> <span className="font-medium text-sm">Ghi Chú Bảo Mật</span>
                                </button>
                                <button onClick={() => {setActiveTab('timetable'); setShowMenu(false)}} className={`w-full flex items-center gap-3 p-3 rounded-xl ${activeTab === 'timetable' ? 'bg-red-50 text-red-600' : 'text-gray-600'}`}>
                                    <Table size={18} /> <span className="font-medium text-sm">Thời Khóa Biểu</span>
                                </button>
                            </div>
                        </div>
                    )}

                    <main className="max-w-md mx-auto p-4 animate-in fade-in duration-500">
                        {activeTab === 'calendar' && (
                            <section>
                                <div className="flex items-center justify-between mb-6">
                                    <button onClick={() => setCurrentDate(new Date(currentDate.setMonth(currentDate.getMonth() - 1)))} className="p-2 hover:bg-white rounded-full shadow-sm"><ChevronLeft /></button>
                                    <div className="text-center">
                                        <h2 className="text-xl font-extrabold text-gray-800 uppercase tracking-wide">Tháng {currentDate.getMonth() + 1}</h2>
                                        <p className="text-gray-400 font-bold text-sm">{currentDate.getFullYear()}</p>
                                    </div>
                                    <button onClick={() => setCurrentDate(new Date(currentDate.setMonth(currentDate.getMonth() + 1)))} className="p-2 hover:bg-white rounded-full shadow-sm"><ChevronRight /></button>
                                </div>

                                <div className="bg-white rounded-[2rem] shadow-xl shadow-gray-200/50 p-4 overflow-hidden border border-gray-50">
                                    <div className="calendar-grid mb-4">
                                        {['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'].map(d => (
                                            <div key={d} className="text-center text-[10px] font-black text-gray-300 py-2">{d}</div>
                                        ))}
                                    </div>
                                    <div className="calendar-grid gap-y-2">
                                        {renderCalendar().map((item, idx) => {
                                            const lunar = getLunarDate(item.day, currentDate.getMonth(), currentDate.getFullYear());
                                            return (
                                                <div key={idx} className={`relative flex flex-col items-center justify-center aspect-square rounded-2xl transition-all ${!item.current ? 'opacity-20' : ''} ${item.today ? 'bg-red-600 text-white shadow-lg shadow-red-200' : 'hover:bg-gray-50'}`}>
                                                    <span className="text-sm font-bold">{item.day}</span>
                                                    <span className={`lunar-day ${item.today ? 'text-red-100' : ''}`}>{lunar.day}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="mt-8 bg-indigo-900 text-white p-6 rounded-[2rem] shadow-2xl relative overflow-hidden">
                                    <div className="relative z-10">
                                        <div className="flex items-center gap-2 mb-2 opacity-60">
                                            <Info size={14} />
                                            <span className="text-[10px] font-bold uppercase tracking-widest">Hôm nay</span>
                                        </div>
                                        <h3 className="text-2xl font-black mb-1">Thứ {new Date().getDay() + 1}, {new Date().toLocaleDateString('vi-VN')}</h3>
                                        <p className="text-indigo-200 text-sm font-medium">Tiết trời trong xanh, thích hợp khởi đầu mới.</p>
                                    </div>
                                    <div className="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
                                </div>
                            </section>
                        )}

                        {activeTab === 'notes' && (
                            <section className="animate-in slide-in-from-right-4">
                                <div className="flex items-center justify-between mb-8">
                                    <h2 className="text-3xl font-black text-gray-800 uppercase tracking-tighter">Ghi Chú</h2>
                                    <div className="bg-green-100 text-green-700 px-3 py-1 rounded-full text-[10px] font-bold flex items-center gap-1">
                                        <Shield size={12}/> ĐÃ MÃ HÓA
                                    </div>
                                </div>

                                <form onSubmit={(e) => { e.preventDefault(); handleAddNote(e.target.note.value); e.target.reset(); }} className="relative mb-8">
                                    <input name="note" type="text" placeholder="Ghi lại ý tưởng mới..." className="w-full bg-white border-none rounded-2xl py-4 pl-6 pr-16 shadow-lg shadow-gray-200/50 focus:ring-4 focus:ring-red-100 text-sm font-medium" />
                                    <button type="submit" className="absolute right-2 top-2 bottom-2 aspect-square bg-red-600 text-white rounded-xl flex items-center justify-center shadow-lg shadow-red-100"><Plus/></button>
                                </form>

                                <div className="space-y-3">
                                    {notes.map(note => (
                                        <div key={note.id} className="flex items-center gap-4 bg-white p-4 rounded-2xl shadow-sm border border-gray-50 group hover:shadow-md transition-all">
                                            <button onClick={() => toggleNote(note.id, note.completed)} className={`w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all ${note.completed ? 'bg-green-500 border-green-500 text-white' : 'border-gray-200'}`}>
                                                {note.completed && <CheckCircle2 size={14} strokeWidth={3} />}
                                            </button>
                                            <span className={`flex-1 text-sm font-semibold tracking-tight ${note.completed ? 'text-gray-300 line-through' : 'text-gray-700'}`}>{note.text}</span>
                                            <button onClick={() => deleteNote(note.id)} className="opacity-0 group-hover:opacity-100 p-2 text-gray-300 hover:text-red-500 transition-all"><Trash2 size={16}/></button>
                                        </div>
                                    ))}
                                    {notes.length === 0 && (
                                        <div className="py-20 text-center opacity-20">
                                            <StickyNote size={64} className="mx-auto mb-4" />
                                            <p className="font-bold">Chưa có ghi chú nào</p>
                                        </div>
                                    )}
                                </div>
                            </section>
                        )}

                        {activeTab === 'timetable' && (
                            <section className="animate-in slide-in-from-left-4">
                                <h2 className="text-3xl font-black text-gray-800 mb-8 uppercase tracking-tighter">Thời Khóa Biểu</h2>
                                <div className="bg-white rounded-[2rem] shadow-xl shadow-gray-200/50 p-2 overflow-x-auto hide-scrollbar">
                                    <table className="w-full min-w-[400px]">
                                        <thead>
                                            <tr>
                                                <th className="p-4 text-[10px] font-black text-gray-300 text-left uppercase tracking-widest">Tiết</th>
                                                {['T2', 'T3', 'T4', 'T5', 'T6', 'T7'].map(d => <th key={d} className="p-4 text-[10px] font-black text-gray-300 uppercase tracking-widest">{d}</th>)}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {[1, 2, 3, 4, 5].map(t => (
                                                <tr key={t} className="border-t border-gray-50">
                                                    <td className="p-4 text-xs font-bold text-gray-400">{t}</td>
                                                    {[...Array(6)].map((_, i) => (
                                                        <td key={i} className="p-2">
                                                            <div className="bg-gray-50 h-10 rounded-lg border border-dashed border-gray-200"></div>
                                                        </td>
                                                    ))}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <p className="mt-6 text-center text-gray-400 text-xs italic">Tính năng chỉnh sửa TKB sẽ sớm ra mắt.</p>
                            </section>
                        )}
                    </main>

                    {/* Bottom Nav */}
                    <nav className="fixed bottom-4 left-4 right-4 h-16 bg-white/90 backdrop-blur-xl border border-white shadow-2xl rounded-2xl flex items-center justify-around px-2 z-40">
                        <button onClick={() => setActiveTab('calendar')} className={`flex flex-col items-center gap-1 px-4 py-2 rounded-xl transition-all ${activeTab === 'calendar' ? 'text-red-600' : 'text-gray-300'}`}>
                            <CalendarIcon size={20} />
                            <span className="text-[10px] font-black uppercase tracking-tighter">Lịch</span>
                        </button>
                        <button onClick={() => setActiveTab('notes')} className={`flex flex-col items-center gap-1 px-4 py-2 rounded-xl transition-all ${activeTab === 'notes' ? 'text-red-600' : 'text-gray-300'}`}>
                            <StickyNote size={20} />
                            <span className="text-[10px] font-black uppercase tracking-tighter">Ghi chú</span>
                        </button>
                        <button onClick={() => setActiveTab('timetable')} className={`flex flex-col items-center gap-1 px-4 py-2 rounded-xl transition-all ${activeTab === 'timetable' ? 'text-red-600' : 'text-gray-300'}`}>
                            <Table size={20} />
                            <span className="text-[10px] font-black uppercase tracking-tighter">Học tập</span>
                        </button>
                    </nav>

                    {error && (
                        <div className="fixed top-20 left-4 right-4 bg-red-500 text-white p-4 rounded-xl shadow-lg flex items-center justify-between z-50 animate-bounce">
                            <span className="text-xs font-bold">{error}</span>
                            <button onClick={() => setError(null)}><X size={16}/></button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
