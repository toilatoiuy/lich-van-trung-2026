                                    type="checkbox"
                                    checked={isChecklist}
                                    onChange={(e) => handleToggleChecklist(e.target.checked)}
                                    className="w-4 h-4 accent-blue-600 cursor-pointer"
                                />
                                Thêm hộp kiểm
                            </label>

                            {/* Input "Đặt tên nhãn" */}
                            <div className="flex items-center gap-1 flex-1 min-w-[80px]">
                                <Tag size={14} className="text-gray-400 shrink-0" />
                                <input
                                    className="flex-1 min-w-[60px] text-xs bg-transparent outline-none py-1 text-gray-700 border-b border-transparent focus:border-blue-400 transition"
                                    placeholder="Đặt tên nhãn..."
                                    value={labelInput}
                                    onChange={e => setLabelInput(e.target.value)}
                                    onKeyDown={handleLabelKeyDown}
                                    onBlur={addLabelFromInput}
                                />
                                <button type="button" onClick={handleSuggestLabels} disabled={suggestingLabels}
                                    title="Gợi ý nhãn bằng AI dựa trên nội dung ghi chú"
                                    className="shrink-0 flex items-center gap-1 text-[10px] font-bold text-indigo-600 hover:text-indigo-800 disabled:opacity-50 px-1.5 py-1 rounded-full hover:bg-indigo-50 transition">
                                    <Sparkles size={12} className={suggestingLabels ? 'animate-pulse' : ''}/> {suggestingLabels ? 'Đang gợi ý...' : 'Gợi ý'}
                                </button>
                            </div>

                            {/* Các nhãn AI vừa gợi ý — bấm để thêm nhanh */}
                            {labelSuggestions.length > 0 && (
                                <div className="flex items-center gap-1 flex-wrap w-full">
                                    <span className="text-[10px] text-slate-400 shrink-0">AI gợi ý:</span>
                                    {labelSuggestions.filter(s => !labels.includes(s)).map(s => (
                                        <button key={s} type="button" onClick={() => { setLabels(prev => [...prev, s]); setLabelSuggestions(prev => prev.filter(x => x !== s)); }}
                                            className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100">
                                            + {s}
                                        </button>
                                    ))}
                                </div>
                            )}

                            {/* Hiển thị các nhãn đã có */}
                            <div className="flex items-center gap-1 flex-wrap shrink-0">
                                {labels.map(lb => (
                                    <span key={lb} className="flex items-center gap-0.5 bg-blue-100 text-blue-700 text-[10px] font-semibold pl-1.5 pr-1 py-0.5 rounded-full">
                                        {lb}
                                        <button type="button" onClick={() => setLabels(ls => ls.filter(x => x !== lb))} aria-label={`Xóa nhãn ${lb}`} className="hover:text-blue-900 p-0.5"><X size={8}/></button>
                                    </span>
                                ))}
                            </div>

                            <button onClick={handleSave} className="text-blue-600 font-bold flex items-center gap-1 shrink-0 ml-auto"><Save size={18}/> Lưu</button>
                        </div>
                    </div>

                    {/* Dòng màu sắc */}
                    <div className="px-4 py-2 bg-gray-50 flex gap-3 overflow-x-auto no-scrollbar items-center border-b">
                        <span className="text-xs text-slate-700 font-bold mr-1 shrink-0">Màu:</span>
                        {NOTE_COLORS.map(c => (
                            <button key={c} onClick={() => setColor(c)} className={`w-8 h-8 rounded-full border border-gray-300 shadow-sm transition-transform hover:scale-110 shrink-0 ${color === c ? 'ring-2 ring-blue-500 ring-offset-2' : ''}`} style={{ backgroundColor: c }} />
                        ))}
                    </div>

                    {/* Nội dung ghi chú */}
                    <div className="p-4 flex-1 flex flex-col gap-4 overflow-y-auto" style={{ backgroundColor: color }}>
                        {/* Thanh định dạng chữ (mục 2) — đặt ngay dưới thanh "Màu" theo yêu cầu. Tác động
                            lên ĐÚNG ô đang được soạn thảo (Tiêu đề hoặc 1 dòng nội dung đang gõ dở) —
                            không còn cố định vào "Tiêu đề" như trước (trước đây cứ bấm vào thanh này là
                            bị nhảy về dòng Tiêu đề, dù đang gõ ở dòng nội dung khác). */}
                        <div>
                            <label className="text-xs font-bold text-slate-500 block mb-1">Định dạng chữ</label>
                            <RichTextToolbar targetRef={activeEditableRef} />
                        </div>
                        <RichTitleEditable editableRef={noteTitleRef} onFocus={() => { activeEditableRef.current = noteTitleRef.current; setFocusedId(null); }} className="w-full text-2xl font-bold outline-none placeholder-gray-400 bg-transparent text-slate-800" placeholder="Tiêu đề" value={title} onChange={setTitle} />

                        <div ref={itemsWrapRef} onContextMenu={handleItemsContextMenu} className="flex flex-col">
                            {displayItems.map((it, idx) => {
                                // Xác định vị trí thực tế trong items để truyền vào onKeyDown
                                const realIdx = items.findIndex(orig => orig.id === it.id);
                                const isThisDragging = draggingId === it.id;

                                // Dòng đang được kéo: tách hẳn khỏi luồng bố cục bình thường (position:
                                // fixed) và luôn vẽ tại "vị trí ban đầu lúc bắt đầu kéo + khoảng cách con
                                // trỏ đã di chuyển" — nhờ vậy nó bám sát con trỏ tuyệt đối mượt mà, không
                                // còn phụ thuộc/nhảy theo vị trí-trong-mảng (vốn liên tục đổi khi xem trước
                                // thứ tự mới). Một ô giữ-chỗ (placeholder) cùng chiều cao được đặt đúng vị
                                // trí hiện tại trong danh sách để các dòng khác vẫn dịch chuyển nhường chỗ
                                // bình thường (qua kỹ thuật FLIP ở trên).
                                if (isThisDragging && dragStartRect) {
                                    return (
                                        <React.Fragment key={it.id}>
                                            <div
                                                ref={el => { rowRefs.current[it.id] = el; }}
                                                style={{ height: dragStartRect.height }}
                                                aria-hidden="true"
                                            />
                                            <div
                                                style={{
                                                    position: 'fixed',
                                                    top: dragStartRect.top,
                                                    left: dragStartRect.left,
                                                    width: dragStartRect.width,
                                                    transform: `translateY(${dragOffsetY || 0}px)`,
                                                    zIndex: 50,
                                                    pointerEvents: 'none',
                                                }}
                                            >
                                                <NoteItemRow
                                                    item={it}
                                                    isChecklist={isChecklist}
                                                    isDragging={true}
                                                    dragOffsetY={0}
                                                    isDragOver={false}
                                                    rowRef={() => {}}
                                                    onTextChange={() => {}}
                                                    onKeyDown={() => {}}
                                                    onToggleChecked={() => {}}
                                                    onDelete={() => {}}
                                                    onDragHandlePointerDown={() => {}}
                                                    isFocused={false}
                                                    onFocus={() => {}}
                                                    onBlurRow={() => {}}
                                                    isFirstLine={(realIdx !== -1 ? realIdx : idx) === 0}
                                                />
                                            </div>
                                        </React.Fragment>
                                    );
                                }

                                return (
                                    <NoteItemRow
                                        key={it.id}
                                        item={it}
                                        isChecklist={isChecklist}
                                        isDragging={false}
                                        dragOffsetY={0}
                                        isDragOver={isChecklist && dragOverId === it.id && draggingId !== null && draggingId !== it.id}
                                        rowRef={el => { rowRefs.current[it.id] = el; }}
                                        onTextChange={e => updateItemText(it.id, e.target.value)}
                                        onKeyDown={e => handleRowKeyDown(e, it.id, realIdx !== -1 ? realIdx : idx)}
                                        onToggleChecked={() => toggleItemChecked(it.id)}
                                        onDelete={() => deleteItem(it.id)}
                                        onDragHandlePointerDown={e => startDrag(e, it.id)}
                                        isFocused={focusedId === it.id}
                                        onFocus={el => { setFocusedId(it.id); activeEditableRef.current = el; }}
                                        onBlurRow={() => setFocusedId(prev => (prev === it.id ? null : prev))}
                                        isFirstLine={(realIdx !== -1 ? realIdx : idx) === 0}
                                    />
                                );
                            })}
                            <button type="button" onClick={addItemAtEnd} className="text-xs text-blue-500 font-semibold flex items-center gap-1 mt-1 self-start py-1">
                                <Plus size={14}/> Thêm dòng
                            </button>
                        </div>

                        {customMenu && (
                            <div
                                ref={customMenuRef}
                                onMouseDown={e => e.preventDefault()}
                                className="fixed z-50 bg-white border border-slate-200 rounded-lg shadow-lg py-1 text-sm min-w-[120px]"
                                style={{ left: customMenu.x, top: customMenu.y }}
                            >
                                <button type="button" className="block w-full text-left px-4 py-1.5 hover:bg-blue-50 text-slate-700"
                                    onClick={() => {
                                        if (customMenu.payload.text && navigator.clipboard) navigator.clipboard.writeText(customMenu.payload.text).catch(() => {});
                                        applyCrossRowDeletion(customMenu.payload);
                                        setCustomMenu(null);
                                    }}>Cắt</button>
                                <button type="button" className="block w-full text-left px-4 py-1.5 hover:bg-blue-50 text-slate-700"
                                    onClick={() => {
                                        if (customMenu.payload.text && navigator.clipboard) navigator.clipboard.writeText(customMenu.payload.text).catch(() => {});
                                        setCustomMenu(null);
                                    }}>Sao chép</button>
                                <button type="button" className="block w-full text-left px-4 py-1.5 hover:bg-blue-50 text-red-600"
                                    onClick={() => {
                                        applyCrossRowDeletion(customMenu.payload);
                                        setCustomMenu(null);
                                    }}>Xóa</button>
                            </div>
                        )}

                        <ReminderSettings
                            enabled={reminderEnabled}
                            setEnabled={setReminderEnabled}
                            time={reminderTime}
                            setTime={setReminderTime}
                            offset={reminderOffset}
                            setOffset={setReminderOffset}
                            repeat={reminderRepeat}
                            setRepeat={setReminderRepeat}
                            label="Nhắc nhở tùy chỉnh"
                        />
                    </div>
                </div>
            );
        };

        const TodoView = ({ user, db, appId, theme, searchTarget, onSearchTargetClear, activeTab }) => {
            const [todos, setTodos] = useState([]);
            const [editing, setEditing] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const [highlightId, setHighlightId] = useState(null);
            const todoRef = useMemo(() => collection(db, 'artifacts', appId, 'users', user.uid, 'todos'), [db, appId, user.uid]);
            
            // ── KEYBOARD ────────────────────────────────────────────────────────
            useEffect(() => {
                const handler = (e) => {
                    if (activeTab !== 'todo') return;
                    const target = e.target;
                    const tag = target?.tagName || '';
                    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || target?.isContentEditable) return;
                    // Ctrl+N hoặc Cmd+N để thêm mới
                    if ((e.ctrlKey || e.metaKey) && (e.key === 'n' || e.key === 'N')) {
                        e.preventDefault();
                        setEditing({});
                    }
                };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, [activeTab]);

            useEffect(() => {
                if (!searchTarget || searchTarget.tab !== 'todo' || !searchTarget.itemId) return;
                setHighlightId(searchTarget.itemId);
                setTimeout(() => {
                    const el = document.getElementById(`todo-item-${searchTarget.itemId}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 200);
                const timer = setTimeout(() => {
                    setHighlightId(null);
                    if (onSearchTargetClear) onSearchTargetClear();
                }, 3000);
                return () => clearTimeout(timer);
            }, [searchTarget]);
            
            useEffect(() => {
                const unsub = onSnapshot(query(todoRef), snap => {
                    const data = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    data.sort((a, b) => {
                        const aActiveDeadline = !a.completed && a.deadlineTime;
                        const bActiveDeadline = !b.completed && b.deadlineTime;

                        if (aActiveDeadline && !bActiveDeadline) return -1;
                        if (!aActiveDeadline && bActiveDeadline) return 1;

                        if (aActiveDeadline && bActiveDeadline) {
                            const aSecs = a.deadlineTime.seconds || 0;
                            const bSecs = b.deadlineTime.seconds || 0;
                            if (aSecs !== bSecs) {
                                return aSecs - bSecs;
                            }
                        }

                        if (a.order !== undefined && b.order !== undefined) {
                            return a.order - b.order;
                        }
                        return (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0);
                    });
                    setTodos(data);
                });
                return unsub;
            }, [todoRef]);

            const save = async (text, reminderStr, deadlineStr) => {
                const reminderData = reminderStr ? Timestamp.fromDate(new Date(reminderStr)) : null;
                const deadlineData = deadlineStr ? Timestamp.fromDate(new Date(deadlineStr)) : null;
                const payload = { text, reminderTime: reminderData, deadlineTime: deadlineData, pushSent: false };
                if (editing.id) await updateDoc(doc(todoRef, editing.id), payload);
                else await addDoc(todoRef, { ...payload, completed: false, createdAt: serverTimestamp(), order: Date.now() });
                setEditing(null);
            };
            const handleDelete = (e, id) => {
                e.stopPropagation();
                if (deleteConfirm === id) { deleteDoc(doc(todoRef, id)); setDeleteConfirm(null); } 
                else { setDeleteConfirm(id); setTimeout(() => setDeleteConfirm(prev => prev === id ? null : prev), 3000); }
            };
            const moveItem = async (e, index, direction) => {
                e.stopPropagation();
                if ((direction === -1 && index === 0) || (direction === 1 && index === todos.length - 1)) return;
                const itemA = todos[index];
                const itemB = todos[index + direction];
                const orderA = itemB.order || Date.now();
                const orderB = itemA.order || Date.now();
                await updateDoc(doc(todoRef, itemA.id), { order: orderA });
                await updateDoc(doc(todoRef, itemB.id), { order: orderB });
            };
            return (
                <div className="p-4 pb-24 min-h-full font-sans" style={{ color: theme.textColor }}>
                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-xl font-bold">Danh sách việc</h2>
                        <button onClick={()=>setEditing({})} className="bg-blue-100 text-blue-600 px-3 py-2 rounded-lg flex items-center gap-1 text-sm font-bold"><Plus size={16}/> Mới</button>
                    </div>
                    <div className="space-y-2">
                        {todos.map((t, idx) => {
                            const timeStatus = t.deadlineTime ? getRemainingTime(t.deadlineTime) : null;
                            const isHighlighted = highlightId === t.id;
                            const kw = searchTarget?.keyword?.toLowerCase();
                            return (
                                <div key={t.id} id={`todo-item-${t.id}`} onClick={() => setEditing(t)} className={`group flex items-center p-3 rounded-lg shadow-sm border cursor-pointer transition-all duration-500 ${isHighlighted ? 'bg-yellow-50 border-yellow-400 ring-2 ring-yellow-300 scale-[1.01]' : 'bg-white border-gray-100 hover:bg-gray-50'}`}>
                                    <div className="flex flex-col mr-2 text-gray-300" onClick={e => e.stopPropagation()}>
                                        <button onClick={(e)=>moveItem(e, idx, -1)} className="hover:text-blue-500 p-0.5"><ArrowUp size={14}/></button>
                                        <button onClick={(e)=>moveItem(e, idx, 1)} className="hover:text-blue-500 p-0.5"><ArrowDown size={14}/></button>
                                    </div>
                                    <div className="mt-1 mr-3 cursor-pointer text-gray-400" onClick={(e) => { e.stopPropagation(); updateDoc(doc(todoRef, t.id), {completed: !t.completed}); }}>
                                        {t.completed ? <CheckSquare className="text-green-500"/> : <div className="w-5 h-5 border-2 rounded"></div>}
                                    </div>
                                    <div className="flex-1 min-w-0">
                                        <div className={`font-semibold truncate ${t.completed ? 'line-through text-gray-400' : ''}`} style={{ color: t.completed ? '#9ca3af' : theme.textColor }}>
                                            {isHighlighted && kw && t.text?.toLowerCase().includes(kw) ? (() => {
                                                const idx2 = t.text.toLowerCase().indexOf(kw);
                                                return <span>{t.text.slice(0, idx2)}<mark className="bg-yellow-300 text-yellow-900 rounded px-0.5 not-italic">{t.text.slice(idx2, idx2 + kw.length)}</mark>{t.text.slice(idx2 + kw.length)}</span>;
                                            })() : t.text}
                                        </div>
                                        <div className="flex gap-3 mt-1 flex-wrap">
                                            {t.deadlineTime && <div className={`text-[10px] flex items-center gap-1 font-medium ${timeStatus?.isOverdue && !t.completed ? 'text-red-600 font-bold' : 'text-gray-500'}`}><AlertCircle size={10}/> {t.completed ? `Thời hạn: ${formatDisplayDate(t.deadlineTime.seconds)}` : timeStatus?.text}</div>}
                                            {t.reminderTime && !t.completed && <div className="text-[10px] text-orange-500 flex items-center gap-1 font-medium"><Bell size={10} /> Nhắc: {formatDisplayDate(t.reminderTime.seconds)}</div>}
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2 shrink-0" onClick={e => e.stopPropagation()}>
                                        <button onClick={(e) => { e.stopPropagation(); setEditing(t); }} className="p-1 rounded text-gray-400 hover:text-blue-500 hover:bg-blue-50 transition-colors" title="Sửa"><Pencil size={16}/></button>
                                        <button onClick={(e) => handleDelete(e, t.id)} className={`p-1 rounded transition-all ${deleteConfirm === t.id ? 'bg-red-100 text-red-600 w-16 text-xs font-bold' : 'text-gray-300 hover:text-red-500'}`}>{deleteConfirm === t.id ? <span>Xóa?</span> : <Trash2 size={16}/>}</button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    {editing && <TodoEditor initialText={editing.text} initialReminder={editing.reminderTime ? formatDateTimeForInput(editing.reminderTime.seconds*1000) : ''} initialDeadline={editing.deadlineTime ? formatDateTimeForInput(editing.deadlineTime.seconds*1000) : ''} isNew={!editing.id} onSave={save} onCancel={() => setEditing(null)} titleSuggestions={Array.from(new Set(todos.map(t => t.text).filter(Boolean)))} />}
                </div>
            );
        };

        // ─── Component quản lý nhãn (chỉ hiển thị danh sách, bấm để lọc) ────
        const LabelManagerModal = ({ labels, onSelectLabel, onClose }) => {
            return (
                <div className="fixed inset-0 bg-black/50 z-[70] flex items-center justify-center p-4" onClick={onClose}>
                    <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden max-h-[80vh] flex flex-col" onClick={e => e.stopPropagation()}>
                        <div className="bg-gray-800 text-white p-4 flex justify-between items-center shrink-0">
                            <h3 className="font-bold flex items-center gap-2"><Tag size={18}/> Lọc theo nhãn</h3>
                            <button onClick={onClose} aria-label="Đóng"><X size={20}/></button>
                        </div>
                        <div className="p-4 flex-1 overflow-y-auto space-y-4">
                            {labels.length === 0 ? (
                                <p className="text-center text-gray-400 text-sm py-4">Chưa có nhãn nào.</p>
                            ) : (
                                <div className="flex flex-wrap gap-2">
                                    {labels.map(lb => (
                                        <button key={lb} onClick={() => { onSelectLabel(lb); onClose(); }} className="bg-blue-100 text-blue-700 text-sm font-semibold px-3 py-1.5 rounded-full hover:bg-blue-200 transition">
                                            {lb}
                                        </button>
                                    ))}
                                </div>
                            )}
                            <button onClick={onClose} className="w-full border border-slate-300 text-slate-600 py-2.5 rounded-xl text-sm font-bold hover:bg-slate-50 transition">Đóng</button>
                        </div>
                    </div>
                </div>
            );
        };

        // ─── Component thùng rác ghi chú ──────────────────────────────────────
        const TrashModal = ({ items, onRestore, onDeletePermanently, onClose, onEmptyTrash }) => {
            const [deletingAll, setDeletingAll] = useState(false);
            const handleEmptyTrash = async () => {
                if (items.length === 0) return;
                setDeletingAll(true);
                try {
                    // Dùng chung hàm dọn sạch thùng rác của NotesView (đã xóa toàn bộ ghi chú
                    // khỏi collection thùng rác) để tránh trùng lặp logic.
                    await onEmptyTrash();
                } finally {
                    setDeletingAll(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/50 z-[70] flex items-center justify-center p-4" onClick={onClose}>
                    <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden max-h-[80vh] flex flex-col" onClick={e => e.stopPropagation()}>
                        <div className="bg-red-600 text-white p-4 flex justify-between items-center shrink-0">
                            <h3 className="font-bold flex items-center gap-2"><Trash2 size={18}/> Thùng rác ghi chú</h3>
                            <button onClick={onClose} aria-label="Đóng"><X size={20}/></button>
                        </div>
                        <div className="p-4 flex-1 overflow-y-auto space-y-3">
                            {items.length === 0 ? (
                                <p className="text-center text-gray-400 text-sm py-4">Thùng rác trống.</p>
                            ) : (
                                <>
                                    {items.map((note) => (
                                        <div key={note.id} className="flex items-center justify-between bg-gray-50 p-3 rounded-xl border border-gray-200">
                                            <div className="min-w-0 flex-1">
                                                <div className="font-semibold text-sm text-slate-800 truncate">{note.title || 'Không tiêu đề'}</div>
                                                <div className="text-[10px] text-gray-400">{note.content ? note.content.slice(0, 40) : ''}</div>
                                            </div>
                                            <div className="flex items-center gap-1 shrink-0">
                                                <button onClick={() => onRestore(note.id)} className="p-1.5 text-green-600 hover:bg-green-50 rounded-lg transition" title="Khôi phục"><RefreshCw size={14}/></button>
                                                <button onClick={() => onDeletePermanently(note.id)} className="p-1.5 text-red-600 hover:bg-red-50 rounded-lg transition" title="Xóa vĩnh viễn"><Trash2 size={14}/></button>
                                            </div>
                                        </div>
                                    ))}
                                    <button
                                        onClick={handleEmptyTrash}
                                        disabled={deletingAll}
                                        className="w-full py-2.5 bg-red-500 hover:bg-red-600 disabled:opacity-50 text-white rounded-xl text-sm font-bold transition"
                                    >
                                        {deletingAll ? 'Đang xóa...' : '🗑️ Dọn sạch thùng rác'}
                                    </button>
                                </>
                            )}
                        </div>
                        <div className="p-4 border-t shrink-0">
                            <button onClick={onClose} className="w-full border border-slate-300 text-slate-600 py-2.5 rounded-xl text-sm font-bold hover:bg-slate-50 transition">Đóng</button>
                        </div>
                    </div>
                </div>
            );
        };

        const NotesView = ({ user, db, appId, theme, searchTarget, onSearchTargetClear, activeTab }) => {
            const [notes, setNotes] = useState([]);
            const [editing, setEditing] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const [highlightId, setHighlightId] = useState(null);
            const [showNotebookMenu, setShowNotebookMenu] = useState(false);
            const [allLabels, setAllLabels] = useState([]);
            const [labelUsageCounts, setLabelUsageCounts] = useState({});
            const [trashItems, setTrashItems] = useState([]);
            const [showTrash, setShowTrash] = useState(false);
            const [filterLabel, setFilterLabel] = useState(null);
            const noteRef = useMemo(() => collection(db, 'artifacts', appId, 'users', user.uid, 'notes'), [db, appId, user.uid]);
            const trashRef = useMemo(() => collection(db, 'artifacts', appId, 'users', user.uid, 'notes_trash'), [db, appId, user.uid]);
            
            // ── KEYBOARD ────────────────────────────────────────────────────────
            useEffect(() => {
                const handler = (e) => {
                    if (activeTab !== 'notes') return;
                    const target = e.target;
                    const tag = target?.tagName || '';
                    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || target?.isContentEditable) return;
                    if ((e.ctrlKey || e.metaKey) && (e.key === 'n' || e.key === 'N')) {
                        e.preventDefault();
                        setEditing({});
                    }
                };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, [activeTab]);

            useEffect(() => {
                const unsub = onSnapshot(query(noteRef), snap => {
                    // Lưu ý: đặt "id: d.id" SAU khi trải (...d.data()) để đảm bảo ID thật của
                    // tài liệu Firestore luôn được dùng, không bị đè bởi trường "id" (nếu có)
                    // vô tình còn sót lại bên trong dữ liệu của tài liệu.
                    const data = snap.docs.map(d => ({ ...d.data(), id: d.id })).sort((a,b) => {
                        const aPin = a.pinned ? 1 : 0, bPin = b.pinned ? 1 : 0;
                        if (aPin !== bPin) return bPin - aPin;
                        return (b.updatedAt?.seconds||0) - (a.updatedAt?.seconds||0);
                    });
                    setNotes(data);
                    // Thu thập tất cả nhãn và đếm số lần sử dụng để sắp xếp nhãn dùng nhiều lên trên
                    const counts = {};
                    data.forEach(n => (n.labels || []).forEach(lb => { counts[lb] = (counts[lb] || 0) + 1; }));
                    setLabelUsageCounts(counts);
                    setAllLabels(Object.keys(counts).sort((a, b) => (counts[b] - counts[a]) || a.localeCompare(b)));
                });
                return unsub;
            }, [noteRef]);

            // Lắng nghe thùng rác
            useEffect(() => {
                const unsub = onSnapshot(query(trashRef), snap => {
                    // Quan trọng: id phải lấy từ d.id (ID thật của tài liệu trong thùng rác),
                    // đặt sau khi trải dữ liệu để không bị trường "id" cũ (của ghi chú gốc,
                    // vô tình bị lưu lẫn vào dữ liệu khi chuyển vào thùng rác) ghi đè lên.
                    // Nếu bị đè, thao tác "khôi phục"/"dọn sạch thùng rác" sẽ xóa nhầm một ID
                    // không tồn tại (Firestore không báo lỗi khi xóa ID không tồn tại) khiến
                    // ghi chú vẫn còn nguyên trong thùng rác dù đã báo "thành công".
                    const data = snap.docs.map(d => ({ ...d.data(), id: d.id }));
                    setTrashItems(data);
                });
                return unsub;
            }, [trashRef]);

            useEffect(() => {
                if (!searchTarget || searchTarget.tab !== 'notes' || !searchTarget.itemId) return;
                setHighlightId(searchTarget.itemId);
                setTimeout(() => {
                    const el = document.getElementById(`note-item-${searchTarget.itemId}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 200);
                const timer = setTimeout(() => {
                    setHighlightId(null);
                    if (onSearchTargetClear) onSearchTargetClear();
                }, 3000);
                return () => clearTimeout(timer);
            }, [searchTarget]);

            const save = (noteData) => {
                const { title, content, items, isChecklist, reminderStr, color, pinned, labels } = noteData;
                const reminderData = reminderStr ? Timestamp.fromDate(new Date(reminderStr)) : null;
                const data = {
                    title: title || 'K.Tiêu đề',
                    content: content || '',
                    items: items || [],
                    isChecklist: !!isChecklist,
                    reminderTime: reminderData,
                    pushSent: false,
                    color: color,
                    pinned: !!pinned,
                    labels: labels || [],
                    updatedAt: serverTimestamp()
                };
                if(editing.id) updateDoc(doc(noteRef, editing.id), data);
                else addDoc(noteRef, data);
                setEditing(null);
            };

            const handleDelete = (e, id) => {
                e.stopPropagation();
                if (deleteConfirm === id) {
                    // Chuyển vào thùng rác thay vì xóa vĩnh viễn
                    const note = notes.find(n => n.id === id);
                    if (note) {
                        // Lưu vào trash collection — bỏ trường "id" của ghi chú gốc trước khi lưu,
                        // để không lẫn lộn với ID thật (do Firestore tự sinh) của tài liệu thùng rác.
                        const { id: _origId, ...noteDataOnly } = note;
                        addDoc(trashRef, { ...noteDataOnly, deletedAt: serverTimestamp() });
                        // Xóa khỏi notes
                        deleteDoc(doc(noteRef, id));
                    }
                    setDeleteConfirm(null);
                } else {
                    setDeleteConfirm(id);
                    setTimeout(() => setDeleteConfirm(prev => prev === id ? null : prev), 3000);
                }
            };

            const handleRestoreFromTrash = async (id) => {
                const item = trashItems.find(t => t.id === id);
                if (!item) return;
                try {
                    const { id: _, deletedAt, ...rest } = item;
                    // Thêm lại vào danh sách ghi chú, sau đó XÓA khỏi thùng rác
                    await addDoc(noteRef, rest);
                    await deleteDoc(doc(trashRef, id));
                    toast.success("Đã khôi phục ghi chú.", { position: "top-center" });
                } catch (err) {
                    toast.error("Lỗi khi khôi phục ghi chú.", { position: "top-center" });
                }
            };

            const handlePermanentDelete = async (id) => {
                try {
                    await deleteDoc(doc(trashRef, id));
                } catch (err) {
                    console.error("Lỗi xóa vĩnh viễn:", err);
                }
            };

            const handleEmptyTrash = async () => {
                if (trashItems.length === 0) return;
                if (!window.confirm("Bạn có chắc muốn xóa vĩnh viễn tất cả ghi chú trong thùng rác?")) return;
                try {
                    await Promise.all(trashItems.map(item => deleteDoc(doc(trashRef, item.id))));
                    toast.success("Đã dọn sạch thùng rác.", { position: "top-center" });
                } catch (err) {
                    toast.error("Lỗi khi dọn thùng rác.", { position: "top-center" });
                }
            };

            const handleUpdateLabels = (newLabels) => {
                setAllLabels(newLabels);
                // Cập nhật lại tất cả note có nhãn cũ không còn trong danh sách mới
                notes.forEach(n => {
                    const updatedLabels = (n.labels || []).filter(lb => newLabels.includes(lb));
                    if (updatedLabels.length !== (n.labels || []).length) {
                        updateDoc(doc(noteRef, n.id), { labels: updatedLabels });
                    }
                });
            };

            const kw = searchTarget?.keyword?.toLowerCase();
            const renderNoteCard = (n) => {
                const isHighlighted = highlightId === n.id;
                const plainTitle = stripHtml(n.title || ''); // Tiêu đề lưu kèm định dạng (HTML) — chỉ dùng bản chữ thường khi hiển thị ở thẻ ngoài danh sách, tránh lộ thẻ HTML thô ra màn hình
                const hlTitle = isHighlighted && kw && plainTitle.toLowerCase().includes(kw);
                const hlContent = isHighlighted && kw && n.content?.toLowerCase().includes(kw);
                const mkHL = (text) => {
                    if (!text || !kw) return text;
                    const i = text.toLowerCase().indexOf(kw);
                    if (i === -1) return text;
                    return <span>{text.slice(0,i)}<mark className="bg-yellow-300 text-yellow-900 rounded px-0.5">{text.slice(i, i+kw.length)}</mark>{text.slice(i+kw.length)}</span>;
                };
                const bulletLines = !n.isChecklist ? (n.content || '').split('\n').filter(l => l.trim() !== '') : [];
                return (
                    <div key={n.id} id={`note-item-${n.id}`} onClick={()=>setEditing(n)} className={`p-4 rounded-xl border shadow-sm h-48 flex flex-col relative group cursor-pointer transition-all duration-500 ${isHighlighted ? 'ring-2 ring-yellow-400 shadow-yellow-200 shadow-md scale-[1.02]' : 'hover:shadow-md'}`} style={{backgroundColor: n.color || theme.noteColor, borderColor: isHighlighted ? '#fbbf24' : '#e5e7eb'}}>
                        <div className="flex justify-between items-start mb-2">
                            <h4 className="font-bold truncate text-gray-800 flex-1">{hlTitle ? mkHL(plainTitle) : plainTitle}</h4>
                            <div className="flex items-center gap-1.5 shrink-0 ml-1" onClick={e => e.stopPropagation()}>
                                {n.reminderTime && <Bell size={12} className="text-orange-500" />}
                                <button onClick={() => updateDoc(doc(noteRef, n.id), { pinned: !n.pinned })} title={n.pinned ? 'Bỏ ghim' : 'Ghim'} className={n.pinned ? 'text-blue-600' : 'text-gray-300 hover:text-gray-400'}>
                                    <Pin size={13} className={n.pinned ? 'fill-blue-600' : ''} />
                                </button>
                            </div>
                        </div>
                        {n.isChecklist && Array.isArray(n.items) && n.items.length > 0 ? (
                            <div className="text-xs flex-1 overflow-hidden space-y-0.5">
                                {n.items.slice(0, 6).map(it => (
                                    <div key={it.id} className="flex items-center gap-1.5" style={{ color: theme.textColor, opacity: it.checked ? 0.5 : 0.85 }}>
                                        {it.checked ? <CheckSquare size={11} className="shrink-0 text-blue-500" /> : <div className="w-[11px] h-[11px] border border-gray-400 rounded-sm shrink-0"></div>}
                                        <span className={`truncate ${it.checked ? 'line-through' : ''}`}>{stripHtml(it.text)}</span>
                                    </div>
                                ))}
                                {n.items.length > 6 && <div className="text-[10px] text-gray-400">+{n.items.length - 6} mục khác</div>}
                            </div>
                        ) : bulletLines.length > 0 ? (
                            <ul className="text-xs flex-1 overflow-hidden leading-snug font-medium list-disc list-inside space-y-0" style={{color: theme.textColor, opacity: 0.8}}>
                                {bulletLines.slice(0, 6).map((line, i) => (
                                    <li key={i} className="truncate">{hlContent ? mkHL(line) : line}</li>
                                ))}
                                {bulletLines.length > 6 && <li className="text-[10px] text-gray-400 list-none">+{bulletLines.length - 6} dòng khác</li>}
                            </ul>
                        ) : (
                            <div className="flex-1"></div>
                        )}
                        {Array.isArray(n.labels) && n.labels.length > 0 && (
                            <div className="flex flex-wrap gap-1 mt-1">
                                {n.labels.slice(0, 4).map(lb => (
                                    <span key={lb} className="text-[9px] font-semibold px-1.5 py-0.5 rounded-full bg-black/10" style={{color: theme.textColor}}>{lb}</span>
                                ))}
                                {n.labels.length > 4 && <span className="text-[9px] text-gray-400">+{n.labels.length - 4}</span>}
                            </div>
                        )}
                        {n.reminderTime && <div className="text-[9px] text-orange-600 font-medium mt-1 mb-1 flex items-center gap-1"><Clock size={10}/> {formatDisplayDate(n.reminderTime.seconds)}</div>}
                        <div className="flex justify-between items-center mt-1 pt-2 border-t border-black/10">
                            <span className="text-[10px] text-slate-500">{n.updatedAt ? new Date(n.updatedAt.seconds*1000).toLocaleDateString('vi-VN') : ''}</span>
                            <button onClick={(e)=>handleDelete(e, n.id)} className={`text-slate-400 hover:text-red-500 transition-all ${deleteConfirm === n.id ? 'bg-white text-red-600 px-2 py-1 rounded shadow-sm text-xs font-bold' : ''}`}>{deleteConfirm === n.id ? <span>Xóa?</span> : <Trash2 size={16}/>}</button>
                        </div>
                    </div>
                );
            };

            const filteredNotes = useMemo(() => {
                if (!filterLabel) return notes;
                return notes.filter(n => (n.labels || []).includes(filterLabel));
            }, [notes, filterLabel]);

            const pinnedNotes = filteredNotes.filter(n => n.pinned);
            const otherNotes = filteredNotes.filter(n => !n.pinned);

            // Nút điều hướng: một cái trên, một cái dưới, đặt bên phải
            const scrollRef = useRef(null);
            const scrollToTop = () => { if (scrollRef.current) scrollRef.current.scrollTo({ top: 0, behavior: 'smooth' }); };
            const scrollToBottom = () => { if (scrollRef.current) scrollRef.current.scrollTo({ top: scrollRef.current.scrollHeight, behavior: 'smooth' }); };

            return (
                <div className="p-4 font-sans relative" style={{color: theme.textColor}}>
                    {/* Mũi tên điều hướng bên phải */}
                    <div className="fixed right-2 z-50 opacity-30 hover:opacity-100 transition-opacity" style={{ top: '80px' }}>
                        <button onClick={scrollToTop} className="p-2 bg-gray-200/80 rounded-full hover:bg-gray-300/80 transition" title="Lên đầu">
                            <ArrowUp size={16} className="text-gray-600"/>
                        </button>
                    </div>
                    <div className="fixed right-2 z-50 opacity-30 hover:opacity-100 transition-opacity" style={{ bottom: '80px' }}>
                        <button onClick={scrollToBottom} className="p-2 bg-gray-200/80 rounded-full hover:bg-gray-300/80 transition" title="Xuống cuối">
                            <ArrowDown size={16} className="text-gray-600"/>
                        </button>
                    </div>

                    <div className="flex justify-between items-center mb-4 flex-wrap gap-2">
                        <button onClick={() => setShowNotebookMenu(true)} className="text-xl font-bold flex items-center gap-1.5 hover:opacity-70 transition" title="Mở menu Sổ tay">
                            <Menu size={20}/> Sổ tay
                        </button>
                        <div className="flex items-center gap-2 flex-wrap">
                            <button onClick={()=>setEditing({})} className="bg-blue-100 text-blue-600 px-3 py-2 rounded-lg flex items-center gap-1 text-sm font-bold hover:bg-blue-200 transition">
                                <Plus size={16}/> Mới
                            </button>
                        </div>
                    </div>

                    {filterLabel && (
                        <div className="flex items-center gap-2 mb-3 text-sm text-blue-600 bg-blue-50 p-2 rounded-lg">
                            <span>Đang lọc theo nhãn: <strong>{filterLabel}</strong></span>
                            <button onClick={() => setFilterLabel(null)} className="text-blue-800 hover:underline">(Xóa bộ lọc)</button>
                        </div>
                    )}

                    <div ref={scrollRef} className="overflow-y-auto" style={{ maxHeight: 'calc(100vh - 260px)' }}>
                        {filteredNotes.length === 0 && (
                            <div className="text-center text-gray-400 mt-10">
                                <StickyNote size={48} className="mx-auto mb-2 opacity-20" />
                                <p>{filterLabel ? `Không có ghi chú nào mang nhãn "${filterLabel}"` : 'Trống trơn...'}</p>
                            </div>
                        )}
                        {pinnedNotes.length > 0 && (
                            <div className="mb-4">
                                <div className="flex items-center gap-1.5 mb-2 text-xs font-black uppercase tracking-wider text-slate-400"><Pin size={12} className="fill-slate-400"/> Đã ghim</div>
                                <div className="grid grid-cols-2 gap-3">{pinnedNotes.map(renderNoteCard)}</div>
                            </div>
                        )}
                        {otherNotes.length > 0 && (
                            <div>
                                {pinnedNotes.length > 0 && <div className="mb-2 text-xs font-black uppercase tracking-wider text-slate-400">Ghi chú khác</div>}
                                <div className="grid grid-cols-2 gap-3">{otherNotes.map(renderNoteCard)}</div>
                            </div>
                        )}
                    </div>

                    {showNotebookMenu && (
                        <div className="fixed inset-0 bg-black/50 z-[70] animate-in fade-in duration-150" onClick={() => setShowNotebookMenu(false)}>
                            <div
                                className="fixed top-0 left-0 h-full w-64 max-w-[80vw] bg-white shadow-2xl flex flex-col animate-in slide-in-from-left duration-200"
                                onClick={e => e.stopPropagation()}
                            >
                                <div className="bg-gray-800 text-white p-4 flex justify-between items-center shrink-0">
                                    <h3 className="font-bold flex items-center gap-2"><Tag size={18}/> Lọc theo nhãn</h3>
                                    <button onClick={() => setShowNotebookMenu(false)} aria-label="Đóng menu Sổ tay"><X size={20}/></button>
                                </div>
                                <div className="flex-1 overflow-y-auto">
                                    {filterLabel && (
                                        <button
                                            onClick={() => { setFilterLabel(null); setShowNotebookMenu(false); }}
                                            className="w-full text-left px-4 py-3 text-sm font-semibold text-blue-600 hover:bg-blue-50 border-b transition"
                                        >
                                            Bỏ lọc nhãn (xem tất cả)
                                        </button>
                                    )}
                                    {allLabels.length === 0 ? (
                                        <p className="text-center text-gray-400 text-sm py-6 px-4">Chưa có nhãn nào.</p>
                                    ) : (
                                        allLabels.map(lb => (
                                            <button
                                                key={lb}
                                                onClick={() => { setFilterLabel(lb); setShowNotebookMenu(false); }}
                                                className={`w-full text-left px-4 py-3 text-sm font-medium flex items-center justify-between gap-2 hover:bg-gray-50 border-b transition ${filterLabel === lb ? 'text-blue-600 bg-blue-50 font-bold' : 'text-slate-700'}`}
                                            >
                                                <span className="truncate">{lb}</span>
                                                <span className="text-[10px] text-gray-400 shrink-0">{labelUsageCounts[lb] || 0}</span>
                                            </button>
                                        ))
                                    )}
                                </div>
                                <button
                                    onClick={() => { setShowTrash(true); setShowNotebookMenu(false); }}
                                    className="w-full text-left px-4 py-3 text-sm font-bold text-gray-500 hover:text-red-500 hover:bg-red-50 border-t flex items-center gap-2 transition shrink-0"
                                >
                                    <Trash2 size={16}/> Thùng rác {trashItems.length > 0 && `(${trashItems.length})`}
                                </button>
                            </div>
                        </div>
                    )}

                    {showTrash && (
                        <TrashModal
                            items={trashItems}
                            onRestore={handleRestoreFromTrash}
                            onDeletePermanently={handlePermanentDelete}
                            onEmptyTrash={handleEmptyTrash}
                            onClose={() => setShowTrash(false)}
                        />
                    )}

                    {editing && (
                        <NoteEditor
                            initialTitle={editing.title}
                            initialContent={editing.content}
                            initialItems={editing.items}
                            initialIsChecklist={editing.isChecklist}
                            initialReminder={editing.reminderTime ? formatDateTimeForInput(editing.reminderTime.seconds * 1000) : ''}
                            initialColor={editing.color}
                            initialPinned={editing.pinned}
                            initialLabels={editing.labels}
                            isNew={!editing.id}
                            onSave={save}
                            onCancel={() => setEditing(null)}
                            titleSuggestions={Array.from(new Set(notes.map(n => n.title).filter(Boolean)))}
                            existingLabels={Array.from(new Set(notes.flatMap(n => n.labels || [])))}
                        />
                    )}
                </div>
            );
        };

        // --- COMPONENT: KHO BẢO MẬT (Vault) ---
        const VaultModal = ({ db, appId, auth, user, onClose }) => {
            const uid = auth.currentUser?.uid;

            // --- Quản lý mật khẩu riêng của Kho bảo mật (lưu hash + salt) ---
            const [loadingPwd, setLoadingPwd] = useState(true);
            const [vaultPasswordHash, setVaultPasswordHash] = useState('');
            const [unlocked, setUnlocked] = useState(false);
            const [mode, setMode] = useState('gate'); // 'setup' | 'gate' | 'change' | 'forgot-verify' | 'forgot-reset'
            const [pinInput, setPinInput] = useState('');
            const [gateError, setGateError] = useState('');
            const [attempts, setAttempts] = useState(0);
            const [lockedUntil, setLockedUntil] = useState(null);
            const [remaining, setRemaining] = useState(0);
            const [actionDisabled, setActionDisabled] = useState(false);

            const [setupPin, setSetupPin] = useState('');
            const [setupPin2, setSetupPin2] = useState('');
            const [setupError, setSetupError] = useState('');

            const [curPin, setCurPin] = useState('');
            const [newPin, setNewPin] = useState('');
            const [newPin2, setNewPin2] = useState('');
            const [changeError, setChangeError] = useState('');
            const [changeSuccess, setChangeSuccess] = useState('');

            const [accountPassword, setAccountPassword] = useState('');
            const [forgotError, setForgotError] = useState('');
            const [resetPin, setResetPin] = useState('');
            const [resetPin2, setResetPin2] = useState('');

            const vaultAuthRef = useMemo(() => uid ? doc(db, 'artifacts', appId, 'users', uid, 'settings', 'vaultAuth') : null, [db, appId, uid]);

            // Load hash
            useEffect(() => {
                if (!vaultAuthRef) return;
                (async () => {
                    let hash = '';
                    try {
                        const snap = await getDoc(vaultAuthRef);
                        if (snap.exists() && snap.data().vaultPasswordHash) hash = snap.data().vaultPasswordHash;
                    } catch (e) { /* bỏ qua */ }
                    setVaultPasswordHash(hash);
                    setMode(hash ? 'gate' : 'setup');
                    setLoadingPwd(false);
                })();
            }, [vaultAuthRef]);

            // Đọc trạng thái attempts từ Firestore
            useEffect(() => {
                if (!uid) return;
                const attemptsRef = doc(db, 'artifacts', appId, 'users', uid, 'settings', 'attempts');
                const fetchAttempts = async () => {
                    try {
                        const snap = await getDoc(attemptsRef);
                        if (snap.exists()) {
                            const data = snap.data();
                            setAttempts(data.attempts || 0);
                            if (data.lockedUntil && data.lockedUntil.toMillis) {
                                const lockTime = data.lockedUntil.toMillis();
                                if (lockTime > Date.now()) {
                                    setLockedUntil(lockTime);
                                } else {
                                    await setDoc(attemptsRef, { attempts: 0, lockedUntil: null }, { merge: true });
                                    setAttempts(0);
                                    setLockedUntil(null);
                                }
                            }
                        } else {
                            await setDoc(attemptsRef, { attempts: 0, lockedUntil: null });
                        }
                    } catch (e) {
                        console.warn('Lỗi đọc attempts vault:', e);
                    }
                };
                fetchAttempts();
            }, [db, appId, uid]);

            // Timer đếm ngược khi bị khóa
            useEffect(() => {
                if (!lockedUntil) return;
                const interval = setInterval(() => {
                    const now = Date.now();
                    if (now >= lockedUntil) {
                        setLockedUntil(null);
                        setAttempts(0);
                        const attemptsRef = doc(db, 'artifacts', appId, 'users', uid, 'settings', 'attempts');
                        setDoc(attemptsRef, { attempts: 0, lockedUntil: null }, { merge: true }).catch(console.warn);
                        clearInterval(interval);
                        setRemaining(0);
                    } else {
                        setRemaining(Math.ceil((lockedUntil - now) / 1000));
                    }
                }, 1000);
                return () => clearInterval(interval);
            }, [lockedUntil, db, appId, uid]);

            const persistVaultPasswordHash = async (hash) => {
                if (vaultAuthRef) await setDoc(vaultAuthRef, { vaultPasswordHash: hash }, { merge: true });
            };

            const handleSetup = async (e) => {
                e.preventDefault();
                setSetupError('');
                if (!setupPin.trim()) { setSetupError("Vui lòng nhập mật khẩu."); return; }
                if (setupPin !== setupPin2) { setSetupError("Mật khẩu nhập lại không khớp."); return; }
                const hash = await createPasswordHash(setupPin.trim());
                await persistVaultPasswordHash(hash);
                setVaultPasswordHash(hash);
                setSetupPin(''); setSetupPin2('');
                setUnlocked(true);
                setMode('gate');
            };

            const verifyVaultPassword = async (input, stored) => {
                return await verifyPasswordWithSalt(input, stored);
            };

            const handleUnlockSubmit = async (e) => {
                e.preventDefault();
                if (actionDisabled) return;
                setGateError('');
                if (lockedUntil) {
                    setGateError(`Tạm khóa ${remaining}s. Vui lòng chờ.`);
                    return;
                }
                const attemptsRef = doc(db, 'artifacts', appId, 'users', uid, 'settings', 'attempts');
                const isMatch = await verifyVaultPassword(pinInput, vaultPasswordHash);
                if (isMatch) {
                    await setDoc(attemptsRef, { attempts: 0, lockedUntil: null }, { merge: true });
                    setAttempts(0);
                    setUnlocked(true);
                    setVaultPlainPassword(pinInput);
                    setPinInput('');
                    return;
                }
                const newAttempts = attempts + 1;
                setAttempts(newAttempts);
                let lockDuration = 0;
                const level = Math.floor((newAttempts - 1) / 5);
                switch (level) {
                    case 0: lockDuration = 30; break;
                    case 1: lockDuration = 120; break;
                    case 2: lockDuration = 300; break;
                    case 3: lockDuration = 1800; break;
                    case 4: lockDuration = 7200; break;
                    default: lockDuration = 14400; break;
                }
                if (newAttempts >= 5) {
                    const lockUntil = Date.now() + lockDuration * 1000;
                    setLockedUntil(lockUntil);
                    await setDoc(attemptsRef, { attempts: newAttempts, lockedUntil: Timestamp.fromMillis(lockUntil) }, { merge: true });
                    setGateError(`Sai quá 5 lần. Tạm khóa ${lockDuration}s.`);
                    setPinInput('');
                    return;
                }
                await setDoc(attemptsRef, { attempts: newAttempts, lockedUntil: null }, { merge: true });
                setGateError(`Sai mật khẩu. Còn ${5 - newAttempts} lần thử.`);
                setPinInput('');
            };

            const handleChangePassword = async (e) => {
                e.preventDefault();
                setChangeError(''); setChangeSuccess('');
                const isMatch = await verifyVaultPassword(curPin, vaultPasswordHash);
                if (!isMatch) { setChangeError("Mật khẩu hiện tại không đúng."); return; }
                if (!newPin.trim()) { setChangeError("Vui lòng nhập mật khẩu mới."); return; }
                if (newPin !== newPin2) { setChangeError("Mật khẩu mới nhập lại không khớp."); return; }

                try {
                    const vaultRef = collection(db, 'artifacts', appId, 'users', uid, 'vault');
                    const snap = await getDocs(vaultRef);
                    const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));

                    const decryptedItems = [];
                    for (const item of items) {
                        try {
                            let username = item.usernameEnc ? await decryptText(item.usernameEnc, curPin) : (item.username || '');
                            let password = item.passwordEnc ? await decryptText(item.passwordEnc, curPin) : (item.password || '');
                            let note = item.noteEnc ? await decryptText(item.noteEnc, curPin) : (item.note || '');
                            decryptedItems.push({ ...item, username, password, note });
                        } catch (err) {
                            console.warn('Giải mã thất bại cho item', item.id, err);
                            decryptedItems.push({ ...item, username: '', password: '', note: '', decryptError: true });
                        }
                    }

                    const newHash = await createPasswordHash(newPin.trim());
                    await persistVaultPasswordHash(newHash);
                    setVaultPasswordHash(newHash);
                    setVaultPlainPassword(newPin.trim());

                    for (const item of decryptedItems) {
                        const updateData = { title: item.title };
                        if (item.username) updateData.usernameEnc = await encryptText(item.username, newPin.trim());
                        if (item.password) updateData.passwordEnc = await encryptText(item.password, newPin.trim());
                        if (item.note) updateData.noteEnc = await encryptText(item.note, newPin.trim());
                        await updateDoc(doc(vaultRef, item.id), updateData);
                    }

                    setChangeSuccess("Đã đổi mật khẩu Kho bảo mật và tái mã hóa toàn bộ dữ liệu!");
                    setCurPin(''); setNewPin(''); setNewPin2('');
                    setTimeout(() => setMode('gate'), 1500);
                } catch (err) {
                    setChangeError("Lỗi khi đổi mật khẩu: " + err.message);
                }
            };

            const handleForgotVerify = async (e) => {
                e.preventDefault();
                setForgotError('');
                if (!auth.currentUser?.email) { setForgotError("Không tìm thấy email tài khoản."); return; }
                try {
                    await signInWithEmailAndPassword(auth, auth.currentUser.email, accountPassword);
                    setAccountPassword('');
                    setMode('forgot-reset');
                } catch (err) {
                    setForgotError("Sai mật khẩu tài khoản. Vui lòng thử lại.");
                }
            };

            const handleForgotReset = async (e) => {
                e.preventDefault();
                setForgotError('');
                if (!resetPin.trim()) { setForgotError("Vui lòng nhập mật khẩu mới."); return; }
                if (resetPin !== resetPin2) { setForgotError("Mật khẩu nhập lại không khớp."); return; }

                // Tự động backup
                try {
                    const vaultRef = collection(db, 'artifacts', appId, 'users', uid, 'vault');
                    const snap = await getDocs(vaultRef);
                    if (!snap.empty) {
                        const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `vault_backup_before_reset_${new Date().toISOString().slice(0,10)}.json`;
                        a.click();
                        URL.revokeObjectURL(url);
                        toast.info("Đã tạo bản sao lưu Vault trước khi đặt lại mật khẩu.", { position: "top-center" });
                    }
                } catch (backupErr) {
                    console.warn("Lỗi backup trước khi reset:", backupErr);
                }

                const newHash = await createPasswordHash(resetPin.trim());
                await persistVaultPasswordHash(newHash);
                setVaultPasswordHash(newHash);
                setResetPin(''); setResetPin2('');
                setUnlocked(true);
                setVaultPlainPassword(resetPin.trim());
                setMode('gate');
            };

            // --- Dữ liệu Kho bảo mật ---
            const [items, setItems] = useState([]);
            const [editing, setEditing] = useState(null);
            const [visibleIds, setVisibleIds] = useState({});
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const [form, setForm] = useState({ title: '', username: '', password: '', note: '' });
            const [vaultPlainPassword, setVaultPlainPassword] = useState('');
            const [vaultSearch, setVaultSearch] = useState('');

            const vaultRef = useMemo(() => uid ? collection(db, 'artifacts', appId, 'users', uid, 'vault') : null, [db, appId, uid]);

            useEffect(() => {
                if (!unlocked || !vaultRef) return;
                const unsub = onSnapshot(query(vaultRef), async (snap) => {
                    const rawItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    const decryptedItems = [];
                    for (const item of rawItems) {
                        try {
                            const decrypted = {
                                id: item.id,
                                title: item.title || '',
                                username: item.usernameEnc ? await decryptText(item.usernameEnc, vaultPlainPassword) : (item.username || ''),
                                password: item.passwordEnc ? await decryptText(item.passwordEnc, vaultPlainPassword) : (item.password || ''),
                                note: item.noteEnc ? await decryptText(item.noteEnc, vaultPlainPassword) : (item.note || ''),
                                updatedAt: item.updatedAt,
                                decryptError: false
                            };
                            if ((item.usernameEnc && !decrypted.username) || (item.passwordEnc && !decrypted.password) || (item.noteEnc && !decrypted.note)) {
                                decrypted.decryptError = true;
                            }
                            decryptedItems.push(decrypted);
                        } catch (e) {
                            console.warn('Giải mã thất bại cho item', item.id);
                            decryptedItems.push({ id: item.id, title: '⚠️ Không giải mã được', username: '', password: '', note: '', decryptError: true });
                        }
                    }
                    decryptedItems.sort((a,b) => (b.updatedAt?.seconds||0) - (a.updatedAt?.seconds||0));
                    setItems(decryptedItems);
                });
                return () => unsub();
            }, [unlocked, vaultRef, vaultPlainPassword]);

            const encryptFields = async (data) => {
                const result = { title: data.title };
                if (data.username) result.usernameEnc = await encryptText(data.username, vaultPlainPassword);
                if (data.password) result.passwordEnc = await encryptText(data.password, vaultPlainPassword);
                if (data.note) result.noteEnc = await encryptText(data.note, vaultPlainPassword);
                return result;
            };

            const startNew = () => { setForm({ title: '', username: '', password: '', note: '' }); setEditing({}); };
            const startEdit = (it) => { setForm({ title: it.title||'', username: it.username||'', password: it.password||'', note: it.note||'' }); setEditing(it); };

            const handleSave = async (e) => {
                e.preventDefault();
                if (!form.title.trim() || !vaultRef || !vaultPlainPassword) return;
                const encrypted = await encryptFields(form);
                const payload = { ...encrypted, updatedAt: serverTimestamp() };
                if (editing && editing.id) await updateDoc(doc(vaultRef, editing.id), payload);
                else await addDoc(vaultRef, payload);
                setEditing(null);
            };

            const handleDelete = async (id) => {
                if (deleteConfirm === id) { await deleteDoc(doc(vaultRef, id)); setDeleteConfirm(null); }
                else { setDeleteConfirm(id); setTimeout(() => setDeleteConfirm(null), 3000); }
            };

            const toggleVisible = (id) => setVisibleIds(prev => ({ ...prev, [id]: !prev[id] }));

            const filteredItems = useMemo(() => {
                const kw = normalizeVN(vaultSearch);
                if (!kw) return items;
                const withNorm = items.map(it => ({
                    ...it,
                    __norm: normalizeVN((it.title || '') + ' ' + (it.username || '') + ' ' + (it.note || ''))
                }));
                const fuse = new Fuse(withNorm, { keys: ['__norm'], threshold: 0.4, ignoreLocation: true, minMatchCharLength: 2 });
                return fuse.search(kw).map(r => r.item);
            }, [items, vaultSearch]);

            const clipboardTimerRef = useRef(null);
            const handleCopy = async (text) => {
                try {
                    await navigator.clipboard.writeText(text || '');
                    if (clipboardTimerRef.current) clearTimeout(clipboardTimerRef.current);
                    clipboardTimerRef.current = setTimeout(async () => {
                        try {
                            const current = await navigator.clipboard.readText();
                            if (current === (text || '')) {
                                await navigator.clipboard.writeText('');
                            }
                        } catch (e) { /* bỏ qua */ }
                    }, 30000);
                } catch (e) {}
            };
            useEffect(() => () => { if (clipboardTimerRef.current) clearTimeout(clipboardTimerRef.current); }, []);

            const handleExportVault = async () => {
                try {
                    const snap = await getDocs(vaultRef);
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `vault_export_${new Date().toISOString().slice(0,10)}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                    toast.success("Xuất dữ liệu Vault thành công!", { position: "top-center" });
                } catch (err) {
                    toast.error("Lỗi xuất Vault: " + err.message, { position: "top-center" });
                }
            };

            const handleImportVault = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const text = await file.text();
                    const data = JSON.parse(text);
                    if (!Array.isArray(data)) throw new Error('Dữ liệu không hợp lệ.');
                    if (!window.confirm("CẢNH BÁO: Việc nhập dữ liệu Vault sẽ GHI ĐÈ toàn bộ dữ liệu hiện tại. Bạn có chắc chắn muốn tiếp tục?")) {
                        return;
                    }
                    const snap = await getDocs(vaultRef);
                    for (const docSnap of snap.docs) {
                        await deleteDoc(docSnap.ref);
                    }
                    for (const item of data) {
                        const { id, ...rest } = item;
                        const docRef = doc(vaultRef, id || undefined);
                        await setDoc(docRef, rest);
                    }
                    toast.success("Nhập dữ liệu Vault thành công!", { position: "top-center" });
                } catch (err) {
                    toast.error("Lỗi nhập Vault: " + err.message, { position: "top-center" });
                }
                e.target.value = '';
            };

            return (
                <div className="fixed inset-0 bg-black/60 z-[80] flex items-center justify-center p-4" onClick={onClose}>
                    <div className="bg-white w-full max-w-sm rounded-xl shadow-2xl overflow-hidden max-h-[85vh] flex flex-col" onClick={e => e.stopPropagation()}>
                        <div className="bg-slate-900 text-white p-4 flex justify-between items-center shrink-0">
                            <h3 className="font-bold flex items-center gap-2"><Shield size={18}/> Kho bảo mật</h3>

                                        <input type="password" required value={newPin} onChange={e=>setNewPin(e.target.value)} placeholder="Mật khẩu mới..." className="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-1 focus:ring-slate-800 text-slate-800"/>

                                        <input type="password" required value={resetPin2} onChange={e=>setResetPin2(e.target.value)} placeholder="Nhập lại mật khẩu mới..." className="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-1 focus:ring-slate-800 text-slate-800"/>

                        ) : editing ? (

                                </div>

                                    <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Mật khẩu</label>
                                    <input className="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-1 focus:ring-blue-500" placeholder="Mật khẩu..." value={form.password} onChange={e => setForm({...form, password: e.target.value})} />

                        ) : (

                                    <div className="relative">
                                        <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                        <input
                                            type="text"
                                            value={vaultSearch}
                                            onChange={e => setVaultSearch(e.target.value)}

                                            className="w-full pl-8 pr-16 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:ring-1 focus:ring-slate-800 text-slate-800"
                                        />
                                        <div className="absolute right-2 top-1/2 -translate-y-1/2 flex items-center gap-1.5">
                                            <span className="text-[10px] font-bold text-slate-400 tabular-nums">
                                                {vaultSearch ? `${filteredItems.length}/${items.length}` : `${items.length}`}

                                        </div>
                                    )}
                                    {items.length > 0 && filteredItems.length === 0 && (
                                        <div className="text-center text-gray-400 mt-10">
                                            <Search size={32} className="mx-auto mb-2 opacity-20" />
                                            <p className="text-sm">Không tìm thấy mục nào phù hợp.</p>
                                        </div>
                                    )}
                                    <ul className="space-y-2">
                                        {filteredItems.map(it => {
                                            const hasError = it.decryptError;
                                            return (
                                                <li key={it.id} className={`p-3 rounded-lg border ${hasError ? 'border-red-300 bg-red-50' : 'border-slate-200 bg-slate-50'}`}>

                                                        <h4 className={`font-bold text-sm ${hasError ? 'text-red-600' : 'text-slate-800'} truncate`}>{it.title}</h4>
                                                        <div className="flex items-center gap-1.5 shrink-0">
                                                            <button onClick={() => startEdit(it)} className="text-slate-400 hover:text-blue-600 p-1" title="Sửa"><Pencil size={14}/></button>
                                                            <button onClick={() => handleDelete(it.id)} className={`p-1 transition-all ${deleteConfirm === it.id ? 'text-red-600 font-bold text-[10px] bg-red-100 px-1.5 py-1 rounded' : 'text-red-400 hover:text-red-600'}`}>{deleteConfirm === it.id ? 'Xóa?' : <Trash2 size={14}/>}</button>
                                                        </div>
                                                    </div>
                                                    {hasError && (
                                                        <div className="text-[10px] text-red-500 mt-1 flex items-center gap-1">
                                                            <AlertCircle size={12}/> Không giải mã được (có thể sai mật khẩu hoặc dữ liệu hỏng)
                                                        </div>
                                                    )}
                                                    {!hasError && it.username && (
                                                        <div className="flex items-center justify-between mt-1.5 text-xs text-slate-600">
                                                            <span className="truncate">👤 {it.username}</span>
                                                            <button onClick={() => handleCopy(it.username)} className="text-slate-400 hover:text-slate-700 shrink-0 ml-2" title="Sao chép"><Copy size={12}/></button>
