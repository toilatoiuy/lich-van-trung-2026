                    } else {
                        setRemaining(Math.ceil((lockedUntil - now) / 1000));
                    }
                }, 1000);
                return () => clearInterval(interval);
            }, [lockedUntil, db, appId, user]);

            const handleUnlockSubmit = async (e) => {
                e.preventDefault();
                if (actionDisabled) return;
                setError('');

                if (lockedUntil) {
                    setError(`Tạm khóa ${remaining}s. Vui lòng chờ.`);
                    return;
                }

                const isMatch = await verifyPasswordWithSalt(pin, correctPassword);
                const attemptsRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'attempts');

                if (isMatch) {
                    // Thành công: reset attempts
                    await setDoc(attemptsRef, { attempts: 0, lockedUntil: null }, { merge: true });
                    setAttempts(0);
                    setPin('');
                    onUnlock();
                    return;
                }

                // Sai: tăng attempts
                const newAttempts = attempts + 1;
                setAttempts(newAttempts);

                // Xác định thời gian khóa dựa trên số lần thử sai (tăng dần)
                let lockDuration = 0;
                const level = Math.floor((newAttempts - 1) / 5); // mỗi 5 lần lại tăng mức
                switch (level) {
                    case 0: lockDuration = 30; break;      // 30s
                    case 1: lockDuration = 120; break;     // 2 phút
                    case 2: lockDuration = 300; break;     // 5 phút
                    case 3: lockDuration = 1800; break;    // 30 phút
                    case 4: lockDuration = 7200; break;    // 2 giờ
                    default: lockDuration = 14400; break;  // 4 giờ (tối đa)
                }

                if (newAttempts >= 5) {
                    const lockUntil = Date.now() + lockDuration * 1000;
                    setLockedUntil(lockUntil);
                    await setDoc(attemptsRef, { attempts: newAttempts, lockedUntil: Timestamp.fromMillis(lockUntil) }, { merge: true });
                    setError(`Sai quá 5 lần. Tạm khóa ${lockDuration}s.`);
                    setPin('');
                    return;
                }

                await setDoc(attemptsRef, { attempts: newAttempts, lockedUntil: null }, { merge: true });
                setError(`Sai mã PIN. Còn ${5 - newAttempts} lần thử.`);
                setPin('');
            };

            if (loading) {
                return <div className="flex flex-col flex-1 items-center justify-center p-6 bg-slate-50"><InlineSkeleton lines={3} /></div>;
            }

            return (
                <div className="flex flex-col flex-1 items-center justify-center p-6 bg-slate-50 font-sans">
                    <div className="w-full max-w-xs text-center space-y-6">
                        <div className="mx-auto bg-blue-100 text-blue-600 p-4 rounded-full w-16 h-16 flex items-center justify-center">
                            <Lock size={28} />
                        </div>
                        <div>
                            <h3 className="text-lg font-bold text-slate-800">Khu vực bảo mật</h3>
                            <p className="text-xs text-slate-400 mt-1">Vui lòng cung cấp mã PIN để xem dữ liệu</p>
                            {lockedUntil && <p className="text-xs text-red-500 mt-1 font-bold">Khóa tạm {remaining}s</p>}
                        </div>
                        <form onSubmit={handleUnlockSubmit} className="space-y-4">
                            <input 
                                type="password" 
                                required
                                value={pin}
                                onChange={e => setPin(e.target.value)}
                                placeholder="Nhập mã bảo vệ..." 
                                className="w-full px-4 py-3 border border-slate-200 text-center rounded-xl text-lg font-bold tracking-widest text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none bg-white shadow-sm"
                                disabled={!!lockedUntil}
                            />
                            {error && <p className="text-red-500 text-xs text-center font-medium">{error}</p>}
                            <button 
                                type="submit" 
                                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-md transition"
                                disabled={!!lockedUntil}
                            >
                                Xác nhận mở khóa
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- CÁC COMPONENT CON ---
        const SettingsModal = ({ theme, onSave, onClose, auth, db, appId, onSignOut, user }) => {
            const [localTheme, setLocalTheme] = useState(theme);
            const [newPassword, setNewPassword] = useState('');
            const [oldPassword, setOldPassword] = useState('');
            const [passwordMessage, setPasswordMessage] = useState('');
            const [passwordError, setPasswordError] = useState('');
            const [showChangePassword, setShowChangePassword] = useState(false);

            // Mục 2: bảng chọn màu nền (chế độ "Tùy chọn") — bấm nút là mở THẲNG bảng chọn màu chi
            // tiết của trình duyệt/hệ điều hành, không còn thanh màu đơn giản trung gian như trước.
            const fixedColorInputRef = useRef(null); // ô <input type="color"> ẩn, chỉ dùng để gọi bảng màu native
            useEffect(() => {
                const el = fixedColorInputRef.current;
                if (!el) return;
                // Sự kiện 'change' gốc của trình duyệt chỉ bắn ra ĐÚNG 1 LẦN khi người dùng đóng
                // bảng chọn màu chi tiết (khác với 'input' bắn liên tục lúc đang kéo chọn trong
                // bảng) — dùng đúng thời điểm này để lưu & đồng bộ, tránh ghi lên máy chủ liên tục.
                const handleNativeChange = (e) => {
                    const updated = { ...localTheme, bgColor: e.target.value, bgMode: 'fixed' };
                    setLocalTheme(updated);
                    onSave(updated);
                };
                el.addEventListener('change', handleNativeChange);
                return () => el.removeEventListener('change', handleNativeChange);
            }, [localTheme]);

            // Mục 2: bảng màu theo thứ — ẩn sau khi bấm "Đặt và đồng bộ", bấm lại nút thì hiện ra
            const [showWeekdayPanel, setShowWeekdayPanel] = useState(false);

            // Chọn chế độ màu nền (Tùy chọn/Ngẫu nhiên/Theo thứ) — tự lưu & đồng bộ ngay khi chọn.
            // Bấm "Tùy chọn" mở thẳng bảng chọn màu chi tiết ngay lập tức (kể cả khi đang ở sẵn chế
            // độ đó rồi — bấm lại vẫn mở lại bảng màu để đổi màu khác). Bấm "Theo thứ" tương tự mở
            // luôn bảng 7 thứ.
            const selectBgMode = (mode) => {
                const updated = { ...localTheme, bgMode: mode };
                setLocalTheme(updated);
                onSave(updated);
                if (mode === 'fixed' && fixedColorInputRef.current) {
                    fixedColorInputRef.current.click(); // mở thẳng bảng chọn màu chi tiết
                }
                if (mode === 'weekday') setShowWeekdayPanel(true);
            };

            // Bổ sung thiết lập mật khẩu PIN ứng dụng
            const [appPasswordHash, setAppPasswordHash] = useState('');
            const [enableLock, setEnableLock] = useState(false);
            const [lockError, setLockError] = useState('');
            const [lockSuccess, setLockSuccess] = useState('');
            const [showVault, setShowVault] = useState(false);

            // Đổi / Quên mật khẩu cho khóa Ghi chú & Việc cần làm
            const [lockUiMode, setLockUiMode] = useState('view'); // 'view' | 'change' | 'forgot-verify' | 'forgot-reset'
            const [curLockPin, setCurLockPin] = useState('');
            const [newLockPin, setNewLockPin] = useState('');
            const [newLockPin2, setNewLockPin2] = useState('');
            const [lockChangeError, setLockChangeError] = useState('');
            const [lockChangeSuccess, setLockChangeSuccess] = useState('');
            const [lockAccountPassword, setLockAccountPassword] = useState('');
            const [lockForgotError, setLockForgotError] = useState('');
            const [lockResetPin, setLockResetPin] = useState('');
            const [lockResetPin2, setLockResetPin2] = useState('');

            // State cho thiết lập mật khẩu lần đầu
            const [setupNewPassword, setSetupNewPassword] = useState('');
            const [setupConfirmPassword, setSetupConfirmPassword] = useState('');
            const [setupError, setSetupError] = useState('');

            // State cho popup Export/Import dữ liệu
            const [showExportModal, setShowExportModal] = useState(false);
            const [showImportModal, setShowImportModal] = useState(false);

            // Thông báo đẩy (push) - hoạt động cả khi tắt hẳn trình duyệt/app
            const [pushEnabled, setPushEnabled] = useState(false);
            const [pushLoading, setPushLoading] = useState(false);
            const [pushMessage, setPushMessage] = useState('');
            const pushSupported = typeof window !== 'undefined' && 'serviceWorker' in navigator && 'PushManager' in window;

            // ── Trợ lý AI (đã đơn giản hoá: chỉ dùng Gemini miễn phí, bật/tắt bằng công tắc) ──
            const [aiEnabled, setAiEnabled] = useState(() => localStorage.getItem('vt_ai_enabled') === 'true');
            const [aiApiKey, setAiApiKey] = useState(() => localStorage.getItem('vt_ai_api_key') || '');
            const [showAiKeyInput, setShowAiKeyInput] = useState(false);
            const [aiMode, setAiMode] = useState(() => localStorage.getItem('vt_ai_mode') || null);
            const [aiPrivacy, setAiPrivacy] = useState(() => getAIPrivacy());

            const saveAiEnabled = (val) => {
                setAiEnabled(val);
                localStorage.setItem('vt_ai_enabled', val ? 'true' : 'false');
                if (!val) {
                    // Tắt AI: tự động đưa Mức độ (chưa chọn) + Chế độ riêng tư (mặc định) về lại
                    // trạng thái ban đầu, để lần sau bật lại không giữ các lựa chọn dở dang trước đó.
                    setAiMode(null);
                    localStorage.removeItem('vt_ai_mode');
                    setAiPrivacy({ ...DEFAULT_AI_PRIVACY });
                    localStorage.setItem('vt_ai_privacy', JSON.stringify(DEFAULT_AI_PRIVACY));
                }
            };
            const saveAiApiKey = (val) => {
                // Loại bỏ TOÀN BỘ khoảng trắng/xuống dòng (ở bất kỳ vị trí nào, không chỉ đầu-cuối)
                // và các ký tự Unicode ẩn/vô hình (zero-width space, BOM, non-breaking space...) —
                // thao tác dán (paste) trên điện thoại rất dễ dính các ký tự này (từ bàn phím ảo,
                // ứng dụng ghi chú, hoặc trình duyệt), khiến API Key trông có vẻ đúng nhưng thực chất
                // sai lệch, bị Google từ chối với lỗi 401 chung chung "invalid authentication
                // credentials" — API Key thật sự không bao giờ chứa khoảng trắng ở bất kỳ đâu nên loại
                // bỏ hết là an toàn, không làm hỏng key hợp lệ.
                const trimmed = sanitizeApiKey(val);
                setAiApiKey(trimmed);
                localStorage.setItem('vt_ai_api_key', trimmed);
            };
            // Bấm "Tiết kiệm"/"Thông minh": chọn mức độ VÀ để trống toàn bộ ô tick riêng tư,
            // buộc người dùng tự chọn lại thay vì dùng sẵn giá trị mặc định.
            const chooseAiMode = (val) => {
                setAiMode(val);
                localStorage.setItem('vt_ai_mode', val);
                const cleared = { events: false, todos: false, notes: false, timetable: false, confirmBeforeSend: false, showExactContent: false };
                setAiPrivacy(cleared);
                localStorage.setItem('vt_ai_privacy', JSON.stringify(cleared));
            };
            const saveAiPrivacy = (patch) => {
                setAiPrivacy(prev => {
                    const next = { ...prev, ...patch };
                    localStorage.setItem('vt_ai_privacy', JSON.stringify(next));
                    return next;
                });
            };

            useEffect(() => {
                isPushSubscribed().then(setPushEnabled);
            }, []);

            const handleTogglePush = async () => {
                if (!auth.currentUser) return;
                setPushLoading(true);
                setPushMessage('');
                try {
                    if (pushEnabled) {
                        await disablePushNotifications(db, appId, auth.currentUser.uid);
                        setPushEnabled(false);
                        setPushMessage('Đã tắt thông báo trên thiết bị này.');
                    } else {
                        const res = await enablePushNotifications(db, appId, auth.currentUser.uid);
                        if (res.ok) {
                            setPushEnabled(true);
                            setPushMessage('✅ Đã bật! Bạn sẽ nhận thông báo kể cả khi tắt trình duyệt.');
                        } else if (res.reason === 'denied') {
                            setPushMessage('⚠️ Bạn đã chặn quyền thông báo. Vào cài đặt trình duyệt để cho phép lại.');
                        } else if (res.reason === 'unsupported') {
                            setPushMessage('⚠️ Trình duyệt/thiết bị này chưa hỗ trợ thông báo đẩy.');
                        } else {
                            setPushMessage('⚠️ Có lỗi xảy ra, thử lại sau.');
                        }
                    }
                } finally {
                    setPushLoading(false);
                }
            };

            // Dark mode toggle — tự động lưu & đồng bộ ngay khi bật/tắt (trước đây chỉ đổi ở local,
            // chưa lưu ngay lập tức như các công tắc khác trong Cài đặt).
            const handleToggleDarkMode = () => {
                setLocalTheme(prev => {
                    const updated = { ...prev, darkMode: !prev.darkMode };
                    onSave(updated);
                    return updated;
                });
            };

            // Tải cấu hình mật khẩu bảo mật hiện tại từ Firestore (không lấy từ localStorage)
            useEffect(() => {
                if (!auth.currentUser) return;
                const loadLockConfig = async () => {
                    try {
                        const settingsRef = doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'settings', 'lock');
                        const docSnap = await getDoc(settingsRef);
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            setAppPasswordHash(data.appPasswordHash || '');
                            setEnableLock(data.enableLock || false);
                        } else {
                            setAppPasswordHash('');
                            setEnableLock(false);
                        }
                        // Cập nhật sessionStorage với trạng thái bật khóa
                        sessionStorage.setItem('vt_enable_lock', String(enableLock));
                    } catch (e) {
                        console.error("Lỗi tải thông tin khóa:", e);
                    }
                };
                loadLockConfig();
            }, [auth.currentUser, enableLock]);

            // Lưu cài đặt khóa (không lưu hash vào localStorage)
            const saveLockSettings = async (nextEnable, plainPassword) => {
                setLockError('');
                setLockSuccess('');
                try {
                    const settingsRef = doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'settings', 'lock');
                    let nextHash = appPasswordHash; // giữ nguyên nếu không có password mới
                    if (plainPassword && plainPassword.trim()) {
                        nextHash = await createPasswordHash(plainPassword.trim());
                    }
                    const payload = {
                        appPasswordHash: nextHash,
                        enableLock: nextEnable
                    };
                    await setDoc(settingsRef, payload, { merge: true });
                    // Không lưu hash vào localStorage
                    sessionStorage.setItem('vt_enable_lock', nextEnable ? 'true' : 'false');
                    setAppPasswordHash(nextHash);
                    setLockSuccess("Đã cập nhật tính năng bảo vệ thành công!");
                } catch (err) {
                    setLockError("Lỗi lưu cấu hình bảo vệ: " + err.message);
                }
            };

            // Xử lý khi bật/tắt công tắc
            const handleToggleLock = async (val) => {
                setEnableLock(val);
                if (val && appPasswordHash) {
                    // Bật và đã có mật khẩu -> cập nhật enableLock
                    await saveLockSettings(true, null);
                } else if (!val) {
                    // Tắt
                    await saveLockSettings(false, null);
                }
                // Nếu bật mà chưa có mật khẩu thì chỉ set state, form setup sẽ hiện
            };

            // Thiết lập mật khẩu lần đầu
            const handleSetupLock = async () => {
                setSetupError('');
                if (!setupNewPassword.trim()) {
                    setSetupError('Vui lòng nhập mã PIN.');
                    return;
                }
                if (setupNewPassword !== setupConfirmPassword) {
                    setSetupError('Mã PIN xác nhận không khớp.');
                    return;
                }
                // Lưu mật khẩu và bật khóa
                await saveLockSettings(true, setupNewPassword);
                setSetupNewPassword('');
                setSetupConfirmPassword('');
                setLockSuccess('Đã thiết lập mã PIN bảo mật!');
                setLockUiMode('view'); // quay về chế độ xem
            };

            // Đổi mật khẩu (khi đã có hash)
            const handleLockChangePassword = async (e) => {
                e.preventDefault();
                setLockChangeError(''); setLockChangeSuccess('');
                const isMatch = await verifyPasswordWithSalt(curLockPin, appPasswordHash);
                if (!isMatch) { setLockChangeError("Mã PIN hiện tại không đúng."); return; }
                if (!newLockPin.trim()) { setLockChangeError("Vui lòng nhập mã PIN mới."); return; }
                if (newLockPin !== newLockPin2) { setLockChangeError("Mã PIN mới nhập lại không khớp."); return; }
                await saveLockSettings(true, newLockPin.trim());
                setLockChangeSuccess("Đã đổi mã PIN bảo mật!");
                setCurLockPin(''); setNewLockPin(''); setNewLockPin2('');
                setTimeout(() => setLockUiMode('view'), 1200);
            };

            // Quên mật khẩu: xác thực tài khoản
            const handleLockForgotVerify = async (e) => {
                e.preventDefault();
                setLockForgotError('');
                if (!auth.currentUser?.email) { setLockForgotError("Không tìm thấy email tài khoản."); return; }
                try {
                    await signInWithEmailAndPassword(auth, auth.currentUser.email, lockAccountPassword);
                    setLockAccountPassword('');
                    setLockUiMode('forgot-reset');
                } catch (err) {
                    setLockForgotError("Sai mật khẩu tài khoản. Vui lòng thử lại.");
                }
            };

            // Quên mật khẩu: đặt lại (có tự động backup)
            const handleLockForgotReset = async (e) => {
                e.preventDefault();
                setLockForgotError('');
                if (!lockResetPin.trim()) { setLockForgotError("Vui lòng nhập mã PIN mới."); return; }
                if (lockResetPin !== lockResetPin2) { setLockForgotError("Mã PIN nhập lại không khớp."); return; }
                
                // Tự động backup trước khi reset
                try {
                    // Lấy dữ liệu Vault (nếu có) và xuất ra file
                    const vaultRef = collection(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'vault');
                    const snap = await getDocs(vaultRef);
                    if (!snap.empty) {
                        const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `vault_backup_before_reset_${new Date().toISOString().slice(0,10)}.json`;
                        a.click();
                        URL.revokeObjectURL(url);
                        toast.info("Đã tạo bản sao lưu Vault trước khi đặt lại mật khẩu.", { position: "top-center" });
                    }
                } catch (backupErr) {
                    console.warn("Lỗi backup trước khi reset:", backupErr);
                }

                await saveLockSettings(true, lockResetPin.trim());
                setLockResetPin(''); setLockResetPin2('');
                setLockUiMode('view');
            };

            // Tính năng Đổi mật khẩu tài khoản
            const handleChangePassword = async (e) => {
                e.preventDefault();
                setPasswordMessage('');
                setPasswordError('');
                if (!oldPassword.trim()) {
                    setPasswordError("Vui lòng nhập mật khẩu cũ.");
                    return;
                }
                if (!newPassword.trim()) {
                    setPasswordError("Vui lòng nhập mật khẩu mới.");
                    return;
                }
                try {
                    if (auth.currentUser) {
                        const credential = EmailAuthProvider.credential(auth.currentUser.email, oldPassword);
                        await reauthenticateWithCredential(auth.currentUser, credential);
                        await updatePassword(auth.currentUser, newPassword);
                        setPasswordMessage("Đổi mật khẩu thành công!");
                        setOldPassword('');
                        setNewPassword('');
                        // Nhắc người dùng: mật khẩu tài khoản dùng để xác thực khi "Quên mật khẩu Kho bảo mật",
                        // nên khi đổi mật khẩu tài khoản, nên nhắc cập nhật/kiểm tra lại thông tin khôi phục Vault.
                        setTimeout(() => {
                            const wantsUpdate = window.confirm("Bạn có muốn cập nhật thông tin khôi phục Vault không?");
                            if (wantsUpdate) {
                                toast.info("Vui lòng vào Kho bảo mật > Đổi mật khẩu để cập nhật thông tin khôi phục.", { position: "top-center" });
                            }
                        }, 300);
                    } else {
                        setPasswordError("Không tìm thấy thông tin phiên đăng nhập.");
                    }
                } catch (err) {
                    if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
                        setPasswordError("Mật khẩu cũ không đúng.");
                    } else if (err.code === 'auth/requires-recent-login') {
                        setPasswordError("⚠️ Hãy Đăng xuất và Đăng nhập lại để xác thực danh tính trước khi đổi mật khẩu.");
                    } else {
                        setPasswordError("Lỗi: " + err.message);
                    }
                }
            };

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div className="bg-white w-full max-w-sm rounded-xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
                        <div className="bg-gray-800 text-white p-4 flex justify-between items-center shrink-0">
                            <h3 className="font-bold flex items-center gap-2"><Palette size={18}/> Giao Diện & Bảo Mật</h3>
                            <button onClick={onClose} aria-label="Đóng"><X size={20}/></button>
                        </div>
                        <div className="p-6 space-y-6 overflow-y-auto flex-1 no-scrollbar text-slate-800">
                            {/* Dark Mode Toggle */}
                            <div className="flex items-center justify-between p-3 bg-slate-50 rounded-lg border border-slate-200">

        const AuthScreen = ({ auth, appId }) => {

        // --- MÀN HÌNH THỜI KHÓA BIỂU (TKB VIEW) ---
        // Ô nhập nội dung Lịch biểu hỗ trợ định dạng chữ (contentEditable) — chỉ ô đang được focus
        // mới thực sự contentEditable=true (các ô khác là văn bản thường), cùng lý do với Ghi chú:
        // nhiều vùng contentEditable=true cùng lúc sẽ không cho quét-chọn xuyên qua nhiều ô.
        const TkbCellEditable = ({ cellKey, value, onSave, onBlurSave, isFocused, onFocusCell }) => {
            const ref = useRef(null);
            const didMountRef = useRef(false);

            useEffect(() => {
                if (ref.current && !didMountRef.current) {
                    ref.current.innerHTML = value || '';
                    didMountRef.current = true;
                }
            }, []);
            // Đồng bộ nếu nội dung đổi từ bên ngoài (vd sau khi AI nhập ảnh TKB) trong lúc ô này
            // không phải ô đang gõ dở, tránh nhảy con trỏ khi đang gõ.
            useEffect(() => {
                if (ref.current && !isFocused && ref.current.innerHTML !== (value || '')) {
                    ref.current.innerHTML = value || '';
                }
            }, [value, isFocused]);
            useEffect(() => {
                if (isFocused && ref.current) {
                    ref.current.focus();
                    try {
                        const range = document.createRange();
                        range.selectNodeContents(ref.current);
                        range.collapse(false);
                        const sel = window.getSelection();
                        sel.removeAllRanges();
                        sel.addRange(range);
                    } catch (err) { /* bỏ qua nếu trình duyệt không hỗ trợ */ }
                }
            }, [isFocused]);

            const handleClick = () => {
                const sel = window.getSelection ? window.getSelection() : null;
                if (sel && sel.toString().length > 0) return; // đang quét-chọn xuyên ô, không chuyển sang sửa
                onFocusCell(cellKey, ref);
            };

            return (
                <div
                    ref={ref}
                    onClick={handleClick}
                    contentEditable={isFocused}
                    suppressContentEditableWarning
                    onInput={e => onSave(cellKey, e.currentTarget.innerHTML)}
                    onBlur={e => onBlurSave(cellKey, e.currentTarget.innerHTML)}
                    className="rich-editable w-full h-full p-2 outline-none bg-transparent text-black text-xs leading-tight cursor-text"
                />
            );
        };

        const TimeTableView = ({ user, db, appId, theme, searchTarget, onSearchTargetClear, activeTab }) => {
            // ── STATE ───────────────────────────────────────────────────────────
            const [schedule, setSchedule]         = useState({});
            const [headers, setHeaders]           = useState({ col1: 'Môn - Lớp', col2: 'Ghi chú' });
            const [highlightKey, setHighlightKey] = useState(null);
            const [showYearDrop, setShowYearDrop] = useState(false);
            const [showWeekDrop, setShowWeekDrop] = useState(false);
            const [yearInput, setYearInput]       = useState('');
            const [weekInput, setWeekInput]       = useState('');
            // yearList: [{ id, name, anchorWeekKey }]
            // weekList: [{ id, name, yearId, offset }]  offset=0,1,2... từ anchor
            const [yearList, setYearList] = useState([]);
            const [weekList, setWeekList] = useState([]);
            const [activeYearId, setActiveYearId] = useState(null);

            // ── KÉO GIÃN CỘT "Môn-Lớp" / "Ghi chú" (mục 3) ─────────────────────
            // Lưu tỉ lệ chiều rộng cột 1 (0.15 - 0.85) trong localStorage để nhớ lần sau mở lại.
            // Viết lại bằng Pointer Events (dùng chung cho cả chuột và cảm ứng, đỡ phải viết 2 bộ
            // handler riêng) và đo trực tiếp chiều rộng thật của 2 ô đầu bảng lúc bắt đầu kéo,
            // thay vì đoán chiều rộng còn lại theo công thức cố định như trước.
            // ── Thanh định dạng chữ trượt xuống khi soạn thảo 1 ô (mục 2) ──────────────────────
            const [focusedCellKey, setFocusedCellKey] = useState(null);
            const focusedCellRef = useRef(null);
            const scheduleToolbarRef = useRef(null); // khối chứa thanh định dạng chữ
            const scheduleTableWrapRef = useRef(null); // khối chứa toàn bộ bảng Lịch biểu
            const handleFocusCell = (key, ref) => { setFocusedCellKey(key); focusedCellRef.current = ref.current; };
            // Chỉ thực sự ẩn thanh định dạng (thoát chế độ sửa) khi bấm THẬT SỰ ra ngoài — không phải
            // trong bảng (kể cả đang chuyển từ ô này sang ô khác) và không phải trong thanh định dạng
            // chữ (chọn Font/Cỡ chữ...). Dùng cách "bấm ra ngoài" (document mousedown) thay vì dựa vào
            // sự kiện blur của từng ô — blur/relatedTarget dễ vỡ theo từng trình duyệt khi focus dời
            // từ ô này sang ô khác, từng khiến thanh định dạng bị ẩn nhầm giữa lúc chuyển ô.
            useEffect(() => {
                if (!focusedCellKey) return;
                const handleClickOutsideTable = (e) => {
                    const inTable = scheduleTableWrapRef.current && scheduleTableWrapRef.current.contains(e.target);
                    const inToolbar = scheduleToolbarRef.current && scheduleToolbarRef.current.contains(e.target);
                    if (!inTable && !inToolbar) setFocusedCellKey(null);
                };
                document.addEventListener('mousedown', handleClickOutsideTable);
                return () => document.removeEventListener('mousedown', handleClickOutsideTable);
            }, [focusedCellKey]);

            const [col1Ratio, setCol1Ratio] = useState(() => {
                const saved = parseFloat(localStorage.getItem('vt_tkb_col1_ratio'));
                return (!isNaN(saved) && saved >= 0.15 && saved <= 0.85) ? saved : 0.5;
            });
            const tkbCol1ThRef = useRef(null);
            const tkbCol2ThRef = useRef(null);
            const tkbDragRef = useRef(null); // { startX, startRatio, totalWidth }

            const startColDivider = (clientX) => {
                if (!tkbCol1ThRef.current || !tkbCol2ThRef.current) return;
                const w1 = tkbCol1ThRef.current.getBoundingClientRect().width;
                const w2 = tkbCol2ThRef.current.getBoundingClientRect().width;
                tkbDragRef.current = { startX: clientX, startRatio: col1Ratio, totalWidth: Math.max(1, w1 + w2) };
            };
            useEffect(() => {
                const moveRatio = (clientX) => {
                    const s = tkbDragRef.current;
                    if (!s) return;
                    const deltaRatio = (clientX - s.startX) / s.totalWidth;
                    const newRatio = Math.min(0.85, Math.max(0.15, s.startRatio + deltaRatio));
                    setCol1Ratio(newRatio);
                };
                const onPointerMove = (e) => moveRatio(e.clientX);
                const onEnd = () => {
                    if (tkbDragRef.current) {
                        setCol1Ratio(r => { localStorage.setItem('vt_tkb_col1_ratio', String(r)); return r; });
                    }
                    tkbDragRef.current = null;
                };
                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onEnd);
                window.addEventListener('pointercancel', onEnd);
                return () => {
                    window.removeEventListener('pointermove', onPointerMove);
                    window.removeEventListener('pointerup', onEnd);
                    window.removeEventListener('pointercancel', onEnd);
                };
            }, []); // dùng ref cho trạng thái kéo nên chỉ cần đăng ký sự kiện 1 lần

            // ── TUẦN HIỆN HÀNH ──────────────────────────────────────────────────
            const getCurrentMonday = () => {
                const now = new Date();
                const day = now.getDay();
                const diff = now.getDate() - day + (day === 0 ? -6 : 1);
                const mon = new Date(now); mon.setDate(diff); mon.setHours(0,0,0,0);
                return mon;
            };
            const [startOfWeekDate, setStartOfWeekDate] = useState(getCurrentMonday);
            const periods = [1,2,3,4,5];

            // ── HELPERS ─────────────────────────────────────────────────────────
            const getWeekKey = (date) => {
                const t = new Date(date.valueOf());
                const dayNr = (date.getDay() + 6) % 7;
                t.setDate(t.getDate() - dayNr + 3);
                const ft = t.valueOf();
                t.setMonth(0, 1);
                if (t.getDay() !== 4) t.setMonth(0, 1 + ((4 - t.getDay()) + 7) % 7);
                const weekNum = 1 + Math.ceil((ft - t) / 604800000);
                const y = new Date(date.valueOf()); y.setDate(date.getDate() - dayNr + 3);
                return { yyyy: y.getFullYear(), weekNum, key: y.getFullYear() + '_w' + weekNum };
            };
            const getMondayFromWeek = (year, wn) => {
                const jan4 = new Date(year, 0, 4);
                const j4d = (jan4.getDay() + 6) % 7;
                const w1 = new Date(jan4); w1.setDate(jan4.getDate() - j4d);
                const m = new Date(w1); m.setDate(w1.getDate() + (wn - 1) * 7);
                m.setHours(0,0,0,0); return m;
            };
            const getMondayFromAnchorOffset = (anchorWeekKey, offset) => {
                const parts = anchorWeekKey.split('_w');
                const y = parseInt(parts[0], 10), wn = parseInt(parts[1], 10);
                const anchor = getMondayFromWeek(y, wn);
                const r = new Date(anchor); r.setDate(anchor.getDate() + offset * 7); return r;
            };

            const weekKey = useMemo(() => getWeekKey(startOfWeekDate).key, [startOfWeekDate]);
            const { weekNum: currentWeekNum } = useMemo(() => getWeekKey(startOfWeekDate), [startOfWeekDate]);

            // ── FIRESTORE ───────────────────────────────────────────────────────
            const tkbRef  = useMemo(() => doc(db, 'artifacts', appId, 'users', user.uid, 'timetable', 'main_' + weekKey), [db, appId, user.uid, weekKey]);
            const metaRef = useMemo(() => doc(db, 'artifacts', appId, 'users', user.uid, 'timetable', 'meta'), [db, appId, user.uid]);

            // Cleanup subscriptions
            useEffect(() => {
                const unsubTkb = onSnapshot(tkbRef, snap => {
                    if (snap.exists()) {
                        const d = snap.data();
                        setSchedule(d.schedule || {});
                        if (d.headers) setHeaders(d.headers);
                    } else { setSchedule({}); }
                }, e => console.warn('TKB offline:', e));

                const unsubMeta = onSnapshot(metaRef, snap => {
                    if (snap.exists()) {
                        const d = snap.data();
                        setYearList(d.yearList || []);
                        setWeekList(d.weekList || []);
                    }
                }, e => console.warn('TKB meta offline:', e));

                return () => {
                    unsubTkb();
                    unsubMeta();
                };
            }, [tkbRef, metaRef]);

            // ── NGÀY HÔM NAY ────────────────────────────────────────────────────
            const todayStr = useMemo(() => {
                const n = new Date();
                return String(n.getDate()).padStart(2,'0') + '/' + String(n.getMonth()+1).padStart(2,'0');
            }, []);

            const weekDaysInfo = useMemo(() => {
                return ['t2','t3','t4','t5','t6','t7'].map((id, i) => {
                    const t = new Date(startOfWeekDate); t.setDate(startOfWeekDate.getDate() + i);
                    return { id, label: 'Thứ ' + (i+2), dateStr: String(t.getDate()).padStart(2,'0') + '/' + String(t.getMonth()+1).padStart(2,'0') };
                });
            }, [startOfWeekDate]);

            // ── Tuần hiện tại khớp với tuần nào đã đặt tên ─────────────────────
            const currentWeekEntry = useMemo(() => {
                for (const yr of yearList) {
                    const found = weekList.find(w => w.yearId === yr.id && getMondayFromAnchorOffset(yr.anchorWeekKey, w.offset).toDateString() === startOfWeekDate.toDateString());
                    if (found) return { week: found, year: yr };
                }
                return null;
            }, [yearList, weekList, startOfWeekDate]);

            const activeYear = useMemo(() => yearList.find(y => y.id === activeYearId) || null, [yearList, activeYearId]);

            // Tuần của năm đang chọn — mới nhất (offset cao) lên TRÊN
            const weeksOfActiveYear = useMemo(() => {
                if (!activeYearId) return [];
                return [...weekList.filter(w => w.yearId === activeYearId)].sort((a,b) => b.offset - a.offset);
            }, [weekList, activeYearId]);

            // Sync activeYearId theo tuần đang hiển thị
            useEffect(() => {
                if (currentWeekEntry && currentWeekEntry.year.id !== activeYearId) {
                    setActiveYearId(currentWeekEntry.year.id);
                }
            }, [currentWeekEntry]);

            // ── ĐIỀU HƯỚNG ──────────────────────────────────────────────────────
            const navigateWeek = (dir) => {
                // Nếu đang trong năm học có tuần đặt tên → chỉ nhảy trong các tuần đó
                if (activeYearId && weeksOfActiveYear.length > 0) {
                    const yr = yearList.find(y => y.id === activeYearId);
                    if (!yr) return;
                    // weeksOfActiveYear đã sort offset giảm dần → đảo lại để tăng dần cho navigation
                    const sorted = [...weeksOfActiveYear].sort((a, b) => a.offset - b.offset);
                    const cur = startOfWeekDate.getTime();
                    const idx = sorted.findIndex(w => getMondayFromAnchorOffset(yr.anchorWeekKey, w.offset).getTime() === cur);
                    const ni = idx === -1 ? (dir > 0 ? 0 : sorted.length - 1) : idx + dir;
                    if (ni >= 0 && ni < sorted.length) {
                        setStartOfWeekDate(getMondayFromAnchorOffset(yr.anchorWeekKey, sorted[ni].offset));
                        return;
                    }
                }
                // Fallback: ±1 tuần thường
                const d = new Date(startOfWeekDate); d.setDate(d.getDate() + dir * 7); setStartOfWeekDate(d);
            };

            // ── LƯU DỮ LIỆU ─────────────────────────────────────────────────────
            const saveData = async (path, value) => {
                const ns = { ...schedule, [path]: value }; setSchedule(ns);
                if (Object.values(ns).some(v => v && v.trim())) await setDoc(tkbRef, { schedule: ns }, { merge: true });
                else try { await deleteDoc(tkbRef); } catch(e) {}
            };
            const saveHeader = async (key, value) => {
                const nh = { ...headers, [key]: value }; setHeaders(nh);
                await setDoc(tkbRef, { headers: nh }, { merge: true });
            };

            // Xóa toàn bộ nội dung Thời khóa biểu của TUẦN ĐANG XEM (đặt lại thành rỗng), không đụng tới tên cột (headers)
            const handleClearWeek = async () => {
                const ok = window.confirm("Xóa toàn bộ nội dung Thời khóa biểu của tuần này? Hành động này không thể hoàn tác.");
                if (!ok) return;
                setSchedule({});
                try { await deleteDoc(tkbRef); } catch (e) { console.warn('Lỗi xóa tuần:', e); }
            };

            // ── THÊM NĂM HỌC ────────────────────────────────────────────────────
            const addYear = async () => {
                const name = yearInput.trim(); if (!name) return;
                const id = 'yr_' + Date.now();
                const entry = { id, name, anchorWeekKey: weekKey };
                const newList = [entry, ...yearList];

            const GEMINI_PROMPT = `Bạn là trợ lý đọc bảng thời khóa biểu (TKB) từ ảnh chụp/scan. Hãy làm theo đúng các bước sau:

BƯỚC 1 — Xác định cấu trúc bảng: hàng là "Tiết" (1-5), cột là "Thứ" (Thứ 2 → Thứ 7, thường xếp trái sang phải theo đúng thứ tự này). Nếu bảng xoay ngang (Thứ theo hàng, Tiết theo cột) thì vẫn phải map lại đúng theo hàng=Tiết, cột=Thứ khi xuất kết quả.
BƯỚC 2 — Với mỗi ô có chữ, xác định chính xác nó thuộc Thứ nào và Tiết nào bằng cách dóng đúng theo hàng/cột của ô đó, KHÔNG suy đoán theo vị trí ô liền kề. Nếu 1 ô gộp (merge) nhiều tiết, lặp lại nội dung đó cho từng tiết mà ô che phủ.
BƯỚC 3 — Nếu 1 ô có 2 dòng thông tin (VD: tên môn + phòng học/ghi chú), dòng đầu là col1, dòng phụ là col2. Nếu ô chỉ có 1 dòng thông tin, chỉ dùng col1.
BƯỚC 4 — Trước khi trả lời, tự kiểm tra lại: mỗi key phải đúng định dạng, không trùng lặp sai vị trí, không bịa thêm dữ liệu không có trong ảnh.

Chỉ trả về JSON THUẦN TÚY (không markdown, không giải thích, không code block), đúng định dạng:
{"headers":{"col1":"tên cột 1","col2":"tên cột 2"},"schedule":{"t2_1_col1":"...","t2_1_col2":"...","t3_2_col1":"..."}}

Quy tắc key bắt buộc: "<thu>_<tiet>_<cot>"
- <thu> chỉ được là một trong: t2, t3, t4, t5, t6, t7 (t2 = Thứ 2/Thứ Hai ... t7 = Thứ 7/Thứ Bảy)
- <tiet> chỉ được là một trong: 1, 2, 3, 4, 5
- <cot> chỉ được là: col1 hoặc col2

{"headers":{"col1":"Môn - Lớp","col2":"Ghi chú"},"schedule":{"t2_1_col1":"Toán - 10A1","t2_1_col2":"Phòng A2","t2_2_col1":"Văn - 10A1","t4_3_col1":"Anh - 10A1","t6_5_col1":"Thể dục - 10A1"}}

Ô trống thì bỏ qua hoàn toàn, không tạo key cho ô trống. Không được tạo key ngoài định dạng trên.`;

                                headerRow = row;

                        }

                                                                <div className="flex flex-col items-center justify-center gap-0.5">
                                                                    <div className={'font-extrabold text-xs ' + (isToday ? 'text-blue-700' : 'text-blue-600')}>{day.label}</div>
                                                                    <div className={'text-[10px] font-bold px-1.5 py-0.5 rounded-full ' + (isToday ? 'bg-blue-500 text-white' : 'bg-blue-100 text-blue-500')}>{day.dateStr}</div>
                                                                </div>
                                                            </td>
                                                        )}
                                                        <td className={'border border-blue-100 p-2 text-center font-bold text-xs align-middle ' + (isToday ? 'text-blue-700' : 'text-blue-400')}>{period}</td>
                                                        <td id={'tkb-cell-' + day.id + '_' + period + '_col1'} className={'border border-blue-100 p-0 align-middle transition-all duration-500 ' + (highlightKey === day.id + '_' + period + '_col1' ? 'bg-yellow-100 ring-2 ring-yellow-400 ring-inset' : '')}>
                                                            <TkbCellEditable
                                                                cellKey={day.id + '_' + period + '_col1'}
                                                                value={schedule[day.id + '_' + period + '_col1'] || ''}
                                                                isFocused={focusedCellKey === day.id + '_' + period + '_col1'}
                                                                onSave={(key, html) => setSchedule(prev => ({ ...prev, [key]: html }))}
                                                                onFocusCell={handleFocusCell}
                                                                onBlurSave={saveData}
                                                            />
                                                        </td>
                                                        <td id={'tkb-cell-' + day.id + '_' + period + '_col2'} className={'border border-blue-100 p-0 align-middle transition-all duration-500 ' + (highlightKey === day.id + '_' + period + '_col2' ? 'bg-yellow-100 ring-2 ring-yellow-400 ring-inset' : '')}>
                                                            <TkbCellEditable
                                                                cellKey={day.id + '_' + period + '_col2'}
                                                                value={schedule[day.id + '_' + period + '_col2'] || ''}
                                                                isFocused={focusedCellKey === day.id + '_' + period + '_col2'}
                                                                onSave={(key, html) => setSchedule(prev => ({ ...prev, [key]: html }))}
                                                                onFocusCell={handleFocusCell}
                                                                onBlurSave={saveData}
                                                            />
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </React.Fragment>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>

                    <button onClick={handleClearWeek}
                        className="mb-2 shrink-0 flex items-center justify-center gap-2 w-full py-2.5 rounded-xl border border-red-200 bg-red-50 text-red-500 text-sm font-bold hover:bg-red-100 transition">
                        <Trash2 size={16}/> Xóa cả tuần
                    </button>
                </div>
            );
        };
        // END: TimeTableView

        // ==============================================================
        // MÀN HÌNH LỊCH NGÀY (DAILY VIEW) – PHIÊN BẢN CŨ (ĐÃ HOÀN NGUYÊN)
        // ==============================================================
        const DailyView = ({ user, db, appId, today, setToday, activeTab }) => {
            const [weather, setWeather] = useState(null);
            const [weatherUpdatedAt, setWeatherUpdatedAt] = useState(null); // Mục 3: thời điểm cập nhật thời tiết gần nhất, hiện cạnh nút làm mới
            const [verses, setVerses] = useState([]);
            const [currentVerse, setCurrentVerse] = useState(DEFAULT_VERSES[0]);
            const [animClass, setAnimClass] = useState('');
            const [locationName, setLocationName] = useState('Bắc Ninh');
            const [showWeatherSearch, setShowWeatherSearch] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [todayEvents, setTodayEvents] = useState([]);
            const [isNewYearWish, setIsNewYearWish] = useState(false);
            
            const [viewMode, setViewMode] = useState('verse');
            const [showMenu, setShowMenu] = useState(false);
            const [showAddVerse, setShowAddVerse] = useState(false);
            const [newVerse, setNewVerse] = useState('');

            const [touchStart, setTouchStart] = useState(null);
            const onTouchStart = (e) => {
                if (e.touches.length > 1) return;
                setTouchStart(e.targetTouches[0].clientX);
            };
            const onTouchEnd = (e) => {
                if (!touchStart || e.changedTouches.length > 1) return;
                const distance = touchStart - e.changedTouches[0].clientX;
                const newDate = new Date(today);
                if (distance > 50) { 
                    setAnimClass('anim-next');
                    setTimeout(() => { newDate.setDate(today.getDate() + 1); setToday(newDate); setAnimClass(''); }, 400);
                }
                if (distance < -50) { 
                    setAnimClass('anim-prev');
                    setTimeout(() => { newDate.setDate(today.getDate() - 1); setToday(newDate); setAnimClass(''); }, 400);
                }
                setTouchStart(null);
            };
            
            const goNextDay = () => { setAnimClass('anim-next'); setTimeout(() => { const d = new Date(today); d.setDate(today.getDate()+1); setToday(d); setAnimClass(''); }, 300); };
            const goPrevDay = () => { setAnimClass('anim-prev'); setTimeout(() => { const d = new Date(today); d.setDate(today.getDate()-1); setToday(d); setAnimClass(''); }, 300); };
            const stopSwipe = (e) => e.stopPropagation();

            useEffect(() => {
                const isNewYear = today.getDate() === 1 && today.getMonth() === 0;
                if (isNewYear) {
                     setCurrentVerse(`Nhân dịp năm mới ${today.getFullYear()}.\nXin kính chúc mọi người và gia đình một năm mới dồi dào sức khỏe, hạnh phúc và bình an!"\n\n_ Văn Trung`);
                     setIsNewYearWish(true);
                } else {
                     setIsNewYearWish(false);
                     const allVerses = [...DEFAULT_VERSES, ...verses.map(v => v.text)];
                     if(allVerses.length > 0) setCurrentVerse(allVerses[Math.floor(Math.random() * allVerses.length)]);
                }
            }, [today, verses]);

            const verseRef = useMemo(() => collection(db, 'artifacts', appId, 'users', user.uid, 'verses'), [db, appId, user.uid]);
            useEffect(() => onSnapshot(query(verseRef), snap => { const data = snap.docs.map(d => ({id: d.id, ...d.data()})); setVerses(data); }), [verseRef]);

            const eventsRef = useMemo(() => collection(db, 'artifacts', appId, 'users', user.uid, 'events'), [db, appId, user.uid]);
            useEffect(() => onSnapshot(query(eventsRef), snap => {
                const allEvents = snap.docs.map(d => ({id: d.id, ...d.data()}));
                const dateStr = today.toDateString();
                const lunar = getLunarDetails(today);
                const todays = allEvents.filter(e => {
                    if (!e.repeat || e.repeat === 'none') return e.date && new Date(e.date.seconds * 1000).toDateString() === dateStr;
                    if (e.repeat === 'lunar') return e.lunarDay === lunar.day && e.lunarMonth === lunar.month;
                    if (e.repeat === 'solar' && e.date) { const d = new Date(e.date.seconds * 1000); return d.getDate() === today.getDate() && d.getMonth() === today.getMonth(); }
                    if (e.repeat === 'weekly') { const d = new Date(e.date.seconds * 1000); return d.getDay() === today.getDay(); }
                    if (e.repeat === 'monthly') { const d = new Date(e.date.seconds * 1000); return d.getDate() === today.getDate(); }
                    if (e.repeat === 'yearly' && e.date) { const d = new Date(e.date.seconds * 1000); return d.getDate() === today.getDate() && d.getMonth() === today.getMonth(); }
                    return false;
                });
                setTodayEvents(todays);
            }), [today, eventsRef]);

            // Hàm lấy thời tiết — đặt ở scope component (không phải bên trong useEffect) để nút
            // "Làm mới thời tiết" bên dưới gọi được — trước đây hàm này chỉ tồn tại bên trong
            // closure của useEffect nên nút bấm gọi vào 1 biến không tồn tại, không có tác dụng.
            // Mục 3: chỉ hiện thông báo "Đã cập nhật thời tiết!" khi được gọi RÕ RÀNG từ nút bấm
            // (showToast=true) — không hiện khi tự động tải lúc mở app hoặc làm mới định kỳ mỗi 30
            // phút, tránh làm phiền không cần thiết mỗi lần mở ứng dụng.
            const fetchWeather = async (showToast = false) => {
                try {
                    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${locationName}&count=1&language=vi&format=json`);
                    const geoData = await geoRes.json();
                    if (geoData.results && geoData.results.length > 0) {
                        const { latitude, longitude } = geoData.results[0];
                        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto`);
                        const weatherData = await weatherRes.json();
                        setWeather(weatherData.daily);
                        setWeatherUpdatedAt(new Date());
                        if (showToast) toast.info("Đã cập nhật thời tiết!", { position: "top-center" });
                    } else {
                        toast.error("Không tìm thấy địa điểm, thử lại tên khác.", { position: "top-center" });
                    }
                } catch (e) {
                    console.error("Lỗi thời tiết", e);
                    toast.error("Không lấy được thời tiết, kiểm tra lại kết nối mạng.", { position: "top-center" });
                }
            };
            // Tự động làm mới thời tiết mỗi 30 phút
            useEffect(() => {
                fetchWeather();
                const interval = setInterval(fetchWeather, 30 * 60 * 1000);
                return () => clearInterval(interval);
            }, [locationName]);

            const handleSearch = (e) => { e.preventDefault(); if(searchQuery.trim()) { setLocationName(searchQuery); } };
            const handleAddVerse = async () => { if (newVerse.trim()) { await addDoc(verseRef, { text: newVerse, createdAt: serverTimestamp() }); setNewVerse(''); setShowAddVerse(false); } };
            const handleDeleteVerse = async (text) => {
                const verseToDelete = verses.find(v => v.text === text);
                if (verseToDelete && window.confirm("Xóa câu danh ngôn này?")) { await deleteDoc(doc(verseRef, verseToDelete.id)); getRandomVerse(); } 
                else if (!verseToDelete) { alert("Đây là danh ngôn mặc định, không thể xóa."); }
            };

            const bgImage = isNewYearWish 
                ? "https://images.unsplash.com/photo-1516132006923-6cf348e5dee2?q=80&w=800&auto=format&fit=crop" 
                : BACKGROUNDS[today.getDate() % BACKGROUNDS.length];
                
            const getRandomVerse = () => { const allVerses = [...DEFAULT_VERSES, ...verses.map(v => v.text)]; setCurrentVerse(allVerses[Math.floor(Math.random() * allVerses.length)]); };
            const getWeatherIcon = (code) => {
                if (code <= 3) return <Sun size={20} className="text-yellow-400"/>;
                if (code <= 60) return <Cloud size={20} className="text-gray-200"/>;
                return <CloudRain size={20} className="text-blue-300"/>;
            };
            const weekDays = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
            const getVerseFontSize = (text) => { const len = text.length; if (len < 50) return 'text-xl'; if (len < 100) return 'text-lg'; if (len < 200) return 'text-sm'; return 'text-xs'; };

            // ── KEYBOARD NAV ──────────────────────────────────────────────────────
            useEffect(() => {
                const handler = (e) => {
                    if (activeTab !== 'day') return;
                    const target = e.target;
                    const tag = target?.tagName || '';
                    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || target?.isContentEditable) return;
                    if (e.key === 'ArrowLeft') { goPrevDay(); e.preventDefault(); }
                    else if (e.key === 'ArrowRight') { goNextDay(); e.preventDefault(); }
                };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, [activeTab, goPrevDay, goNextDay]);

            const renderCenterContent = () => {
                if (viewMode === 'events') {
                     return (
                        <div className="w-full h-full overflow-y-auto no-scrollbar" onTouchStart={stopSwipe} onTouchEnd={stopSwipe}>
                            <h4 className="text-sm font-bold mb-2 border-b border-white/20 pb-1">Sự kiện hôm nay</h4>
                            {todayEvents.length === 0 ? <p className="text-center text-xs opacity-60 mt-4">Không có sự kiện nào.</p> : (
                                <ul className="space-y-2">{todayEvents.map(e => (<li key={e.id} className="text-sm bg-white/10 p-2 rounded flex items-center gap-2"><Bell size={12} className="text-yellow-300" /><span>{e.title}</span></li>))}</ul>
                            )}
                        </div>
                    );
                }

                return (
                    <div className="text-center w-full flex flex-col h-full relative">
                        {showAddVerse ? (
                             <div className="flex flex-col gap-2 h-full" onTouchStart={stopSwipe} onTouchEnd={stopSwipe}>
                                <textarea className="flex-1 bg-white/20 rounded p-2 text-sm text-white placeholder-white/50 outline-none resize-none" placeholder="Nhập câu danh ngôn..." value={newVerse} onChange={e=>setNewVerse(e.target.value)}></textarea>
                                <div className="flex gap-2 justify-end">
                                    <button onClick={()=>setShowAddVerse(false)} className="text-xs bg-gray-500/50 px-2 py-1 rounded">Hủy</button>
                                    <button onClick={handleAddVerse} className="text-xs bg-blue-500 px-2 py-1 rounded">Lưu</button>
                                </div>
                             </div>
                        ) : (
                            <>
                                <div className="flex justify-end gap-2 mb-1 absolute bottom-1 right-1">
                                     <button onClick={(e)=>{e.stopPropagation(); setShowAddVerse(true)}} className="p-1 opacity-40 hover:opacity-100"><Plus size={12}/></button>
                                     <button onClick={(e)=>{e.stopPropagation(); handleDeleteVerse(currentVerse)}} className="p-1 opacity-40 hover:opacity-100 text-red-300"><Trash2 size={12}/></button>
                                </div>
                                <div className={`flex-1 flex flex-col items-center justify-center font-sans font-medium leading-relaxed whitespace-pre-wrap ${getVerseFontSize(currentVerse)} overflow-y-auto no-scrollbar`} onClick={getRandomVerse}>
                                    <div>"{currentVerse}"</div>
                                    {isNewYearWish && <div className="text-right italic mt-2 text-sm font-normal w-full px-4">_ Văn Trung</div>}
                                </div>
                                <div className="text-[10px] mt-2 opacity-40 flex items-center justify-center gap-1 shrink-0"><BookOpen size={10}/> Chạm để đổi câu khác</div>
                            </>
                        )}
                    </div>
                );
            };

            return (
                <div className="h-full flex flex-col relative text-white overflow-hidden perspective-container" onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
                    <div className="absolute inset-0 bg-gray-900 z-0">
                        <img src={bgImage} loading="lazy" decoding="async" className="w-full h-full object-cover opacity-80 transition-opacity duration-500" alt="Ảnh nền trang trí" />
                    </div>

                    <div className="absolute top-0 inset-x-0 z-30 px-3 pt-2 pb-0"
                        onTouchStart={stopSwipe} onTouchEnd={stopSwipe}>
                        
                        <div className="flex justify-between overflow-x-auto no-scrollbar gap-1.5">
                            {weather ? weather.time.slice(0, 7).map((t, i) => (
                                <div key={t} className={'flex flex-col items-center min-w-[38px] p-1.5 rounded-lg ' + (i === 0 ? 'bg-white/20' : 'bg-black/10')}>
                                    <span className="text-[9px] opacity-80 mb-0.5">{i === 0 ? 'Hôm nay' : weekDays[new Date(t).getDay()]}</span>
                                    <div className="my-0.5 scale-75">{getWeatherIcon(weather.weathercode[i])}</div>
                                    <div className="text-[9px] flex flex-col items-center leading-tight">
                                        <span className="font-bold">{Math.round(weather.temperature_2m_max[i])}°</span>
                                        <span className="opacity-60">{Math.round(weather.temperature_2m_min[i])}°</span>
                                    </div>
                                </div>
                            )) : Array.from({length: 7}).map((_, i) => (
                                <div key={i} className="flex flex-col items-center min-w-[38px] p-1.5 rounded-lg bg-black/10 opacity-40">
                                    <span className="text-[9px] mb-0.5">--</span>
                                    <div className="my-0.5 w-5 h-5 rounded-full bg-white/20"></div>
                                    <span className="text-[9px]">--°</span>
                                </div>
                            ))}
                        </div>

                        <div className="flex items-center justify-between mt-0.5">
                            <div className="flex items-center gap-1.5">
                                {!weather && <Skeleton className="h-[9px] w-16" />}
                                <button onClick={() => fetchWeather(true)} className="text-[9px] bg-white/20 hover:bg-white/30 p-1 rounded-full transition" title="Làm mới thời tiết">
                                    <RefreshCw size={12} />
                                </button>
                                {/* Mục 3: ngày giờ cập nhật gần nhất, cùng dòng với nút làm mới */}
                                {weatherUpdatedAt && (
                                    <span className="text-[9px] text-white/70">
                                        Cập nhật {String(weatherUpdatedAt.getHours()).padStart(2,'0')}:{String(weatherUpdatedAt.getMinutes()).padStart(2,'0')} {weatherUpdatedAt.getDate()}/{weatherUpdatedAt.getMonth()+1}
                                    </span>
                                )}
                            </div>
                            <button onClick={() => setShowWeatherSearch(v => !v)} className="flex items-center gap-1 text-[10px] font-bold uppercase text-yellow-300 hover:text-yellow-200 transition">
                                <MapPin size={10}/> {locationName} <ChevronDown size={10} className={showWeatherSearch ? 'rotate-180 transition-transform' : 'transition-transform'}/>
                            </button>
                        </div>

                        {showWeatherSearch && (
                            <form onSubmit={(e) => { handleSearch(e); setShowWeatherSearch(false); }} className="flex items-center gap-2 mt-1 bg-white/20 p-1.5 rounded-lg w-full">
                                <button type="submit" className="p-1 hover:bg-white/10 rounded"><Search size={14} className="text-white shrink-0"/></button>
                                <input autoFocus className="flex-1 bg-transparent outline-none text-white placeholder-white/70 text-xs font-bold" placeholder="Nhập tên thành phố..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} />
                            </form>
                        )}
                    </div>

                    <button onClick={goPrevDay} className="absolute left-4 top-1/2 -translate-y-1/2 z-40 p-2 bg-black/20 hover:bg-black/50 rounded-full text-white/50 hover:text-white transition"><ChevronLeft size={32}/></button>
                    <button onClick={goNextDay} className="absolute right-4 top-1/2 -translate-y-1/2 z-40 p-2 bg-black/20 hover:bg-black/50 rounded-full text-white/50 hover:text-white transition"><ChevronRight size={32}/></button>

                    <div className={`relative z-10 flex-1 flex flex-col items-center gap-1 overflow-hidden ${animClass}`}>
                        
                        <div className="text-center drop-shadow-lg mt-24 z-20 flex-shrink-0 cursor-pointer hover:scale-105 transition-transform" onClick={() => setToday(new Date())} title="Về hôm nay">
                            <p className="text-xl font-light uppercase tracking-widest mb-0.5 text-white/90">{getDayOfWeek(today)}</p>
                            <h2 className="text-[5.5rem] md:text-[6rem] font-bold leading-none text-white">{today.getDate()}</h2>
                            <p className="text-base mt-1 font-medium text-white/90">Tháng {today.getMonth() + 1} - {today.getFullYear()}</p>
                            <div className="mt-2 flex items-center justify-center gap-2 flex-wrap">
                                <div className="inline-block bg-white/20 backdrop-blur-sm px-4 py-1 rounded-full text-sm border border-white/30 font-serif">
                                    Âm lịch: {getLunarDate(today)}
                                </div>
                            </div>

                            {(() => {
                                const holidayInfo = getHolidayInfo(today);
                                if (!holidayInfo) return null;
                                return (
                                    <div className="mt-2 flex flex-col items-center gap-1 text-center px-4 max-w-xs">
                                        <div className="inline-block bg-gradient-to-r from-red-500/85 to-amber-500/85 backdrop-blur-sm px-4 py-1.5 rounded-full text-sm font-bold text-white border border-white/30 shadow-md">
                                            🎉 Ngày {holidayInfo.name}
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>

                        <div className="w-full max-w-md mt-auto relative group z-30 flex-1 flex flex-col justify-end pb-0">
                            <div className="bg-black/20 backdrop-blur-sm rounded-t-2xl px-4 py-3 border-t border-x border-white/10 flex-1 flex flex-col justify-center items-center relative transition-all duration-300 max-h-[calc(60%+1cm)] overflow-hidden">
                                <div className="absolute top-2 right-2">
                                    <button onClick={(e) => { e.stopPropagation(); setShowMenu(!showMenu); }} className="p-1 opacity-60 hover:opacity-100 transition bg-black/20 rounded-full"><MoreVertical size={15} /></button>
                                    {showMenu && (
                                        <div className="absolute right-0 top-7 bg-white text-gray-800 rounded-lg shadow-xl w-32 py-1 z-50 fade-in overflow-hidden text-sm font-medium">
                                            <button onClick={() => { setViewMode('verse'); setShowMenu(false); }} className={`block w-full text-left px-4 py-2 hover:bg-gray-100 ${viewMode==='verse'?'text-blue-600 bg-blue-50':''}`}>Danh ngôn</button>
                                            <button onClick={() => { setViewMode('events'); setShowMenu(false); }} className={`block w-full text-left px-4 py-2 hover:bg-gray-100 ${viewMode==='events'?'text-blue-600 bg-blue-50':''}`}>Sự kiện</button>
                                        </div>
                                    )}
                                </div>
                                {renderCenterContent()}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- LỊCH VIEW (THÁNG) ---
        // ==============================================================================
        // MODAL "TÌM KIẾM/RA LỆNH THÔNG MINH BẰNG AI" — gọi từ ô Tìm kiếm toàn cục.
        // Ưu tiên hiểu là CÂU HỎI/TÌM KIẾM trước (vd "tháng này có mấy sinh nhật?" → AI tổng hợp
        // từ dữ liệu hiện có và trả lời), chỉ khi không phải câu hỏi mới coi là LỆNH TẠO MỚI Sự
        // kiện/Việc cần làm/Ghi chú.
        // Luồng đúng theo đặc tả: Smart Engine (cục bộ) trước → chỉ gọi AI khi cần → nếu
        // "Chế độ riêng tư AI" bật xác nhận thì hỏi lại và hiển thị đúng nội dung sẽ gửi →
        // AI trả JSON (kèm phân loại tìm_kiếm/tạo_mới) → nếu tìm kiếm thì hiển thị câu trả lời;
        // nếu tạo mới thì hiển thị form xem trước, người dùng có thể sửa cả loại lẫn nội dung →
        // mới lưu vào đúng collection Firestore.
        // Nếu AI không hoạt động (tắt/lỗi/hết mạng...) vẫn không chặn người dùng, chỉ báo rõ
        // (Smart Engine cục bộ chỉ nhận diện được ngày/giờ nên luôn mặc định tạo Sự kiện).
        // ==============================================================================
        const loaiLabelStatic = { su_kien: 'Sự kiện', viec_can_lam: 'Việc cần làm', ghi_chu: 'Ghi chú' };
        const AISmartCommandModal = ({ onClose, onDone, db, appId, user, initialText }) => {
            const [text, setText] = useState(initialText || '');
            const [step, setStep] = useState('input'); // input | confirm-send | loading | preview | answer | error | delete-loading | delete-pick | delete-confirm | delete-none | reschedule-loading | reschedule-pick | reschedule-confirm | reschedule-none | confirm-conflict
            const [errorMsg, setErrorMsg] = useState('');
            const [answerText, setAnswerText] = useState('');
            // Mục 1 (đợt 5): tách riêng "chữ đã nhận được" (answerText, có thể nhận nguyên cục 1 lần nếu
            // rơi về đường dự phòng không-streaming, hoặc nhận rất nhanh nếu câu trả lời ngắn) khỏi
            // "chữ đang HIỆN trên màn hình" (displayedAnswer) — displayedAnswer luôn tự "gõ" dần dần theo
            // 1 tốc độ cố định bằng setInterval, KHÔNG phụ thuộc tốc độ mạng thực tế nữa. Nhờ vậy dù
            // Gemini trả lời nhanh cỡ nào (hoặc phải rơi về đường dự phòng), người dùng vẫn luôn thấy
            // hiệu ứng hiện dần từng chữ mượt mà, thay vì có lúc thấy có lúc không tùy tốc độ mạng.
            const [displayedAnswer, setDisplayedAnswer] = useState('');
            const answerTargetRef = useRef('');
            useEffect(() => { answerTargetRef.current = answerText; }, [answerText]);
            useEffect(() => {
                if (step !== 'answer') return;
                const timer = setInterval(() => {
                    setDisplayedAnswer(prev => {
                        const target = answerTargetRef.current;
                        if (prev.length >= target.length) return prev;
                        const remaining = target.length - prev.length;
                        // Hiện nhanh hơn khi còn nhiều chữ (câu dài không phải đợi quá lâu), chậm lại khi
                        // gần xong — tối thiểu 2 ký tự/nhịp, tối đa theo còn lại chia đều trong ~1.2 giây.
                        const step = Math.max(2, Math.ceil(remaining / 20));
                        return target.slice(0, prev.length + step);
                    });
                }, 20);
                return () => clearInterval(timer);
            }, [step]);
            // Mục 3: lịch sử hội thoại trong PHIÊN NÀY (mất khi đóng modal) — cho phép hỏi tiếp có
            // ngữ cảnh kiểu "còn việc nào nữa không?" thay vì mỗi câu hỏi hoàn toàn độc lập như trước.
            const [conversationHistory, setConversationHistory] = useState([]);
            const [usedAI, setUsedAI] = useState(false);
            const [pendingContext, setPendingContext] = useState(null);
            const [form, setForm] = useState({ loai: 'su_kien', title: '', dateStr: '', timeStr: '', reminder: false, repeat: 'none', reminderOffset: 0 });
            const [deleteResults, setDeleteResults] = useState([]); // Mục 3: danh sách mục tìm được để xóa
            const [deletePick, setDeletePick] = useState(null); // mục đang chọn để xác nhận xóa
            const [rescheduleResults, setRescheduleResults] = useState([]); // Đợt 3, mục 3: danh sách mục tìm được để dời lịch
            const [reschedulePick, setReschedulePick] = useState(null);
            const [rescheduleAfterPart, setRescheduleAfterPart] = useState(''); // phần câu mô tả ngày/giờ MỚI, chưa phân tích
            const [conflictInfo, setConflictInfo] = useState(null); // Đợt 3, mục 4: sự kiện đang bị trùng giờ
            const [saving, setSaving] = useState(false);
            const autoRanRef = useRef(false);

            const config = getAIConfig();
            const privacy = getAIPrivacy();
            const aiUsable = isAIActive(config);

            const toDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const toTimeStr = (d) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            const repeatLabel = { none: 'Không lặp lại', weekly: 'Lặp lại hàng tuần', monthly: 'Lặp lại hàng tháng', yearly: 'Lặp lại hàng năm' };
            // Đợt 3, mục 5: các mốc nhắc trước — dùng chung 1 danh sách với ReminderSettings cho nhất quán
            const OFFSET_OPTIONS = [
                { value: 0, label: 'Đúng giờ diễn ra' },
                { value: 5, label: '5 phút trước' },
                { value: 15, label: '15 phút trước' },
                { value: 30, label: '30 phút trước' },
                { value: 60, label: '1 giờ trước' },
                { value: 120, label: '2 giờ trước' },
                { value: 1440, label: '1 ngày trước' },
            ];

            // Mục 2, đợt 4: chọn giờ mặc định khi câu KHÔNG nói giờ cụ thể — không bao giờ được rơi vào
            // quá khứ. Nếu ngày là HÔM NAY thì dùng đúng giờ hiện tại (chắc chắn không phải quá khứ).
            // Nếu là ngày trong tương lai thì dùng giờ mặc định theo đúng buổi được nhắc tới trong câu
            // (sáng→6h, trưa/chiều→12h, tối→18h, đêm→21h); không nhắc buổi nào thì mặc định 6h sáng.
            const BUOI_DEFAULT_HOUR = { sang: '06:00', trua: '12:00', chieu: '12:00', toi: '18:00', dem: '21:00' };
            const pickDefaultTimeStr = (date, mentionedBuoi) => {
                if (!date) return '06:00';
                const now = new Date();
                const isToday = date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth() && date.getDate() === now.getDate();
                if (isToday) return toTimeStr(now);
                return BUOI_DEFAULT_HOUR[mentionedBuoi] || '06:00';
            };
            const applyResult = (loai, title, date, hasTime, reminder, byAI, repeat, reminderOffsetMinutes, mentionedBuoi) => {
                const hasOffset = reminderOffsetMinutes !== undefined && reminderOffsetMinutes !== null;
                setForm({
                    loai,
                    title,
                    dateStr: date ? toDateStr(date) : '',
                    timeStr: (date && hasTime) ? toTimeStr(date) : pickDefaultTimeStr(date, mentionedBuoi),
                    reminder: !!reminder || hasOffset, // Mục 5: nói rõ "nhắc trước X" thì hiểu luôn là MUỐN nhắc
                    repeat: repeat || 'none',
                    reminderOffset: hasOffset ? reminderOffsetMinutes : 0,
                });
                setUsedAI(byAI);
                setStep('preview');
            };

            // Lấy dữ liệu làm ngữ cảnh cho AI — tôn trọng đúng "Chế độ riêng tư AI".
            // Rộng hơn bản trước (không chỉ 5 sự kiện gần nhất) để AI có thể TRẢ LỜI CÂU HỎI/TÌM KIẾM
            // dạng tổng hợp (vd "tháng này có mấy sinh nhật?"), vẫn giới hạn số lượng hợp lý để không
            // gửi dữ liệu quá lớn không cần thiết.
            const fetchMinimalContext = async () => {
                const ctxData = { events: [], todos: [], notes: [] };
                try {
                    if (privacy.events) {
                        const snap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'events'));
                        // Mục 7: KHÔNG cắt bớt ở đây nữa (Firestore không đảm bảo thứ tự trả về ổn định
                        // khi chưa sắp xếp — cắt ngay tại bước này từng khiến cùng 1 câu hỏi ra kết quả
                        // khác nhau giữa các lần hỏi, tuỳ Firestore trả về theo thứ tự nào). Việc chọn
                        // lọc/sắp xếp THẬT SỰ chuyển hết vào buildAISearchContext bên dưới — chỉ giữ 1
                        // giới hạn an toàn rất cao ở đây để tránh trường hợp cực đoan (hàng chục nghìn
                        // sự kiện) làm chậm máy, không phải điểm cắt thực tế cho người dùng thông thường.
                        ctxData.events = snap.docs.map(d => d.data()).filter(e => e.date).slice(0, 3000);
                    }
                    if (privacy.todos) {
                        const snap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'todos'));
                        ctxData.todos = snap.docs.map(d => d.data()).slice(0, 1000);
                    }
                    if (privacy.notes) {
                        const snap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'notes'));
                        ctxData.notes = snap.docs.map(d => d.data()).slice(0, 500);
                    }
                } catch (e) {
                    // Mục 5: KHÔNG được âm thầm nuốt lỗi rồi gửi ngữ cảnh RỖNG cho AI — trước đây làm vậy
                    // khiến AI trả lời nhầm "không có dữ liệu" mỗi khi lấy dữ liệu bị lỗi (mạng chập
                    // chờn, Firestore tạm thời lỗi...), dù dữ liệu thực ra vẫn còn nguyên trên máy chủ.
                    // Để lỗi tự nổi lên — nơi gọi (handleSubmit) đã có sẵn bước báo lỗi rõ ràng và cho
                    // người dùng thử lại, thay vì âm thầm trả lời sai.
                    throw new Error('Không lấy được dữ liệu (sự kiện/việc/ghi chú) để trả lời: ' + (e.message || 'lỗi không xác định'));
                }
                return buildAISearchContext(privacy, ctxData, tryExtractMonthYearFromQuestion(text.trim(), new Date()));
            };

            const callAIWithContext = async (context) => {
                const trimmed = text.trim();
                // Mục 4: nếu ĐÃ CHẮC CHẮN (qua nhận diện cục bộ, không cần AI) đây là câu hỏi/tra cứu —
                // dùng luồng streaming, hiện câu trả lời dần từng chữ ngay khi có, thay vì phải đợi AI
                // trả lời xong hẳn mới thấy gì đó (cảm giác nhanh hơn hẳn, giống ChatGPT). Trường hợp
                // không chắc câu có phải câu hỏi hay không, vẫn dùng luồng JSON cũ bên dưới (AI tự phân
                // loại trước) để không bỏ sót các câu hỏi diễn đạt không theo mẫu quen thuộc.
