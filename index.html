        // vô tình làm hỏng những câu đã từng nhận diện đúng trước đó. Gọi từ Console của trình duyệt:
        //     runSmartEngineSelfTests()
        // Mốc thời gian "now" cố định (Thứ 7, 8/8/2026) để kết quả luôn giống nhau mỗi lần chạy, không
        // phụ thuộc vào ngày giờ thực tế lúc kiểm tra.
        const SMART_ENGINE_SELF_TESTS = [
            { input: '7h30 sáng mai họp nhóm', title: 'Họp nhóm', hasTime: true },
            { input: 'nộp báo cáo ngày 20/8', title: 'Nộp báo cáo', hasTime: false },
            { input: 'họp cuối tuần này', title: 'Họp', hasTime: false },
            { input: 'gặp khách hàng 3 ngày nữa', title: 'Gặp khách hàng', hasTime: false },
            { input: 'đi công tác 2 tuần trước', title: 'Đi công tác', hasTime: false },
            { input: 'ăn tối 7 giờ rưỡi tối nay', title: 'Ăn tối', hasTime: true },
            { input: 'đi học chiều nay', title: 'Đi học', hasTime: false },
            { input: 'nhắc tôi uống thuốc 9h tối nhé', title: 'Nhắc tôi uống thuốc', hasTime: true },
            { input: 'mua sắm con ruồi bay 7h rưỡi tối mai', title: 'Mua sắm con ruồi bay', hasTime: true },
            { input: 'gặp sếp thứ 2 tuần này', title: 'Gặp sếp', hasTime: false },
            { input: 'trong 30 phút nữa gọi điện cho khách', title: 'Gọi điện cho khách', hasTime: true },
            { input: 'trong 2 giờ nữa đón con', title: 'Đón con', hasTime: true },
            { input: 'họp ngày 20 tháng 8', title: 'Họp', hasTime: false },
            { input: 'nộp thuế đầu tháng sau', title: 'Nộp thuế', hasTime: false },
            { input: 'họp giữa tuần sau', title: 'Họp', hasTime: false },
            { input: 'kiểm kê cuối tháng', title: 'Kiểm kê', hasTime: false },
            { input: 'giỗ ông mùng 10 tháng 3 âm', title: 'Giỗ ông', hasTime: false },
            { input: 'rằm tháng 7 cúng cô hồn', title: 'Cúng cô hồn', hasTime: false },
            { input: 'Quốc khánh nghỉ lễ', title: 'Nghỉ lễ', hasTime: false },
            { input: 'Trung thu mua bánh cho con', title: 'Mua bánh cho con', hasTime: false },
            { input: 'gấp nộp báo cáo ngày mai', title: '🔥 Nộp báo cáo', hasTime: false },
            { input: 'họp hàng tuần lúc 8h thứ 2', title: 'Họp', hasTime: true, repeat: 'weekly' },
            { input: 'đóng tiền nhà hàng tháng ngày 5', title: 'Đóng tiền nhà', hasTime: false, repeat: 'monthly' },
            { input: 'kỷ niệm ngày cưới hàng năm 20/10', title: 'Kỷ niệm ngày cưới', hasTime: false, repeat: 'yearly' },
            { input: 'họp ngày mai nhắc trước 30 phút', title: 'Họp', hasTime: false, reminderOffsetMinutes: 30 },
            { input: 'nộp báo cáo ngày mai nhắc trước 1 ngày', title: 'Nộp báo cáo', hasTime: false, reminderOffsetMinutes: 1440 },
            { input: 'không có gì cả', expectNull: true },
        ];
        // Đợt 3: test riêng cho lệnh dời lịch (tryRescheduleCommand) — không dùng chung định dạng ở
        // trên vì hàm này trả về {keyword, afterPart} chứ không phải {title, date, hasTime}.
        const SMART_ENGINE_RESCHEDULE_TESTS = [
            { input: 'dời họp ngày mai sang thứ 6', keyword: 'Họp', afterPart: 'thứ 6' },
            { input: 'đổi lịch họp nhóm sang 3h chiều', keyword: 'họp nhóm', afterPart: '3h chiều' },
            { input: 'chuyển họp phụ huynh sang 9h sáng thứ 2 tuần sau', keyword: 'họp phụ huynh', afterPart: '9h sáng thứ 2 tuần sau' },
            { input: 'dời gặp khách hàng sang', expectNull: true },
            { input: 'họp ngày mai', expectNull: true },
        ];
        const runSmartEngineSelfTests = () => {
            const fixedNow = new Date(2026, 7, 8); // Thứ 7, 8/8/2026 — cố định để kết quả luôn giống nhau
            let pass = 0, fail = 0;
            SMART_ENGINE_SELF_TESTS.forEach(tc => {
                const r = parseVietnameseDateTime(tc.input, fixedNow);
                let ok = true;
                const problems = [];
                if (tc.expectNull) {
                    if (r) { ok = false; problems.push('lẽ ra phải trả về null nhưng lại nhận diện được'); }
                } else {
                    if (!r) { ok = false; problems.push('không nhận diện được (trả về null)'); }
                    else {
                        if (tc.title !== undefined && r.title !== tc.title) { ok = false; problems.push(`tiêu đề: "${r.title}" ≠ "${tc.title}"`); }
                        if (tc.hasTime !== undefined && r.hasTime !== tc.hasTime) { ok = false; problems.push(`hasTime: ${r.hasTime} ≠ ${tc.hasTime}`); }
                        if (tc.repeat !== undefined && r.repeat !== tc.repeat) { ok = false; problems.push(`repeat: ${r.repeat} ≠ ${tc.repeat}`); }
                        if (tc.reminderOffsetMinutes !== undefined && r.reminderOffsetMinutes !== tc.reminderOffsetMinutes) { ok = false; problems.push(`reminderOffsetMinutes: ${r.reminderOffsetMinutes} ≠ ${tc.reminderOffsetMinutes}`); }
                    }
                }
                if (ok) { pass++; console.log('%c✓ PASS', 'color: green', JSON.stringify(tc.input)); }
                else { fail++; console.log('%c✗ FAIL', 'color: red', JSON.stringify(tc.input), '—', problems.join('; ')); }
            });
            // Đợt 3, mục 3: kiểm tra riêng lệnh dời lịch (tryRescheduleCommand)
            SMART_ENGINE_RESCHEDULE_TESTS.forEach(tc => {
                const r = tryRescheduleCommand(tc.input);
                let ok = true;
                const problems = [];
                if (tc.expectNull) {
                    if (r) { ok = false; problems.push('lẽ ra phải trả về null nhưng lại nhận diện được'); }
                } else {
                    if (!r) { ok = false; problems.push('không nhận diện được (trả về null)'); }
                    else {
                        if (tc.keyword !== undefined && r.keyword !== tc.keyword) { ok = false; problems.push(`keyword: "${r.keyword}" ≠ "${tc.keyword}"`); }
                        if (tc.afterPart !== undefined && r.afterPart !== tc.afterPart) { ok = false; problems.push(`afterPart: "${r.afterPart}" ≠ "${tc.afterPart}"`); }
                    }
                }
                if (ok) { pass++; console.log('%c✓ PASS (dời lịch)', 'color: green', JSON.stringify(tc.input)); }
                else { fail++; console.log('%c✗ FAIL (dời lịch)', 'color: red', JSON.stringify(tc.input), '—', problems.join('; ')); }
            });
            const total = SMART_ENGINE_SELF_TESTS.length + SMART_ENGINE_RESCHEDULE_TESTS.length;
            console.log(`Smart Engine self-test: ${pass}/${total} đạt` + (fail ? `, ${fail} LỖI (xem chi tiết ở trên)` : ' — tất cả đều đúng!'));
            return { pass, fail, total };
        };
        if (typeof window !== 'undefined') window.runSmartEngineSelfTests = runSmartEngineSelfTests;

        // ==============================================================================
        // TẦNG 2 — AI INTEGRATION LAYER
        // Lớp `AIService` độc lập nhà cung cấp: đổi nhà cung cấp AI chỉ cần sửa trong
        // module này, không phải sửa phần còn lại của ứng dụng.
        // Cấu hình (provider/API key/mode/quyền riêng tư) lưu ở localStorage — CHỈ trên
        // thiết bị này, không đồng bộ qua Firestore, để API key không bị lưu chung với
        // dữ liệu người dùng khác.
        // ==============================================================================
        const DEFAULT_AI_PRIVACY = {
            events: true,        // Cho phép AI đọc sự kiện
            todos: true,         // Cho phép AI đọc công việc
            notes: false,        // Không cho AI đọc ghi chú (mặc định an toàn)
            timetable: false,    // Không cho AI đọc thời khóa biểu (mặc định an toàn)
            confirmBeforeSend: true,  // Hỏi lại trước mỗi lần gửi dữ liệu
            showExactContent: true,   // Hiển thị chính xác nội dung sẽ gửi
        };

        // Dọn API key khỏi khoảng trắng/ký tự ẩn ở bất kỳ vị trí nào — dùng chung cho cả lúc lưu và
        // lúc đọc, để những key đã lỡ lưu bị dính ký tự ẩn từ trước (khi chưa có bước dọn này) cũng
        // tự động được sửa mà không cần người dùng phải nhập lại.
        const sanitizeApiKey = (val) => (val || '')
            .replace(/[\u200B-\u200D\uFEFF\u00A0\u2060]/g, '')
            .replace(/\s+/g, '');

        const getAIConfig = () => ({
            provider: 'gemini', // Đã đơn giản hoá: chỉ dùng Gemini (miễn phí), không còn chọn nhà cung cấp khác
            apiKey: sanitizeApiKey(localStorage.getItem('vt_ai_api_key')),
            enabled: localStorage.getItem('vt_ai_enabled') === 'true',
            mode: localStorage.getItem('vt_ai_mode') || null, // 'economical' | 'smart' | null (chưa chọn)
        });

        const getAIPrivacy = () => {
            try {
                const saved = JSON.parse(localStorage.getItem('vt_ai_privacy'));
                return saved ? { ...DEFAULT_AI_PRIVACY, ...saved } : { ...DEFAULT_AI_PRIVACY };
            } catch (e) {
                return { ...DEFAULT_AI_PRIVACY };
            }
        };

        // AI có đang thực sự sẵn sàng dùng được không (đã bật công tắc + đã có API key)
        const isAIActive = (config) => {
            const c = config || getAIConfig();
            return !!c.enabled && !!c.apiKey;
        };

        // Trích JSON đầu tiên tìm thấy trong văn bản trả về của AI (AI hay bọc JSON trong ```json ... ``` )
        const extractJsonFromAIText = (text) => {
            if (!text) return null;
            const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
            const candidate = fenced ? fenced[1] : text;
            // Tìm cặp { } khớp đúng nhau (đếm độ sâu ngoặc) thay vì dùng regex tham lam "\{[\s\S]*\}"
            // — regex tham lam từng bắt nhầm khi AI trả lời kèm thêm chữ/ngoặc rải rác ngoài khối JSON
            // chính (rất hay gặp khi model không tuân thủ tuyệt đối yêu cầu "chỉ trả JSON"), khiến
            // JSON.parse thất bại và báo lỗi dù AI thực ra đã trả lời đúng. Thử lần lượt từng vị trí
            // "{" xuất hiện trong văn bản (không chỉ vị trí đầu tiên) để tránh bị 1 dấu ngoặc lạc ở
            // phần văn bản mở đầu làm hỏng việc bắt đúng khối JSON thực sự.
            for (let start = candidate.indexOf('{'); start !== -1; start = candidate.indexOf('{', start + 1)) {
                let depth = 0;
                for (let i = start; i < candidate.length; i++) {
                    if (candidate[i] === '{') depth++;
                    else if (candidate[i] === '}') {
                        depth--;
                        if (depth === 0) {
                            try {
                                const parsed = JSON.parse(candidate.slice(start, i + 1));
                                if (parsed && typeof parsed === 'object') return parsed;
                            } catch (e) { /* không hợp lệ — thử vị trí "{" tiếp theo */ }
                            break;
                        }
                    }
                }
            }
            return null;
        };

        // ==============================================================================
        // LỚP GỌI GEMINI DÙNG CHUNG CHO TOÀN BỘ ỨNG DỤNG
        // Trước đây có 2 nơi tự gọi Gemini API độc lập nhau (Trợ lý AI ở đây, và tính năng "nhập
        // thời khóa biểu bằng ảnh" có bản riêng) — dễ lệch nhau khi 1 bên được sửa/cải tiến còn bên
        // kia thì không. Gộp lại dùng chung 1 bộ hàm duy nhất, mang theo đầy đủ khả năng tốt nhất của
        // cả 2 bản cũ: (1) thử lần lượt theo danh sách model dự phòng, (2) khi TẤT CẢ đều báo lỗi vì
        // không còn hỗ trợ, tự động dò danh sách model mới nhất từ chính Google (ListModels API) rồi
        // thử lại — ứng dụng tự thích nghi khi Google đổi tên/thế hệ model mà KHÔNG cần sửa code.
        // ==============================================================================

        // Model "biết trước", dùng đầu tiên (không tốn thêm 1 lượt gọi API để dò danh sách). Thứ tự
        // ưu tiên khác nhau tuỳ "mode": Tiết kiệm → ưu tiên model rẻ/nhanh (flash-lite) trước; Thông
        // minh → ưu tiên model mạnh hơn (flash đầy đủ) trước — đây chính là điểm khác biệt thực sự
        // giữa 2 lựa chọn "Tiết kiệm/Thông minh" trong Cài đặt (trước đây 2 lựa chọn này không hề có
        // tác dụng gì khác nhau).
        const GEMINI_MODEL_CANDIDATES_ECONOMICAL = ['gemini-2.5-flash-lite', 'gemini-2.5-flash', 'gemini-2.0-flash'];
        const GEMINI_MODEL_CANDIDATES_SMART = ['gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-2.0-flash'];
        const GEMINI_MODEL_CACHE_KEY = 'vt_gemini_models_cache_v1';
        const GEMINI_MODEL_CACHE_TTL_MS = 24 * 60 * 60 * 1000; // 24h — đỡ phải dò lại API liên tục
        const geminiSleep = (ms) => new Promise(r => setTimeout(r, ms));

        // Mục 5: đếm số lượt gọi Gemini THÀNH CÔNG trong ngày (chỉ lưu trên máy, không gửi đi đâu) —
        // để có thể cảnh báo sớm trước khi vô tình dùng hết hạn mức miễn phí giữa chừng công việc.
        const GEMINI_CALL_COUNT_PREFIX = 'vt_gemini_calls_';
        const getTodayGeminiCallCount = () => {
            try { return parseInt(localStorage.getItem(GEMINI_CALL_COUNT_PREFIX + new Date().toDateString()) || '0', 10) || 0; }
            catch (e) { return 0; }
        };
        const bumpTodayGeminiCallCount = () => {
            try {
                const key = GEMINI_CALL_COUNT_PREFIX + new Date().toDateString();
                const next = getTodayGeminiCallCount() + 1;
                localStorage.setItem(key, String(next));
                // Dọn các ngày cũ (giữ tối đa 3 ngày gần nhất) — tránh localStorage phình to vô hạn theo thời gian
                Object.keys(localStorage).forEach(k => {
                    if (k.startsWith(GEMINI_CALL_COUNT_PREFIX) && k !== key) {
                        const days = (Date.now() - new Date(k.slice(GEMINI_CALL_COUNT_PREFIX.length)).getTime()) / 86400000;
                        if (!(days >= 0 && days <= 3)) localStorage.removeItem(k);
                    }
                });
                return next;
            } catch (e) { return null; }
        };
        // Ngưỡng cảnh báo — hạn mức miễn phí thực tế của Google dao động khá nhiều tuỳ model/thời
        // điểm nên đây chỉ là ước lượng thận trọng để nhắc sớm, không phải con số chính xác tuyệt đối.
        const GEMINI_DAILY_WARNING_THRESHOLD = 40;
        // Mục 3: hạn mức ƯỚC TÍNH mỗi ngày, dùng để tính "còn lại khoảng bao nhiêu lượt" hiện trong Cài
        // đặt. Đây KHÔNG phải con số chính thức của Google (hạn mức thật tuỳ model đang dùng và có thể
        // đổi bất kỳ lúc nào) — chỉ mang tính tham khảo, ước lượng thận trọng theo model rẻ/nhẹ nhất.
        const GEMINI_DAILY_ESTIMATED_LIMIT = 50;

        // Dò danh sách model gemini-* hiện còn hỗ trợ generateContent trực tiếp từ Google — chỉ gọi
        // khi thật sự cần (toàn bộ model đã biết trước đều lỗi), có cache 24h để đỡ tốn lượt gọi.
        const discoverAvailableGeminiModels = async (apiKey) => {
            try {
                const cachedRaw = localStorage.getItem(GEMINI_MODEL_CACHE_KEY);
                if (cachedRaw) {
                    const cached = JSON.parse(cachedRaw);
                    if (cached && Date.now() - cached.ts < GEMINI_MODEL_CACHE_TTL_MS && Array.isArray(cached.models) && cached.models.length) {
                        return cached.models;
                    }
                }
            } catch (e) { /* cache lỗi/thiếu — dò lại từ đầu */ }
            const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models?key=' + encodeURIComponent(apiKey));
            if (!res.ok) throw new Error('Không lấy được danh sách model từ Google.');
            const data = await res.json();
            const list = (data.models || [])
                .filter(m => m.name && m.supportedGenerationMethods?.includes('generateContent'))
                .map(m => m.name.replace(/^models\//, ''))
                .filter(name => /gemini/i.test(name) && !/embedding|aqa|imagen|tts|vision-only/i.test(name));
            const rank = (name) => (/flash-lite/i.test(name) ? 0 : /flash/i.test(name) ? 1 : /pro/i.test(name) ? 2 : 3);
            list.sort((a, b) => rank(a) - rank(b));
            try { localStorage.setItem(GEMINI_MODEL_CACHE_KEY, JSON.stringify({ ts: Date.now(), models: list })); } catch (e) {}
            return list;
        };

        // Gọi 1 model cụ thể (KHÔNG streaming) — dùng chung cho mọi loại nội dung (text thuần hay có
        // kèm ảnh), vì bodyObj đã được nơi gọi tự soạn sẵn đầy đủ.
        const callGeminiSingleModel = async (bodyObj, apiKey, model, timeoutMs = 25000) => {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
            let res;
            try {
                res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bodyObj), signal: controller.signal
                });
            } catch (networkErr) {
                clearTimeout(timeoutId);
                if (networkErr.name === 'AbortError') {
                    const err = new Error(`Model ${model} không phản hồi sau ${Math.round(timeoutMs / 1000)} giây (mạng chậm hoặc bị chặn).`);
                    err.status = 'timeout';
                    throw err;
                }
                const err = new Error('Không kết nối được tới Gemini API: ' + (networkErr.message || ''));
                err.status = 'network';
                throw err;
            }
            clearTimeout(timeoutId);
            if (!res.ok) {
                let errMsg = 'Lỗi API ' + res.status;
                try { const e = await res.json(); errMsg = e.error?.message || errMsg; } catch (e2) {}
                const err = new Error(errMsg);
                err.status = res.status;
                throw err;
            }
            return res.json();
        };

        const tryGeminiModelList = async (models, bodyObj, apiKey) => {
            let lastErr = null;
            for (const model of models) {
                for (let attempt = 0; attempt < 2; attempt++) {
                    try {
                        const data = await callGeminiSingleModel(bodyObj, apiKey, model);
                        bumpTodayGeminiCallCount();
                        return data;
                    } catch (e) {
                        lastErr = e;
                        if (e.status === 429 && attempt === 0) { await geminiSleep(4000); continue; } // hết hạn mức tạm thời — đợi rồi thử lại đúng model này 1 lần
                        break; // lỗi khác (hoặc đã thử lại vẫn lỗi) — chuyển sang model kế tiếp
                    }
                }
            }
            throw lastErr || new Error('Không thể kết nối tới Gemini AI.');
        };

        // Điểm gọi Gemini KHÔNG STREAMING dùng chung duy nhất — trả về nguyên văn JSON response của
        // Google (nơi gọi tự trích phần cần dùng, vì text thuần và JSON có cấu trúc trích khác nhau).
        const callGeminiRaw = async (bodyObj, apiKey, { mode, modelOverride } = {}) => {
            const baseCandidates = mode === 'smart' ? GEMINI_MODEL_CANDIDATES_SMART : GEMINI_MODEL_CANDIDATES_ECONOMICAL;
            const primaryModels = modelOverride ? [modelOverride, ...baseCandidates] : baseCandidates;
            try {
                return await tryGeminiModelList(primaryModels, bodyObj, apiKey);
            } catch (firstErr) {
                if (firstErr.status === 401 || firstErr.status === 403) {
                    throw new Error('Gemini API từ chối API Key (lỗi ' + firstErr.status + '). Hãy thử: (1) vào Cài đặt, xoá và dán lại API Key (nhất là nếu bạn copy trên điện thoại — có thể dính ký tự ẩn); (2) đảm bảo API Key được tạo trực tiếp tại aistudio.google.com (không phải qua Google Cloud Console); (3) thử tạo API Key mới nếu vẫn lỗi.');
                }
                const looksDeprecated = firstErr.status === 404 || /not found|not supported|deprecated/i.test(firstErr.message || '');
                if (!looksDeprecated) {
                    if (firstErr.status === 429) {
                        throw new Error('Đã hết hạn mức Gemini miễn phí ở các model đã thử. Hạn mức miễn phí thường tính theo phút và/hoặc theo ngày — đợi vài phút rồi thử lại.');
                    }
                    if (firstErr.status === 'timeout') throw firstErr;
                    throw firstErr;
                }
                try {
                    const discovered = await discoverAvailableGeminiModels(apiKey);
                    const freshModels = discovered.filter(m => !primaryModels.includes(m));
                    if (!freshModels.length) throw firstErr;
                    return await tryGeminiModelList(freshModels, bodyObj, apiKey);
                } catch (secondErr) {
                    throw new Error('Các model Gemini hiện tại (kể cả model mới tự dò) đều không dùng được. Google có thể vừa thay đổi model — hãy vào aistudio.google.com để xem tên model mới nhất.');
                }
            }
        };

        // Mục 4: gọi Gemini dạng STREAMING (trả lời hiện dần từng chữ, giống ChatGPT) — chỉ dùng cho
        // trường hợp câu trả lời là VĂN BẢN THUẦN hiện thẳng cho người dùng đọc (không áp dụng cho các
        // trường hợp cần AI trả về JSON có cấu trúc, vì hiện dần từng ký tự JSON thô sẽ chỉ thấy dấu
        // ngoặc/dấu phẩy nhảy loạn, không có ý nghĩa gì với người dùng). CHỈ thử với 1 model đầu tiên
        // (không dò/dự phòng nhiều model như bản không-streaming) để giữ đơn giản — nếu lỗi, bên gọi
        // (AIService.answerQuestionStream) tự động chuyển sang gọi lại kiểu không-streaming để vẫn ra
        // được kết quả, không chặn hẳn người dùng.
        const callGeminiStream = async (bodyObj, apiKey, model, onChunk) => {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${encodeURIComponent(apiKey)}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bodyObj)
            });
            if (!res.ok || !res.body) {
                let errMsg = 'Lỗi API ' + res.status;
                try { const e = await res.json(); errMsg = e.error?.message || errMsg; } catch (e2) {}
                const err = new Error(errMsg);
                err.status = res.status;
                throw err;
            }
            const reader = res.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';
            let fullText = '';
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                // QUAN TRỌNG: Gemini trả về mỗi sự kiện SSE dưới dạng JSON IN ĐẸP (nhiều dòng, có thụt
                // lề), KHÔNG gọn trong 1 dòng. Vì vậy phải tách theo TỪNG KHỐI sự kiện — các khối cách
                // nhau bởi 1 dòng trống ("\n\n") đúng chuẩn SSE — rồi lấy TOÀN BỘ phần sau "data:" đầu
                // tiên của khối đó làm JSON (giữ nguyên xuống dòng bên trong). Trước đây tách theo TỪNG
                // DÒNG ĐƠN nên JSON nhiều dòng bị cắt vụn giữa chừng, không parse được dòng nào cả →
                // không đọc được chữ nào → luôn phải âm thầm rơi về gọi không-streaming (đây chính là lý
                // do trước đó không thấy hiệu ứng hiện dần từng chữ, dù đã có "cơ chế dự phòng" che đi).
                let sepIdx;
                while ((sepIdx = buffer.indexOf('\n\n')) !== -1) {
                    const eventBlock = buffer.slice(0, sepIdx);
                    buffer = buffer.slice(sepIdx + 2);
                    const dataIdx = eventBlock.indexOf('data:');
                    if (dataIdx === -1) continue;
                    const jsonStr = eventBlock.slice(dataIdx + 5).trim();
                    if (!jsonStr || jsonStr === '[DONE]') continue;
                    try {
                        const obj = JSON.parse(jsonStr);
                        const piece = (obj.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
                        if (piece) { fullText += piece; onChunk(piece, fullText); }
                    } catch (e) { /* khối JSON chưa trọn hẳn (hiếm khi xảy ra với cách tách theo khối) — bỏ qua */ }
                }
            }
            bumpTodayGeminiCallCount();
            return fullText;
        };

        // Điểm gọi duy nhất ra bên ngoài — hiện chỉ dùng Gemini (đã đơn giản hoá theo yêu cầu,
        // không còn OpenAI/API riêng nữa). Giữ tên "AIService" và cấu trúc tách biệt để sau
        // này nếu cần thêm nhà cung cấp khác chỉ cần sửa trong module này.
        // Mục 3: định dạng lịch sử hội thoại (tối đa vài lượt gần nhất) thành đoạn văn bản đưa vào
        // prompt, để AI hiểu được các câu hỏi nối tiếp kiểu "còn việc nào nữa không?" (tham chiếu tới
        // câu hỏi/trả lời TRƯỚC ĐÓ trong cùng phiên, không phải hỏi độc lập từng câu như trước).
        const formatConversationHistory = (history) => {
            if (!Array.isArray(history) || history.length === 0) return '';
            const lines = history.map(h => (h.role === 'user' ? 'Người dùng: ' : 'Trợ lý: ') + h.text);
            return 'Lịch sử hội thoại gần đây (để hiểu ngữ cảnh câu hỏi tiếp theo, KHÔNG lặp lại nguyên văn):\n' + lines.join('\n');
        };

        const AIService = {
            async callRaw(prompt, config) {
                const c = config || getAIConfig();
                if (!c.apiKey) throw new Error('Chưa nhập API key.');
                // Mục 7: temperature THẤP — đây là việc TRA CỨU/phân tích dữ liệu có sẵn (không phải viết
                // sáng tạo), cần kết quả ổn định/nhất quán mỗi lần hỏi, không cần AI "sáng tạo" nhiều
                // phương án khác nhau. Trước đây không đặt temperature nên dùng mặc định khá cao của
                // Gemini, khiến cùng 1 câu hỏi hỏi lại nhiều lần có khi ra kết quả khác nhau (thậm chí
                // nhầm sang tháng khác) — đây chính là nguyên nhân.
                const data = await callGeminiRaw({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.1 } }, c.apiKey, { mode: c.mode });
                const answerText = (data?.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
                if (!answerText) {
                    throw new Error('Gemini API không trả về nội dung (có thể do bộ lọc an toàn chặn câu trả lời) — thử diễn đạt lại câu khác.');
                }
                return answerText;
            },
            // Mục 4: bản streaming của callRaw — hiện dần từng chữ qua onChunk(fullTextSoFar) thay vì
            // đợi xong hẳn mới hiện 1 lần. Chỉ nên dùng khi câu trả lời là văn bản thuần hiện thẳng cho
            // người đọc (không phải JSON có cấu trúc). Tự động rơi về gọi callRaw (không streaming)
            // nếu streaming lỗi ngay từ đầu (chưa nhận được chữ nào) — vẫn ra kết quả bình thường,
            // chỉ là không có hiệu ứng hiện dần.
            async callRawStream(prompt, config, onChunk) {
                const c = config || getAIConfig();
                if (!c.apiKey) throw new Error('Chưa nhập API key.');
                const model = c.mode === 'smart' ? GEMINI_MODEL_CANDIDATES_SMART[0] : GEMINI_MODEL_CANDIDATES_ECONOMICAL[0];
                try {
                    const fullText = await callGeminiStream({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.1 } }, c.apiKey, model, onChunk);
                    if (!fullText) throw new Error('Gemini API không trả về nội dung.');
                    return fullText;
                } catch (e) {
                    // Streaming lỗi (model tạm thời không hỗ trợ, mạng chập chờn giữa chừng...) — rơi về
                    // gọi lại kiểu không-streaming, có đầy đủ khả năng dò/dự phòng model để chắc chắn
                    // vẫn ra được kết quả cho người dùng.
                    return this.callRaw(prompt, c);
                }
            },
            // Gọi thử 1 request nhỏ để xác minh API key (hàm tiện ích, không bắt buộc phải có nút riêng trong UI)
            async testConnection(config) {
                const c = config || getAIConfig();
                if (!c.apiKey) return { ok: false, message: 'Chưa nhập API key.' };
                try {
                    const text = await this.callRaw('Trả lời đúng 1 chữ: OK', c);
                    return { ok: true, message: 'Kết nối thành công! Phản hồi: ' + text.trim().slice(0, 50) };
                } catch (e) {
                    return { ok: false, message: e.message || 'Kết nối thất bại.' };
                }
            },
            // Mục 3+4: dùng khi ĐÃ CHẮC CHẮN (qua looksLikeQuestion cục bộ) đây là câu hỏi/tra cứu —
            // trả lời thẳng bằng văn bản thuần qua streaming (hiện dần từng chữ), không cần bắt AI trả
            // JSON có cấu trúc (đỡ tốn token phân loại không cần thiết cho trường hợp đã rõ ràng này).
            // Có tính đến lịch sử hội thoại trước đó để hỏi tiếp/nối câu vẫn hiểu đúng ngữ cảnh.
            async answerQuestionStream(text, context, config, history, onChunk) {
                const c = config || getAIConfig();
                const today = new Date();
                const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
                const prompt = [
                    'Bạn là trợ lý lịch/việc cần làm/ghi chú tiếng Việt. Hôm nay là ' + todayStr + ' (yyyy-mm-dd).',
                    'Người dùng đang HỎI/TÌM thông tin — đếm, liệt kê, tổng hợp, tra cứu dữ liệu hiện có.',
                    'Trả lời NGẮN GỌN, tự nhiên bằng tiếng Việt, dựa HOÀN TOÀN vào dữ liệu ngữ cảnh bên dưới — nếu',
                    'ngữ cảnh không đủ để trả lời chắc chắn, hãy nói rõ là không đủ dữ liệu, KHÔNG suy đoán hay bịa',
                    'thông tin. CHỈ trả lời bằng văn bản thuần (không dùng JSON). KHÔNG dùng markdown khác (không',
                    'in đậm bằng dấu *, không tiêu đề #).',
                    'LƯU Ý QUAN TRỌNG khi trả lời câu hỏi về sự kiện: mỗi sự kiện có "ngay_goc" (ngày tạo ban đầu,',
                    'có thể từ nhiều năm trước) và "lap_lai" (none/weekly/monthly/lunar/solar/yearly). Với sự kiện',
                    'lặp hàng năm (lap_lai là lunar/solar/yearly — thường là sinh nhật/giỗ/kỷ niệm), trường',
                    '"ngay_roi_vao_nam_nay" (nếu có) mới chính là ngày sự kiện đó THỰC SỰ diễn ra trong năm nay —',
                    'LUÔN dùng trường này, TUYỆT ĐỐI không tự suy luận đổi lịch âm dương. Nhận diện sinh nhật/giỗ',
                    'dựa vào chữ "sinh nhật"/"giỗ" có trong "tieu_de" của sự kiện.',
                    context && Object.keys(context).length > 0 ? 'Dữ liệu ngữ cảnh tham khảo (JSON): ' + JSON.stringify(context) : 'Không có dữ liệu ngữ cảnh nào được cung cấp.',
                    formatConversationHistory(history),
                    'Câu hỏi hiện tại của người dùng: "' + text + '"',
                    // Mục 2 (nhắc lại lần nữa, SÁT NGAY CUỐI prompt để mô hình ưu tiên tuân theo hơn — LLM
                    // thường bám sát chỉ dẫn gần cuối prompt hơn là chỉ dẫn ở đầu): BẮT BUỘC liệt kê bằng
                    // gạch đầu dòng, kèm ví dụ cụ thể để không hiểu nhầm thành đoạn văn liền mạch.
                    'QUY TẮC ĐỊNH DẠNG BẮT BUỘC: nếu câu trả lời có từ 2 mục trở lên (nhiều sự kiện/việc/ghi',
                    'chú...), PHẢI trình bày mỗi mục 1 dòng riêng, mỗi dòng bắt đầu bằng "- ". Ví dụ đúng:',
                    '"Tháng này có 2 sinh nhật:\\n- Sinh nhật mẹ, ngày 12/8\\n- Sinh nhật Lan, ngày 25/8".',
                    'KHÔNG viết liền thành 1 đoạn văn kiểu "gồm có A vào ngày X và B vào ngày Y". Nếu câu trả lời',
                    'chỉ có 1 thông tin/số liệu duy nhất (không phải danh sách) thì viết thành câu bình thường,',
                    'không cần gạch đầu dòng.'
                ].filter(Boolean).join('\n');
                return this.callRawStream(prompt, c, onChunk);
            },
            // Nhờ AI: TRƯỚC TIÊN xác định đây là câu hỏi/tìm kiếm (đếm, liệt kê, tổng hợp dữ liệu hiện
            // có — ví dụ "tháng này có mấy sinh nhật?") hay lệnh tạo mới sự kiện/việc/ghi chú.
            // Ưu tiên tìm kiếm trước, tạo mới sau (đúng theo yêu cầu).
            async parseNaturalLanguage(text, context, config, history) {
                const c = config || getAIConfig();
                const today = new Date();
                const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
                const prompt = [
                    'Bạn là trợ lý lịch/việc cần làm/ghi chú tiếng Việt. Hôm nay là ' + todayStr + ' (yyyy-mm-dd).',
                    'BƯỚC 1 — Trước tiên, xác định câu của người dùng thuộc loại nào:',
                    '- "tim_kiem": người dùng đang HỎI/TÌM thông tin — đếm, liệt kê, tổng hợp, tra cứu dữ liệu hiện có',
                    '  (ví dụ: "tháng này có mấy sinh nhật?", "tuần sau tôi có việc gì?", "còn việc nào chưa xong?").',
                    '- "tao_moi": người dùng muốn TẠO MỚI 1 sự kiện/việc cần làm/ghi chú.',
                    'Ưu tiên hiểu là "tim_kiem" nếu câu có ý nghĩa nghi vấn/tra cứu; chỉ chọn "tao_moi" khi rõ ràng là đang mô tả một việc/sự kiện/ghi chú cụ thể cần lưu lại.',
                    '',
                    'BƯỚC 2 — Tuỳ loại, trả về DUY NHẤT 1 đối tượng JSON sau (không kèm giải thích, không dùng markdown):',
                    '- Nếu "tim_kiem": {"intent": "tim_kiem", "answer": "câu trả lời ngắn gọn, tự nhiên bằng tiếng Việt, dựa HOÀN TOÀN vào dữ liệu ngữ cảnh bên dưới — nếu ngữ cảnh không đủ để trả lời chắc chắn, hãy nói rõ là không đủ dữ liệu, KHÔNG suy đoán hay bịa thông tin"}',
                    '- Nếu "tao_moi": {"intent": "tao_moi", "loai": "su_kien|viec_can_lam|ghi_chu", "title": "tiêu đề ngắn gọn", "date": "yyyy-mm-dd hoặc null nếu không có ngày cụ thể", "time": "HH:mm hoặc null nếu không có giờ cụ thể", "reminder": true hoặc false}',
                    'LƯU Ý QUAN TRỌNG khi trả lời câu hỏi về sự kiện: mỗi sự kiện có "ngay_goc" (ngày tạo ban đầu, có thể từ nhiều năm trước) và "lap_lai" (none/weekly/monthly/lunar/solar/yearly).',
                    'Với sự kiện lặp hàng năm (lap_lai là lunar/solar/yearly — thường là sinh nhật/giỗ/kỷ niệm), trường "ngay_roi_vao_nam_nay" (nếu có) mới chính là ngày sự kiện đó THỰC SỰ diễn ra trong năm nay — LUÔN dùng trường này để xác định tháng/ngày cụ thể trong năm nay, TUYỆT ĐỐI không tự suy luận đổi lịch âm dương hay dùng tháng của "ngay_goc" vì có thể sai.',
                    'Nhận diện sinh nhật/giỗ dựa vào chữ "sinh nhật"/"giỗ" có trong "tieu_de" của sự kiện.',
                    context && Object.keys(context).length > 0 ? 'Dữ liệu ngữ cảnh tham khảo (JSON): ' + JSON.stringify(context) : 'Không có dữ liệu ngữ cảnh nào được cung cấp.',
                    formatConversationHistory(history),
                    'Câu của người dùng: "' + text + '"'
                ].filter(Boolean).join('\n');
                const raw = await this.callRaw(prompt, c);
                const parsed = extractJsonFromAIText(raw);
                if (!parsed) {
                    throw new Error('AI không trả về kết quả hợp lệ, vui lòng thử diễn đạt lại.');
                }
                if (parsed.intent === 'tim_kiem') {
                    if (!parsed.answer) throw new Error('AI không trả về câu trả lời hợp lệ, vui lòng thử lại.');
                    return parsed;
                }
                if (!parsed.title) {
                    throw new Error('AI không trả về kết quả hợp lệ, vui lòng thử diễn đạt lại.');
                }
                if (!['su_kien', 'viec_can_lam', 'ghi_chu'].includes(parsed.loai)) parsed.loai = 'su_kien';
                parsed.intent = 'tao_moi';
                return parsed;
            }
        };

        // Chuẩn bị ngữ cảnh gửi kèm AI — CHỈ lấy đúng loại dữ liệu được phép theo "Chế độ riêng tư AI",
        // và chỉ lấy tối thiểu cần thiết (không gửi toàn bộ dữ liệu người dùng).
        // Ngữ cảnh RỘNG hơn dành riêng cho chế độ "tìm kiếm/hỏi đáp thông minh" bằng AI — vì để trả
        // lời được các câu như "tháng này có mấy sinh nhật?" AI cần thấy đủ dữ liệu liên quan (không
        // thể chỉ gửi 5 sự kiện gần nhất như chế độ tạo nhanh). Vẫn tôn trọng đúng "Chế độ riêng tư AI"
        // và vẫn giới hạn số lượng để tránh phình to prompt quá mức.
        // Chuyển Firestore Timestamp -> chuỗi ngày yyyy-mm-dd, KHÔNG BAO GIỜ throw lỗi — trả về null
        // nếu dữ liệu không hợp lệ/thiếu, để 1 bản ghi lỗi không làm hỏng toàn bộ dữ liệu gửi cho AI
        // (lỗi trước đây: "Invalid time value" khi có 1 việc/sự kiện có deadlineTime/date bị hỏng).
        const safeISODate = (ts) => {
            try {
                if (!ts) return null;
                const seconds = typeof ts.seconds === 'number' ? ts.seconds : (typeof ts._seconds === 'number' ? ts._seconds : null);
                if (seconds === null || isNaN(seconds)) return null;
                const d = new Date(seconds * 1000);
                if (isNaN(d.getTime())) return null;
                return d.toISOString().slice(0, 10);
            } catch (e) { return null; }
        };
        // Bản Date (không phải chuỗi) từ Timestamp, an toàn tương tự — dùng khi cần đưa tiếp vào hàm khác
        const safeDateFromTs = (ts) => {
            try {
                if (!ts) return null;
                const seconds = typeof ts.seconds === 'number' ? ts.seconds : (typeof ts._seconds === 'number' ? ts._seconds : null);
                if (seconds === null || isNaN(seconds)) return null;
                const d = new Date(seconds * 1000);
                return isNaN(d.getTime()) ? null : d;
            } catch (e) { return null; }
        };

        const buildAISearchContext = (privacy, { events = [], todos = [], notes = [] } = {}, monthFilter = null) => {
            const ctx = {};
            const thisYear = new Date().getFullYear();
            const todayForSort = new Date();
            const inMonthFilter = (d) => !monthFilter || (d && d.getFullYear() === monthFilter.year && d.getMonth() === monthFilter.month);
            if (privacy.events && events.length) {
                // Mục 7: tính sẵn ngày hiệu lực (ngay_roi_vao_nam_nay cho sự kiện lặp hàng năm, hoặc
                // ngay_goc cho sự kiện không lặp) cho TỪNG sự kiện TRƯỚC, rồi SẮP XẾP theo khoảng cách
                // gần với HÔM NAY nhất (không phân biệt quá khứ gần hay tương lai gần) trước khi cắt
                // bớt — nếu không sẽ dễ cắt trúng đúng sự kiện liên quan (ví dụ sinh nhật tháng này)
                // trong khi giữ lại các sự kiện xa lơ xa lắc, KHÔNG NHẤT QUÁN giữa các lần hỏi (vì thứ
                // tự Firestore trả về không đảm bảo cố định) — đây chính là lý do cùng 1 câu hỏi như
                // "tháng này có mấy sinh nhật?" có lúc ra kết quả đúng, có lúc lại thiếu/lẫn tháng khác.
                const withEffectiveDate = events.map(e => {
                    const base = safeDateFromTs(e.date);
                    const repeat = e.repeat || 'none';
                    let effectiveDate = base;
                    let occIso = null;
                    if (base && (repeat === 'lunar' || repeat === 'solar' || repeat === 'yearly')) {
                        try {
                            const occ = getEventOccurrenceInYear(e, base, monthFilter ? monthFilter.year : thisYear);
                            if (occ && !isNaN(occ.getTime())) { effectiveDate = occ; occIso = occ.toISOString().slice(0, 10); }
                        } catch (e2) { /* bỏ qua, không để 1 sự kiện lỗi làm hỏng cả danh sách */ }
                    }
                    return { e, base, repeat, effectiveDate, occIso };
                });
                let picked;
                if (monthFilter) {
                    // Mục 2: đã biết CHẮC CHẮN đúng 1 tháng đang được hỏi — lọc CHÍNH XÁC bằng code, AI
                    // không cần (và không được) tự lọc lại nữa, loại bỏ hẳn khả năng AI lẫn/sót tháng.
                    picked = withEffectiveDate
                        .filter(x => inMonthFilter(x.effectiveDate))
                        .sort((a, b) => a.effectiveDate - b.effectiveDate);
                } else {
                    picked = withEffectiveDate
                        .sort((a, b) => {
                            const da = a.effectiveDate ? Math.abs(a.effectiveDate - todayForSort) : Infinity;
                            const db_ = b.effectiveDate ? Math.abs(b.effectiveDate - todayForSort) : Infinity;
                            return da - db_;
                        })
                        .slice(0, 300);
                }
                ctx.su_kien = picked.map(({ e, base, repeat, occIso }) => {
                    const item = { tieu_de: e.title, ngay_goc: safeISODate(e.date), lap_lai: repeat };
                    if (occIso) item.ngay_roi_vao_nam_nay = occIso;
                    return item;
                });
            }
            if (privacy.todos && todos.length) {
                const withDeadline = todos.map(t => ({ t, d: safeDateFromTs(t.deadlineTime) }));
                const picked = monthFilter ? withDeadline.filter(x => inMonthFilter(x.d)) : withDeadline.slice(0, 100);
                ctx.viec_can_lam = picked.map(({ t }) => ({
                    noi_dung: t.text,
                    xong: !!t.completed,
                    han: safeISODate(t.deadlineTime),
                }));
            }
            if (privacy.notes && notes.length) {
                const withReminder = notes.map(n => ({ n, d: safeDateFromTs(n.reminderTime) }));
                // Ghi chú không phải lúc nào cũng có giờ nhắc — khi đang lọc theo tháng, chỉ giữ ghi chú
                // CÓ giờ nhắc và rơi đúng tháng đó (ghi chú không giờ nhắc coi như không gắn với 1 tháng cụ thể nào để so khớp).
                const picked = monthFilter ? withReminder.filter(x => inMonthFilter(x.d)) : withReminder.slice(0, 50);
                ctx.ghi_chu = picked.map(({ n }) => ({ tieu_de: stripHtml(n.title) || (n.content || '').slice(0, 60) }));
            }
            return ctx;
        };

        // Nhận diện thô 1 câu tiếng Việt có phải câu HỎI/TÌM KIẾM hay không (ưu tiên xử lý trước khi
        // coi là lệnh tạo mới) — dựa theo dấu "?" hoặc các từ để hỏi thông dụng, không cần gọi AI để
        // phân loại (đỡ tốn 1 lượt gọi API chỉ để phân loại ý định).
        const looksLikeQuestion = (text) => {
            if (!text) return false;
            if (/\?\s*$/.test(text.trim())) return true;
            const t = normalizeVN(text);
            const patterns = [
                /\bmay\b/, /\bbao nhieu\b/, /\bkhi nao\b/, /\bo dau\b/, /\bla gi\b/,
                /\bco phai\b/, /\btai sao\b/, /\bvi sao\b/, /\bthe nao\b/, /\bnhu the nao\b/,
                /^(hoi|cho hoi|cho toi hoi|lam on cho biet)\b/, /\bcon (bao nhieu|may)\b/, /\bco (gi|nhung gi)\b/,
                // "có sự kiện gì", "có việc gì làm không", "có lịch gì không"... — cho phép vài từ ở
                // giữa "có" và "gì"/"không" (trước đây yêu cầu "có" đứng NGAY TRƯỚC "gì" nên bỏ sót).
                /\bco\b[\s\S]{0,25}\bgi\b/, /\bco\b[\s\S]{0,25}\bkhong\b\??$/,
                /\b(su kien nao|viec gi|ghi chu gi|lich gi)\b/,
            ];
            return patterns.some(re => re.test(t));
        };

        // Mục 1: câu có vẻ là 1 lời NHẮC/DẶN (không phải mô tả 1 sự kiện có giờ giấc cụ thể) — dùng để
        // Tầng 1 (Smart Engine) tự chọn tạo "Việc cần làm" thay vì luôn luôn tạo "Sự kiện" như trước.
        // Chỉ dùng các từ khá chắc chắn (nhắc/nhớ/đừng quên) để tránh nhận nhầm — "cần"/"phải" quá
        // chung chung, dễ xuất hiện cả trong câu mô tả sự kiện bình thường nên không dùng.
        const looksLikeTodoCommand = (text) => /\b(nhac|nho|dung quen)\b/i.test(normalizeVN(text));

        // Mục 2: lệnh "ghi chú: ..." / "ghi chú - ..." — tạo thẳng 1 Ghi chú mới, không cần ngày/giờ gì
        // cả nên KHÔNG đi qua parseVietnameseDateTime (hàm đó bắt buộc phải có ngày mới trả về kết quả).
        // Mục 2 (đợt tiếp theo): trích xuất chính xác 1 khoảng THÁNG cụ thể (nếu câu hỏi rõ ràng đang
        // hỏi về đúng 1 tháng, vd "tháng 8/2026 có mấy sinh nhật") — dùng để LỌC SẴN dữ liệu gửi cho AI
        // chỉ còn đúng tháng đó bằng CODE, thay vì gửi hàng trăm sự kiện rồi trông chờ AI tự lọc đúng.
        // Lọc trước bằng code là chắc chắn tuyệt đối 100%, không phụ thuộc AI có đọc đúng từng ngày hay
        // không — đây chính là nguyên nhân trước đó trả lời bị thiếu/lẫn sang tháng khác.
        const tryExtractMonthYearFromQuestion = (rawText, now) => {
            const norm = normalizeVN(rawText);
            now = now || new Date();
            let m = norm.match(/\bthang\s*(\d{1,2})(?:\s*[\/\-]\s*|\s+nam\s+)(\d{4})\b/);
            if (m) {
                const month = parseInt(m[1], 10) - 1;
                const year = parseInt(m[2], 10);
                if (month >= 0 && month <= 11) return { month, year };
            }
            if (/\bthang nay\b/.test(norm)) return { month: now.getMonth(), year: now.getFullYear() };
            if (/\bthang (sau|toi)\b/.test(norm)) {
                let mo = now.getMonth() + 1, y = now.getFullYear();
                if (mo > 11) { mo = 0; y += 1; }
                return { month: mo, year: y };
            }
            if (/\bthang truoc\b/.test(norm)) {
                let mo = now.getMonth() - 1, y = now.getFullYear();
                if (mo < 0) { mo = 11; y -= 1; }
                return { month: mo, year: y };
            }
            return null;
        };
        const tryQuickNoteCommand = (rawText) => {
            const norm = normalizeVN(rawText);
            const m = norm.match(/^\s*ghi\s*chu\s*[:\-]?\s*/i);
            if (!m) return null;
            const title = rawText.slice(m[0].length).trim();
            if (!title) return null;
            return { title: capitalizeFirstLetter(title) };
        };

        // Mục 2 (đợt 6): câu hỏi kiểu "tháng 8/2026 có mấy sinh nhật", "tháng này có mấy sự kiện",
        // "tháng sau có mấy giỗ" — tính trực tiếp bằng code (đếm/lọc chính xác tuyệt đối theo đúng
        // tháng/năm được hỏi) thay vì để AI tự đọc và lọc từ cả danh sách JSON dài, vốn dễ đếm nhầm
        // tháng/bỏ sót/lẫn tháng khác khi danh sách nhiều — lý do gây ra kết quả sai đã gặp phải.
        const tryMonthlyEventCountQuery = (rawText, now) => {
            const norm = normalizeVN(rawText);
            if (!/\b(co\s+(may|bao nhieu)|liet ke|thong ke)\b/.test(norm)) return null;
            const base = now || new Date();
            let month = null, year = base.getFullYear();
            const mAbs = norm.match(/\bthang\s+(\d{1,2})(?:\s*[\/\-]\s*(\d{4})|\s+nam\s+(\d{4}))?\b/);
            const mRel = norm.match(/\bthang\s+(nay|sau|toi|truoc)\b/);
            if (mAbs) {
                const mo = parseInt(mAbs[1], 10);
                if (mo < 1 || mo > 12) return null;
                month = mo;
                if (mAbs[2]) year = parseInt(mAbs[2], 10);
                else if (mAbs[3]) year = parseInt(mAbs[3], 10);
            } else if (mRel) {
                let mo = base.getMonth(); // 0-based
                if (mRel[1] === 'sau' || mRel[1] === 'toi') { mo += 1; if (mo > 11) { mo = 0; year += 1; } }
                else if (mRel[1] === 'truoc') { mo -= 1; if (mo < 0) { mo = 11; year -= 1; } }
                month = mo + 1;
            } else {
                return null;
            }
            // Chỉ xử lý cục bộ cho Sự kiện/sinh nhật/giỗ — nếu câu hỏi rõ ràng là về Việc cần làm/Ghi
            // chú thì nhường lại cho AI (cần logic khác: theo deadlineTime/reminderTime, không phải
            // ngày sự kiện), tránh đếm nhầm loại dữ liệu.
            if (/\b(viec|can lam|ghi chu)\b/.test(norm)) return null;
            let filterKeyword = null, kindLabel = 'sự kiện';
            if (/\bsinh nhat\b/.test(norm)) { filterKeyword = 'sinh nhat'; kindLabel = 'sinh nhật'; }
            else if (/\bgio\b/.test(norm)) { filterKeyword = 'gio'; kindLabel = 'giỗ'; } // "giỗ" — lưu ý "giờ" cũng mất dấu thành "gio", nhưng câu hỏi "tháng này có mấy giờ" không hợp lý nên rủi ro nhầm thấp
            return { month, year, filterKeyword, kindLabel };
        };

        // Đợt 3, mục 3: câu có vẻ là lệnh DỜI LỊCH (vd "dời họp ngày mai sang thứ 6", "đổi lịch họp
        // sang 3h chiều"). Yêu cầu ĐỦ CẢ 2: có từ kích hoạt (dời/đổi/chuyển ở đầu) VÀ có chữ "sang" để
        // tách phần "tên sự kiện cần tìm" (trước "sang") khỏi phần "ngày/giờ mới" (sau "sang") — bắt
        // buộc đủ 2 điều kiện giúp giảm hẳn nguy cơ nhận nhầm với câu bình thường khác.
        // QUAN TRỌNG: tìm chữ "sang" trên bản CÓ DẤU gốc (rawText), KHÔNG phải bản đã bỏ dấu — vì
        // "sang" (chuyển tới) và "sáng" (buổi sáng) sau khi bỏ dấu đều thành "sang" giống hệt nhau,
        // tìm trên bản có dấu mới chắc chắn bắt đúng đúng chữ "sang" không dấu, không nhầm với "sáng".
        const tryRescheduleCommand = (rawText) => {
            const sangMatch = rawText.match(/\bsang\b/i);
            if (!sangMatch) return null;
            const beforePart = rawText.slice(0, sangMatch.index).trim();
            const afterPart = rawText.slice(sangMatch.index + sangMatch[0].length).trim();
            if (!afterPart) return null;
            const triggerMatch = beforePart.match(/^(dời|dơi|đổi|doi|chuyển|chuyen)(\s*lịch|\s*lich)?\s+/i);
            if (!triggerMatch) return null;
            let keyword = beforePart.slice(triggerMatch[0].length).trim();
            keyword = keyword.replace(/\b(sự kiện|su kien|việc cần làm|viec can lam|việc|viec|ghi chú|ghi chu)\b/gi, ' ').replace(/\s{2,}/g, ' ').trim();
            if (!keyword) return null;
            // Dọn thêm các từ chỉ ngày/giờ còn sót trong "keyword" (vd "họp ngày mai" → chỉ giữ "họp")
            // bằng cách tái dùng CHÍNH bộ nhận diện ngày/giờ — chỉ lấy phần "title" nó tách ra được,
            // KHÔNG dùng phần ngày/giờ nó tính (ở đây chỉ cần từ khóa gọn để TÌM sự kiện đã có).
            const cleaned = parseVietnameseDateTime(keyword, new Date());
            if (cleaned && cleaned.title) keyword = cleaned.title;
            return { keyword, afterPart };
        };
        // Câu "afterPart" (phần sau "sang") có nhắc tới NGÀY nào không, hay chỉ thuần nói GIỜ (vd "sang
        // 3h chiều" chỉ đổi giờ, giữ nguyên ngày cũ) — dùng để quyết định giữ nguyên ngày/giờ cũ ở phần
        // không được nhắc tới.
        const mentionsDateWord = (text) => /\b(mai|mot|kia|qua|ngay|thang|tuan|thu\s*[2-7]|chu\s*nhat|cn|ram|mung|tet|hom|dau|cuoi|giua|nam)\b/i.test(normalizeVN(text));

        // Mục 3: câu có vẻ là lệnh XÓA — chỉ dùng từ khá chắc chắn ("xóa", "hủy bỏ") để tránh nhầm với
        // tên riêng (vd "Huy") hay các nghĩa khác của "hủy" khi đứng một mình.
        const looksLikeDeleteCommand = (text) => /\b(xoa|huy bo)\b/i.test(normalizeVN(text));
        // Bóc phần "từ khóa để tìm" ra khỏi câu lệnh xóa — bỏ từ kích hoạt và vài từ định danh loại
        // mục thường gặp, giữ lại phần tên để so khớp với dữ liệu hiện có.
        const extractDeleteKeyword = (rawText) => {
            let t = rawText.trim();
            t = t.replace(/^\s*(xóa|xoá|hủy\s*bỏ|huỷ\s*bỏ)\s+/i, '');
            t = t.replace(/\b(sự kiện|su kien|việc cần làm|viec can lam|việc|viec|ghi chú|ghi chu)\b/gi, ' ');
            t = t.replace(/\s{2,}/g, ' ').trim();
            return t;
        };

        // Mục 18: ghi lại (chỉ trên máy, không gửi đi đâu) những câu Smart Engine "chịu thua" phải
        // chuyển qua AI — sau này xem lại để biết nên bổ sung mẫu câu gì cho Tầng 1. Giới hạn 200 câu
        // gần nhất để tránh phình to localStorage vô hạn.
        const logSmartEngineFallback = (rawText) => {
            try {
                const key = 'vt_smart_engine_fallback_log';
                const arr = JSON.parse(localStorage.getItem(key) || '[]');
                arr.push({ text: rawText, at: new Date().toISOString() });
                while (arr.length > 200) arr.shift();
                localStorage.setItem(key, JSON.stringify(arr));
            } catch (e) { /* localStorage đầy/bị chặn — bỏ qua, không quan trọng bằng luồng chính */ }
        };

        // Trả lời trực tiếp (không cần AI) cho câu hỏi đổi Dương lịch <-> Âm lịch của 1 ngày cụ thể,
        // vì đây là phép tính có thể tính chính xác tuyệt đối bằng thuật toán sẵn có của app — để AI
        // tự "suy luận" lịch âm dương rất dễ sai (LLM không giỏi tính toán lịch chính xác).
        const trySolarLunarQuestion = (rawText) => {
            const text = normalizeVN(rawText);
            const m = rawText.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/);
            if (!m) return null;
            const dd = parseInt(m[1], 10), mm = parseInt(m[2], 10);
            let yy = parseInt(m[3], 10);
            if (m[3].length === 2) yy += 2000;
            const testDate = new Date(yy, mm - 1, dd);
            if (testDate.getMonth() !== mm - 1 || testDate.getDate() !== dd) return null; // ngày không hợp lệ

            const mentionsAmLich = /\bam lich\b/.test(text);
            const mentionsDuongLich = /\bduong lich\b/.test(text);
            if (!mentionsAmLich && !mentionsDuongLich) return null; // không nhắc gì tới âm/dương lịch thì bỏ qua

            try {
                // Mặc định hiểu ngày dd/mm/yyyy nhập vào là ngày DƯƠNG LỊCH (cách viết thông thường),
                // trừ khi câu chỉ nhắc "âm lịch" mà không nhắc "dương lịch" ngay trước ngày đó — trường
                // hợp đổi ngược (âm -> dương) hiếm gặp hơn và cần biết năm dương để dò, nên ở đây ưu tiên
                // xử lý chiều phổ biến: Dương lịch -> Âm lịch.
                const lunar = convertSolar2Lunar(dd, mm, yy);
                return `Ngày Dương lịch ${dd}/${mm}/${yy} tương ứng với ngày ${lunar.day}/${lunar.month}${lunar.leap ? ' (tháng nhuận)' : ''}/${lunar.year} Âm lịch.`;
            } catch (e) { return null; }
        };


        // Số ngày nguyên giữa 2 mốc (bỏ qua giờ/phút/giây), dương nếu b sau a, âm nếu b trước a
        const daysBetweenDates = (a, b) => {
            const A = new Date(a.getFullYear(), a.getMonth(), a.getDate());
            const B = new Date(b.getFullYear(), b.getMonth(), b.getDate());
            return Math.round((B - A) / 86400000);
        };
        // Số năm tròn đã trôi qua từ mốc "from" đến mốc "to" (kiểu tính tuổi thông thường)
        const fullYearsBetween = (from, to) => {
            let years = to.getFullYear() - from.getFullYear();
            if (to.getMonth() < from.getMonth() || (to.getMonth() === from.getMonth() && to.getDate() < from.getDate())) years--;
            return years;
        };
        // Dò tìm ngày Dương lịch khớp với 1 ngày Âm lịch (lunarMonth/lunarDay) trong 1 năm Dương cụ thể.
        // Hệ thống chỉ có sẵn hàm chuyển Dương→Âm (convertSolar2Lunar) nên phải dò từng ngày trong năm
        // (dò dư sang đầu năm sau để không bỏ sót trường hợp Tết Âm lịch lệch qua năm Dương kế tiếp).
        const findSolarDateForLunar = (lunarMonth, lunarDay, solarYear) => {
            let d = new Date(solarYear, 0, 1);
            const guard = new Date(solarYear + 1, 0, 15);
            while (d < guard) {
                const l = getLunarDetails(d);
                if (l.day === lunarDay && l.month === lunarMonth) return new Date(d);
                d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
            }
            return null;
        };
        // Ngày xảy ra (Dương lịch) của 1 sự kiện lặp Âm/Dương/Năm ứng với 1 năm Dương cụ thể
        const getEventOccurrenceInYear = (ev, base, solarYear) => {
            if (ev.repeat === 'lunar') {
                if (!ev.lunarMonth || !ev.lunarDay) return null;
                return findSolarDateForLunar(ev.lunarMonth, ev.lunarDay, solarYear);
            }
            // solar / yearly: giữ nguyên ngày/tháng của mốc gốc, chỉ đổi năm
            return new Date(solarYear, base.getMonth(), base.getDate());
        };
        // --- Tính 2 mốc bao quanh "hôm nay" cho 1 sự kiện LẶP (tuần/tháng/năm/dương/âm):
        // lần lặp gần nhất đã qua (past) và lần lặp gần nhất sắp tới (future).
        // Nếu hôm nay trùng đúng lịch lặp thì past === future (cùng 1 ngày = hôm nay).
        // Nếu sự kiện gốc còn chưa tới (chưa từng diễn ra lần nào) thì past = null.
        const getNearestPastFutureOccurrence = (ev, base, today) => {
            const repeat = ev.repeat;
            const startOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const startOfBase = new Date(base.getFullYear(), base.getMonth(), base.getDate());
            if (startOfBase > startOfToday) return { past: null, future: startOfBase };

            if (repeat === 'weekly') {
                const diff = daysBetweenDates(startOfBase, startOfToday);
                const rem = diff % 7;
                const pastOcc = new Date(startOfToday); pastOcc.setDate(pastOcc.getDate() - rem);
                if (rem === 0) return { past: pastOcc, future: pastOcc };
                const futureOcc = new Date(pastOcc); futureOcc.setDate(futureOcc.getDate() + 7);
                return { past: pastOcc, future: futureOcc };
            }
            if (repeat === 'monthly') {
                const day = base.getDate();
                const clampDay = (y, m) => Math.min(day, new Date(y, m + 1, 0).getDate());
                const y0 = startOfToday.getFullYear(), m0 = startOfToday.getMonth();
                const thisMonthOcc = new Date(y0, m0, clampDay(y0, m0));
                const d = daysBetweenDates(thisMonthOcc, startOfToday);
                if (d === 0) return { past: thisMonthOcc, future: thisMonthOcc };
                if (d > 0) {
                    const nm = m0 === 11 ? 0 : m0 + 1, ny = m0 === 11 ? y0 + 1 : y0;
                    return { past: thisMonthOcc, future: new Date(ny, nm, clampDay(ny, nm)) };
                }
                const pm = m0 === 0 ? 11 : m0 - 1, py = m0 === 0 ? y0 - 1 : y0;
                return { past: new Date(py, pm, clampDay(py, pm)), future: thisMonthOcc };
            }
            // yearly / solar / lunar
            const thisYearOcc = getEventOccurrenceInYear(ev, base, startOfToday.getFullYear());
            if (!thisYearOcc) return { past: null, future: null };
            const diff = daysBetweenDates(thisYearOcc, startOfToday);
            if (diff === 0) return { past: thisYearOcc, future: thisYearOcc };
            if (diff > 0) return { past: thisYearOcc, future: getEventOccurrenceInYear(ev, base, startOfToday.getFullYear() + 1) };
            return { past: getEventOccurrenceInYear(ev, base, startOfToday.getFullYear() - 1), future: thisYearOcc };
        };

        // Sinh ra tối đa 2 "dòng" hiển thị (quá khứ gần nhất + tương lai gần nhất) cho 1 sự kiện
        // thuộc nhóm "Sự kiện khác (có lặp)" — không áp dụng cho sinh nhật/giỗ.
        const getOtherRepeatingEventRows = (ev, base, today) => {
            const repeat = ev.repeat;
            const yearlyLike = repeat === 'lunar' || repeat === 'solar' || repeat === 'yearly'; // Lặp Âm / Lặp Dương (và Năm nếu có)
            const unitLabel = repeat === 'weekly' ? 'tuần' : repeat === 'monthly' ? 'tháng' : 'năm';
            const countUnitsSinceBase = (occDate) => {
                if (repeat === 'weekly') return Math.round(daysBetweenDates(base, occDate) / 7);
                if (repeat === 'monthly') return (occDate.getFullYear() - base.getFullYear()) * 12 + (occDate.getMonth() - base.getMonth());
                return occDate.getFullYear() - base.getFullYear();
            };
            const { past, future } = getNearestPastFutureOccurrence(ev, base, today);
            const startOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const rows = [];

            if (past && future && daysBetweenDates(past, future) === 0) {
                rows.push({ occDate: past, subInfo: `Hôm nay tròn ${countUnitsSinceBase(past)} ${unitLabel}`, key: 'today' });
                return rows;
            }
            // Theo yêu cầu: "Sự kiện khác (có lặp)" chỉ hiển thị lần TƯƠNG LAI gần nhất, bỏ hẳn lần
            // quá khứ gần nhất (trước đây hiển thị cả 2).
            if (future) {
                let subInfo;
                if (yearlyLike) {
                    // Lặp Âm/Dương: chưa đủ 1 năm kể từ mốc gốc (lần đầu tiên sắp diễn ra) → chỉ "Còn X ngày nữa";
                    // từ năm thứ 1 trở đi → kèm "kỷ niệm Y năm"
                    const soNgay = daysBetweenDates(startOfToday, future);
                    const namSapToi = future.getFullYear() - base.getFullYear();
                    subInfo = namSapToi >= 1 ? `Còn ${soNgay} ngày nữa kỷ niệm ${namSapToi} năm` : `Còn ${soNgay} ngày nữa`;
                } else {
                    const diffDays = daysBetweenDates(startOfToday, future);
                    subInfo = diffDays < 365 ? `Còn ${diffDays} ngày nữa` : `Còn ${Math.round(diffDays / 30)} tháng nữa`;
                }
                rows.push({ occDate: future, subInfo, key: 'future' });
            }
            return rows;
        };

        // Diễn giải hiển thị phụ (dưới tên sự kiện) cho từng sự kiện trong kết quả tìm kiếm toàn cục.
        // Trả về null nếu không có gì để hiển thị thêm.
        const getEventSearchSubInfo = (ev) => {
            // Với các dòng đã được tách sẵn (quá khứ/tương lai gần nhất của "Sự kiện khác có lặp"),
            // sub-info đã được tính trước — dùng luôn, không tính lại.
            if (ev.__precomputedSubInfo) return ev.__precomputedSubInfo;
            if (!ev.date) return null;
            const base = new Date(ev.date.seconds * 1000);
            const today = new Date();
            const repeat = ev.repeat || 'none';
            const yearlyLike = repeat === 'lunar' || repeat === 'solar' || repeat === 'yearly';
            const titleLower = (ev.title || '').toLowerCase();
            const isBirthday = yearlyLike && titleLower.includes('sinh nhật');
            const isDeathAnniversary = yearlyLike && !isBirthday && titleLower.includes('giỗ');

            // --- Sinh nhật (chỉ áp dụng khi lặp Âm/Dương/Năm và tên chứa "sinh nhật") ---
            if (isBirthday) {
                const thisYearOcc = getEventOccurrenceInYear(ev, base, today.getFullYear());
                if (!thisYearOcc) return null;
                const diff = daysBetweenDates(thisYearOcc, today); // >0: đã qua; 0: hôm nay; <0: chưa tới
                const tuoi = today.getFullYear() - base.getFullYear();
                if (diff === 0) return `Hôm nay tròn ${tuoi} tuổi`;
                if (diff > 0) {
                    // Chưa tròn 1 tuổi (chưa qua sinh nhật đầu tiên) → hiển thị theo số ngày
                    if (tuoi <= 0) return `Đã sinh ${diff} ngày`;
                    return `${tuoi} tuổi`;
                }
                const soNgay = Math.abs(diff);
                const tuoiSapToi = thisYearOcc.getFullYear() - base.getFullYear();
                return `Còn ${soNgay} ngày nữa ${tuoiSapToi} tuổi`;
            }

            // --- Ngày giỗ (chỉ áp dụng khi lặp Âm/Dương/Năm và tên chứa "giỗ") ---
            if (isDeathAnniversary) {
                const thisYearOcc = getEventOccurrenceInYear(ev, base, today.getFullYear());
                if (!thisYearOcc) return null;
                const diff = daysBetweenDates(thisYearOcc, today);
                const soNam = today.getFullYear() - base.getFullYear();
                if (diff === 0) return `Hôm nay đã mất tròn ${soNam} năm`;
                if (diff > 0) {
                    // Chưa tròn 1 năm kể từ ngày mất → hiển thị theo số ngày
                    if (soNam <= 0) return `Đã mất ${diff} ngày`;
                    return `Đã mất ${soNam} năm`;
                }
                const soNgay = Math.abs(diff);
                const namSapToi = thisYearOcc.getFullYear() - base.getFullYear();
                return `Còn ${soNgay} ngày nữa Giỗ ${namSapToi} năm`;
            }

            // --- Sự kiện khác (không lặp): chỉ có đúng 1 mốc thời gian duy nhất ---
            if (repeat === 'none') {
                const diffDays = daysBetweenDates(base, today);
                if (diffDays === 0) {
                    const soNam = fullYearsBetween(base, today);
                    return `Hôm nay tròn ${soNam} năm`;
                }
                if (diffDays > 0) {
                    if (diffDays < 365) return `${diffDays} ngày trước`;
                    const soNam = fullYearsBetween(base, today);
                    return `${soNam} năm trước`;
                }
                const soNgayConLai = Math.abs(diffDays);
                if (soNgayConLai < 365) return `Còn ${soNgayConLai} ngày nữa`;
                const soNam = fullYearsBetween(today, base);
                return `Còn hơn ${soNam} năm nữa`;
            }

            // --- Sự kiện khác (có lặp): trường hợp fallback (không đi qua bước tách dòng ở trên) ---
            const rows = getOtherRepeatingEventRows(ev, base, today);
            if (rows.length === 0) return null;
            return rows[0].subInfo;
        };

        // --- GLOBAL SEARCH MODAL ---
        // ─── Skeleton loading dùng chung (thay cho chữ "Đang tải...") ───────
        const Skeleton = ({ className = '' }) => <div className={`skeleton rounded ${className}`} aria-hidden="true" />;

        // Khung xương mô phỏng giao diện chính của app khi đang chờ xác thực đăng nhập
        const AppSkeleton = () => (
            <div className="flex flex-col h-screen max-w-md mx-auto bg-slate-50 overflow-hidden" role="status" aria-label="Đang tải ứng dụng">
                <div className="p-4 flex items-center justify-between border-b bg-white shrink-0">
                    <Skeleton className="h-6 w-32" />
                    <div className="flex gap-2"><Skeleton className="h-8 w-8 !rounded-full" /><Skeleton className="h-8 w-8 !rounded-full" /></div>
                </div>
                <div className="p-4 space-y-3 flex-1">
                    <Skeleton className="h-24 w-full" />
                    <div className="grid grid-cols-7 gap-2">
                        {Array.from({ length: 21 }).map((_, i) => <Skeleton key={i} className="h-9 w-full" />)}
                    </div>
                </div>
                <div className="p-3 flex justify-around border-t bg-white shrink-0">
                    {Array.from({ length: 4 }).map((_, i) => <Skeleton key={i} className="h-8 w-8 !rounded-full" />)}
                </div>
                <span className="sr-only">Đang tải ứng dụng, vui lòng đợi...</span>
            </div>
        );

        // Khung xương gọn cho các modal/khối nội dung nhỏ (form mật khẩu, danh sách...)
        const InlineSkeleton = ({ lines = 3 }) => (
            <div className="p-6 space-y-3" role="status" aria-label="Đang tải">
                {Array.from({ length: lines }).map((_, i) => (
                    <Skeleton key={i} className={`h-4 ${i === lines - 1 ? 'w-2/3' : 'w-full'}`} />
                ))}
                <span className="sr-only">Đang tải, vui lòng đợi...</span>
            </div>
        );


        // ─── Ô nhập có gợi ý tự động (dựa trên các tiêu đề/nội dung đã dùng trước đó) ───────
        // Ô nhập có gợi ý tự động — dùng position:fixed (tính toạ độ từ input) thay vì absolute,
        // để khung gợi ý không bị các modal cha có "overflow-y-auto" cắt mất (lỗi trước đây khiến
        // gợi ý không bao giờ hiển thị được khi ô nhập nằm trong vùng cuộn của form).
        // ─── Thanh định dạng chữ dùng chung (Đậm/Nghiêng/Gạch chân/Font/Cỡ chữ/Màu chữ) ───────
        // Áp dụng lên vùng contentEditable đang được targetRef trỏ tới, thông qua execCommand —
        // đây là API trình duyệt chuẩn cho phép: nếu ĐANG BÔI ĐEN 1 đoạn chữ cũ thì chỉ định dạng
        // riêng đoạn đó; nếu KHÔNG bôi đen (chỉ đặt con trỏ) thì bật/tắt "trạng thái đang gõ", chữ
        // MỚI gõ tiếp theo sẽ tự mang định dạng đó — đúng theo yêu cầu.
        const RICH_FONT_SIZES = [12, 13, 14, 16, 18, 20, 24, 28, 32];
        // Bọc vùng đang được bôi đen (hoặc đúng vị trí con trỏ nếu chưa bôi đen) bằng 1 thẻ <span
        // style="..."> — dùng thao tác Range thủ công thay vì document.execCommand('fontName'/
        // 'fontSize'). Lý do: 2 lệnh execCommand đó có lỗi vặt của trình duyệt — khi vùng đang chọn
        // đã có sẵn Đậm/Nghiêng/Gạch chân, chúng hay "viết đè" làm mất các định dạng đó đi. Bọc span
        // thủ công chỉ thêm đúng 1 lớp định dạng mới bên ngoài, giữ nguyên mọi thẻ con bên trong.
        //
        // clearConflicting (tùy chọn): sau khi bọc xong, dọn sạch đúng thuộc tính vừa áp (vd
        // font-size) trên MỌI thẻ con nằm bên trong — vì CSS luôn ưu tiên thẻ gần nội dung nhất, nếu
        // trong vùng bôi đen có sẵn 1 đoạn nhỏ đã được set cỡ chữ khác từ trước, đoạn đó sẽ "đè" lại
        // cỡ chữ mới dù đã bọc span ở ngoài. Dọn sạch đảm bảo TOÀN BỘ vùng chọn đồng loạt đổi sang
        // đúng định dạng vừa chọn, bất kể trước đó từng đoạn đang ở định dạng gì.
        const wrapSelectionWithStyle = (targetEl, applyStyle, clearConflicting) => {
            if (!targetEl) return;
            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0) return;
            const range = sel.getRangeAt(0);
            if (!targetEl.contains(range.commonAncestorContainer)) return;
            const span = document.createElement('span');
            applyStyle(span.style);
            if (range.collapsed) {
                // Con trỏ đứng yên, không bôi đen gì — chèn 1 khoảng trắng-không-độ-rộng làm chỗ giữ,
                // đặt con trỏ vào bên trong span đó để chữ gõ tiếp theo tự mang định dạng mới.
                span.appendChild(document.createTextNode('\u200B'));
                range.insertNode(span);
                const newRange = document.createRange();
                newRange.setStart(span.firstChild, 1);
                newRange.collapse(true);
                sel.removeAllRanges();
                sel.addRange(newRange);
            } else {
                try {
                    range.surroundContents(span);
                } catch (e) {
                    // Vùng chọn cắt ngang nhiều thẻ lồng nhau (surroundContents không xử lý được) —
                    // tách nội dung ra rồi bọc lại, vẫn giữ nguyên cấu trúc thẻ con bên trong.
                    const frag = range.extractContents();
                    span.appendChild(frag);
                    range.insertNode(span);
                }
                if (clearConflicting) {
                    span.querySelectorAll('*').forEach(node => clearConflicting(node));
                }
                const newRange = document.createRange();
                newRange.selectNodeContents(span);
                sel.removeAllRanges();
                sel.addRange(newRange);
            }
        };
        const RichTextToolbar = ({ targetRef, onChanged, className = '' }) => {
            // Trạng thái "đang bật" của Đậm/Nghiêng/Gạch chân tại đúng vị trí con trỏ/vùng bôi đen
            // hiện tại — dùng để tô tối nút tương ứng (yêu cầu: bấm vào nút nào thì nút đó tô tối).
            const [activeStates, setActiveStates] = useState({ bold: false, italic: false, underline: false });
            const updateActiveStates = () => {
                try {
                    setActiveStates({
                        bold: document.queryCommandState('bold'),
                        italic: document.queryCommandState('italic'),
                        underline: document.queryCommandState('underline'),
                    });
                } catch (e) { /* một số trình duyệt cũ không hỗ trợ queryCommandState — bỏ qua */ }
            };
            // Theo dõi con trỏ/vùng bôi đen di chuyển trong đúng ô đang soạn thảo (targetRef) để cập
            // nhật lại trạng thái tô tối cho khớp (ví dụ đặt con trỏ vào đoạn chữ đậm sẵn có).
            useEffect(() => {
                const handleSelectionChange = () => {
                    if (targetRef && targetRef.current && document.activeElement === targetRef.current) {
                        updateActiveStates();
                    }
                };
                document.addEventListener('selectionchange', handleSelectionChange);
                return () => document.removeEventListener('selectionchange', handleSelectionChange);
            }, [targetRef]);

            // Đậm/Nghiêng/Gạch chân: vẫn dùng execCommand riêng cho 3 lệnh này (hoạt động ổn định,
            // trình duyệt tự lồng đúng thẻ <b>/<i>/<u> và tự theo dõi trạng thái bật/tắt qua
            // queryCommandState). CHỈ Font/Cỡ chữ mới đổi sang cách bọc span thủ công ở trên.
            const exec = (cmd, value) => {
                if (targetRef && targetRef.current) targetRef.current.focus();
                document.execCommand(cmd, false, value);
                updateActiveStates();
                if (onChanged) onChanged();
            };
            // onMouseDown preventDefault: tránh bấm nút làm mất vùng đang bôi đen / mất focus khỏi
            // ô soạn thảo trước khi lệnh định dạng kịp áp dụng. CHỈ dùng cho nút bấm (button) —
            // KHÔNG dùng cho <select>/<input> chọn Font, Cỡ chữ (xem savedRangeRef bên dưới), vì
            // preventDefault trên mousedown của <select>/<input> sẽ chặn luôn việc mở dropdown/gõ số.
            const stop = (e) => e.preventDefault();

            // Lưu lại vùng bôi đen hiện tại trước khi mở Font/Cỡ chữ, vì việc chuyển focus sang
            // <select>/<input> khiến ô soạn thảo MẤT vùng đang bôi đen. Khi người dùng chọn/gõ xong,
            // khôi phục lại đúng vùng đó rồi mới áp dụng định dạng.
            const savedRangeRef = useRef(null);
            const saveSelection = () => {
                const sel = window.getSelection();
                if (sel && sel.rangeCount > 0 && targetRef && targetRef.current && targetRef.current.contains(sel.anchorNode)) {
                    savedRangeRef.current = sel.getRangeAt(0).cloneRange();
                }
            };
            const restoreSelection = () => {
                if (targetRef && targetRef.current) targetRef.current.focus();
                if (savedRangeRef.current) {
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(savedRangeRef.current);
                }
            };

            // Font/Cỡ chữ đang chọn — giữ lại để hiển thị đúng ngay trong ô, không tự xóa về rỗng nữa.
            // Hiện sẵn 1 giá trị mặc định thay vì để ô trống/mờ chữ gợi ý — theo yêu cầu "hiển thị
            // luôn font và cỡ chữ mặc định trong ô".
            const [selectedFont, setSelectedFont] = useState('Times New Roman');
            const [selectedSize, setSelectedSize] = useState('16');
            // Danh sách gợi ý cỡ chữ: dùng menu tự làm (thay vì <datalist>) vì <datalist> của trình
            // duyệt tự lọc gợi ý theo đúng những gì đang gõ trong ô — khi ô đã có sẵn 1 số, bấm mũi
            // tên chỉ ra đúng mỗi số đó (coi như không xổ ra gì), phải xóa trắng mới thấy đủ danh sách.
            // Menu tự làm luôn hiện đủ danh sách bất kể ô đang có gì.
            const [showSizeMenu, setShowSizeMenu] = useState(false);
            const sizeMenuWrapRef = useRef(null);
            useEffect(() => {
                if (!showSizeMenu) return;
                const handleClickOutside = (e) => {
                    if (sizeMenuWrapRef.current && !sizeMenuWrapRef.current.contains(e.target)) setShowSizeMenu(false);
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, [showSizeMenu]);

            const applyFont = (name) => {
                restoreSelection();
                wrapSelectionWithStyle(
                    targetRef && targetRef.current,
                    style => { style.fontFamily = name; },
                    node => { if (node.style) node.style.fontFamily = ''; if (node.tagName === 'FONT') node.removeAttribute('face'); }
                );
                if (onChanged) onChanged();
            };
            const applySize = (raw) => {
                const v = parseInt(raw, 10);
                if (!v || v < 6 || v > 200) return; // bỏ qua giá trị rỗng/không hợp lệ
                restoreSelection();
                wrapSelectionWithStyle(
                    targetRef && targetRef.current,
                    style => { style.fontSize = v + 'px'; },
                    node => { if (node.style) node.style.fontSize = ''; if (node.tagName === 'FONT') node.removeAttribute('size'); }
                );
                if (onChanged) onChanged();
            };

            // Tô tối màu xám khi nút Đậm/Nghiêng/Gạch chân đang bật (trước đây tô đen).
            const activeBtnClass = 'bg-slate-400 text-white border-slate-400';
            const idleBtnClass = 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100';

            // Bố cục: các nút/ô KHÔNG xuống dòng và KHÔNG cuộn ngang — B/I/U và ô màu giữ kích thước
            // cố định nhỏ gọn (đủ để bấm), còn Font/Cỡ chữ dùng flex-1 để tự co giãn theo đúng khoảng
            // trống còn lại của màn hình, vừa khít dù điện thoại rộng hay hẹp.
            return (
                <div className={`flex items-center gap-1 flex-nowrap w-full ${className}`}>
                    <button type="button" onMouseDown={stop} onClick={() => exec('bold')} title="Đậm"
                        className={`w-6 h-6 shrink-0 flex items-center justify-center rounded border font-bold text-xs transition ${activeStates.bold ? activeBtnClass : idleBtnClass}`}>B</button>
                    <button type="button" onMouseDown={stop} onClick={() => exec('italic')} title="Nghiêng"
                        className={`w-6 h-6 shrink-0 flex items-center justify-center rounded border italic text-xs transition ${activeStates.italic ? activeBtnClass : idleBtnClass}`}>I</button>
                    <button type="button" onMouseDown={stop} onClick={() => exec('underline')} title="Gạch chân"
                        className={`w-6 h-6 shrink-0 flex items-center justify-center rounded border underline text-xs transition ${activeStates.underline ? activeBtnClass : idleBtnClass}`}>U</button>
                    <select value={selectedFont} onMouseDown={saveSelection}
                        onChange={e => { const v = e.target.value; setSelectedFont(v); if (v) applyFont(v); }}

                        <option value="Times New Roman">Times New Roman</option>

                    {/* Cỡ chữ: ô nhập số (không còn chữ "px", đã bỏ mũi tên tăng/giảm mặc định, tự bôi
                        đen số khi bấm vào để gõ đè) + nút mũi tên riêng luôn xổ ra đủ danh sách gợi ý. */}
                    <div ref={sizeMenuWrapRef} className="relative flex-1 min-w-0 flex items-stretch">
                        <input type="number" min="6" max="200" placeholder="Cỡ"

                            onChange={e => setSelectedSize(e.target.value)}
                            onBlur={e => applySize(e.target.value)}
                            onKeyDown={e => { if (e.key === 'Enter') { applySize(e.target.value); e.target.blur(); } }}
