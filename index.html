                if (looksLikeQuestion(trimmed)) {
                    setStep('answer');
                    setAnswerText('');
                    setDisplayedAnswer('');
                    setUsedAI(true);
                    try {
                        const finalAnswer = await AIService.answerQuestionStream(trimmed, context, config, conversationHistory, (piece, fullSoFar) => {
                            setAnswerText(fullSoFar);
                        });
                        // Luôn gán rõ ràng câu trả lời cuối cùng vào màn hình — nếu streaming thất bại
                        // giữa chừng, AIService tự âm thầm chuyển sang gọi lại KHÔNG streaming (không gọi
                        // onChunk), nên nếu không gán ở đây, answerText sẽ vẫn trống trơn dù đã có kết quả.
                        setAnswerText(finalAnswer);
                        // Mục 3: lưu lại lượt hỏi-đáp này để hỏi tiếp vẫn hiểu đúng ngữ cảnh — chỉ giữ
                        // 10 lượt gần nhất, tránh prompt phình to vô hạn qua nhiều câu hỏi liên tiếp.
                        setConversationHistory(prev => [...prev, { role: 'user', text: trimmed }, { role: 'assistant', text: finalAnswer }].slice(-10));
                    } catch (e) {
                        setErrorMsg(e.message || 'Có lỗi khi gọi AI, vui lòng thử lại.');
                        setStep('error');
                    }
                    return;
                }
                setStep('loading');
                try {
                    const result = await AIService.parseNaturalLanguage(trimmed, context, config, conversationHistory);
                    if (result.intent === 'tim_kiem') {
                        setAnswerText(result.answer);
                        setDisplayedAnswer('');
                        setConversationHistory(prev => [...prev, { role: 'user', text: trimmed }, { role: 'assistant', text: result.answer }].slice(-10));
                        setStep('answer');
                        return;
                    }
                    let date = null;
                    if (result.date) {
                        const [y, mo, d] = result.date.split('-').map(Number);
                        if (y && mo && d) {
                            date = new Date(y, mo - 1, d);
                            if (result.time) {
                                const [hh, mm] = result.time.split(':').map(Number);
                                if (!isNaN(hh)) date.setHours(hh, mm || 0, 0, 0);
                            }
                        }
                    }
                    applyResult(result.loai, result.title, date, !!result.time, !!result.reminder, true);
                } catch (e) {
                    setErrorMsg(e.message || 'Có lỗi khi gọi AI, vui lòng thử lại hoặc điền form thủ công.');
                    setStep('error');
                }
            };

            // Mục 2 (đợt 6): tính TRỰC TIẾP danh sách sự kiện rơi vào đúng tháng/năm được hỏi — dùng
            // đúng logic getEventOccurrenceInYear đã có sẵn (tính cả sự kiện lặp âm/dương/hàng năm),
            // chính xác tuyệt đối vì code tự đếm, không nhờ AI tự lọc từ danh sách JSON dễ sai.
            const answerMonthlyEventQuery = async ({ month, year, filterKeyword, kindLabel }) => {
                const evSnap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'events'));
                const matched = [];
                evSnap.docs.forEach(d => {
                    const data = d.data();
                    const base = data.date ? new Date(data.date.seconds * 1000) : null;
                    if (!base) return;
                    const repeat = data.repeat || 'none';
                    let occ = null;
                    if (repeat === 'lunar' || repeat === 'solar' || repeat === 'yearly') {
                        occ = getEventOccurrenceInYear({ repeat, lunarMonth: data.lunarMonth, lunarDay: data.lunarDay }, base, year);
                    } else if (repeat === 'none') {
                        if (base.getFullYear() === year) occ = base;
                    }
                    // weekly/monthly repeat không có khái niệm "chỉ 1 lần trong năm" rõ ràng — bỏ qua khỏi kiểu liệt kê theo tháng/năm này
                    if (!occ || isNaN(occ.getTime())) return;
                    if (occ.getMonth() + 1 !== month || occ.getFullYear() !== year) return;
                    const title = stripHtml(data.title || '') || '(không có tiêu đề)';
                    if (filterKeyword && !normalizeVN(title).includes(filterKeyword)) return;
                    matched.push({ title, date: occ });
                });
                matched.sort((a, b) => a.date - b.date);
                const monthLabel = `Tháng ${month}/${year}`;
                if (matched.length === 0) return `${monthLabel} không có ${kindLabel} nào.`;
                const lines = matched.map(m => `- ${m.title}, ngày ${String(m.date.getDate()).padStart(2, '0')}/${String(m.date.getMonth() + 1).padStart(2, '0')}/${m.date.getFullYear()}`);
                return `${monthLabel} có ${matched.length} ${kindLabel}:\n` + lines.join('\n');
            };

            // Mục 3: tìm các Sự kiện/Việc cần làm/Ghi chú có tiêu đề khớp với từ khóa, để xóa cục bộ —
            // không cần AI, chỉ cần so khớp chuỗi (không dấu, không phân biệt hoa/thường) với dữ liệu
            // đã có. Giới hạn 8 kết quả để danh sách gọn, dễ chọn.
            const searchItemsToDelete = async (keyword) => {
                const kw = normalizeVN(keyword);
                if (!kw) return [];
                const results = [];
                const [evSnap, tdSnap, ntSnap] = await Promise.all([
                    getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'events')),
                    getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'todos')),
                    getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'notes')),
                ]);
                evSnap.docs.forEach(d => {
                    const data = d.data();
                    const plain = stripHtml(data.title || '');
                    if (plain && normalizeVN(plain).includes(kw)) {
                        results.push({ id: d.id, col: 'events', loai: 'su_kien', title: plain, date: data.date ? new Date(data.date.seconds * 1000) : null });
                    }
                });
                tdSnap.docs.forEach(d => {
                    const data = d.data();
                    const plain = stripHtml(data.text || '');
                    if (plain && normalizeVN(plain).includes(kw)) {
                        results.push({ id: d.id, col: 'todos', loai: 'viec_can_lam', title: plain, date: data.deadlineTime ? new Date(data.deadlineTime.seconds * 1000) : null });
                    }
                });
                ntSnap.docs.forEach(d => {
                    const data = d.data();
                    const plain = stripHtml(data.title || '') || (data.content || '').slice(0, 40);
                    if (plain && normalizeVN(plain).includes(kw)) {
                        results.push({ id: d.id, col: 'notes', loai: 'ghi_chu', title: plain, date: null });
                    }
                });
                return results.slice(0, 8);
            };
            const handleConfirmDelete = async () => {
                if (!deletePick) return;
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, deletePick.col, deletePick.id));
                    toast.success('Đã xóa!', { position: 'top-center' });
                    setDeleteResults(prev => prev.filter(it => it.id !== deletePick.id));
                    setDeletePick(null);
                    setStep(deleteResults.length > 1 ? 'delete-pick' : 'input');
                    if (deleteResults.length <= 1) { setText(''); onDone(); }
                } catch (e) {
                    toast.error('Lỗi khi xóa: ' + (e.message || 'không xác định'), { position: 'top-center' });
                }
            };

            // Đợt 3, mục 3: tính ngày/giờ MỚI cho lệnh dời lịch — kết hợp phần đã phân tích được từ câu
            // lệnh (parsed) với ngày/giờ CŨ của mục đang dời (oldDate): nếu câu chỉ nói ngày (không nói
            // giờ) thì GIỮ NGUYÊN giờ cũ; nếu câu chỉ nói giờ (không nói ngày) thì GIỮ NGUYÊN ngày cũ.
            const computeRescheduleNewDate = (oldDate, afterPart, parsed) => {
                const hasDateWord = mentionsDateWord(afterPart);
                let newDate;
                if (hasDateWord && parsed.hasTime) newDate = new Date(parsed.date);
                else if (hasDateWord && !parsed.hasTime) { newDate = new Date(parsed.date); if (oldDate) newDate.setHours(oldDate.getHours(), oldDate.getMinutes(), 0, 0); }
                else if (!hasDateWord && parsed.hasTime) { newDate = oldDate ? new Date(oldDate) : new Date(parsed.date); newDate.setHours(parsed.date.getHours(), parsed.date.getMinutes(), 0, 0); }
                else newDate = new Date(parsed.date);
                return newDate;
            };
            const [rescheduleNewDate, setRescheduleNewDate] = useState(null);
            const pickRescheduleTarget = (item, afterPart) => {
                const parsed = parseVietnameseDateTime(afterPart, new Date());
                if (!parsed) {
                    setErrorMsg(`Tìm thấy "${item.title}" nhưng không hiểu được ngày/giờ mới ("${afterPart}"). Hãy thử lại với mẫu như "sang thứ 6" hoặc "sang 3h chiều".`);
                    setStep('error');
                    return;
                }
                setReschedulePick(item);
                setRescheduleNewDate(computeRescheduleNewDate(item.date, afterPart, parsed));
                setStep('reschedule-confirm');
            };
            const handleConfirmReschedule = async () => {
                if (!reschedulePick || !rescheduleNewDate) return;
                try {
                    const field = reschedulePick.col === 'events' ? 'date' : (reschedulePick.col === 'todos' ? 'deadlineTime' : 'reminderTime');
                    await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, reschedulePick.col, reschedulePick.id), { [field]: Timestamp.fromDate(rescheduleNewDate) });
                    toast.success('Đã dời lịch!', { position: 'top-center' });
                    setText(''); setReschedulePick(null); setRescheduleNewDate(null);
                    onDone();
                } catch (e) {
                    toast.error('Lỗi khi dời lịch: ' + (e.message || 'không xác định'), { position: 'top-center' });
                }
            };

            // Đợt 3, mục 4: kiểm tra xem giờ vừa nhận diện có TRÙNG (trong vòng 60 phút) với 1 sự kiện
            // đã có sẵn hay không — chỉ kiểm tra khi có giờ cụ thể (không kiểm tra nếu chỉ có ngày,
            // vì trùng NGÀY là chuyện rất bình thường, không cần cảnh báo).
            const checkTimeConflict = async (date, hasTime, excludeId) => {
                if (!date || !hasTime) return null;
                try {
                    const snap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'events'));
                    let found = null;
                    snap.docs.forEach(d => {
                        if (excludeId && d.id === excludeId) return;
                        const data = d.data();
                        if (!data.date) return;
                        const evDate = new Date(data.date.seconds * 1000);
                        if (evDate.getFullYear() === date.getFullYear() && evDate.getMonth() === date.getMonth() && evDate.getDate() === date.getDate()
                            && Math.abs(evDate.getTime() - date.getTime()) < 60 * 60000) {
                            found = { title: stripHtml(data.title || ''), date: evDate };
                        }
                    });
                    return found;
                } catch (e) { return null; }
            };

            const handleSubmit = async () => {
                setErrorMsg('');
                const trimmed = text.trim();
                if (!trimmed) return;

                // TẦNG 0a: câu hỏi đổi Dương lịch <-> Âm lịch của 1 ngày cụ thể — trả lời trực tiếp bằng
                // thuật toán sẵn có của app, chính xác tuyệt đối, không cần gọi AI.
                const lunarAnswer = trySolarLunarQuestion(trimmed);
                if (lunarAnswer) { setAnswerText(lunarAnswer); setDisplayedAnswer(''); setUsedAI(false); setStep('answer'); return; }

                // TẦNG 0b (mục 2, đợt 6): câu hỏi "tháng X có mấy sinh nhật/sự kiện/giỗ" — đếm và liệt
                // kê TRỰC TIẾP bằng code (chính xác tuyệt đối theo đúng tháng/năm hỏi), không nhờ AI tự
                // lọc từ danh sách JSON dài (đã từng bị đếm nhầm/lẫn sang tháng khác).
                const monthlyQuery = tryMonthlyEventCountQuery(trimmed, new Date());
                if (monthlyQuery) {
                    setStep('loading');
                    try {
                        const answer = await answerMonthlyEventQuery(monthlyQuery);
                        setAnswerText(answer);
                        setDisplayedAnswer('');
                        setUsedAI(false);
                        setConversationHistory(prev => [...prev, { role: 'user', text: trimmed }, { role: 'assistant', text: answer }].slice(-10));
                        setStep('answer');
                    } catch (e) {
                        setErrorMsg('Có lỗi khi thống kê: ' + (e.message || 'không xác định'));
                        setStep('error');
                    }
                    return;
                }

                // Mục 2: lệnh "ghi chú: ..." — tạo thẳng ghi chú, không cần ngày/giờ, xử lý trước tất cả
                // các tầng khác vì đây là ý định rất rõ ràng, không cần đoán.
                const quickNote = tryQuickNoteCommand(trimmed);
                if (quickNote) { applyResult('ghi_chu', quickNote.title, null, false, false, false, 'none'); return; }

                // Mục 3: lệnh xóa — tìm cục bộ trong dữ liệu đã có, không cần AI.
                if (looksLikeDeleteCommand(trimmed)) {
                    const keyword = extractDeleteKeyword(trimmed);
                    setStep('delete-loading');
                    try {
                        const results = await searchItemsToDelete(keyword);
                        if (!results.length) { setStep('delete-none'); return; }
                        setDeleteResults(results);
                        if (results.length === 1) { setDeletePick(results[0]); setStep('delete-confirm'); }
                        else setStep('delete-pick');
                    } catch (e) {
                        setErrorMsg('Có lỗi khi tìm mục để xóa: ' + (e.message || 'không xác định'));
                        setStep('error');
                    }
                    return;
                }

                // Đợt 3, mục 3: lệnh dời lịch — tìm cục bộ mục cần dời, rồi tự tính ngày/giờ mới bằng
                // chính Smart Engine (không cần AI).
                const reschedule = tryRescheduleCommand(trimmed);
                if (reschedule) {
                    setRescheduleAfterPart(reschedule.afterPart);
                    setStep('reschedule-loading');
                    try {
                        const results = await searchItemsToDelete(reschedule.keyword); // dùng chung hàm tìm kiếm với lệnh xóa
                        if (!results.length) { setStep('reschedule-none'); return; }
                        setRescheduleResults(results);
                        if (results.length === 1) pickRescheduleTarget(results[0], reschedule.afterPart);
                        else setStep('reschedule-pick');
                    } catch (e) {
                        setErrorMsg('Có lỗi khi tìm mục để dời lịch: ' + (e.message || 'không xác định'));
                        setStep('error');
                    }
                    return;
                }

                // TẦNG 1: Smart Engine (cục bộ, không tốn API, không cần mạng) — CHỈ áp dụng khi câu
                // không có vẻ là 1 câu hỏi. Lý do: 1 câu hỏi vẫn có thể chứa sẵn 1 ngày cụ thể (vd
                // "dương lịch 3/8/1976 thì âm lịch là ngày nào?") — nếu để Smart Engine xử lý trước sẽ
                // hiểu nhầm thành lệnh tạo sự kiện ngày 3/8/1976, trong khi đây rõ ràng là câu hỏi cần
                // AI/tính toán trả lời, không phải lệnh tạo mới. Ưu tiên tìm kiếm/hỏi đáp trước, tạo
                // mới sau, đúng theo yêu cầu.
                if (!looksLikeQuestion(trimmed)) {
                    const smart = parseVietnameseDateTime(trimmed, new Date());
                    if (smart) {
                        // Mục 1: có vẻ là lời NHẮC (nhắc/nhớ/đừng quên) → tạo "Việc cần làm" thay vì
                        // luôn luôn tạo "Sự kiện" như trước.
                        const loai = looksLikeTodoCommand(trimmed) ? 'viec_can_lam' : 'su_kien';
                        applyResult(loai, smart.title, smart.date, smart.hasTime, false, false, smart.repeat, smart.reminderOffsetMinutes, smart.mentionedBuoi);
                        return;
                    }
                }

                // TẦNG 2: cần AI. Nếu AI chưa sẵn sàng (tắt / chưa cấu hình / thiếu key) → báo rõ, không chặn người dùng
                if (!aiUsable) {
                    logSmartEngineFallback(trimmed); // Mục 18: ghi lại câu chịu thua để sau này biết bổ sung mẫu gì
                    setErrorMsg('Chưa nhận diện được ngày/giờ trong câu này bằng quy tắc có sẵn. Hãy thử theo mẫu như "Họp lúc 7h30 sáng thứ Hai tuần sau", "Đi khám ngày mai lúc 15h"... — hoặc bật AI trong Cài đặt ✨ Trợ lý AI để hỏi/tìm kiếm dữ liệu hoặc tạo Việc cần làm/Ghi chú.');
                    setStep('error');
                    return;
                }
                logSmartEngineFallback(trimmed); // Mục 18: ghi lại câu phải chuyển qua AI

                // Phản hồi ngay lập tức trong lúc lấy dữ liệu ngữ cảnh (có thể mất vài giây tuỳ mạng) —
                // trước đây màn hình đứng yên không có gì thay đổi trong lúc chờ, trông như bị treo.
                setStep('loading');
                try {
                    const context = await fetchMinimalContext();
                    setPendingContext(context);
                    if (privacy.confirmBeforeSend) setStep('confirm-send');
                    else await callAIWithContext(context);
                } catch (e) {
                    setErrorMsg('Có lỗi khi chuẩn bị dữ liệu gửi AI: ' + (e.message || 'không xác định') + '. Vui lòng thử lại.');
                    setStep('error');
                }
            };

            // Nếu đã có sẵn câu (gõ từ ô tìm kiếm rồi bấm Enter/icon ✨), tự động phân tích ngay,
            // không bắt người dùng phải bấm "Phân tích" thêm 1 lần nữa.
            useEffect(() => {
                if (text.trim() && !autoRanRef.current) {
                    autoRanRef.current = true;
                    handleSubmit();
                }
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);

            const computeDateFromForm = () => {
                if (!form.dateStr || !isValidDateInputStr(form.dateStr)) return null;
                const d = new Date(form.dateStr);
                if (form.timeStr) {
                    const [hh, mm] = form.timeStr.split(':').map(Number);
                    d.setHours(hh, mm, 0, 0);
                } else {
                    d.setHours(0, 0, 0, 0);
                }
                return d;
            };
            // Mục 5: tính đúng thời điểm cần bắn thông báo nhắc — lùi lại đúng "reminderOffset" phút so
            // với giờ diễn ra (mặc định 0 = đúng giờ, như trước).
            const computeReminderTime = (date) => new Date(date.getTime() - (form.reminderOffset || 0) * 60000);

            const doSave = async () => {
                const date = computeDateFromForm();
                setSaving(true);
                try {
                    if (form.loai === 'su_kien') {
                        const data = { title: form.title.trim(), date: Timestamp.fromDate(date), repeat: form.repeat || 'none' };
                        if (form.reminder) { data.reminderTime = Timestamp.fromDate(computeReminderTime(date)); data.pushSent = false; }
                        await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'events'), data);
                        toast.success("Đã thêm sự kiện!", { position: "top-center" });
                    } else if (form.loai === 'viec_can_lam') {
                        const data = { text: form.title.trim(), pushSent: false, reminderTime: (form.reminder && date) ? Timestamp.fromDate(computeReminderTime(date)) : null, deadlineTime: date ? Timestamp.fromDate(date) : null };
                        await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'todos'), data);
                        toast.success("Đã thêm việc cần làm!", { position: "top-center" });
                    } else {
                        const data = { title: form.title.trim(), content: '', items: [], isChecklist: false, reminderTime: (form.reminder && date) ? Timestamp.fromDate(computeReminderTime(date)) : null, pushSent: false, color: '#FEFCE8', pinned: false, labels: [], updatedAt: serverTimestamp() };
                        await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'notes'), data);
                        toast.success("Đã thêm ghi chú!", { position: "top-center" });
                    }
                    onDone();
                } catch (e) {
                    toast.error("Lỗi khi lưu: " + (e.message || 'không xác định'), { position: "top-center" });
                } finally {
                    setSaving(false);
                }
            };

            // Mục 4: trước khi lưu 1 Sự kiện có giờ cụ thể, kiểm tra xem có bị trùng (trong vòng 60
            // phút) với 1 sự kiện đã có sẵn không — nếu có, hỏi lại 1 lần cho chắc trước khi lưu tiếp.
            // skipConflictCheck=true khi người dùng đã xác nhận "Vẫn lưu" ở bước cảnh báo.
            const handleSave = async (skipConflictCheck) => {
                if (!form.title.trim()) {
                    toast.error("Vui lòng nhập tiêu đề/nội dung.", { position: "top-center" });
                    return;
                }
                if (form.loai === 'su_kien' && !isValidDateInputStr(form.dateStr)) {
                    toast.error("Sự kiện cần có ngày hợp lệ.", { position: "top-center" });
                    return;
                }
                if (form.loai === 'su_kien' && !skipConflictCheck) {
                    const date = computeDateFromForm();
                    const hasRealTime = form.timeStr && form.timeStr !== '06:00'; // 06:00 là giờ mặc định khi không nhận diện được giờ — không coi là "giờ thật" để kiểm tra trùng
                    setSaving(true);
                    const conflict = await checkTimeConflict(date, !!hasRealTime, null);
                    setSaving(false);
                    if (conflict) { setConflictInfo(conflict); setStep('confirm-conflict'); return; }
                }
                await doSave();
            };

            const loaiLabel = { su_kien: 'Sự kiện', viec_can_lam: 'Việc cần làm', ghi_chu: 'Ghi chú' };
            const titlePlaceholder = { su_kien: 'Tiêu đề sự kiện', viec_can_lam: 'Nội dung việc cần làm', ghi_chu: 'Tiêu đề ghi chú' }[form.loai];

            return (
                <div className="fixed inset-0 bg-black/60 z-[70] flex items-center justify-center p-4 animate-in fade-in duration-150" onClick={onClose}>
                    <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden animate-in zoom-in-95 duration-200" onClick={e => e.stopPropagation()}>
                        <div className="bg-blue-600 p-4 text-white flex items-center justify-between">
                            <h3 className="font-bold flex items-center gap-2"><Sparkles size={18} /> Tìm kiếm / Ra lệnh bằng AI</h3>
                            <button onClick={onClose} aria-label="Đóng"><X size={20} /></button>
                        </div>
                        <div className="p-4 space-y-3">
                            {step === 'input' && (
                                <>
                                    <p className="text-xs text-slate-500">Gõ 1 câu tự nhiên — hỏi thông tin (vd: "tháng này có mấy sinh nhật?"), tạo mới (vd: "Họp phụ huynh 7h30 sáng thứ Hai tuần sau", "Nhắc tôi mua sữa", "Ghi chú: ý tưởng quà sinh nhật"), hoặc xóa (vd: "xóa họp phụ huynh")</p>
                                    <textarea
                                        autoFocus
                                        value={text}
                                        onChange={e => setText(e.target.value)}
                                        rows={3}
                                        className="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-400 outline-none"
                                        placeholder="Nhập câu hỏi hoặc yêu cầu của bạn..."
                                    />
                                    {!aiUsable && (
                                        <p className="text-[11px] text-amber-600 bg-amber-50 border border-amber-200 rounded-lg p-2">
                                            AI đang tắt — vẫn nhận diện được cục bộ (không cần mạng): tạo Sự kiện/Việc cần làm có ngày giờ rõ ràng, "Ghi chú: ..." nhanh, và lệnh xóa. Bật AI trong Cài đặt để hỏi/tìm kiếm dữ liệu và xử lý được câu phức tạp hơn.
                                        </p>
                                    )}
                                    <button onClick={handleSubmit} className="w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg hover:bg-blue-700 transition">Gửi</button>
                                </>
                            )}

                            {step === 'confirm-send' && (
                                <>
                                    <p className="text-sm font-bold text-slate-700">Gửi câu này cho AI để phân tích?</p>
                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs text-slate-600 space-y-1">
                                        <p><span className="font-bold">Câu của bạn:</span> {text}</p>
                                        {privacy.showExactContent && (
                                            <p className="break-all"><span className="font-bold">Dữ liệu kèm theo (nếu có):</span> {Object.keys(pendingContext || {}).length ? JSON.stringify(pendingContext) : 'Không có'}</p>
                                        )}
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setStep('input')} className="flex-1 bg-slate-100 text-slate-600 font-bold py-2 rounded-lg">Hủy</button>
                                        <button onClick={() => callAIWithContext(pendingContext)} className="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg">Đồng ý gửi</button>
                                    </div>
                                </>
                            )}

                            {step === 'loading' && (
                                <InlineSkeleton lines={3} />
                            )}

                            {step === 'delete-loading' && (
                                <InlineSkeleton lines={3} />
                            )}

                            {step === 'delete-none' && (
                                <>
                                    <p className="text-sm text-slate-600 bg-slate-50 border border-slate-200 rounded-lg p-3">Không tìm thấy mục nào khớp để xóa. Thử lại với từ khóa khác (đúng 1 phần tên) nhé.</p>
                                    <button onClick={() => setStep('input')} className="w-full bg-slate-100 text-slate-600 font-bold py-2 rounded-lg">Nhập lại</button>
                                </>
                            )}

                            {step === 'delete-pick' && (
                                <>
                                    <p className="text-sm font-bold text-slate-700">Tìm thấy {deleteResults.length} mục khớp — chọn mục muốn xóa:</p>
                                    <div className="space-y-1.5 max-h-64 overflow-y-auto">
                                        {deleteResults.map(it => (
                                            <button key={it.id} type="button" onClick={() => { setDeletePick(it); setStep('delete-confirm'); }}
                                                className="w-full text-left bg-slate-50 hover:bg-red-50 border border-slate-200 rounded-lg p-2.5 text-sm transition">
                                                <span className="text-[10px] font-bold text-slate-400">{loaiLabelStatic[it.loai]}</span>
                                                <p className="font-semibold text-slate-800 truncate">{it.title}</p>
                                                {it.date && <p className="text-[11px] text-slate-500">{getDayOfWeek(it.date)}, {it.date.getDate()}/{it.date.getMonth()+1}/{it.date.getFullYear()}</p>}
                                            </button>
                                        ))}
                                    </div>
                                    <button onClick={() => setStep('input')} className="w-full bg-slate-100 text-slate-600 font-bold py-2 rounded-lg">Hủy</button>
                                </>
                            )}

                            {step === 'delete-confirm' && deletePick && (
                                <>
                                    <p className="text-sm font-bold text-red-600">Xác nhận xóa mục này?</p>
                                    <div className="bg-red-50 border border-red-200 rounded-lg p-3 text-sm">
                                        <span className="text-[10px] font-bold text-red-400">{loaiLabelStatic[deletePick.loai]}</span>
                                        <p className="font-semibold text-slate-800">{deletePick.title}</p>
                                        {deletePick.date && <p className="text-[11px] text-slate-500">{getDayOfWeek(deletePick.date)}, {deletePick.date.getDate()}/{deletePick.date.getMonth()+1}/{deletePick.date.getFullYear()}</p>}
                                    </div>
                                    <p className="text-[11px] text-slate-400">Không thể hoàn tác sau khi xóa.</p>
                                    <div className="flex gap-2">
                                        <button onClick={() => setStep(deleteResults.length > 1 ? 'delete-pick' : 'input')} className="flex-1 bg-slate-100 text-slate-600 font-bold py-2 rounded-lg">Hủy</button>
                                        <button onClick={handleConfirmDelete} className="flex-1 bg-red-600 text-white font-bold py-2 rounded-lg">Xóa</button>
                                    </div>
                                </>
                            )}

                            {step === 'reschedule-loading' && (
                                <InlineSkeleton lines={3} />
                            )}

                            {step === 'reschedule-none' && (
                                <>
                                    <p className="text-sm text-slate-600 bg-slate-50 border border-slate-200 rounded-lg p-3">Không tìm thấy mục nào khớp để dời lịch. Thử lại với từ khóa khác (đúng 1 phần tên) nhé.</p>
                                    <button onClick={() => setStep('input')} className="w-full bg-slate-100 text-slate-600 font-bold py-2 rounded-lg">Nhập lại</button>
                                </>
                            )}

                            {step === 'reschedule-pick' && (
                                <>
                                    <p className="text-sm font-bold text-slate-700">Tìm thấy {rescheduleResults.length} mục khớp — chọn mục muốn dời lịch:</p>
                                    <div className="space-y-1.5 max-h-64 overflow-y-auto">
                                        {rescheduleResults.map(it => (
                                            <button key={it.id} type="button" onClick={() => pickRescheduleTarget(it, rescheduleAfterPart)}
                                                className="w-full text-left bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-lg p-2.5 text-sm transition">
                                                <span className="text-[10px] font-bold text-slate-400">{loaiLabelStatic[it.loai]}</span>
                                                <p className="font-semibold text-slate-800 truncate">{it.title}</p>
                                                {it.date && <p className="text-[11px] text-slate-500">{getDayOfWeek(it.date)}, {it.date.getDate()}/{it.date.getMonth()+1}/{it.date.getFullYear()}</p>}
                                            </button>
                                        ))}
                                    </div>
                                    <button onClick={() => setStep('input')} className="w-full bg-slate-100 text-slate-600 font-bold py-2 rounded-lg">Hủy</button>
                                </>
                            )}

                            {step === 'reschedule-confirm' && reschedulePick && rescheduleNewDate && (
                                <>
                                    <p className="text-sm font-bold text-blue-700">Xác nhận dời lịch mục này?</p>
                                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 text-sm space-y-1.5">
                                        <span className="text-[10px] font-bold text-blue-400">{loaiLabelStatic[reschedulePick.loai]}</span>
                                        <p className="font-semibold text-slate-800">{reschedulePick.title}</p>
                                        <p className="text-[11px] text-slate-500">
                                            {reschedulePick.date ? `${getDayOfWeek(reschedulePick.date)}, ${reschedulePick.date.getDate()}/${reschedulePick.date.getMonth()+1}/${reschedulePick.date.getFullYear()}` : 'Chưa có ngày'}
                                            {' → '}
                                            <span className="font-bold text-blue-600">{getDayOfWeek(rescheduleNewDate)}, {rescheduleNewDate.getDate()}/{rescheduleNewDate.getMonth()+1}/{rescheduleNewDate.getFullYear()} {toTimeStr(rescheduleNewDate)}</span>
                                        </p>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setStep(rescheduleResults.length > 1 ? 'reschedule-pick' : 'input')} className="flex-1 bg-slate-100 text-slate-600 font-bold py-2 rounded-lg">Hủy</button>
                                        <button onClick={handleConfirmReschedule} className="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg">Dời lịch</button>
                                    </div>
                                </>
                            )}

                            {step === 'confirm-conflict' && conflictInfo && (
                                <>
                                    <p className="text-sm font-bold text-amber-600">⚠️ Trùng giờ với 1 sự kiện đã có</p>
                                    <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 text-sm">
                                        <p className="text-slate-600">Bạn đã có lịch lúc <span className="font-bold">{toTimeStr(conflictInfo.date)}</span> cùng ngày:</p>
                                        <p className="font-semibold text-slate-800 mt-1">{conflictInfo.title}</p>
                                    </div>
                                    <p className="text-[11px] text-slate-400">Vẫn muốn tạo thêm mục mới vào đúng giờ này chứ?</p>
                                    <div className="flex gap-2">
                                        <button onClick={() => setStep('preview')} className="flex-1 bg-slate-100 text-slate-600 font-bold py-2 rounded-lg">Sửa lại giờ</button>
                                        <button onClick={() => handleSave(true)} disabled={saving} className="flex-1 bg-amber-500 text-white font-bold py-2 rounded-lg disabled:opacity-60">{saving ? 'Đang lưu...' : 'Vẫn lưu'}</button>
                                    </div>
                                </>
                            )}

                            {step === 'error' && (
                                <>
                                    <p className="text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg p-3">{errorMsg}</p>
                                    <button onClick={() => setStep('input')} className="w-full bg-slate-100 text-slate-600 font-bold py-2 rounded-lg">Nhập lại</button>
                                </>
                            )}

                            {step === 'answer' && (
                                <>
                                    <p className="text-[11px] text-slate-500 flex items-center gap-1"><Sparkles size={12} className="text-indigo-500"/> AI đã tìm và tổng hợp từ dữ liệu của bạn:</p>
                                    <div className="text-sm text-slate-800 bg-indigo-50 border border-indigo-200 rounded-lg p-3 space-y-1">
                                        {displayedAnswer.split('\n').map((line, i) => {
                                            const bulletMatch = line.match(/^\s*[-•]\s+(.*)$/);
                                            return bulletMatch
                                                ? <div key={i} className="flex gap-1.5 pl-1"><span className="text-indigo-400">•</span><span className="whitespace-pre-wrap">{bulletMatch[1]}</span></div>
                                                : (line.trim() ? <p key={i} className="whitespace-pre-wrap">{line}</p> : null);
                                        })}
                                    </div>
                                    {/* Mục 5: cảnh báo sớm khi đã dùng khá nhiều lượt AI trong ngày — tránh bất ngờ hết hạn mức miễn phí giữa chừng công việc */}
                                    {getTodayGeminiCallCount() >= GEMINI_DAILY_WARNING_THRESHOLD && (
                                        <p className="text-[10px] text-amber-600 bg-amber-50 border border-amber-200 rounded-lg p-1.5">⚠️ Đã dùng {getTodayGeminiCallCount()} lượt gọi AI hôm nay — có thể sắp hết hạn mức miễn phí. Nếu gặp lỗi, hãy thử lại sau vài phút.</p>
                                    )}
                                    <div className="flex gap-2">
                                        <button onClick={() => setStep('input')} className="flex-1 bg-slate-100 text-slate-600 font-bold py-2 rounded-lg text-sm">Hỏi/nhập câu khác</button>
                                        <button onClick={onClose} className="flex-1 bg-indigo-600 text-white font-bold py-2 rounded-lg text-sm">Xong</button>
                                    </div>
                                </>
                            )}

                            {step === 'preview' && (
                                <>
                                    {usedAI && getTodayGeminiCallCount() >= GEMINI_DAILY_WARNING_THRESHOLD && (
                                        <p className="text-[10px] text-amber-600 bg-amber-50 border border-amber-200 rounded-lg p-1.5">⚠️ Đã dùng {getTodayGeminiCallCount()} lượt gọi AI hôm nay — có thể sắp hết hạn mức miễn phí.</p>
                                    )}
                                    {/* Mục 5: cảnh báo nếu thời điểm đã chọn (ngày+giờ trong form) đang nằm ở QUÁ
                                        KHỨ so với hiện tại — phòng trường hợp ra lệnh nhầm (vd gõ nhầm ngày/giờ đã
                                        qua). Tính lại mỗi lần form.dateStr/timeStr đổi nên luôn khớp với ô đang hiện. */}
                                    {(() => {
                                        const previewDate = computeDateFromForm();
                                        if (previewDate && previewDate.getTime() < Date.now()) {
                                            return <p className="text-[11px] text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-2">⚠️ Thời điểm này đã ở trong quá khứ — kiểm tra lại xem có nhầm ngày/giờ không.</p>;
                                        }
                                        return null;
                                    })()}

                                    <div className="grid grid-cols-3 gap-1.5">
                                        {['su_kien', 'viec_can_lam', 'ghi_chu'].map(v => (
                                            <button key={v} type="button" onClick={() => setForm(f => ({ ...f, loai: v }))}
                                                className={`text-[11px] font-semibold py-1.5 rounded-lg border transition ${form.loai === v ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-300'}`}>
                                                {loaiLabel[v]}
                                            </button>
                                        ))}
                                    </div>

                                    <input
                                        value={form.title}
                                        onChange={e => setForm(f => ({ ...f, title: e.target.value }))}
                                        className="w-full border border-slate-300 rounded-lg p-2.5 text-sm font-bold focus:ring-2 focus:ring-blue-400 outline-none"
                                        placeholder={titlePlaceholder}
                                    />
                                    <div className="flex gap-2">
                                        <input type="date" value={form.dateStr} onChange={e => setForm(f => ({ ...f, dateStr: e.target.value }))} className="flex-1 border border-slate-300 rounded-lg p-2.5 text-sm" />
                                        <input type="time" value={form.timeStr} onChange={e => setForm(f => ({ ...f, timeStr: e.target.value }))} className="flex-1 border border-slate-300 rounded-lg p-2.5 text-sm" />
                                    </div>
                                    {form.loai !== 'su_kien' && (
                                        <p className="text-[10px] text-slate-400">Có thể để trống ngày/giờ nếu {form.loai === 'ghi_chu' ? 'ghi chú' : 'việc'} này không cần mốc thời gian cụ thể.</p>
                                    )}
                                    {/* Mục 12: chỉ Sự kiện mới có Lặp lại — Việc cần làm/Ghi chú không có trường này */}
                                    {form.loai === 'su_kien' && (
                                        <select value={form.repeat} onChange={e => setForm(f => ({ ...f, repeat: e.target.value }))}
                                            className="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white">
                                            {Object.entries(repeatLabel).map(([v, label]) => <option key={v} value={v}>{label}</option>)}
                                        </select>
                                    )}
                                    <label className="flex items-center gap-2 text-sm text-slate-600">
                                        <input type="checkbox" checked={form.reminder} onChange={e => setForm(f => ({ ...f, reminder: e.target.checked }))} />
                                        Nhắc tôi trước giờ diễn ra
                                    </label>
                                    {form.reminder && (
                                        <select value={form.reminderOffset} onChange={e => setForm(f => ({ ...f, reminderOffset: parseInt(e.target.value, 10) }))}
                                            className="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white">
                                            {OFFSET_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                                        </select>
                                    )}
                                    <div className="flex gap-2">
                                        <button onClick={() => setStep('input')} className="flex-1 bg-slate-100 text-slate-600 font-bold py-2 rounded-lg">Nhập lại</button>
                                        <button onClick={() => handleSave()} disabled={saving} className="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg disabled:opacity-60">{saving ? 'Đang kiểm tra...' : 'Lưu'}</button>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };


        const CalendarView = ({ user, db, appId, currentDate, setCurrentDate, selectedDate, setSelectedDate, onTabChange, theme, activeTab }) => {
            const [events, setEvents] = useState([]);
            const [showEventModal, setShowEventModal] = useState(false);
            const [animClass, setAnimClass] = useState('');
            const [touchStart, setTouchStart] = useState(null);

            const [showQuickJump, setShowQuickJump] = useState(false);
            const [pickerYear, setPickerYear] = useState(currentDate.getFullYear());
            const [pickerMonth, setPickerMonth] = useState(currentDate.getMonth());

            const openQuickJump = () => {
                setPickerYear(currentDate.getFullYear());
                setPickerMonth(currentDate.getMonth());
                setShowQuickJump(true);
            };

            const pickerDaysInMonth = new Date(pickerYear, pickerMonth + 1, 0).getDate();
            const pickerStartDayIndex = new Date(pickerYear, pickerMonth, 1).getDay() === 0 ? 6 : new Date(pickerYear, pickerMonth, 1).getDay() - 1;
            const pickerDays = Array(pickerStartDayIndex).fill(null).concat(Array.from({length: pickerDaysInMonth}, (_, i) => i + 1));

            const handlePickDay = (d) => {
                const newDate = new Date(pickerYear, pickerMonth, d);
                setCurrentDate(new Date(pickerYear, pickerMonth, 1));
                setSelectedDate(newDate);
                setShowQuickJump(false);
            };
            
            const onTouchStart = (e) => { 
                if (e.touches.length > 1) return; 
                setTouchStart(e.targetTouches[0].clientX); 
            };
            
            const onTouchEnd = (e) => {
                if (!touchStart || e.changedTouches.length > 1) return;
                const distance = touchStart - e.changedTouches[0].clientX;
                if (distance > 50) { 
                    setAnimClass('anim-next'); 
                    setTimeout(() => { 
                        setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1)); 
                        setAnimClass(''); 
                    }, 300); 
                }
                if (distance < -50) { 
                    setAnimClass('anim-prev'); 
                    setTimeout(() => { 
                        setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1)); 
                        setAnimClass(''); 
                    }, 300); 
                }
                setTouchStart(null);
            };

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const startDayIndex = new Date(year, month, 1).getDay() === 0 ? 6 : new Date(year, month, 1).getDay() - 1;
            // Số ngày của tháng trước, dùng để lấp đầy các ô trống đầu bảng
            const prevMonthDaysCount = new Date(year, month, 0).getDate();
            const leadingDays = Array.from({ length: startDayIndex }, (_, i) => ({
                date: new Date(year, month - 1, prevMonthDaysCount - startDayIndex + i + 1),
                outside: true
            }));
            const currentDays = Array.from({ length: daysInMonth }, (_, i) => ({
                date: new Date(year, month, i + 1),
                outside: false
            }));
            // Lấp đầy các ô trống cuối bảng bằng ngày của tháng sau, đủ tròn hàng (bội số của 7)
            const filledSoFar = leadingDays.length + currentDays.length;
            const trailingCount = (7 - (filledSoFar % 7)) % 7;
            const trailingDays = Array.from({ length: trailingCount }, (_, i) => ({
                date: new Date(year, month + 1, i + 1),
                outside: true
            }));
            const days = [...leadingDays, ...currentDays, ...trailingDays];

            const eventsRef = useMemo(() => collection(db, 'artifacts', appId, 'users', user.uid, 'events'), [db, appId, user.uid]);
            useEffect(() => onSnapshot(query(eventsRef), snap => setEvents(snap.docs.map(d => ({id: d.id, ...d.data()})))), [eventsRef]);
            
            const hasEvent = (date) => {
                if (!date) return false;
                const dateStr = date.toDateString();
                const lunar = getLunarDetails(date);
                return events.some(e => {
                    if (!e.repeat || e.repeat === 'none') {
                        return e.date && new Date(e.date.seconds * 1000).toDateString() === dateStr;
                    }
                    if (e.repeat === 'lunar') {
                        return e.lunarDay === lunar.day && e.lunarMonth === lunar.month;
                    }
                    if (e.repeat === 'solar' && e.date) {
                        const d = new Date(e.date.seconds * 1000);
                        return d.getDate() === date.getDate() && d.getMonth() === date.getMonth();
                    }
                    if (e.repeat === 'weekly' && e.date) {
                        const d = new Date(e.date.seconds * 1000);
                        const dayMatches = d.getDay() === date.getDay();
                        if (!dayMatches) return false;
                        if (e.weeklyMonths && e.weeklyMonths.length > 0) {
                            return e.weeklyMonths.includes(date.getMonth() + 1);
                        }
                        return true;
                    }
                    if (e.repeat === 'monthly' && e.date) {
                        const d = new Date(e.date.seconds * 1000);
                        return d.getDate() === date.getDate();
                    }
                    if (e.repeat === 'yearly' && e.date) {
                        const d = new Date(e.date.seconds * 1000);
                        return d.getDate() === date.getDate() && d.getMonth() === date.getMonth();
                    }
                    return false;
                });
            };

            const getEventsForDate = (date) => {
                if (!date) return [];
                const dateStr = date.toDateString();
                const lunar = getLunarDetails(date);
                return events.filter(e => {
                    if (!e.repeat || e.repeat === 'none') return e.date && new Date(e.date.seconds * 1000).toDateString() === dateStr;
                    if (e.repeat === 'lunar') return e.lunarDay === lunar.day && e.lunarMonth === lunar.month;
                    if (e.repeat === 'solar' && e.date) { const d = new Date(e.date.seconds * 1000); return d.getDate() === date.getDate() && d.getMonth() === date.getMonth(); }
                    if (e.repeat === 'weekly' && e.date) { 
                        const d = new Date(e.date.seconds * 1000); 
                        const dayMatches = d.getDay() === date.getDay();
                        if (!dayMatches) return false;
                        if (e.weeklyMonths && e.weeklyMonths.length > 0) {
                            return e.weeklyMonths.includes(date.getMonth() + 1);
                        }
                        return true;
                    }
                    if (e.repeat === 'monthly' && e.date) { const d = new Date(e.date.seconds * 1000); return d.getDate() === date.getDate(); }
                    if (e.repeat === 'yearly' && e.date) { const d = new Date(e.date.seconds * 1000); return d.getDate() === date.getDate() && d.getMonth() === date.getMonth(); }
                    return false;
                });
            };

            const handleAddEvent = async (title, repeatType, weeklyMonths, eventDateStr, reminderInfo) => {
                let eventDate = selectedDate;
                if (eventDateStr) {
                    const [yyyy, mm, dd] = eventDateStr.split('-').map(Number);
                    if (yyyy && mm && dd) {
                        eventDate = new Date(selectedDate);
                        eventDate.setFullYear(yyyy, mm - 1, dd);
                    }
                }
                const data = { title, date: Timestamp.fromDate(eventDate), repeat: repeatType };
                if (repeatType === 'lunar') { const lunar = getLunarDetails(eventDate); data.lunarDay = lunar.day; data.lunarMonth = lunar.month; }
                if (repeatType === 'weekly' && weeklyMonths && weeklyMonths.length > 0) { data.weeklyMonths = weeklyMonths; }
                // Lưu thời điểm nhắc lên Firestore (đồng bộ mọi thiết bị) để hệ thống
                // thông báo đẩy nền (hoạt động cả khi tắt app) có thể gửi đúng giờ.
                if (reminderInfo && reminderInfo.time) {
                    const base = new Date(reminderInfo.time);
                    if (!isNaN(base.getTime())) {
                        const triggerDate = new Date(base.getTime() - (reminderInfo.offsetMinutes || 0) * 60000);
                        data.reminderTime = Timestamp.fromDate(triggerDate);
                        data.pushSent = false;
                    }
                }
                await addDoc(eventsRef, data);
            };
            const getDayColor = (index) => {
                if (index === 5) return 'text-[#84cc16]'; 
                if (index === 6) return 'text-[#ec4899]'; 
                return 'text-slate-500'; 
            };

            // ── KEYBOARD NAV ──────────────────────────────────────────────────────
            useEffect(() => {
                const handler = (e) => {
                    if (activeTab !== 'calendar') return;
                    const target = e.target;
                    const tag = target?.tagName || '';
                    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || target?.isContentEditable) return;
                    if (e.key === 'ArrowLeft') { setCurrentDate(new Date(year, month - 1, 1)); e.preventDefault(); }
                    else if (e.key === 'ArrowRight') { setCurrentDate(new Date(year, month + 1, 1)); e.preventDefault(); }
                    else if (e.key === 'ArrowUp') { setCurrentDate(new Date(year - 1, month, 1)); e.preventDefault(); }
                    else if (e.key === 'ArrowDown') { setCurrentDate(new Date(year + 1, month, 1)); e.preventDefault(); }
                };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, [activeTab, year, month, setCurrentDate]);

            return (
                <div className="p-4 select-none perspective-container" style={{ color: theme.textColor }} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
                    <div className="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-slate-150">
                        <button onClick={() => setCurrentDate(new Date(year, month - 1, 1))} className="p-2 hover:bg-gray-100 rounded-full"><ChevronLeft className="text-gray-600" /></button>
                        <button onClick={openQuickJump} className="text-lg font-bold uppercase text-gray-800 hover:text-blue-600 transition flex items-center gap-1.5">
                            Tháng {month + 1} / {year}
                            <ChevronDown size={16} className="text-gray-400"/>
                        </button>
                        <button onClick={() => setCurrentDate(new Date(year, month + 1, 1))} className="p-2 hover:bg-gray-100 rounded-full"><ChevronRight className="text-gray-600" /></button>
                    </div>

                    {showQuickJump && (
                        <div className="fixed inset-0 bg-black/50 z-[70] overflow-y-auto overscroll-contain" onClick={() => setShowQuickJump(false)}>
                            <div className="min-h-full flex items-end sm:items-center justify-center">
                            <div className="bg-white w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl shadow-2xl overflow-hidden max-h-[100dvh] sm:max-h-[85vh] flex flex-col" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between px-4 py-3 bg-blue-600 text-white shrink-0">
                                    <h3 className="font-bold text-sm">Chọn ngày</h3>
                                    <button onClick={() => setShowQuickJump(false)} aria-label="Đóng chọn ngày nhanh" className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-blue-500 transition"><X size={18}/></button>
                                </div>
                                <div className="p-4 space-y-4 overflow-y-auto flex-1">
                                    <div className="flex items-center justify-center gap-4">
                                        <button onClick={() => setPickerYear(y => y - 1)} className="p-2 hover:bg-gray-100 rounded-full"><ChevronLeft size={18} className="text-gray-600"/></button>
                                        <input type="number" value={pickerYear}
                                            onChange={e => { const v = parseInt(e.target.value, 10); if (!isNaN(v)) setPickerYear(v); }}
                                            className="w-24 text-center text-lg font-bold border border-slate-200 rounded-lg py-1.5 outline-none focus:border-blue-500" />
                                        <button onClick={() => setPickerYear(y => y + 1)} className="p-2 hover:bg-gray-100 rounded-full"><ChevronRight size={18} className="text-gray-600"/></button>
                                    </div>

                                    <div className="grid grid-cols-4 gap-2">
                                        {Array.from({length: 12}, (_, i) => i).map(m => (
                                            <button key={m} onClick={() => setPickerMonth(m)}
                                                className={'py-2 rounded-lg text-xs font-bold transition ' + (m === pickerMonth ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-blue-50')}>
                                                Th{m + 1}
                                            </button>
                                        ))}
                                    </div>

                                    <div>
                                        <div className="grid grid-cols-7 gap-1 text-center mb-1">
                                            {['T2','T3','T4','T5','T6','T7','CN'].map(d => <div key={d} className="text-[10px] font-bold text-gray-400">{d}</div>)}
                                        </div>
                                        <div className="grid grid-cols-7 gap-1">
                                            {pickerDays.map((d, idx) => {
                                                if (!d) return <div key={idx} className="aspect-square"/>;
                                                const isSel = pickerYear === selectedDate.getFullYear() && pickerMonth === selectedDate.getMonth() && d === selectedDate.getDate();
                                                const isToday = pickerYear === new Date().getFullYear() && pickerMonth === new Date().getMonth() && d === new Date().getDate();
                                                return (
                                                    <button key={idx} onClick={() => handlePickDay(d)}
                                                        className={'aspect-square flex items-center justify-center rounded-lg text-xs font-semibold transition ' + (isSel ? 'bg-blue-600 text-white' : 'bg-gray-50 hover:bg-blue-50 text-gray-700') + (isToday && !isSel ? ' border-2 border-blue-500' : '')}>
                                                        {d}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <button onClick={() => { const t = new Date(); setPickerYear(t.getFullYear()); setPickerMonth(t.getMonth()); }}
                                        className="w-full py-2 rounded-xl border border-blue-200 text-blue-600 font-bold text-xs hover:bg-blue-50 transition">
                                        📍 Hôm nay
                                    </button>
                                </div>
                            </div>
                            </div>
                        </div>
                    )}
                    <div className="grid grid-cols-7 gap-1 text-center mb-2">
                        {['T2','T3','T4','T5','T6','T7','CN'].map((d, i) => <div key={d} className={`text-sm font-bold ${getDayColor(i)}`}>{d}</div>)}
                    </div>
                    <div className={`grid grid-cols-7 gap-1 ${animClass}`}>
                        {days.map((d, idx) => {
                            if(!d) return <div key={idx} className="aspect-square"/>;
                            const { date, outside } = d;
                            const isSel = date.toDateString() === selectedDate.toDateString();
                            const isToday = date.toDateString() === new Date().toDateString();
                            const dayOfWeek = date.getDay();
                            let textColor = 'text-gray-800';
                            if (dayOfWeek === 6) textColor = 'text-[#84cc16]'; 
                            if (dayOfWeek === 0) textColor = 'text-[#ec4899]'; 
                            if (isSel) textColor = 'text-white';
                            return (
                                <div key={idx}
                                    onClick={outside ? undefined : () => { setSelectedDate(date); setShowEventModal(true); }}
                                    className={`aspect-square flex flex-col items-center justify-center rounded-xl transition-all relative ${outside ? 'bg-white border border-gray-100 pointer-events-none select-none' : (isSel ? 'bg-blue-600 shadow-md transform scale-105 cursor-pointer' : 'bg-white hover:bg-blue-50 border border-gray-100 cursor-pointer')} ${isToday && !isSel && !outside ? 'border-2 border-blue-600' : ''}`}
                                    style={outside ? { opacity: 0.4 } : undefined}>
                                    <span className={`font-bold ${textColor}`}>{date.getDate()}</span>
                                    <span className={`text-[9px] ${isSel?'text-blue-100':'text-gray-400'}`}>{getLunarDate(date)}</span>
                                    {!outside && hasEvent(date) && <div className={`w-1.5 h-1.5 rounded-full mt-0.5 ${isSel ? 'bg-white' : 'bg-red-500'}`}></div>}
                                </div>
                            )
                        })}
                    </div>
                    <div className="mt-6 flex justify-center gap-2">
                         <button onClick={() => setShowEventModal(true)} className="bg-blue-600 text-white px-4 py-2 rounded-full shadow-lg flex items-center gap-2 text-sm font-bold active:scale-95 transition-transform"><Plus size={16}/> Thêm sự kiện</button>
                         <button onClick={() => { const t = new Date(); setCurrentDate(t); setSelectedDate(t); }} className="bg-slate-800 text-white px-4 py-2 rounded-full shadow-lg flex items-center gap-2 text-sm font-bold active:scale-95 transition-transform">Hôm nay</button>
                    </div>
                    {showEventModal && <EventModal 
                        date={selectedDate} 
                        events={getEventsForDate(selectedDate)} 
                        titleSuggestions={Array.from(new Set(events.map(e => e.title).filter(Boolean)))}
                        onClose={() => setShowEventModal(false)} 
                        onAdd={handleAddEvent} 
                        onDelete={async (id) => { await deleteDoc(doc(eventsRef, id)); }} 
                        onUpdate={async (id, newTitle, newDateStr, newRepeat, newWeeklyMonths) => {
                            const newDate = newDateStr ? Timestamp.fromDate(new Date(newDateStr)) : null;
                            const updatePayload = { title: newTitle, repeat: newRepeat };
                            if (newRepeat === 'weekly') {
                                updatePayload.weeklyMonths = (newWeeklyMonths && newWeeklyMonths.length > 0) ? newWeeklyMonths : [];
                            } else {
                                updatePayload.weeklyMonths = [];
                            }
                            if (newDate) {
                                updatePayload.date = newDate;
                                if (newRepeat === 'lunar') {
                                    const d = new Date(newDateStr);
                                    const lunar = getLunarDetails(d);
                                    updatePayload.lunarDay = lunar.day;
                                    updatePayload.lunarMonth = lunar.month;
                                }
                            }
                            await updateDoc(doc(eventsRef, id), updatePayload);
                        }}
                    />}
                </div>
            );
        };

        // ─── COMPONENT REMINDER SETTINGS (Dùng chung cho Event, Todo, Note) ───
        const ReminderSettings = ({ enabled, setEnabled, time, setTime, offset, setOffset, repeat, setRepeat, label }) => {
            const OFFSET_OPTIONS = [
                { value: 0, label: 'Đúng giờ' },
                { value: 5, label: '5 phút trước' },
                { value: 15, label: '15 phút trước' },
                { value: 30, label: '30 phút trước' },
                { value: 60, label: '1 giờ trước' },
                { value: 120, label: '2 giờ trước' },
                { value: 1440, label: '1 ngày trước' },
                { value: 'custom', label: 'Tùy chỉnh...' },
            ];
            const REPEAT_OPTIONS = [
                { value: 'none', label: 'Không lặp' },
                { value: 'daily', label: 'Hàng ngày' },
                { value: 'custom', label: 'Tùy chỉnh (ngày)' },
            ];

            const [customOffset, setCustomOffset] = useState(30);
            const [customRepeatDays, setCustomRepeatDays] = useState(1);

            const handleOffsetChange = (e) => {
                const val = e.target.value;
                setOffset(val);
                if (val !== 'custom') {
                    // nếu chọn giá trị khác, không cần custom
                }
            };

            const handleRepeatChange = (e) => {
                const val = e.target.value;
                setRepeat(val);
            };

            // Gọi requestPermission khi bật lần đầu
            useEffect(() => {
                if (enabled && Notification.permission === 'default') {
                    Notification.requestPermission();
                }
            }, [enabled]);

            // Bật công tắc mà chưa chọn giờ thì tự động gợi ý ngày giờ hiện tại
            const handleToggleEnabled = (val) => {
                setEnabled(val);
                if (val && !time) setTime(formatDateTimeForInput(new Date()));
            };

            return (
                <div className="mt-3 p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-2.5">
                    <div className="flex items-center justify-between">
                        <label
                            className="flex items-center gap-2 text-sm font-bold text-slate-700 cursor-pointer select-none"
                            onClick={() => handleToggleEnabled(!enabled)}
                        >
                            <Bell size={16} className="text-slate-500" />
                            {label || 'Nhắc nhở'}
                        </label>
                        <label className="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" className="sr-only peer" checked={enabled} onChange={e => handleToggleEnabled(e.target.checked)} />
                            <div className="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                        </label>
                    </div>

                    {enabled && (
                        <div className="space-y-2 animate-in fade-in duration-150">
                            <div className="flex flex-col gap-1">
                                <label className="text-[10px] font-bold text-slate-500 uppercase">Thời gian nhắc</label>
                                <input
                                    type="datetime-local"
                                    className="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-sm text-slate-800 focus:ring-1 focus:ring-blue-500 outline-none bg-white"
                                    value={time}
                                    onChange={e => setTime(e.target.value)}
                                />
                            </div>
                            <div className="flex gap-3">
                                <div className="flex-1">
                                    <label className="text-[10px] font-bold text-slate-500 uppercase">Nhắc trước</label>
                                    <select
                                        className="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-sm text-slate-800 focus:ring-1 focus:ring-blue-500 outline-none bg-white"
                                        value={offset}
                                        onChange={handleOffsetChange}
                                    >
                                        {OFFSET_OPTIONS.map(opt => (
                                            <option key={opt.value} value={opt.value}>{opt.label}</option>
                                        ))}
                                    </select>
                                    {offset === 'custom' && (
                                        <div className="mt-1 flex items-center gap-2">
                                            <input
                                                type="number"
                                                min={1}
                                                value={customOffset}
                                                onChange={e => setCustomOffset(parseInt(e.target.value, 10) || 1)}
                                                className="w-20 px-2 py-1 border rounded text-sm text-slate-800"
                                            />
                                            <span className="text-xs text-slate-500">phút</span>
                                        </div>
                                    )}
                                </div>
                                <div className="flex-1">
                                    <label className="text-[10px] font-bold text-slate-500 uppercase">Lặp lại</label>
                                    <select
                                        className="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-sm text-slate-800 focus:ring-1 focus:ring-blue-500 outline-none bg-white"
                                        value={repeat}
                                        onChange={handleRepeatChange}
                                    >
                                        {REPEAT_OPTIONS.map(opt => (
                                            <option key={opt.value} value={opt.value}>{opt.label}</option>
                                        ))}
                                    </select>
                                    {repeat === 'custom' && (
                                        <div className="mt-1 flex items-center gap-2">
                                            <input
                                                type="number"
                                                min={1}
                                                value={customRepeatDays}
                                                onChange={e => setCustomRepeatDays(parseInt(e.target.value, 10) || 1)}
                                                className="w-20 px-2 py-1 border rounded text-sm text-slate-800"
                                            />
                                            <span className="text-xs text-slate-500">ngày</span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const EventModal = ({ date, events, onClose, onAdd, onDelete, onUpdate, titleSuggestions = [] }) => {
            const [newEvent, setNewEvent] = useState('');
            const [newEventDate, setNewEventDate] = useState(() => {
                const yyyy = date.getFullYear();
                const mm = String(date.getMonth() + 1).padStart(2, '0');
                const dd = String(date.getDate()).padStart(2, '0');
                return `${yyyy}-${mm}-${dd}`;
            });
            const [repeatType, setRepeatType] = useState('none'); 
            const [weeklyMonths, setWeeklyMonths] = useState([]);
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const dateInputRef = useRef(null);
            const openDatePicker = () => {
                if (!dateInputRef.current) return;
                if (dateInputRef.current.showPicker) dateInputRef.current.showPicker();
                else dateInputRef.current.click();
            };

            const [editingId, setEditingId] = useState(null);
            const [editTitle, setEditTitle] = useState('');
            const [editDate, setEditDate] = useState('');
            const [editRepeat, setEditRepeat] = useState('none');
            const [editWeeklyMonths, setEditWeeklyMonths] = useState([]);

            // --- Reminder state ---
            const [reminderEnabled, setReminderEnabled] = useState(false);
            const [reminderTime, setReminderTime] = useState('');
            const [reminderOffset, setReminderOffset] = useState(0);
            const [reminderRepeat, setReminderRepeat] = useState('none');

            // Gợi ý giờ trống (mục 3): lấy giờ nhắc (nếu có) của các sự kiện KHÁC rơi đúng ngày đang
            // chọn, để phát hiện trùng giờ và đề xuất khung giờ trống. Không cần gọi AI — tính cục bộ.
            const bookedMinutesOnSelectedDate = useMemo(() => {
                if (!newEventDate) return [];
                return (events || [])
                    .filter(e => e.id !== editingId && e.reminderTime && e.reminderTime.seconds)
                    .map(e => new Date(e.reminderTime.seconds * 1000))
                    .filter(d => formatDateTimeForInput(d).slice(0, 10) === newEventDate)
                    .map(d => d.getHours() * 60 + d.getMinutes());
            }, [events, newEventDate, editingId]);
            const reminderTimeConflict = useMemo(() => {
                if (!reminderTime) return null;
                const timePart = reminderTime.slice(11, 16); // "yyyy-mm-ddTHH:mm" -> "HH:mm"
                return checkTimeConflict(timePart, bookedMinutesOnSelectedDate);
            }, [reminderTime, bookedMinutesOnSelectedDate]);

            const toggleMonth = (m, arr, setArr) => {
                setArr(prev => prev.includes(m) ? prev.filter(x => x !== m) : [...prev, m].sort((a,b) => a-b));
            };

            const MONTH_LABELS = ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'];

            const handleStartEdit = (eItem) => {
                setEditingId(eItem.id);
                setEditTitle(eItem.title);
                const d = eItem.date ? new Date(eItem.date.seconds * 1000) : date;
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                setEditDate(`${yyyy}-${mm}-${dd}`);
                setEditRepeat(eItem.repeat || 'none');
                setEditWeeklyMonths(eItem.weeklyMonths || []);
            };

            const handleSaveEdit = async (id) => {
                if (!editTitle.trim()) { toast.error("Vui lòng nhập tên sự kiện.", { position: "top-center" }); return; }
                if (editDate && !isValidDateInputStr(editDate)) {
                    toast.error("Ngày không hợp lệ, vui lòng kiểm tra lại.", { position: "top-center" });
                    return;
                }
                try {
                    await onUpdate(id, editTitle, editDate, editRepeat, editWeeklyMonths);
                    setEditingId(null);
                } catch (err) {
                    toast.error("Lỗi khi lưu sự kiện: " + (err.message || 'không xác định'), { position: "top-center" });
                }
            };

            const newEventDateObj = (() => {
                const [yyyy, mm, dd] = newEventDate.split('-').map(Number);
                if (yyyy && mm && dd) { const d = new Date(date); d.setFullYear(yyyy, mm - 1, dd); return d; }
                return date;
            })();
            const lunar = getLunarDetails(newEventDateObj);
            const handleDelete = (id) => {
                if (deleteConfirm === id) { onDelete(id); setDeleteConfirm(null); } 
                else { setDeleteConfirm(id); setTimeout(() => setDeleteConfirm(null), 3000); }
            };

            // Hàm lên lịch thông báo
            const scheduleReminder = async (title, reminderTimeStr, offsetMinutes, repeatType) => {
                if (!reminderTimeStr || !('Notification' in window) || Notification.permission !== 'granted') return;
                try {
                    const baseTime = new Date(reminderTimeStr);
                    let triggerTime = new Date(baseTime.getTime() - offsetMinutes * 60000);
                    let repeatDays = 1;

                    // Nếu lặp lại, tính triggerTime dựa trên lần lặp tiếp theo
                    if (repeatType === 'daily') {
                        triggerTime = new Date(baseTime);
                        while (triggerTime.getTime() <= Date.now()) {
                            triggerTime.setDate(triggerTime.getDate() + 1);
                        }
                    } else if (repeatType === 'custom') {
