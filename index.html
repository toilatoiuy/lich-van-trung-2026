    <style>
        /* ─── Hiệu ứng chuyển động mềm mại cho các khối "animate-in ..." ───
           Bản Tailwind qua CDN (cdn.tailwindcss.com) KHÔNG có sẵn plugin tailwindcss-animate,
           nên các lớp animate-in/fade-in/zoom-in-95/slide-in-from-.../duration-* vốn không có
           tác dụng gì (chuyển cảnh tức thì, giật cục). Định nghĩa thủ công tại đây để toàn bộ
           menu/modal trong app (kể cả menu "Sổ tay") có hiệu ứng trượt/mờ dần mượt mà. */
        @keyframes calAppFadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes calAppZoomIn95 { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes calAppFadeZoomIn95 { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes calAppSlideInLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        @keyframes calAppSlideInBottom5 { from { opacity: 0; transform: translateY(1.25rem); } to { opacity: 1; transform: translateY(0); } }
        @keyframes calAppSlideInTop { from { opacity: 0; transform: translateY(-0.5rem); max-height: 0; } to { opacity: 1; transform: translateY(0); max-height: 60px; } }
        .animate-in { animation-duration: 220ms; animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); animation-fill-mode: both; }
        .animate-in.fade-in { animation-name: calAppFadeIn; }
        .animate-in.zoom-in-95 { animation-name: calAppZoomIn95; }
        .animate-in.fade-in.zoom-in-95 { animation-name: calAppFadeZoomIn95; }
        .animate-in.slide-in-from-left { animation-name: calAppSlideInLeft; }
        .animate-in.slide-in-from-bottom-5 { animation-name: calAppSlideInBottom5; }
        .animate-in.slide-in-from-top { animation-name: calAppSlideInTop; }
        .animate-in.duration-150 { animation-duration: 150ms; }
        .animate-in.duration-200 { animation-duration: 200ms; }
        @media (prefers-reduced-motion: reduce) {
            .animate-in { animation: none !important; }
        }

        /* ─── Skeleton loading (thay cho chữ "Đang tải...") ─── */
        @keyframes calAppShimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .skeleton {
            background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 37%, #e5e7eb 63%);
            background-size: 400% 100%;
            animation: calAppShimmer 1.4s ease-in-out infinite;
        }
        @media (prefers-reduced-motion: reduce) {
            .skeleton { animation: none; background: #e5e7eb; }
        }
        body { transition: background-color 0.3s, color 0.3s; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Ô nhập cỡ chữ trong thanh Định dạng chữ: bỏ mũi tên tăng/giảm mặc định của input[number],
           chỉ giữ lại mũi tên xổ xuống danh sách gợi ý (datalist) do trình duyệt tự vẽ riêng. */
        .no-spinner::-webkit-outer-spin-button,
        .no-spinner::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .no-spinner { -moz-appearance: textfield; }

        /* Ô nội dung từng dòng ghi chú: dùng div contentEditable (không phải input/textarea).
           Chỉ dòng đang được focus mới thật sự contentEditable=true (các dòng khác là văn bản
           thường contentEditable=false), nhờ vậy khi không có dòng nào đang gõ dở, người dùng
           có thể quét-bôi-đen chọn văn bản xuyên suốt nhiều dòng rồi copy cùng lúc như bình thường. */
        .note-line-editable:empty:before { content: attr(data-placeholder); color: #9ca3af; pointer-events: none; }
        /* Dùng chung cho các ô contentEditable hỗ trợ định dạng (Đậm/Nghiêng/Gạch chân/Font/Cỡ/Màu)
           mới thêm ở Việc cần làm / Ghi chú / Lịch biểu — mục 2 (thanh định dạng chữ). */
        .rich-editable:empty:before { content: attr(data-placeholder); color: #9ca3af; pointer-events: none; }
        .rich-editable { outline: none; }
        /* Hiệu ứng trượt xuống cho thanh định dạng ở Lịch biểu — chỉ hiện khi đang soạn thảo 1 ô */
        @keyframes richToolbarSlideDown { from { opacity: 0; transform: translateY(-6px); max-height: 0; } to { opacity: 1; transform: translateY(0); max-height: 60px; } }
        .rich-toolbar-slide { animation: richToolbarSlideDown 160ms ease-out; overflow: hidden; }
        
        /* 3D Animations */
        .perspective-container { perspective: 1000px; }
        
        @keyframes rotateInRight {
            from { transform: translateX(100%) rotateY(-90deg); opacity: 0; }
            to { transform: translateX(0) rotateY(0); opacity: 1; }
        }
        @keyframes rotateInLeft {
            from { transform: translateX(-100%) rotateY(90deg); opacity: 0; }
            to { transform: translateX(0) rotateY(0); opacity: 1; }
        }

        .anim-next { animation: rotateInRight 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        .anim-prev { animation: rotateInLeft 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        
        /* Animation cho menu popup */
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* Hiệu ứng mềm mại khi chuyển tab/màn hình chính (Hôm nay, Lịch, Việc cần làm, Ghi chú, Thời khóa biểu) */
        .tab-fade-in { animation: tabFadeIn 0.28s ease-out; }
        @keyframes tabFadeIn { from { opacity: 0; transform: scale(0.985); } to { opacity: 1; transform: scale(1); } }

        /* Hiệu ứng mềm mại khi chuyển giữa các màn hình lớn (Đang tải -> Đăng nhập -> Ứng dụng chính) */
        .animate-fade-in { animation: screenFadeIn 0.4s ease-out; }
        @keyframes screenFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        // Hàm tạo salt ngẫu nhiên 16 byte (base64)
        function generateSalt() {
            const salt = crypto.getRandomValues(new Uint8Array(16));
            return btoa(String.fromCharCode(...salt));
        }

        // Hàm băm mật khẩu với PBKDF2 + salt (100k iterations)
        async function pbkdf2Hash(password, salt) {
            const encoder = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                encoder.encode(password),
                'PBKDF2',
                false,
                ['deriveBits']
            );
            const hashBuffer = await crypto.subtle.deriveBits(
                {
                    name: 'PBKDF2',
                    salt: encoder.encode(salt),
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                256 // 256 bits = 32 bytes
            );
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return btoa(String.fromCharCode(...hashArray));
        }

        // Lưu hash với salt: dạng "salt:hash"
        async function createPasswordHash(password) {
            const salt = generateSalt();
            const hash = await pbkdf2Hash(password, salt);
            return `${salt}:${hash}`;
        }

        // Kiểm tra mật khẩu với chuỗi lưu trữ
        async function verifyPasswordWithSalt(input, stored) {
            if (!stored) return false;
            const parts = stored.split(':');
            if (parts.length !== 2) return false;
            const [salt, hash] = parts;
            const newHash = await pbkdf2Hash(input, salt);
            return newHash === hash;
        }

        // ---- Các hàm mã hóa AES-GCM (giữ nguyên) ----
        // Hàm dẫn xuất khóa từ mật khẩu bằng PBKDF2 (dùng để mã hóa nội dung Vault)
        async function deriveKey(password, salt, iterations = 100000, length = 256) {
            const encoder = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                encoder.encode(password),
                'PBKDF2',
                false,
                ['deriveKey']
            );
            return crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: encoder.encode(salt),
                    iterations: iterations,
                    hash: 'SHA-256'
                },
                keyMaterial,
                {
                    name: 'AES-GCM',
                    length: length
                },
                false,
                ['encrypt', 'decrypt']
            );
        }

        // Mã hóa văn bản với AES-GCM, tạo salt ngẫu nhiên 16 byte, trả về base64 của (salt + iv + ciphertext)
        async function encryptText(plaintext, password) {
            if (!plaintext) return '';
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const key = await deriveKey(password, salt);
            const encoder = new TextEncoder();
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encrypted = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                encoder.encode(plaintext)
            );
            const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
            combined.set(salt, 0);
            combined.set(iv, salt.length);
            combined.set(new Uint8Array(encrypted), salt.length + iv.length);
            return btoa(String.fromCharCode(...combined));
        }

        // Giải mã văn bản từ base64 (salt + iv + ciphertext)
        async function decryptText(encryptedBase64, password) {
            if (!encryptedBase64) return '';
            const combined = Uint8Array.from(atob(encryptedBase64), c => c.charCodeAt(0));
            if (combined.length < 16 + 12) return '';
            const salt = combined.slice(0, 16);
            const iv = combined.slice(16, 16 + 12);
            const ciphertext = combined.slice(16 + 12);
            const key = await deriveKey(password, salt);
            try {
                const decrypted = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    ciphertext
                );
                return new TextDecoder().decode(decrypted);
            } catch (e) {
                console.warn('Giải mã thất bại: sai mật khẩu hoặc dữ liệu hỏng');
                return '';

            "Làu thông cả kho kinh sâu sắc\nKhông thực hành, phóng dật ích chi?\nKhác gì như kẻ làm thuê\nChăn bò cho chủ, có gì của ta?",
            "Người nói ít nhưng hành miên mật\nBỏ tham, sân; tỉnh giác, thong dong\nHai đời dính mắc không còn\nNgười này xứng hạnh sa-môn sáng ngời.",
            "Không phóng dật là con đường sống\nKẻ buông lung làm hỏng cuộc đời.\nKhông còn phóng dật, sáng ngời\nBuông lung như kẻ chết rồi, ích chi.",
            "Sống bất tử với đường tỉnh thức\nThói buông lung là vực tử sanh.\nĐịnh thiền, giới hạnh, tinh cần\nUng dung đạo giác, an nhàn thân tâm.",
            "Người có trí siêng tu thiền định\nLuôn tinh cần thức tỉnh ngày đêm\nNiết-bàn vô thượng xứng tên\nKhổ đau, trói buộc không còn đeo mang.",
            "Luôn tinh tấn, tự điều, chính niệm\nNương pháp màu, đức hạnh sáng trong,\nGiữ mình, dứt bỏ buông lung\nTiếng lành, phước tốt gia tăng mỗi ngày.",
            "Luôn nỗ lực vượt qua phóng dật\nTự điều thân, làm chủ giác quan\nTrí nhân như đảo vững vàng\nBão giông không thể ngập tràn được đâu.",
            "Kẻ thiếu trí đam mê phóng dật\nBám nghiệp duyên, rồi gặt quả sầu\nTrí nhân tinh tấn trước sau\nNhư gìn của báu làm giàu bản thân.",
            "Cảnh hưởng thụ không thèm màng tới\nDục lạc đời chẳng luyến ái tham.\nSiêng tu thiền định, chánh tâm,\nNiềm vui sâu lắng đạt thành khó chi.",
            "Người có trí dẹp tan phóng dật\nOn lầu cao tuệ giác nhìn trông\nKhông sầu khổ, hết buồn vương\nThương người ngu dưới kiếp hồng trần kia.",
            "Sống tinh tấn giữa người phóng đãng\nTỉnh thức luôn bên cạnh kẻ say\nTrí nhân như ngựa khéo nài\nBỏ xa ngựa yếu cả bầy sau lưng.",
            "Như Đế Thích do tu tinh tấn\nKhi tái sanh làm chủ cõi thiên\nKhông còn phóng dật được khen.\nĐời hay chỉ trích kẻ ghiền buông lung.",
            "Tâm luôn thích niềm vui tinh tấn\nSợ buông lung phá hạnh thanh cao\nTu theo pháp Phật nhiệm mầu\nĐốt tiêu trói buộc, sầu đau bao đời.",
            "Tâm luôn thích niềm vui tinh tấn\nSợ buông lung phá hạnh thanh cao\nTu theo pháp Phật nhiệm mầu\nNiết-bàn sẽ chứng, khổ sầu lánh xa.",
            "Tâm dao động, sầu lo, sợ hãi\nKhó giữ gìn, vùng vẫy theo duyên.\nTrí nhân làm thẳng tâm này\nNhư người thợ khéo uốn tên thẳng hàng.",
            "Như tôm cá vất ngoài thủy giới\nLuôn vẫy vùng hướng tới nước nguồn\nTâm tu vẫy mạnh thoát trần\nQuyết lòng dẹp sạch Ma quân não phiền.",
            "Tâm phàm tục chuyền cành như khỉ\nTheo thú vui thành thị, xóm làng.\nLành thay, làm chủ được tâm\nGiữ tâm định tĩnh, bình an lâu dài.",
            "Tâm vi tế, khó nhìn, khó thấy\nTheo dục tham, thoải mái quay cuồng\nTrí nhân làm chủ được tâm\nNiềm vui nội tại phủ trùm khắp nơi.",
            "Đâu cần phải chạy xa, sống ẩn\nVào hang sâu, hóa hiện không thân.\nChi bằng điều phục được tâm\nVượt qua trói buộc của ngàn Ma quân.",
            "Đối với kẻ tâm không an trụ\nPháp nhiệm mầu khó tỏ nguồn khơi\nNiềm tin rúng động ,chơi vơi\nCòn nguồn trí tuệ rạng ngời khó thông.",
            "Khi tâm thoát dục tham, vướng mắc\nBuông hận thù, ganh ghét, hờn ghen\nAn toàn tuyệt đối trước sau,\nVượt trên thiện ác nhị nguyên\nXứng hàng tỉnh thức, không còn sầu lo.",
            "Thân năm uẩn như sành dễ bể\nGiữ gìn tâm như thể thành trì\nVung gươm trí tuệ diệt si\nThắng Ma quân xấu, chớ vì vinh quang.",
            "Thân vô thường, chẳng bao lâu nữa\nNằm vô tri trong cỗ quan tài\nKhi tâm thoát khỏi thân này\nThân như khúc gỗ chẳng xài vào đâu.",
            "Người ác độc diệt trừ đối thủ\nKẻ oan gia trả đũa oan gia\nKhông bằng tâm ác hại ta\nTrầm luân muôn kiếp, đường tà lún sâu.",
            "Cha mẹ muốn cho con hưởng phước\nThương cỡ nào, chẳng được dài lâu\nTâm lành, nhân tốt gieo sâu\nTự mình tạo dựng, quả mau lớn dần.",
            "Ai chinh phục địa cầu, thiên giới\nVượt lên trên cả cõi Diêm-ma\nSao bằng ngộ pháp Phật-đà\nNhư người khéo kết tràng hoa đẹp màu.",
            "Bậc hữu học vượt qua trời đất\nVượt lên trên cả cõi Diêm-ma\nLại thông chánh pháp Phật-đà\nNhư người khéo kết tràng hoa đẹp màu.",
            "Khi tỏ ngộ thân như bọt nước\nẢo ảnh như điện chớp trên không\nBẻ tan tên của Ma quân\nVượt tầm thần chết hàng ngàn dặm xa.",
            "Dùng vũ khí, gậy dao đánh đập\nHành hạ người, trù dập tơi bời\nQuả sầu mười loại sau đây:\nMột là đau nhức đêm ngày rên la;",
            "Hai, tai biến; ba là thương tật;\nBốn, độn căn, ngu ngốc, hay quên;\nNăm thường lận đận luật quan;\nSáu vương trọng tội bị oan, hiểu lầm.",
            "Bảy, thân quyến, họ hàng ly tán\nTám, chẳng may tài sản tiêu tan\nChín là hỏa hoạn, nghèo nàn\nMười sau khi chết đọa làm súc sinh.",
            "Dù lõa thể, ngồi lì, tuyệt thực;\nKhông gội đầu, bện tóc rối tung…\nĐừng hòng chuyển hóa tâm hồn\nNếu tâm nghi hoặc vẫn còn y nguyên.",
            "Sống trang sức bằng nguồn an tịnh\nĐiều phục tâm, giới hạnh, kiên trì\nThương người, mến vật, từ bi\nSa-môn, phạm chí sánh vì trời cao.",
            "Trong trời đất hiếm người chính niệm,\nBiết giữ mình, hổ thẹn, lương tâm\nTránh lời chỉ trích, chửi thầm\nCũng như ngựa giỏi chẳng cần phạt roi.",
            "Như ngựa quý chẳng cần roi chạm\nSống nhiệt tâm, dũng cảm, chuyên cần\nVững tin, giới đức, thiền hành\nChọn tìm giáo pháp, thấm nhuần lý chân.",
            "Gìn chính niệm, cùng Minh Hạnh túc\nNêu quyết tâm tam độc loại trừ,\nKhổ đau kết thúc, thản thư\nNgười này xứng bậc chân tu trên đời.",
            "Như thủy lợi làm kênh dẫn nước\nKẻ làm tên nắn vuốt cung tên\nThợ cây bào ván hai bên\nNgười khôn làm chủ bản thân đêm ngày.",
            "Cười sao được, sướng vui sao nổi\nKhi lửa tham cháy rụi thế gian\nTối tăm giăng phủ trời đêm\nSao không nỗ lực tìm đèn sáng soi?",
            "Thân bề ngoài, đẹp đầy nhựa sống\nỞ bên trong, một đống vết thương\nGây sầu, sao lại vấn vương?\nThân là giả tạm, vô thường, mong manh.",
            "Thân mấy chốc đã già, tàn tạ\nNơi chứa đầy bệnh khổ, hôi tanh\nVô thường tổ hợp mong manh\nChết là kết thúc, tái sanh hồng trần.",
            "Thân thể này màu bồ câu trắng\nNhư trái bầu, thu đến vứt đi.\nChết rồi thi thể gớm ghê\nCó gì vui thích, mải mê thân này?",
            "Ôi, thân thể như thành trì cổ\nDựng bằng xương, máu đỏ, thịt, gân\nChứa già, chết, bệnh từng phần\nCống cao, lừa dối; dáng duyên nỗi gì!",
            "Xe vua đẹp có ngày cũng cũ\nThân thể rồi u rũ, tàn phai\nPháp lành trẻ mãi, còn hoài\nHãy nên khắc cốt những lời thánh nhân.",
            "Trẻ ít học, già không hiểu biết\nChẳng khác gì bò đực lớn đầu\nThân to, cơ bắp, khỏe, mau\nNhưng không trí tuệ, khác nào bóng đêm?",
            "Lang thang suốt luân hồi bao kiếp\nQuyết đi tìm “ông xếp” xây nhà\nTìm hoài, tìm mãi, không ra\nTái sanh, khổ lụy, đọa sa ba đường.",
            "Nay ta cấm ngươi không xây nữa\nPhá cột kèo, ván cửa, rui mè…\nNay ta đã chứng niết-bàn\nÁi tham, chấp thủ tiêu tan hết rồi.",
            "Lúc còn trẻ chẳng màng đạo đức\nKhông học nghề, tự lập lo thân\nĐến già gặp phải khó khăn\nNhư cò ủ rũ, không còn cá tôm.",
            "Có người trẻ chẳng rèn đức hạnh\nKhông luyện nghề, không lãnh tiền lương\nKhi già, buồn tủi, sầu vương\nNhớ về dĩ vãng, thở than vắn dài.",
            "Người đánh giá bản thân là quý\nPhải chính tâm bảo vệ lấy mình\nNgày đêm người trí giữ gìn\nLuôn trong tỉnh thức, tịnh minh cõi lòng.",
            "Người trí tuệ bản thân vững chải\nTự chủ mình, hoàn thiện, chánh chân\nXong rồi, giáo hóa tha nhân\nSống trong gương mẫu, thế gian nể vì.",
            "Người gương mẫu thực hành hoàn tất\nMới đem ra giáo dục thế nhân\nTự mình làm chủ thân tâm\nSoi gương nhân cách, hạnh lành truyền trao.",
            "Người sáng suốt tự nương mình vững\nKhông tìm cầu, dựa dẫm vào ai\nLành thay, điều phục tâm này\nBiết tự điều phục, không hai trên đời.",
            "Các điều ác do mình tự tạo\nÁc do tâm, ai khác ngoài ta\nÁc nhân nghiền nát người tà\nNhư kim cương cứng nghiền qua đá thường.",
            "Như tầm gửi bám cây Phật pháp\nNgười buông lung giới đức chẳng gìn\nHạnh tà chuốc họa vào thân,\nKẻ thù sung sướng thấy mình tiêu tan.",
            "Làm điều ác không cần trình độ\nHãm hại ta đạo khổ dễ hơn\nKhó thay, làm thiện chánh chơn\nMình người lợi lạc, bình an cõi đời.",
            "Kẻ ác kiến ngu si, phỉ báng\nGiáo pháp hàng La-hán nhiệm mầu\nHại mình như ngọn trúc lau\nNgay khi trổ quả nhuốm màu diệt vong.",
            "Các điều ác do mình tự tạo\nRồi vướng vào khổ não, họa tai.\nĐiều lành ta tạo hôm nay\nQuả an vui đến sớm mai là thường.",
            "Nên hiểu rõ sạch trong, nhơ uế\nHành động do gốc rễ từ tâm\nCậy nhờ tha lực khó thành\nĐỗ lỗi “tại, bởi” sao đành, không nên.",
            "Dù phụng sự, vị tha thiết thực\nXin chớ quên thực tập lợi mình\nChuyên tâm học pháp cao minh\nHướng về giải thoát, đạt thành mới thôi.",
            "Người sáng suốt chớ ôm tà kiến\nSống buông lung, ti tiện qua ngày.\nNệp tà vạy, chớ kéo dài\nĐược vầy, sinh tử luân hồi sớm ra.",
            "Luôn tinh tấn không mê lạc thú\nHạnh thanh cao, tu sĩ thường ghi\nTrang nghiêm giới đức, hành trì\nHai đời hưởng phúc chỉ vì tu tâm.",
            "Hãy quán tưởng trong đời trần tục\nMọi thứ như bọt nước, huyễn vong.\nĐến khi ngộ lẽ vô thường\nTử thần không thể lần đường chân nhân.",
            "Cõi hồng trần đẹp tuồng ảo mộng\nNhư xe vua hoành tráng gấm thêu\nKẻ ngu tham đắm, chắt chiêu\nNgười khôn tỉnh thức, chẳng yêu nhiễm đời.",
            "Dù quá khứ buông lung, dục lạc\nNhưng về sau tỉnh thức, chuyển tâm\nLàm lành, tỏa sáng trần gian\nNhư trăng rằm chiếu, không còn mây che.",
            "Dù ngày trước gây bao tội lỗi\nNhưng hôm nay sám hối, hồi tâm\nLàm lành, tỏa sáng trần gian\nNhư trăng rằm chiếu, không còn mây che.",
            "Kẻ mù tối, thế gian đầy dẫy\nNgười sáng trong có mấy trên đời!\nNhư chim khôn chẳng vướng mồi\nNgười tu đạo đức an vui cõi trời.",
            "Như trời thẳm, thiên nga uốn lượn\nCó thần thông ẩn hiện không gian\nTrí nhân thoát chốn hồng trần\nVượt qua ma chướng, vững vàng đường tu.",
            "With những kẻ chẳng tôn trọng Pháp\nDùng vọng ngôn lừa lọc, rêu rao\nGhét thiện, bác bỏ đời sau...\nLún sâu đường ác, ngày nào vượt ra!",
            "Kẻ keo kiệt không sanh thiên giới\nNgười dại ngu chẳng đoái tình thương\nNgười hiền thích sống thiện lương\nĐời sau hưởng phúc khác thường thế nhân.",
            "Chứng sơ quả thánh nhân rạng rỡ\nHơn cõi trời Thiên chủ uy quyền\nHơn Trời trong chốn càn khôn\nKhó tìm trong cõi bụi hồng người hơn.",
            "Phật chiến thắng hoàn toàn cõi trược\nTham ái trừ, tuệ giác sâu ngần\nKhông lưu dấu vết trần gian\nĐố ai vẽ được bước chân vượt đời.",
            "Bậc giải thoát lưới tham, á dục\nHết tái sanh, tuệ giác sâu ngần\nKhông lưu dấu vết trần gian\nĐố ai vẽ được bước chân vượt đời.",
            "Người có trí thiền hành, tinh tấn\nTìm niềm vui trong hạnh viễn ly\nĐêm ngày tỉnh thức luôn khi\nTrời người kính trọng, sánh vì trăng sao.",
            "Thật hạnh phúc, làm người nhân đức\nQuả khó thay, sống thật tịnh thanh\nKhó thay, nghe pháp, thực hành\nKhó thay, gặp Phật chứng thành quả cao.",
            "Mọi hoàn cảnh không làm bất thiện\nDù khó khăn, phát triển nhân lành\nLuyện tâm, rèn ý tịnh thanh\nLà lời Phật dạy đành rành xưa nay.",
            "Tu nhẫn nhục: Khổ hành đáng quý\nĐạt niết-bàn: Quả vị tối cao\nChúng sinh: Chẳng hại tơ hào\nHạnh sa-môn ấy cao sâu khó bàn.",
            "Không phỉ báng, không làm thương tổn\nLàm chủ mình, giới bổn vẹn toàn\nĐoạn điệu ăn uống, định thiền\nSống đời an tịnh, không phiền một ai.",
            "Dù mưa rãi bạc vàng chưa thỏa\nLòng dục tham không đáy xưa nay\nTrí nhân hiệu rõ điều này\nKhổ nhiều, vui ít, không sai bao giờ.",
            "Ngộ lẽ ấy, người tu học Phật\nChẳng đam mê dục lạc người, trời\nQuyết lòng chuyển hóa, thảnh thơi\nKhông còn tham ái, rạng ngời nhân gian.",
            "Trong nguy khổ, người tìm nương tựa\nHoặc thần linh, rừng rú, non cao,\nMiếu, đình, cây, vật, hang sâu,\nVái van, hiến tế, mong sao an lành.",
            "Nương tựa ấy hoàn toàn vô bổ\nTìm loanh quanh, nhiều chỗ bất an\nKhổ đau còn đó, chưa tan\nChỉ do mê tín, chẳng thành tựu chi.",
            "Người có phước, tìm về Tam bảo\nPhật, Pháp, Tăng quý báu khó hơn\nKhó khăn, bất hạnh tựa nương\nDùng Bốn chân lý làm phương thoát nàn.",
            "Thấy đau khổ, nguyên nhân gây khổ\nThấy Niết-bàn, thánh lộ tám ngành\nĐưa người đến chốn bình an\nKhông còn bất hạnh, trần gian muộn phiền.",
            "Nương tựa ấy tạo nên quả phước\nNguồn tâm linh, thể đạt an vui\nNgười khôn nương tựa đời đời\nVẫy chào đau khổ, thảnh thơi cuộc đời.",
            "Bậc trí tuệ vun bồi giới đức\nTìm khắp nơi hiếm được một người\nChỗ nào có bậc trí tài\nXóm làng hạnh phúc, cuộc đời bình An.",

        // --- HÀM HỖ TRỢ ---
        const formatDateTimeForInput = (date) => {
            if (!date) return '';
            const d = new Date(date);
            const pad = (n) => n.toString().padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        };

        const formatDisplayDate = (seconds) => {
            if (!seconds) return '';
            return new Date(seconds * 1000).toLocaleString('vi-VN', { hour: '2-digit', minute:'2-digit', day:'2-digit', month:'2-digit' });
        };

        // Kiểm tra 1 giờ cụ thể (chuỗi "HH:mm") có bị trùng (trong khoảng bufferMinutes) với danh sách
        // giờ đã có hay không — trả về phút của mốc trùng gần nhất, hoặc null nếu không trùng.
        const checkTimeConflict = (timeStr, bookedMinutesList, bufferMinutes = 30) => {
            if (!timeStr) return null;
            const [hh, mm] = timeStr.split(':').map(Number);
            if (isNaN(hh)) return null;
            const target = hh * 60 + mm;
            const conflict = bookedMinutesList.find(b => Math.abs(b - target) < bufferMinutes);
            return conflict !== undefined ? conflict : null;
        };

        const getRemainingTime = (timestamp) => {
            if (!timestamp) return null;
            const now = new Date();
            const deadline = new Date(timestamp.seconds * 1000);
            const diff = deadline - now;
            if (diff < 0) {
                const overdueDays = Math.floor(Math.abs(diff) / (1000 * 60 * 60 * 24));
                const overdueHours = Math.floor((Math.abs(diff) % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                let text = "Quá hạn ";
                if (overdueDays > 0) text += `${overdueDays} ngày`;
                else text += `${overdueHours} giờ`;
                return { text: text, isOverdue: true };
            }
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            if (days > 0) return { text: `Còn ${days} ngày, ${hours} giờ`, isOverdue: false };
            if (hours > 0) return { text: `Còn ${hours} giờ, ${minutes} phút`, isOverdue: false };
            return { text: 'Sắp đến hạn', isOverdue: false };
        };

        // THUẬT TOÁN CHUYỂN ĐỔI DƯƠNG LỊCH SANG ÂM LỊCH VIỆT NAM (dựa trên múi giờ UTC+7)
        // Nguyên lý: xác định các điểm Sóc (New Moon - thời điểm trăng non) và kinh độ Mặt Trời
        // theo tọa độ thiên văn, quy đổi mọi mốc thời gian về múi giờ Việt Nam (UTC+7) để
        // tính đúng ngày bắt đầu tháng Âm lịch và năm nhuận theo quy ước lịch Việt Nam.
        // ==================================================================================
        const VN_TIMEZONE = 7; // Việt Nam sử dụng múi giờ UTC+7 làm chuẩn tính lịch Âm

        // Quy đổi ngày Dương lịch (dd/mm/yyyy) sang số ngày Julius (Julian Day Number)
        const jdFromDate = (dd, mm, yy) => {
            const a = Math.floor((14 - mm) / 12);
            const y = yy + 4800 - a;
            const m = mm + 12 * a - 3;
            let jd = dd + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4)
                - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
            if (jd < 2299161) {
                jd = dd + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - 32083;
            }
            return jd;
        };

        // Tính kinh độ Mặt Trời (đơn vị: cung 30 độ, 0-11) tại thời điểm jdn, quy theo múi giờ
        const getSunLongitude = (jdn, timeZone) => {
            const T = (jdn - 2451545.5 - timeZone / 24) / 36525;
            const T2 = T * T;
            const dr = Math.PI / 180;
            const M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2;
            const L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;
            let DL = (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M);
            DL += (0.019993 - 0.000101 * T) * Math.sin(dr * 2 * M) + 0.000290 * Math.sin(dr * 3 * M);
            let L = (L0 + DL) * dr;
            L -= Math.PI * 2 * Math.floor(L / (Math.PI * 2));
            return Math.floor((L / Math.PI) * 6);
        };

        // sai số thường vài phút tới khoảng 1 giờ. Bình thường sai số này không ảnh hưởng gì (ngày Âm
        // lịch vẫn đúng), nhưng nếu trăng non thực tế rơi quá SÁT nửa đêm giờ Việt Nam (chỉ lệch vài
        // chục phút), sai số đó đủ để "nhảy" sang tính sai hẳn 1 ngày.

        // Định dạng: k (số thứ tự kỳ trăng non, xem getNewMoonDay) → số ngày cần cộng thêm (thường +1).
        const LUNAR_NEW_MOON_K_CORRECTIONS = {

            // 2026 đủ 30 ngày, mùng 1 tháng 7 Âm là 13/8/2026 dương lịch).
            1566: 1,
        };
        // Tính thời điểm Sóc (New Moon) lần thứ k kể từ mốc gốc, trả về số ngày Julius quy theo múi giờ
        const getNewMoonDay = (k, timeZone) => {
            const T = k / 1236.85;
            const T2 = T * T;
            const T3 = T2 * T;
            const dr = Math.PI / 180;
            let jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3;
            jd1 += 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * dr);
            const M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
            const Mpr = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3;
            const F = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3;
            let C1 = (0.1734 - 0.000393 * T) * Math.sin(M * dr) + 0.0021 * Math.sin(2 * dr * M);
            C1 -= 0.4068 * Math.sin(Mpr * dr) + 0.0161 * Math.sin(dr * 2 * Mpr);
            C1 -= 0.0004 * Math.sin(dr * 3 * Mpr);
            C1 += 0.0104 * Math.sin(dr * 2 * F) - 0.0051 * Math.sin(dr * (M + Mpr));
            C1 -= 0.0074 * Math.sin(dr * (M - Mpr)) + 0.0004 * Math.sin(dr * (2 * F + M));
            C1 -= 0.0004 * Math.sin(dr * (2 * F - M)) - 0.0006 * Math.sin(dr * (2 * F + Mpr));
            C1 += 0.0010 * Math.sin(dr * (2 * F - Mpr)) + 0.0005 * Math.sin(dr * (2 * Mpr + M));
            let deltaT;
            if (T < -11) {
                deltaT = 0.001 + 0.000839 * T + 0.0002261 * T2 - 0.00000845 * T3 - 0.000000081 * T * T3;
            } else {
                deltaT = -0.000278 + 0.000265 * T + 0.000262 * T2;
            }
            const jdNew = jd1 + C1 - deltaT;
            let result = Math.floor(jdNew + 0.5 + timeZone / 24);
            if (LUNAR_NEW_MOON_K_CORRECTIONS[k]) result += LUNAR_NEW_MOON_K_CORRECTIONS[k];
            return result;
        };

        // Tìm ngày (Julius) mà tháng 11 Âm lịch của năm yy bắt đầu (dùng làm mốc quy chiếu năm Âm lịch)
        const getLunarMonth11 = (yy, timeZone) => {
            const off = jdFromDate(31, 12, yy) - 2415021;
            const k = Math.floor(off / 29.530588853);
            let nm = getNewMoonDay(k, timeZone);
            if (getSunLongitude(nm, timeZone) >= 9) {
                nm = getNewMoonDay(k - 1, timeZone);
            }
            return nm;
        };

        // Xác định tháng nhuận (nếu năm Âm lịch có 13 tháng) rơi vào vị trí thứ mấy
        const getLeapMonthOffset = (a11, timeZone) => {
            const k = Math.floor((a11 - 2415021.076998695) / 29.530588853 + 0.5);
            let last = getSunLongitude(getNewMoonDay(k + 1, timeZone), timeZone);
            let i = 1;
            let arc = last;
            do {
                i++;
                last = arc;
                arc = getSunLongitude(getNewMoonDay(k + i, timeZone), timeZone);
            } while (arc !== last && i < 14);
            return i - 1;
        };

        // HÀM CHÍNH: chuyển một ngày Dương lịch (dd/mm/yyyy) sang ngày Âm lịch Việt Nam
        // Trả về { day, month, year, leap } — leap = true nếu rơi vào tháng nhuận
        const convertSolar2Lunar = (dd, mm, yy, timeZone = VN_TIMEZONE) => {
            const dayNumber = jdFromDate(dd, mm, yy);
            const k = Math.floor((dayNumber - 2415021.076998695) / 29.530588853);
            let monthStart = getNewMoonDay(k + 1, timeZone);
            if (monthStart > dayNumber) monthStart = getNewMoonDay(k, timeZone);

            let a11 = getLunarMonth11(yy, timeZone);
            let b11 = a11;
            let lunarYear;
            if (a11 >= monthStart) {
                lunarYear = yy;
                a11 = getLunarMonth11(yy - 1, timeZone);
            } else {
                lunarYear = yy + 1;
                b11 = getLunarMonth11(yy + 1, timeZone);
            }

            const lunarDay = dayNumber - monthStart + 1;
            const diff = Math.floor((monthStart - a11) / 29);
            let lunarLeap = false;
            let lunarMonth = diff + 11;

            if (b11 - a11 > 365) {
                const leapMonthOff = getLeapMonthOffset(a11, timeZone);
                if (diff >= leapMonthOff) {
                    lunarMonth = diff + 10;
                    if (diff === leapMonthOff) lunarLeap = true;
                }
            }
            if (lunarMonth > 12) lunarMonth -= 12;
            if (lunarMonth >= 11 && diff < 4) lunarYear -= 1;

            return { day: lunarDay, month: lunarMonth, year: lunarYear, leap: lunarLeap };
        };

        // Quy đổi một đối tượng Date bất kỳ (theo giờ máy người dùng) về đúng ngày/tháng/năm
        // theo múi giờ UTC+7 của Việt Nam, để đảm bảo tính Âm lịch luôn chính xác dù người dùng ở múi giờ khác
        // Nguyên lý: date.getTime() luôn là mốc thời gian UTC tuyệt đối (bất kể múi giờ máy đang đặt là gì),
        // nên chỉ cần cộng thêm đúng 7 giờ rồi đọc lại bằng các hàm getUTC... để có ngày/giờ theo giờ Việt Nam.
        const toVNDateParts = (date) => {
            const vnMs = date.getTime() + VN_TIMEZONE * 3600000;
            const vnDate = new Date(vnMs);
            return { dd: vnDate.getUTCDate(), mm: vnDate.getUTCMonth() + 1, yy: vnDate.getUTCFullYear() };

        // ==================== KẾT THÚC THUẬT TOÁN CHUYỂN ĐỔI ÂM LỊCH VIỆT NAM ====================

        // Trả về thông tin ngày lễ (nếu có) cho một ngày cụ thể, ưu tiên kiểm tra cả Dương lịch, Âm lịch và Giao thừa

        // ── THÔNG BÁO ĐẨY (PUSH) - HOẠT ĐỘNG NGAY CẢ KHI ĐÃ TẮT HẲN TRÌNH DUYỆT ──
        // Khóa công khai VAPID dùng để đăng ký nhận Push. Đây LÀ khóa công khai,

        const VAPID_PUBLIC_KEY = 'BOhjTSUQyLsqwauL7-ifTVx32UgAaHPatYcxIK-JJ8YUASPIpCqLKXLxtcbNZLfhoAEKyH6BhEh6LEcBCIkqfE8';

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
            return outputArray;
        }

        // Tạo 1 ID ngắn gọn, ổn định từ endpoint push để làm ID tài liệu Firestore
        const pushSubIdFromEndpoint = (endpoint) => {
            let hash = 0;
            for (let i = 0; i < endpoint.length; i++) {
                hash = ((hash << 5) - hash + endpoint.charCodeAt(i)) | 0;
            }
            return 'sub_' + Math.abs(hash).toString(36) + '_' + endpoint.slice(-24).replace(/[^a-zA-Z0-9]/g, '');

        const enablePushNotifications = async (db, appId, uid) => {

                        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
                    });

                const subId = pushSubIdFromEndpoint(subJson.endpoint);
                await setDoc(doc(db, 'artifacts', appId, 'users', uid, 'pushSubscriptions', subId), {
                    endpoint: subJson.endpoint,

                    createdAt: Timestamp.now(),

        const REMINDERS_STORAGE_KEY = 'vt_scheduled_reminders';

                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 800;
                gainNode.gain.value = 0.2;
                oscillator.start();
                setTimeout(() => oscillator.stop(), 200);

        // Kiểm tra và bắn các nhắc nhở đã tới giờ. Gọi định kỳ + mỗi khi mở lại app.
        const checkDueReminders = async () => {

            const list = getStoredReminders();
            if (list.length === 0) return;
            const now = Date.now();

                    if (r.repeatType === 'daily' || r.repeatType === 'custom') {
                        const days = r.repeatType === 'daily' ? 1 : (parseInt(r.repeatDays, 10) || 1);
                        let next = r.triggerTime;
                        while (next <= now) { next += days * 86400000; }

                } else {
                    remaining.push(r);

            if (firedAny) {

        // Alias để tránh xung đột tên với biến state query nội bộ trong GlobalSearchModal
        const query_q = (ref) => query(ref);

        // --- HÀM PARSE NGÀY TỪ CHUỖI TÌM KIẾM ---
        // Hỗ trợ: d/m/yy, d/m/yyyy, dd/mm/yy, dd/mm/yyyy
        const parseSearchDate = (str) => {
            const s = str.trim();
            const match = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
            if (!match) return null;
            let [, d, m, y] = match;
            d = parseInt(d, 10);
            m = parseInt(m, 10);
            y = parseInt(y, 10);
            if (y < 100) y += 2000; // yy → yyyy
            if (m < 1 || m > 12 || d < 1 || d > 31) return null;
            const date = new Date(y, m - 1, d);
            // Kiểm tra ngày hợp lệ (vd: 31/2 sẽ bị reject)
            if (date.getFullYear() !== y || date.getMonth() !== m - 1 || date.getDate() !== d) return null;
            return date;
        };

        // ==============================================================
        // MÀU NỀN ỨNG DỤNG: 3 chế độ — (1) Ngẫu nhiên theo ngày, (2) Theo thứ trong tuần
        // (người dùng tự chọn), (3) Màu tùy chọn cố định (tính năng gốc, giữ nguyên).
        // Toàn bộ màu trong bảng pastel đều nhẹ nhàng/tươi sáng, tránh sặc sỡ - gay gắt.
        // ==============================================================

        // Bảng màu pastel dùng cho chế độ "Ngẫu nhiên mỗi ngày"
        // 31 màu pastel nhẹ nhàng, khác nhau — đủ để mỗi ngày trong tháng có 1 màu riêng, không lặp lại
        // trong cùng 1 tháng (theo yêu cầu "càng nhiều càng tốt / mỗi ngày 1 màu theo tháng").
        const PASTEL_BG_PALETTE = [
            '#F8DDDD', '#F8E3DD', '#F8E8DD', '#F8EDDD', '#F8F2DD', '#F8F7DD', '#F3F8DD', '#EFF8DD', '#E9F8DD', '#E4F8DD',
            '#DFF8DD', '#DDF8E1', '#DDF8E6', '#DDF8EB', '#DDF8F0', '#DDF8F5', '#DDF5F8', '#DDF0F8', '#DDEBF8', '#DDE6F8',
            '#DDE1F8', '#DFDDF8', '#E4DDF8', '#E9DDF8', '#EFDDF8', '#F3DDF8', '#F8DDF7', '#F8DDF2', '#F8DDED', '#F8DDE8', '#F8DDE3'
        ];

        // Màu mặc định cho từng thứ (Thứ 2 → Chủ nhật), người dùng có thể tự đổi trong Cài đặt
        const DEFAULT_WEEKDAY_BG_COLORS = {
            t2: '#E8F4FD', // Thứ 2 - xanh dương nhạt
            t3: '#E8FBF0', // Thứ 3 - xanh lá nhạt
            t4: '#FEF6DF', // Thứ 4 - vàng nhạt
            t5: '#F4EBFD', // Thứ 5 - tím nhạt
            t6: '#FDECEC', // Thứ 6 - hồng nhạt
            t7: '#E0F7F5', // Thứ 7 - ngọc nhạt
            cn: '#FDF0E4', // Chủ nhật - cam nhạt
        };
        const WEEKDAY_ORDER = ['t2', 't3', 't4', 't5', 't6', 't7', 'cn'];
        const WEEKDAY_LABELS = { t2: 'Thứ 2', t3: 'Thứ 3', t4: 'Thứ 4', t5: 'Thứ 5', t6: 'Thứ 6', t7: 'Thứ 7', cn: 'Chủ nhật' };

        // JS Date.getDay(): 0 = Chủ nhật, 1 = Thứ 2, ... 6 = Thứ 7
        const getWeekdayKey = (date) => ['cn', 't2', 't3', 't4', 't5', 't6', 't7'][date.getDay()];

        // Chọn 1 màu pastel theo NGÀY TRONG THÁNG (mỗi ngày 1 màu riêng, không lặp lại trong cùng 1
        // tháng vì bảng màu có đủ 31 màu) — ổn định theo ngày, sang ngày mới mới đổi màu khác.
        const getRandomPastelForDate = (date) => {
            return PASTEL_BG_PALETTE[(date.getDate() - 1) % PASTEL_BG_PALETTE.length];
        };

        // Tính màu nền thực tế đang áp dụng, dựa trên theme.bgMode ('random' | 'weekday' | 'fixed'/mặc định)
        const getEffectiveBgColor = (theme, now) => {
            if (theme.bgMode === 'random') return getRandomPastelForDate(now);
            if (theme.bgMode === 'weekday') {
                const key = getWeekdayKey(now);
                return (theme.weekdayColors && theme.weekdayColors[key]) || DEFAULT_WEEKDAY_BG_COLORS[key];
            }
            return theme.bgColor || '#f3f4f6';
        };

        // --- CHUẨN HÓA TIẾNG VIỆT: bỏ dấu để tìm "khong dau" vẫn ra kết quả "không dấu" ---
        // Bỏ hết thẻ HTML, chỉ lấy văn bản thuần — dùng cho các chỗ KHÔNG được phép chứa HTML thô
        // (tìm kiếm, thông báo, gửi cho AI...) vì các ô Việc cần làm/Ghi chú/Lịch biểu giờ có thể lưu
        // định dạng (đậm/nghiêng/màu...) dưới dạng HTML sau khi thêm thanh định dạng chữ.
        const stripHtml = (html) => {
            if (!html) return '';
            if (!/[<&]/.test(html)) return html; // không có gì cần bóc tách thì trả về luôn cho nhanh
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            return (tmp.textContent || tmp.innerText || '').trim();
        };

        // Dùng khi đổ dữ liệu 1 dòng ghi chú (đã lưu dạng HTML để giữ định dạng) vào ô contentEditable
        // bằng innerHTML. Ghi chú TẠO TỪ TRƯỚC khi có tính năng định dạng chữ vẫn đang lưu dạng văn
        // bản thường — nếu chẳng may trong đó có sẵn ký tự '<', '>', '&' đơn lẻ (không tạo thành thẻ
        // HTML thật sự), gán thẳng qua innerHTML có thể bị trình duyệt hiểu nhầm/vỡ hiển thị. Vì vậy:
        // chỉ coi là HTML thật khi thấy đúng khuôn dạng 1 thẻ (ví dụ <b>, <span style="...">), còn lại
        // luôn mã hóa (escape) an toàn trước khi gán.
        const looksLikeRealHtml = (str) => /<[a-z][^>]*>/i.test(str || '');
        const escapeHtml = (str) => (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const toSafeLineHtml = (str) => (looksLikeRealHtml(str) ? str : escapeHtml(str));

        const normalizeVN = (str) => {
            if (!str) return '';
            return str.toString()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // bỏ dấu thanh/dấu mũ/móc
                .replace(/đ/g, 'd').replace(/Đ/g, 'D')             // đ/Đ không tách được bằng NFD nên xử lý riêng
                .toLowerCase().trim();
        };

        // Viết hoa CHỮ CÁI đầu tiên của chuỗi — tự bỏ qua mọi ký tự không phải chữ cái ở đầu (emoji,
        // khoảng trắng...) để không viết hoa nhầm emoji hay để sót chữ cái thật sự đầu tiên, ví dụ
        // "🔥 đi khám răng" → viết hoa đúng chữ "đ" thành "Đ", không đụng vào emoji "🔥".
        const capitalizeFirstLetter = (str) => {
            if (!str) return str;
            const m = str.match(/\p{L}/u);
            if (!m) return str;
            const idx = m.index;
            return str.slice(0, idx) + str.charAt(idx).toUpperCase() + str.slice(idx + 1);
        };

        // --- TÌM KIẾM NGỮ NGHĨA (nhẹ): nhận diện khoảng thời gian tương đối trong câu tìm kiếm ---
        // Hỗ trợ: hôm nay, hôm qua, ngày mai, tuần này/trước/sau, tháng này/trước/sau, năm nay/trước/sau/ngoái
        const getRelativeDateRange = (rawText) => {
            const text = normalizeVN(rawText);
            const now = new Date();
            const startOfDay = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
            const endOfDay = (d) => { const x = new Date(d); x.setHours(23,59,59,999); return x; };
            const mondayOf = (d) => { const x = new Date(d); const day = (x.getDay() + 6) % 7; x.setDate(x.getDate() - day); return startOfDay(x); };

            const rules = [
                { re: /\bhom nay\b/,              range: () => [startOfDay(now), endOfDay(now)] },
                { re: /\bhom qua\b/,               range: () => { const d = new Date(now); d.setDate(d.getDate()-1); return [startOfDay(d), endOfDay(d)]; } },
                { re: /\bngay mai\b/,              range: () => { const d = new Date(now); d.setDate(d.getDate()+1); return [startOfDay(d), endOfDay(d)]; } },
                { re: /\btuan nay\b/,              range: () => { const m = mondayOf(now); const e = new Date(m); e.setDate(e.getDate()+6); return [m, endOfDay(e)]; } },
                { re: /\btuan truoc\b/,            range: () => { const m = mondayOf(now); m.setDate(m.getDate()-7); const e = new Date(m); e.setDate(e.getDate()+6); return [m, endOfDay(e)]; } },
                { re: /\btuan sau\b/,              range: () => { const m = mondayOf(now); m.setDate(m.getDate()+7); const e = new Date(m); e.setDate(e.getDate()+6); return [m, endOfDay(e)]; } },
                { re: /\bthang nay\b/,             range: () => { const s = new Date(now.getFullYear(), now.getMonth(), 1); const e = new Date(now.getFullYear(), now.getMonth()+1, 0); return [startOfDay(s), endOfDay(e)]; } },
                { re: /\bthang truoc\b/,           range: () => { const s = new Date(now.getFullYear(), now.getMonth()-1, 1); const e = new Date(now.getFullYear(), now.getMonth(), 0); return [startOfDay(s), endOfDay(e)]; } },
                { re: /\bthang sau\b/,             range: () => { const s = new Date(now.getFullYear(), now.getMonth()+1, 1); const e = new Date(now.getFullYear(), now.getMonth()+2, 0); return [startOfDay(s), endOfDay(e)]; } },
                { re: /\bnam nay\b/,               range: () => [startOfDay(new Date(now.getFullYear(),0,1)), endOfDay(new Date(now.getFullYear(),11,31))] },
                { re: /\bnam truoc\b|\bnam ngoai\b/, range: () => [startOfDay(new Date(now.getFullYear()-1,0,1)), endOfDay(new Date(now.getFullYear()-1,11,31))] },
                { re: /\bnam sau\b/,               range: () => [startOfDay(new Date(now.getFullYear()+1,0,1)), endOfDay(new Date(now.getFullYear()+1,11,31))] },
            ];

            for (const rule of rules) {
                const m = text.match(rule.re);
                if (m) {
                    const [start, end] = rule.range();
                    return { start, end, matched: m[0] };
                }
            }
            return null;
        };

        // --- TÌM KIẾM NGỮ NGHĨA (nhẹ): nhận diện ý định muốn tìm trong danh mục nào ---
        const CATEGORY_HINTS = {
            events:    [/\bsu kien\b/, /\bcuoc hop\b/, /\blich hen\b/, /\bhop\b/],
            todos:     [/\bcong viec\b/, /\bviec can lam\b/, /\bnhiem vu\b/, /\btodo\b/],
            notes:     [/\bghi chu\b/, /\bnote\b/, /\bghi nho\b/],
            timetable: [/\bthoi khoa bieu\b/, /\btkb\b/, /\blich hoc\b/, /\btiet hoc\b/],
        };
        const detectCategoryIntent = (rawText) => {
            const text = normalizeVN(rawText);
            for (const [cat, patterns] of Object.entries(CATEGORY_HINTS)) {
                for (const re of patterns) {
                    const m = text.match(re);
                    if (m) return { category: cat, matched: m[0] };
                }
            }
            return null;
        };

        // Nhận diện câu tìm kiếm theo TRẠNG THÁI HOÀN THÀNH (mục 4) — ví dụ gõ "chưa hoàn thành"
        // hoặc "đã xong" để lọc thẳng theo trạng thái, thay vì so khớp chữ trong nội dung.
        // Kiểm tra CÓ MẶT chữ "hoàn thành"/"xong" và chữ "chưa" ở BẤT KỲ ĐÂU trong câu (không bắt
        // buộc đứng liền nhau) — vì câu tự nhiên thường chèn thêm chữ ở giữa (vd "chưa TICK hoàn
        // thành"), yêu cầu đứng liền kề trước đây khiến không nhận diện được các câu như vậy.
        const detectCompletionIntent = (rawText) => {
            const text = normalizeVN(rawText);
            const mentionsDone = /\b(hoan\s*thanh|xong)\b/.test(text);
            if (!mentionsDone) return null;
            const mentionsChua = /\bchua\b/.test(text);
            return mentionsChua ? 'pending' : 'done';
        };

        // --- LỌC TRÙNG TÊN SỰ KIỆN TRONG KẾT QUẢ TÌM KIẾM ---
        // Nhiều sự kiện có thể trùng tên do lặp lại (hàng tuần/hàng tháng/hàng năm...). Với mỗi tên
        // trùng nhau, chỉ giữ lại 1 bản "gần nhất": ưu tiên lần sắp diễn ra gần nhất trong tương lai
        // (kể cả hôm nay); nếu không còn lần nào ở tương lai thì lấy lần gần nhất đã diễn ra trong quá khứ.
        const dedupeEventsByNearest = (events) => {
            const groups = new Map();
            for (const ev of events) {
                const key = normalizeVN(ev.title || '');
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(ev);
            }
            const now = new Date();
            const result = [];
            for (const list of groups.values()) {
                if (list.length === 1) { result.push(list[0]); continue; }
                // Sự kiện không có ngày (nếu có) luôn được giữ lại riêng, không tham gia so sánh ngày
                const withDate = list.filter(e => e.date);
                const withoutDate = list.filter(e => !e.date);
                if (withDate.length === 0) { result.push(...withoutDate); continue; }
                let best = null, bestDiff = Infinity, bestIsFuture = false;
                for (const e of withDate) {
                    const d = new Date(e.date.seconds * 1000);
                    const diff = d - now;
                    const isFuture = diff >= 0;
                    if (isFuture) {
                        // Trong các lần tương lai, chọn lần gần hiện tại nhất
                        if (!bestIsFuture || diff < bestDiff) { best = e; bestDiff = diff; bestIsFuture = true; }
                    } else if (!bestIsFuture) {
                        // Chưa tìm được lần tương lai nào -> so sánh các lần quá khứ, chọn gần nhất
                        const absDiff = Math.abs(diff);
                        if (absDiff < bestDiff) { best = e; bestDiff = absDiff; }
                    }
                }
                if (best) result.push(best);
                result.push(...withoutDate);
            }
            // Giữ thứ tự gần giống ban đầu (theo độ khớp tìm kiếm) bằng cách sắp xếp lại theo vị trí xuất hiện đầu tiên trong danh sách gốc
            const order = new Map(events.map((e, i) => [e.id, i]));
            result.sort((a, b) => (order.get(a.id) ?? 0) - (order.get(b.id) ?? 0));
            return result;
        };

        // --- QUẢN LÝ "vt_completed_alerts" (danh sách nhắc việc đã tích "Hoàn thành") ---
        // Trước đây mỗi mục chỉ lưu giá trị "true" (không có mốc thời gian) nên localStorage sẽ
        // phình to vô hạn theo thời gian vì không bao giờ tự xoá. Nay lưu kèm mốc thời gian hoàn
        // thành (ts) và tự động dọn các mục đã hoàn thành quá 30 ngày mỗi khi ứng dụng khởi động.
        // Trước đây có tự động "hết hạn" sau 30 ngày — đã bỏ theo đúng yêu
        // cầu: một khi đã tích "đã xem/xử lý" trong thông báo thì NHỚ VĨNH VIỄN, không tự động hỏi lại
        // nữa dù bao lâu sau đó. Giữ lại hàm này chỉ để chuẩn hoá định dạng dữ liệu cũ (thời trước chỉ
        // lưu "true" đơn giản, chưa có mốc thời gian) sang định dạng {done, ts} thống nhất.
        const normalizeAndPruneCompletedAlerts = (raw) => {
            const now = Date.now();
            const result = {};
            Object.keys(raw || {}).forEach(id => {
                const v = raw[id];
                const ts = (v && typeof v === 'object' && v.ts) ? v.ts : now;
                result[id] = { done: true, ts };
            });
            return result;
        };
        const isAlertMarkedCompleted = (completedObj, id) => {
            const v = completedObj && completedObj[id];
            return v === true || (v && typeof v === 'object' && v.done === true);
        };

        // Kiểm tra chuỗi ngày nhập từ input type="date" (yyyy-mm-dd) có hợp lệ hay không —
        // dùng để validate trước khi lưu, tránh Timestamp.fromDate() bị lỗi với ngày sai định dạng.
        const isValidDateInputStr = (str) => {
            if (!str || typeof str !== 'string') return false;
            const m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (!m) return false;
            const d = new Date(str);
            return !isNaN(d.getTime());
        };

        // ==============================================================================
        // TẦNG 1 — SMART ENGINE (Rule-based Intelligence)
        // Phân tích 1 câu tiếng Việt tự nhiên thành {title, date, hasTime, confidence}
        // KHÔNG gọi mạng, KHÔNG cần AI — luôn chạy được kể cả offline / chưa cấu hình AI.
        // Theo đúng nguyên tắc "gửi tối thiểu, xử lý tối đa": chỉ khi tầng này không đủ
        // tự tin (confidence 'low' / null) mới cân nhắc chuyển sang gọi AI (Tầng 2).
        //
        // Đã tối ưu (nhận thêm nhiều mẫu câu hơn, sửa vài chỗ nhận diện thiếu/sai, và biên dịch sẵn
        // các regex cố định thay vì dựng lại mỗi lần gọi) — chi tiết xem chú thích ở từng đoạn bên dưới.
        // ==============================================================================
        // Khoá không dấu (đã qua normalizeVN) để khớp đúng với "text" đã chuẩn hoá trong parseVietnameseDateTime
        const VN_WEEKDAYS = { 'chu nhat': 0, 'cn': 0, 'thu 2': 1, 'thu hai': 1, 'thu 3': 2, 'thu ba': 2, 'thu 4': 3, 'thu tu': 3, 'thu 5': 4, 'thu nam': 4, 'thu 6': 5, 'thu sau': 5, 'thu 7': 6, 'thu bay': 6 };
        // Biên dịch sẵn regex của từng thứ trong tuần NGAY KHI TẢI TRANG (1 lần duy nhất), thay vì phải
        // dựng lại (new RegExp) mỗi lần gọi parseVietnameseDateTime — đỡ tốn công vô ích vì các mẫu này
        // không bao giờ đổi trong suốt vòng đời trang.
        const VN_WEEKDAY_PATTERNS = Object.keys(VN_WEEKDAYS).map(key => ({
            value: VN_WEEKDAYS[key],
            re: new RegExp('\\b' + key.replace(/\s+/g, '\\s+') + '\\b', 'i'),
        }));

        // ==============================================================================
        // Bí danh ngày lễ hay được gọi tắt (khác với tên đầy đủ trong SOLAR_HOLIDAYS/LUNAR_HOLIDAYS)
        // — để nhận diện được cả khi người dùng gõ ngắn gọn kiểu "Tết", "Quốc khánh", "Trung thu"...
        // ==============================================================================
        const HOLIDAY_ALIASES = [
            { norm: 'tet nguyen dan', month: 1, day: 1, lunar: true },
            { norm: 'tet am lich', month: 1, day: 1, lunar: true },
            { norm: 'tet duong lich', month: 1, day: 1, lunar: false },
            { norm: 'tet', month: 1, day: 1, lunar: true }, // "Tết" nói suông → hiểu là Tết Nguyên Đán (phổ biến hơn hẳn)
            { norm: 'quoc khanh', month: 9, day: 2, lunar: false },
            { norm: 'gio to hung vuong', month: 3, day: 10, lunar: true },
            { norm: 'gio to', month: 3, day: 10, lunar: true },
            { norm: 'trung thu', month: 8, day: 15, lunar: true },
            { norm: 'valentine', month: 2, day: 14, lunar: false },
            { norm: 'giang sinh', month: 12, day: 25, lunar: false },
            { norm: 'noel', month: 12, day: 25, lunar: false },
            { norm: 'quoc te phu nu', month: 3, day: 8, lunar: false },
            { norm: 'phu nu viet nam', month: 10, day: 20, lunar: false },
            { norm: 'nha giao viet nam', month: 11, day: 20, lunar: false },
            { norm: 'quoc te lao dong', month: 5, day: 1, lunar: false },
            { norm: 'quoc te thieu nhi', month: 6, day: 1, lunar: false },
            { norm: 'vu lan', month: 7, day: 15, lunar: true },
            { norm: 'doan ngo', month: 5, day: 5, lunar: true },
            { norm: 'ram thang gieng', month: 1, day: 15, lunar: true },
        ].sort((a, b) => b.norm.length - a.norm.length); // tên dài/cụ thể hơn kiểm tra trước, tránh bị tên ngắn "nuốt" nhầm

        const parseVietnameseDateTime = (rawText, now) => {
            if (!rawText || !rawText.trim()) return null;
            now = now || new Date();
            const trimmedRaw = rawText.trim();
            let text = normalizeVN(trimmedRaw);
            let title = trimmedRaw;
            let matchedDate = null;
            let matchedTime = null;
            const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const toIsoWeekday = (jsDay) => (jsDay + 6) % 7;

            const consume = (re) => {
                const m = text.match(re);
                if (!m) return null;
                const start = m.index, end = start + m[0].length;
                const blank = ' '.repeat(end - start);
                text = text.slice(0, start) + blank + text.slice(end);
                title = title.slice(0, start) + blank + title.slice(end);
                return m;
            };
            // Giống consume(), nhưng so khớp trên bản CÓ DẤU gốc (title) thay vì bản đã bỏ dấu (text) — cần
            // thiết cho vài từ mà bỏ dấu xong lại trùng y hệt từ khác nghĩa hoàn toàn khác, ví dụ "gấp" (khẩn
            // cấp) và "gặp" (gặp gỡ) đều thành "gap" sau khi bỏ dấu.
            const consumeAccented = (re) => {
                const m = title.match(re);
                if (!m) return null;
                const start = m.index, end = start + m[0].length;
                const blank = ' '.repeat(end - start);
                text = text.slice(0, start) + blank + text.slice(end);
                title = title.slice(0, start) + blank + title.slice(end);
                return m;
            };
            const consumeNear = (anchor, re, radiusBefore = 6, radiusAfter = 20) => {
                const afterTo = Math.min(text.length, anchor + radiusAfter);
                let m = text.slice(anchor, afterTo).match(re);
                if (m) {
                    const start = anchor + m.index, end = start + m[0].length;
                    const blank = ' '.repeat(end - start);
                    text = text.slice(0, start) + blank + text.slice(end);
                    title = title.slice(0, start) + blank + title.slice(end);
                    return m;
                }
                const beforeFrom = Math.max(0, anchor - radiusBefore);
                m = text.slice(beforeFrom, anchor).match(re);
                if (m) {
                    const start = beforeFrom + m.index, end = start + m[0].length;
                    const blank = ' '.repeat(end - start);
                    text = text.slice(0, start) + blank + text.slice(end);
                    title = title.slice(0, start) + blank + title.slice(end);
                    return m;
                }
                return null;
            };

            // Đưa 1 ngày Âm lịch (tháng/ngày Âm) về ngày Dương lịch gần nhất SẮP TỚI (kể cả hôm nay) — nếu
            // ngày Âm đó của năm nay đã qua rồi thì tự động dò sang năm sau.
            const resolveUpcomingLunar = (lunarMonth, lunarDay) => {
                let solar = findSolarDateForLunar(lunarMonth, lunarDay, now.getFullYear());
                if (!solar || solar < startOfToday) {
                    const nextYearSolar = findSolarDateForLunar(lunarMonth, lunarDay, now.getFullYear() + 1);
                    if (nextYearSolar) solar = nextYearSolar;
                }
                return solar;
            };

            // --- Mục 12: lặp lại định kỳ — nhận diện SỚM (trước khi các mẫu câu khác kịp "ăn" mất chữ liên
            // quan), để "họp hàng tuần lúc 8h thứ 2" vẫn nhận diện đúng cả ngày bắt đầu lẫn có lặp lại. ---
            let repeatType = 'none';
            if (consume(/\b(hang nam|moi nam)\b/i)) repeatType = 'yearly';
            else if (consume(/\b(hang thang|moi thang)\b/i)) repeatType = 'monthly';
            else if (consume(/\b(hang tuan|moi tuan)\b/i)) repeatType = 'weekly';
            else if (/\bmoi\s+(thu\s*[2-7]|chu\s*nhat|cn)\b/i.test(text)) {
                repeatType = 'weekly';
                consume(/\bmoi\b/i); // chỉ bỏ chữ "mỗi" đi, để lại đúng "thứ X"/"chủ nhật" cho bước nhận diện thứ bên dưới xử lý tiếp
            }

            // --- Mục 11: mức độ khẩn cấp — chỉ đánh dấu nhẹ vào tiêu đề (app hiện chưa có trường "độ ưu
            // tiên" riêng để không phải sửa cả loạt chỗ khác); nhận diện sớm để không lẫn vào phần còn lại. ---
            const isUrgent = !!consumeAccented(/\bgấp\b/i) || !!consume(/\b(khan cap|khan|quan trong)\b/i);

            // --- Đợt 3, mục 5: "nhắc trước X phút/giờ/ngày" — mức nhắc cụ thể, khác với chỉ bật/tắt
            // nhắc mặc định (đúng giờ diễn ra). Để ý thứ tự: cụm này là "trước" ĐỨNG TRƯỚC số, ngược
            // với "3 ngày trước" (số đứng trước "trước") vốn dùng để lùi NGÀY — 2 mẫu không đụng nhau
            // nhờ khác thứ tự từ, nên có thể nhận diện độc lập, không sợ giẫm lên nhau.
            let reminderOffsetMinutes = null;
            const mOffset = consume(/\b(?:nhac\s*(?:toi\s*)?)?truoc\s*(\d{1,4})\s*(phut|gio|tieng|ngay)\b/i);
            if (mOffset) {
                const n = parseInt(mOffset[1], 10);
                const unit = mOffset[2];
                reminderOffsetMinutes = unit === 'ngay' ? n * 1440 : (unit === 'phut' ? n : n * 60);
            }

            // --- Mục 4: "trong X phút/giờ nữa" — tính tương đối ngay từ thời điểm hiện tại (now), xác định
            // LUÔN CẢ NGÀY LẪN GIỜ nên bỏ qua toàn bộ các bước nhận diện ngày/giờ khác bên dưới. ---
            let handledByRelative = false;
            {
                const mMin = consume(/\btrong\s+(\d{1,3})\s*phut\s*(nua)?\b/i);
                if (mMin) {
                    const target = new Date(now.getTime() + parseInt(mMin[1], 10) * 60000);
                    matchedDate = new Date(target.getFullYear(), target.getMonth(), target.getDate());
                    matchedTime = { hours: target.getHours(), minutes: target.getMinutes() };
                    handledByRelative = true;
                } else {
                    const mHour = consume(/\btrong\s+(\d{1,3})\s*(gio|tieng)\s*(nua)?\b/i);
                    if (mHour) {
                        const target = new Date(now.getTime() + parseInt(mHour[1], 10) * 3600000);
                        matchedDate = new Date(target.getFullYear(), target.getMonth(), target.getDate());
                        matchedTime = { hours: target.getHours(), minutes: target.getMinutes() };
                        handledByRelative = true;
                    }
                }
            }

            let mentionedBuoi = null; // "buổi" được nhắc tới (sáng/trưa/chiều/tối/đêm) dù không có giờ cụ thể kèm theo — dùng để chọn giờ mặc định hợp lý hơn (mục 2, đợt 4)
            if (!handledByRelative) {
                // "sáng nay/trưa nay/chiều nay/tối nay/đêm nay": xoá riêng đúng chữ "nay", giữ lại chữ buổi
                // để bước nhận diện giờ bên dưới vẫn tự bắt được.
                let earlyToday = false;
                const buoiNay = text.match(/\b(sang|trua|chieu|toi|dem)\s+nay\b/i);
                if (buoiNay) {
                    const nayStart = buoiNay.index + buoiNay[0].length - 3;
                    const nayEnd = nayStart + 3;
                    text = text.slice(0, nayStart) + '   ' + text.slice(nayEnd);
                    title = title.slice(0, nayStart) + '   ' + title.slice(nayEnd);
                    earlyToday = true;
                    mentionedBuoi = buoiNay[1];
                }

                // --- Giờ ---
                let mTime = consume(/\b(\d{1,2})\s*[hg]\s*(\d{1,2})?\b/i) || consume(/\b(\d{1,2})\s*gio\s*(\d{1,2})?\s*(phut)?\b/i) || consume(/\b(\d{1,2}):(\d{2})\b/);
                if (mTime) {
                    let hh = parseInt(mTime[1], 10);
                    let mm = parseInt(mTime[2], 10) || 0;
                    if (!mTime[2] && consumeNear(mTime.index, /\bruoi\b/i)) mm = 30;
                    const buoi = consumeNear(mTime.index, /\b(sang|trua|chieu|toi|dem)\b/i);
                    if (buoi) {
                        const b = buoi[1];
                        if ((b === 'chieu' || b === 'toi' || b === 'dem') && hh < 12) hh += 12;
                        if (b === 'trua' && hh < 10) hh += 12;
                    }
                    if (hh >= 0 && hh <= 23 && mm >= 0 && mm <= 59) matchedTime = { hours: hh, minutes: mm };
                } else {
                    // QUAN TRỌNG: không neo được vào vị trí giờ nào (vì không có giờ), nên KHÔNG thể
                    // dùng consumeNear như nhánh trên — phải so khớp trên bản CÓ DẤU gốc (title) thay vì
                    // bản đã bỏ dấu (text), nếu không "tôi" (đại từ, vd "Tôi sẽ đi họp") sẽ bị nhầm thành
                    // "tối" (buổi) vì cả 2 đều mất dấu thành "toi" giống hệt nhau.
                    const buoiAloneAccented = consumeAccented(/\b(sáng|trưa|chiều|tối|đêm)\b/i);
                    if (buoiAloneAccented) {
                        const ACCENTED_BUOI_TO_KEY = { 'sáng': 'sang', 'trưa': 'trua', 'chiều': 'chieu', 'tối': 'toi', 'đêm': 'dem' };
                        mentionedBuoi = ACCENTED_BUOI_TO_KEY[buoiAloneAccented[1].toLowerCase()] || null;
                    }
                }

                // --- Ngày: Mục 10 — tên ngày lễ (kiểm tra SỚM, trước các mẫu ngày khác, vì tên lễ có thể
                // trùng 1 phần với các từ khác, vd "Tết" không nên bị mẫu khác nuốt mất trước). ---
                let mHoliday = null;
                for (const h of HOLIDAY_ALIASES) {
                    const re = new RegExp('\\b' + h.norm.replace(/\s+/g, '\\s+') + '\\b', 'i');
                    const m = text.match(re);
                    if (m) { mHoliday = { m, h }; break; }
                }
                if (mHoliday) {
                    const mh = consume(new RegExp('\\b' + mHoliday.h.norm.replace(/\s+/g, '\\s+') + '\\b', 'i'));
                    consumeNear(mh.index, /\bnam\s+(nay|sau|toi)\b/i); // dọn "năm nay/sau/tới" thừa (vd "Tết năm nay")
                    matchedDate = mHoliday.h.lunar
                        ? resolveUpcomingLunar(mHoliday.h.month, mHoliday.h.day)
                        : (() => {
                            let d = new Date(now.getFullYear(), mHoliday.h.month - 1, mHoliday.h.day);
                            if (d < startOfToday) d = new Date(now.getFullYear() + 1, mHoliday.h.month - 1, mHoliday.h.day);
                            return d;
                        })();
                }
                // --- Mục 9: ngày Âm lịch tường minh — "mùng X (tháng Y) âm", "rằm (tháng Y)" ---
                else {
                    let mLunar = consume(/\bmung\s+(\d{1,2})\s+thang\s+(\d{1,2})(?:\s+am(?:\s+lich)?)?\b/i);
                    if (mLunar) {
                        matchedDate = resolveUpcomingLunar(parseInt(mLunar[2], 10), parseInt(mLunar[1], 10));
                    } else {
                        let mMungAlone = consume(/\bmung\s+(\d{1,2})\b/i);
                        if (mMungAlone) {
                            // "mùng X" không kèm tháng — cách nói phổ biến nhất là ngày Tết (tháng Giêng Âm lịch)
                            matchedDate = resolveUpcomingLunar(1, parseInt(mMungAlone[1], 10));
                        } else {
                            let mRamThang = consume(/\bram\s+thang\s+(\d{1,2})\b/i);
                            if (mRamThang) {
                                matchedDate = resolveUpcomingLunar(parseInt(mRamThang[1], 10), 15);
                            } else if (consume(/\bram\b/i)) {
                                // "rằm" nói suông — hiểu là ngày 15 của THÁNG ÂM LỊCH HIỆN TẠI; nếu đã qua trong
                                // tháng này thì lấy rằm THÁNG ÂM LỊCH KẾ TIẾP (đây là hiện tượng lặp lại theo
                                // THÁNG, khác với ngày lễ theo NĂM — không dùng resolveUpcomingLunar ở đây vì hàm
                                // đó sẽ nhảy hẳn sang năm sau, quá xa so với ý "rằm này/rằm sắp tới").
                                const curLunar = getLunarDetails(now);
                                let targetMonth = curLunar.month, searchYear = now.getFullYear();
                                let solar = findSolarDateForLunar(targetMonth, 15, searchYear);
                                if (!solar || solar < startOfToday) {
                                    targetMonth += 1;
                                    if (targetMonth > 12) { targetMonth = 1; searchYear += 1; }
                                    solar = findSolarDateForLunar(targetMonth, 15, searchYear) || findSolarDateForLunar(targetMonth, 15, searchYear + 1);
                                }
                                matchedDate = solar;
                            } else if (consume(/\bhom nay\b/i) || earlyToday) matchedDate = new Date(startOfToday);
                            else if (consume(/\b(ngay mai|mai)\b/i)) matchedDate = new Date(startOfToday.getTime() + 86400000);
                            else if (consume(/\b(ngay mot|ngay kia|mot)\b/i)) matchedDate = new Date(startOfToday.getTime() + 2 * 86400000);
                            else if (consume(/\bhom kia\b/i)) matchedDate = new Date(startOfToday.getTime() - 2 * 86400000);
                            else if (consume(/\bhom qua\b/i)) matchedDate = new Date(startOfToday.getTime() - 86400000);
                            else {
                                const mWeekend = consume(/\bcuoi tuan\b/i);
                                if (mWeekend) {
                                    // "cuối tuần" = Chủ nhật (không phải Thứ 7). "cuối tuần sau/tới": cộng
                                    // thêm 1 tuần, đồng thời phải XÓA chữ "sau"/"tới" đó khỏi tiêu đề (nếu
                                    // không sẽ sót lại, ví dụ tiêu đề bị lẫn thành "Sau họp tổ" thay vì "Họp tổ").
                                    const nextWeek = consumeNear(mWeekend.index, /\b(sau|toi)\b/i);
                                    let diff = (6 - toIsoWeekday(startOfToday.getDay()) + 7) % 7; // 6 = Chủ nhật (Thứ 2 = 0 ... Chủ nhật = 6)
                                    if (nextWeek) diff += 7;
                                    matchedDate = new Date(startOfToday.getTime() + diff * 86400000);
                                } else {
                                let mWeekPart = consume(/\b(dau|giua)\s+tuan\b/i);
                                if (mWeekPart) {
                                    // "tuần" đã bị 'ăn' ở trên rồi nên không thể khớp cụm "tuần sau" nữa — tìm
                                    // riêng chữ định danh (sau/tới) ở gần đó.
                                    const nextWeek = consumeNear(mWeekPart.index, /\b(sau|toi)\b/i);
                                    const curIso = toIsoWeekday(startOfToday.getDay());
                                    const targetIso = mWeekPart[1] === 'dau' ? 0 : 2; // đầu tuần = Thứ 2 (iso 0), giữa tuần = Thứ 4 (iso 2)
                                    let diff = targetIso - curIso;
                                    if (nextWeek) diff += 7;
                                    else if (diff < 0) diff += 7; // không nói rõ tuần nào & đã qua trong tuần này → hiểu là tuần sau luôn (đầu/giữa tuần "đã qua" thì nói tới cũng vô nghĩa)
                                    matchedDate = new Date(startOfToday.getTime() + diff * 86400000);
                                } else {
                                    let mMonthPart = consume(/\b(dau|cuoi)\s+thang\b/i);
                                    if (mMonthPart) {
                                        // Tương tự trên: "tháng" đã bị 'ăn' rồi, tìm riêng chữ định danh gần đó.
                                        const nextMonth = consumeNear(mMonthPart.index, /\b(sau|toi)\b/i);
                                        const prevMonth = !nextMonth && consumeNear(mMonthPart.index, /\btruoc\b/i);
                                        let mo = now.getMonth(), y = now.getFullYear();
                                        if (nextMonth) { mo += 1; if (mo > 11) { mo = 0; y += 1; } }
                                        else if (prevMonth) { mo -= 1; if (mo < 0) { mo = 11; y -= 1; } }
                                        matchedDate = mMonthPart[1] === 'dau'
                                            ? new Date(y, mo, 1)
                                            : new Date(y, mo + 1, 0); // ngày 0 của tháng sau = ngày cuối tháng này
                                    } else {
                                        // "X ngày nữa"/"X ngày trước", "X tuần nữa"/"X tuần trước"
                                        let m2 = consume(/\b(\d{1,3})\s*ngay\s*(nua|truoc)\b/i);
                                        if (m2) matchedDate = new Date(startOfToday.getTime() + parseInt(m2[1], 10) * (m2[2] === 'truoc' ? -1 : 1) * 86400000);
                                        else {
                                            m2 = consume(/\b(\d{1,2})\s*tuan\s*(nua|truoc)\b/i);
                                            if (m2) matchedDate = new Date(startOfToday.getTime() + parseInt(m2[1], 10) * (m2[2] === 'truoc' ? -1 : 1) * 7 * 86400000);
                                            else {
                                                let m4 = consume(/\bngay\s+(\d{1,2})\s+thang\s+(sau|toi|truoc|nay)\b/i);
                                                if (m4) {
                                                    const dNum = parseInt(m4[1], 10);
                                                    let mo = now.getMonth(), y = now.getFullYear();
                                                    if (m4[2] === 'sau' || m4[2] === 'toi') { mo += 1; if (mo > 11) { mo = 0; y += 1; } }
                                                    else if (m4[2] === 'truoc') { mo -= 1; if (mo < 0) { mo = 11; y -= 1; } }
                                                    const candidate = new Date(y, mo, dNum);
                                                    if (candidate.getMonth() === mo && candidate.getDate() === dNum) matchedDate = candidate;
                                                } else {
                                                    // Mục 5: "ngày X tháng Y" (số thuần, không kèm sau/tới/trước/này)
                                                    let m4b = consume(/\bngay\s+(\d{1,2})\s+thang\s+(\d{1,2})\b/i);
                                                    if (m4b) {
                                                        const dNum = parseInt(m4b[1], 10), moNum = parseInt(m4b[2], 10) - 1;
                                                        let y = now.getFullYear();
                                                        let candidate = new Date(y, moNum, dNum);
                                                        // Nếu ngày/tháng đó của năm nay đã qua rồi, hiểu là năm sau (giống cách xử lý ngày lễ)
                                                        if (candidate < startOfToday) candidate = new Date(y + 1, moNum, dNum);
                                                        if (candidate.getDate() === dNum) matchedDate = candidate;
                                                    } else {
                                                        let m3 = consume(/\b(?:ngay\s+)?(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?\b/i);
                                                        if (m3) {
                                                            const d = parseInt(m3[1], 10), mo = parseInt(m3[2], 10) - 1;
                                                            const y = m3[3] ? (m3[3].length === 2 ? 2000 + parseInt(m3[3], 10) : parseInt(m3[3], 10)) : now.getFullYear();
                                                            const candidate = new Date(y, mo, d);
                                                            if (candidate.getMonth() === mo && candidate.getDate() === d) matchedDate = candidate;
                                                        } else {
                                                            let foundWeekday = null;
                                                            for (const { value, re } of VN_WEEKDAY_PATTERNS) {
                                                                if (re.test(text)) { foundWeekday = value; consume(re); break; }
                                                            }
                                                            if (foundWeekday !== null) {
                                                                const nextWeek = consume(/\b(tuan sau|tuan toi)\b/i);
                                                                const thisWeek = consume(/\btuan nay\b/i);
                                                                const curIso = toIsoWeekday(startOfToday.getDay());
                                                                const targetIso = toIsoWeekday(foundWeekday);
                                                                const diffThisWeek = targetIso - curIso;
                                                                let diff;
                                                                if (nextWeek) diff = diffThisWeek + 7;
                                                                else if (thisWeek) diff = diffThisWeek;
                                                                else diff = diffThisWeek < 0 ? diffThisWeek + 7 : diffThisWeek;
                                                                matchedDate = new Date(startOfToday.getTime() + diff * 86400000);
                                                            } else {
                                                                let m5 = consume(/\bngay\s+(\d{1,2})\b(?!\s*phut)/i);
                                                                if (m5) {
                                                                    const dNum = parseInt(m5[1], 10);
                                                                    const candidate = new Date(now.getFullYear(), now.getMonth(), dNum);
                                                                    if (candidate.getMonth() === now.getMonth() && candidate.getDate() === dNum) matchedDate = candidate;
                                                                }
                                                            }
                                                        }
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                                }
                            }
                        }
                    }
                }
            }

            // Không nhận diện được ngày nào, nhưng CÓ nhận diện được giờ hoặc là lệnh lặp lại định kỳ — mặc
            // định hiểu là HÔM NAY, đúng với cách nói tắt phổ biến khi nhắc việc trong ngày.
            if (!matchedDate && (matchedTime || repeatType !== 'none')) matchedDate = new Date(startOfToday);
            if (!matchedDate) return null;

            // Dọn các từ đệm ở ĐẦU câu kiểu "tôi sẽ...", "mình thì sẽ..." — lặp lại tới khi không còn
            // khớp nữa để bắt hết CHUỖI nhiều từ đệm liên tiếp (không dừng lại sau từ đầu tiên). Chỉ
            // dùng các từ chắc chắn an toàn (tôi/mình/sẽ/thì/là) — KHÔNG thêm "anh"/"chị"/"em" vì các từ
            // này thường là 1 phần tên riêng của người khác (vd "Anh Tuấn sinh nhật"), xóa đi sẽ sai.
            let prevTitle;
            do {
                prevTitle = title;
                title = title.replace(/^\s*(tôi|mình|sẽ|thì|là)\s+/i, ' ');
            } while (title !== prevTitle);

            title = title
                .replace(/\b(lúc|vào|này|hồi|khi)\b/gi, ' ')
                .replace(/\b(nhé|nha|nhá|nhỉ|ạ|nghen|nghe|giúp|giùm|hộ)\s*$/gi, ' ')
                .replace(/\s{2,}/g, ' ')
                .replace(/^[\s,.\-–]+|[\s,.\-–]+$/g, '')
                .trim();
            if (!title) title = 'Sự kiện mới';
            title = capitalizeFirstLetter(title);
            if (isUrgent) title = '🔥 ' + title;

            const finalDate = new Date(matchedDate);
            if (matchedTime) finalDate.setHours(matchedTime.hours, matchedTime.minutes, 0, 0);
            else finalDate.setHours(0, 0, 0, 0);

            return { title, date: finalDate, hasTime: !!matchedTime, confidence: 'high', repeat: repeatType, urgent: isUrgent, reminderOffsetMinutes, mentionedBuoi };
        };

        // Mục 17: Bộ tự kiểm tra Smart Engine — giữ SẴN trong code (không cần cài thêm công cụ test
        // nào khác) để mỗi khi sửa lại quy tắc nhận diện, có thể tự chạy lại NGAY để chắc chắn không
