                        <button type="button"
                            onMouseDown={e => { stop(e); saveSelection(); }}
                            onClick={() => setShowSizeMenu(v => !v)}
                            className="shrink-0 w-4 flex items-center justify-center border border-l-0 border-slate-200 rounded-r bg-white text-slate-500 hover:bg-slate-100"
                            title="Chọn cỡ có sẵn">
                            <ChevronDown size={10} />
                        </button>
                        {showSizeMenu && (
                            <div className="absolute right-0 top-full mt-1 z-30 bg-white border border-slate-200 rounded-lg shadow-lg max-h-48 overflow-y-auto min-w-[64px]">
                                {RICH_FONT_SIZES.map(sz => (
                                    <button key={sz} type="button" onMouseDown={e => { e.preventDefault(); saveSelection(); }}
                                        onClick={() => { setSelectedSize(String(sz)); applySize(sz); setShowSizeMenu(false); }}
                                        className="block w-full text-left px-3 py-1.5 text-xs text-slate-700 hover:bg-blue-50">{sz}</button>
                                ))}
                            </div>

                    </div>
                    <input type="color" onMouseDown={stop} onChange={e => exec('foreColor', e.target.value)}
                        className="w-6 h-6 shrink-0 rounded cursor-pointer border border-slate-200" title="Màu chữ" />
                </div>
            );
        };

        // Ô nhập tiêu đề hỗ trợ định dạng chữ (contentEditable) + gợi ý tự điền — thay cho input
        // thường, để có thể bôi đen 1 phần chữ cũ rồi định dạng riêng phần đó (input thường không
        // làm được việc này). Nội dung được lưu dưới dạng HTML (rỗng/không định dạng thì vẫn là văn
        // bản thường như trước, không có gì thay đổi với dữ liệu cũ).
        const RichTitleEditable = ({ value, onChange, suggestions = [], placeholder = '', className = '', editableRef, onFocus, onBlur }) => {
            const localRef = useRef(null);
            const ref = editableRef || localRef;
            const [open, setOpen] = useState(false);
            const didMountRef = useRef(false);

            // Chỉ đổ nội dung vào DOM MỘT LẦN lúc mount — sau đó để contentEditable tự quản lý,
            // tránh bị nhảy con trỏ về đầu mỗi khi gõ (nếu set lại innerHTML theo state mỗi lần render).
            useEffect(() => {
                if (ref.current && !didMountRef.current) {
                    ref.current.innerHTML = value || '';
                    didMountRef.current = true;
                }
            }, []);

            const plain = stripHtml(value || '');
            const q = plain.trim().toLowerCase();
            const filtered = q.length >= 1
                ? suggestions.filter(s => s && s.toLowerCase().includes(q) && s.toLowerCase() !== q).slice(0, 5)
                : [];

            return (
                <div className="relative">
                    <div
                        ref={ref}
                        contentEditable
                        suppressContentEditableWarning
                        data-placeholder={placeholder}
                        onInput={e => { onChange(e.currentTarget.innerHTML); setOpen(true); }}
                        onFocus={() => { setOpen(true); if (onFocus) onFocus(); }}
                        onBlur={() => { setTimeout(() => setOpen(false), 150); if (onBlur) onBlur(); }}
                        className={`rich-editable ${className}`}
                    />
                    {open && filtered.length > 0 && (
                        <div className="absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-lg shadow-lg z-30 max-h-40 overflow-y-auto">
                            {filtered.map((s, i) => (
                                <button key={i} type="button" onMouseDown={() => {
                                    if (ref.current) ref.current.innerHTML = s;
                                    onChange(s);
                                    setOpen(false);
                                }} className="w-full text-left px-3 py-2 text-xs text-slate-700 hover:bg-blue-50 truncate">{stripHtml(s)}</button>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const AutocompleteInput = ({ value, onChange, suggestions = [], placeholder = '', className = '', inputClassName = '', ...rest }) => {

            const [open, setOpen] = useState(false);
            const [rect, setRect] = useState(null);
            const inputRef = useRef(null);
            const q = (value || '').trim().toLowerCase();
            const filtered = q.length >= 1
                ? suggestions.filter(s => s && s.toLowerCase().includes(q) && s.toLowerCase() !== q).slice(0, 5)
                : [];
            const updateRect = () => {
                if (inputRef.current) {
                    const r = inputRef.current.getBoundingClientRect();
                    setRect({ top: r.bottom + 4, left: r.left, width: r.width });
                }
            };
            return (
                <div className={`relative ${className}`}>
                    <input
                        ref={inputRef}
                        value={value}
                        onChange={e => { onChange(e.target.value); updateRect(); setOpen(true); }}
                        onFocus={() => { updateRect(); setOpen(true); }}
                        onBlur={() => setTimeout(() => setOpen(false), 150)}
                        placeholder={placeholder}
                        className={inputClassName}
                        {...rest}
                    />
                    {open && filtered.length > 0 && rect && (
                        <div
                            style={{ position: 'fixed', top: rect.top, left: rect.left, width: rect.width, zIndex: 9999 }}
                            className="bg-white border border-slate-200 rounded-lg shadow-lg max-h-40 overflow-y-auto"
                        >
                            {filtered.map((s, i) => (
                                <button key={i} type="button" onMouseDown={() => { onChange(s); setOpen(false); }}
                                    className="w-full text-left px-3 py-2 text-xs text-slate-700 hover:bg-blue-50 truncate">{s}</button>
                            ))}
                        </div>
                    )}
                </div>
            );
        };


        const GlobalSearchModal = ({ onClose, db, user, appId, onNavigate, headerRef }) => {
            const [query, setQuery] = React.useState('');
            const [results, setResults] = React.useState({ dateEvents: [], dateTarget: null, events: [], todos: [], notes: [], timetable: [] });
            const [loading, setLoading] = React.useState(false);
            // Danh sách gợi ý mặc định (chưa gõ chữ): tối đa 20 sự kiện/việc cần làm/ghi chú SẮP TỚI,
            // xếp hạn ngắn hơn lên trên — hiện ngay khi người dùng chạm vào ô tìm kiếm.
            const [suggestions, setSuggestions] = React.useState([]);
            const [loadingSuggestions, setLoadingSuggestions] = React.useState(false);
            const [headerH, setHeaderH] = React.useState(56);
            const inputRef = React.useRef(null);
            // Chế độ tìm kiếm thông minh (AI): kích hoạt khi bấm icon ✨ hoặc nhấn Enter mà chưa chọn kết quả nào
            const [showAISmart, setShowAISmart] = React.useState(false);

            React.useEffect(() => {
                if (inputRef.current) inputRef.current.focus();
                // Đo chiều cao header thực tế
                if (headerRef && headerRef.current) {
                    setHeaderH(headerRef.current.getBoundingClientRect().height);
                }
            }, []);

            // Tính số ngày còn lại tới 1 sự kiện (áp dụng cho mọi kiểu lặp, kể cả sinh nhật/giỗ) —
            // trả về null nếu sự kiện không có ngày, hoặc ngày đó không còn lần nào SẮP TỚI (chưa đến).
            const getUpcomingEventDueInfo = (ev, today) => {
                if (!ev.date) return null;
                const base = new Date(ev.date.seconds * 1000);
                const repeat = ev.repeat || 'none';
                if (repeat === 'none') {
                    const diff = daysBetweenDates(today, base);
                    return diff > 0 ? { dueDate: base, diffDays: diff } : null;
                }
                const { future } = getNearestPastFutureOccurrence(ev, base, today);
                if (!future) return null;
                const startOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                const diff = daysBetweenDates(startOfToday, future);
                return diff > 0 ? { dueDate: future, diffDays: diff } : null;
            };
            const getUpcomingSimpleDueInfo = (ts, today) => {
                if (!ts) return null;
                const due = new Date(ts.seconds * 1000);
                const diff = daysBetweenDates(today, due);
                return diff > 0 ? { dueDate: due, diffDays: diff } : null;
            };

            // Tải danh sách gợi ý mặc định khi ô tìm kiếm còn trống (chưa gõ chữ)
            React.useEffect(() => {
                if (query.trim()) { setSuggestions([]); return; }
                let cancelled = false;
                setLoadingSuggestions(true);
                const eventsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'events');
                const todosRef  = collection(db, 'artifacts', appId, 'users', user.uid, 'todos');
                const notesRef  = collection(db, 'artifacts', appId, 'users', user.uid, 'notes');
                (async () => {
                    try {
                        const today = new Date();
                        const [evSnap, tdSnap, ntSnap] = await Promise.all([
                            getDocs(query_q(eventsRef)),
                            getDocs(query_q(todosRef)),
                            getDocs(query_q(notesRef))
                        ]);
                        const combined = [];
                        evSnap.docs.forEach(d => {
                            const ev = { id: d.id, ...d.data() };
                            if (!ev.title) return;
                            const info = getUpcomingEventDueInfo(ev, today);
                            if (info) combined.push({ kind: 'calendar', item: ev, ...info });
                        });
                        tdSnap.docs.forEach(d => {
                            const td = { id: d.id, ...d.data() };
                            if (!td.text || td.completed) return;
                            const info = getUpcomingSimpleDueInfo(td.deadlineTime || td.reminderTime, today);
                            if (info) combined.push({ kind: 'todo', item: td, ...info });
                        });
                        ntSnap.docs.forEach(d => {
                            const nt = { id: d.id, ...d.data() };
                            if (!nt.title && !nt.content) return;
                            const info = getUpcomingSimpleDueInfo(nt.reminderTime, today);
                            if (info) combined.push({ kind: 'notes', item: nt, ...info });
                        });
                        // Hạn ngắn hơn (sắp tới gần hơn) lên trên
                        combined.sort((a, b) => a.diffDays - b.diffDays);
                        if (!cancelled) setSuggestions(combined.slice(0, 20));
                    } catch (e) {
                        console.error('Lỗi tải danh sách gợi ý:', e);
                    } finally {
                        if (!cancelled) setLoadingSuggestions(false);
                    }
                })();
                return () => { cancelled = true; };
            }, [query]);

            React.useEffect(() => {
                if (!query.trim()) {
                    setResults({ dateEvents: [], dateTarget: null, events: [], todos: [], notes: [], timetable: [] });
                    return;
                }
                setLoading(true);
                const rawQuery = query.trim();

                // 1) Ngày chính xác kiểu dd/mm/yyyy (tính năng cũ, giữ nguyên)
                const parsedDate = parseSearchDate(rawQuery);
                // 2) Ngôn ngữ tự nhiên: "tháng trước", "tuần này", "hôm qua"... (tìm kiếm ngữ nghĩa)
                const relativeRange = !parsedDate ? getRelativeDateRange(rawQuery) : null;
                // 3) Ý định danh mục: "ghi chú", "cuộc họp", "việc cần làm", "thời khóa biểu"...
                const intent = detectCategoryIntent(rawQuery);

                // Từ khóa "sạch" dùng để so khớp mờ — loại bỏ cụm thời gian / danh mục đã nhận diện được
                let cleaned = normalizeVN(rawQuery);
                if (relativeRange) cleaned = cleaned.replace(relativeRange.matched, ' ').trim();
                let effectiveIntent = null;
                if (intent) {
                    const withoutIntent = cleaned.replace(intent.matched, ' ').replace(/\s+/g, ' ').trim();
                    // Chỉ thật sự lọc theo danh mục nếu còn ngữ cảnh khác đi kèm (từ khóa hoặc mốc thời gian).
                    // Nếu người dùng chỉ gõ đúng 1 từ danh mục ("họp") thì vẫn tìm xuyên suốt như bình thường.
                    if (withoutIntent.length > 0 || relativeRange) {
                        effectiveIntent = intent;
                        cleaned = withoutIntent;
                    }
                }
                cleaned = cleaned.replace(/^(ve|la)\s+/, '').replace(/\s+/g, ' ').trim(); // bỏ từ nối "về"/"là" ở đầu cụm còn lại
                const q = cleaned; // từ khóa không dấu, đã loại phần ngữ nghĩa, dùng cho Fuse.js
                const hasKeyword = q.length > 0;
                const allowCat = (cat) => !effectiveIntent || effectiveIntent.category === cat;
                const inRange = (ts) => {
                    if (!ts) return false;
                    const d = new Date(ts.seconds * 1000);
                    if (parsedDate) return d.toDateString() === parsedDate.toDateString();
                    if (relativeRange) return d >= relativeRange.start && d <= relativeRange.end;
                    return true;
                };

                const eventsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'events');
                const todosRef  = collection(db, 'artifacts', appId, 'users', user.uid, 'todos');
                const notesRef  = collection(db, 'artifacts', appId, 'users', user.uid, 'notes');

                // Tìm kiếm mờ (fuzzy) không phân biệt dấu: so khớp trên bản đã chuẩn hóa (bỏ dấu)
                const fuzzyFilter = (list, getText) => {
                    const withNorm = list.map(item => ({ ...item, __norm: normalizeVN(getText(item)) }));
                    if (!hasKeyword) return withNorm;
                    const fuse = new Fuse(withNorm, { keys: ['__norm'], threshold: 0.4, ignoreLocation: true, minMatchCharLength: 2 });
                    // Không tự sắp theo "khớp đúng" ở đây nữa — việc này để bước sắp xếp cuối cùng
                    // (finalPrioritizeExact, ngay trước khi hiển thị) đảm nhận, vì đó mới là nơi tính
                    // đúng 3 mức độ khớp (y hệt dấu / chỉ khớp sau khi bỏ dấu / khớp mờ). Làm ở đây nữa
                    // dễ gây chồng chéo, không nhất quán với bước cuối.
                    return fuse.search(q).map(r => r.item);
                };

                // Gộp các sự kiện trùng tên (do sự kiện lặp lại hàng tuần/tháng/năm sinh ra nhiều bản ghi
                // cùng tiêu đề): chỉ giữ lại 1 kết quả cho mỗi tên — ưu tiên lần SẮP diễn ra gần nhất
                // (tương lai gần nhất); nếu tên đó không còn lần nào trong tương lai thì lấy lần gần nhất đã qua.
                const dedupeEventsByNearestDate = (list) => {
                    const now = Date.now();
                    const score = (ts) => {
                        if (!ts) return Infinity; // sự kiện không có ngày -> ưu tiên thấp nhất
                        const t = ts.seconds * 1000;
                        return t >= now ? (t - now) : ((now - t) + 1e15); // tương lai luôn ưu tiên hơn quá khứ
                    };
                    const byName = new Map();
                    list.forEach(ev => {
                        const key = normalizeVN(ev.title || '').trim();
                        if (!key) { byName.set(ev.id, ev); return; } // an toàn: không có tiêu đề thì không gộp
                        const current = byName.get(key);
                        if (!current || score(ev.date) < score(current.date)) byName.set(key, ev);
                    });
                    // LỖI TRƯỚC ĐÂY: Map.values() trả về theo thứ tự CHÈN LẦN ĐẦU của mỗi tên, làm mất
                    // hoàn toàn thứ tự "khớp đúng lên trước" mà fuzzyFilter đã sắp xếp trước đó — đây
                    // chính là nguyên nhân kết quả khớp đúng bị xếp lộn xộn trong danh sách tìm kiếm.
                    // Sắp lại theo đúng vị trí xuất hiện của mỗi sự kiện trong danh sách đầu vào (list).
                    const order = new Map(list.map((e, i) => [e.id, i]));
                    const result = Array.from(byName.values());
                    result.sort((a, b) => (order.get(a.id) ?? 0) - (order.get(b.id) ?? 0));
                    return result;
                };

                const fetchAll = async () => {
                    try {
                        const [evSnap, tdSnap, ntSnap] = await Promise.all([
                            getDocs(query_q(eventsRef)),
                            getDocs(query_q(todosRef)),
                            getDocs(query_q(notesRef))
                        ]);
                        const allEvents = evSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                        // Kết quả theo NGÀY cụ thể (dd/mm/yyyy) — giữ nguyên hành vi cũ
                        let dateEvents = [];
                        if (parsedDate) {
                            const ds = parsedDate.toDateString();
                            dateEvents = allEvents.filter(e => e.date && new Date(e.date.seconds * 1000).toDateString() === ds);
                        }

                        // SỰ KIỆN: lọc theo danh mục (nếu có ý định) + khoảng thời gian tương đối (nếu có) + từ khóa mờ
                        let evs = allowCat('events') ? allEvents.filter(e => e.title) : [];
                        if (relativeRange) evs = evs.filter(e => inRange(e.date));
                        evs = fuzzyFilter(evs, e => e.title || '');
                        // Nếu nhiều sự kiện trùng tên (do lặp lại), chỉ hiển thị bản gần nhất
                        evs = dedupeEventsByNearest(evs);
                        evs = dedupeEventsByNearestDate(evs); // bỏ bớt các bản trùng tên do sự kiện lặp lại, chỉ giữ lần gần nhất

                        // "Sự kiện khác (có lặp)" (không phải sinh nhật/giỗ): tách thành tối đa 2 dòng —
                        // lần lặp gần nhất ĐÃ QUA + lần lặp gần nhất SẮP TỚI — thay vì chỉ 1 dòng như trước.
                        const nowForSplit = new Date();
                        evs = evs.reduce((acc, ev) => {
                            if (!ev.date) { acc.push(ev); return acc; }
                            const base = new Date(ev.date.seconds * 1000);
                            const repeat = ev.repeat || 'none';
                            const yearlyLike = repeat === 'lunar' || repeat === 'solar' || repeat === 'yearly';
                            const titleLower = (ev.title || '').toLowerCase();
                            const isBirthday = yearlyLike && titleLower.includes('sinh nhật');
                            const isDeathAnniversary = yearlyLike && !isBirthday && titleLower.includes('giỗ');
                            if (repeat === 'none' || isBirthday || isDeathAnniversary) { acc.push(ev); return acc; }
                            const rows = getOtherRepeatingEventRows(ev, base, nowForSplit);
                            if (rows.length === 0) { acc.push(ev); return acc; }
                            rows.forEach(r => {
                                acc.push({ ...ev, id: `${ev.id}_${r.key}`, __precomputedSubInfo: r.subInfo, __navSeconds: Math.floor(r.occDate.getTime() / 1000) });
                            });
                            return acc;
                        }, []);

                        // Trong các kết quả "sinh nhật"/"giỗ" CHƯA ĐẾN ngày/tháng sự kiện: sắp xếp lại sao cho
                        // sự kiện còn ít ngày hơn (gần tới hơn) hiển thị lên trên. Chỉ đổi chỗ cho nhau GIỮA
                        // các mục sinh nhật/giỗ sắp tới này, không đụng tới vị trí của các kết quả khác.
                        const getUpcomingBirthdayOrDeathRemainingDays = (ev) => {
                            if (!ev.date) return null;
                            const base = new Date(ev.date.seconds * 1000);
                            const repeat = ev.repeat || 'none';
                            const yearlyLike = repeat === 'lunar' || repeat === 'solar' || repeat === 'yearly';
                            const titleLower = (ev.title || '').toLowerCase();
                            const isBirthday = yearlyLike && titleLower.includes('sinh nhật');
                            const isDeathAnniversary = yearlyLike && !isBirthday && titleLower.includes('giỗ');
                            if (!isBirthday && !isDeathAnniversary) return null;
                            const today = new Date();
                            const thisYearOcc = getEventOccurrenceInYear(ev, base, today.getFullYear());
                            if (!thisYearOcc) return null;
                            const diff = daysBetweenDates(thisYearOcc, today);
                            return diff < 0 ? Math.abs(diff) : null; // chỉ lấy trường hợp CHƯA ĐẾN (diff < 0)
                        };
                        {
                            const specialSlots = [];
                            evs.forEach((ev, idx) => {
                                const remaining = getUpcomingBirthdayOrDeathRemainingDays(ev);
                                if (remaining !== null) specialSlots.push({ idx, remaining, ev });
                            });
                            if (specialSlots.length > 1) {
                                const sortedEvs = [...specialSlots].sort((a, b) => a.remaining - b.remaining);
                                specialSlots.forEach((slot, i) => { evs[slot.idx] = sortedEvs[i].ev; });
                            }
                        }

                        // CÔNG VIỆC
                        const completionIntent = detectCompletionIntent(rawQuery);
                        let tds = allowCat('todos') ? tdSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(t => t.text) : [];
                        if (relativeRange) tds = tds.filter(t => inRange(t.deadlineTime || t.reminderTime || t.date));
                        if (completionIntent) {
                            // Tìm theo trạng thái: bỏ qua so khớp chữ, lọc thẳng theo đã/chưa hoàn thành
                            tds = tds.filter(t => !!t.completed === (completionIntent === 'done'));
                        } else {
                            tds = fuzzyFilter(tds, t => t.text || '');
                        }

                        // GHI CHÚ
                        let nts = allowCat('notes') ? ntSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(n => n.title || n.content) : [];
                        if (completionIntent) {
                            // Chỉ áp dụng được cho ghi chú dạng checklist (có các mục việc cần tích) —
                            // "hoàn thành" = tất cả các mục đã tích; "chưa hoàn thành" = còn mục chưa tích.
                            nts = nts.filter(n => {
                                if (!n.isChecklist || !Array.isArray(n.items) || n.items.length === 0) return false;
                                const allChecked = n.items.every(it => !!it.checked);
                                return completionIntent === 'done' ? allChecked : !allChecked;
                            });
                        } else {
                            nts = fuzzyFilter(nts, n => (n.title || '') + ' ' + (n.content || ''));
                        }

                        // THỜI KHÓA BIỂU
                        let tkbResults = [];
                        if (allowCat('timetable')) {
                            try {
                                const tkbSnap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'timetable'));
                                const dayLabels = { t2:'Thứ 2', t3:'Thứ 3', t4:'Thứ 4', t5:'Thứ 5', t6:'Thứ 6', t7:'Thứ 7' };
                                const rawTkb = [];
                                tkbSnap.docs.forEach(d => {
                                    const sched = d.data().schedule || {};
                                    Object.entries(sched).forEach(([key, val]) => {
                                        if (!val) return;
                                        const [dayId, period, col] = key.split('_');
                                        rawTkb.push({ id: d.id + '_' + key, text: val, day: dayLabels[dayId] || dayId, period: 'Tiết ' + period, col: col === 'col1' ? 'Môn' : 'Ghi chú', weekDocId: d.id });
                                    });
                                });
                                tkbResults = fuzzyFilter(rawTkb, t => t.text || '');
                            } catch(e) { console.warn('Tìm TKB lỗi:', e); }
                        }

                        // BƯỚC SẮP XẾP CUỐI CÙNG (đảm bảo chắc chắn): dù các bước xử lý ở trên (gộp
                        // trùng tên, tách sự kiện lặp...) có vô tình làm xáo trộn thứ tự hay không, vẫn
                        // luôn ưu tiên kết quả khớp ĐÚNG lên trên cùng ngay trước khi hiển thị.
                        // LƯU Ý QUAN TRỌNG: phải phân biệt 3 mức, không phải 2 — vì bỏ dấu để so khớp
                        // (q đã bỏ dấu) khiến "Hoàn" cũng chứa "hoa" y như "Hòa"/"Khóa" (chỉ là ký tự,
                        // không phân biệt được dấu khác nhau). Nếu chỉ xét "khớp sau khi bỏ dấu" là
                        // "khớp đúng", sẽ xếp "Hoàn thành", "Mua điều hòa", "khóa tủ" ngang hàng với chữ
                        // "Hoa" y hệt người dùng gõ — đúng là lỗi thấy trong ảnh thực tế người dùng gửi.
                        // Mức 0 (khớp đúng thật sự): chứa nguyên văn từ khóa, GIỮ NGUYÊN DẤU như đã gõ.
                        // Mức 1 (gần đúng): chỉ khớp sau khi bỏ hết dấu (vd gõ "hoa" khớp với "hòa/hóa/khóa").
                        // Mức 2: chỉ khớp mờ (Fuse.js), không chứa cả 2 dạng trên.
                        const finalPrioritizeExact = (list, getText) => {
                            if (!hasKeyword) return list;
                            const rawQLower = rawQuery.toLowerCase();
                            const tierOf = (text) => {
                                const t = text || '';
                                if (t.toLowerCase().includes(rawQLower)) return 0;
                                if (normalizeVN(t).includes(q)) return 1;
                                return 2;
                            };
                            const withIdx = list.map((item, i) => ({ item, i, tier: tierOf(getText(item)) }));
                            withIdx.sort((a, b) => (a.tier - b.tier) || (a.i - b.i));
                            return withIdx.map(x => x.item);
                        };
                        evs = finalPrioritizeExact(evs, e => e.title || '');
                        tds = finalPrioritizeExact(tds, t => t.text || '');
                        nts = finalPrioritizeExact(nts, n => (n.title || '') + ' ' + (n.content || ''));
                        tkbResults = finalPrioritizeExact(tkbResults, t => t.text || '');

                        setResults({ dateEvents, dateTarget: parsedDate, events: evs, todos: tds, notes: nts, timetable: tkbResults });
                    } catch(e) { console.error('Lỗi tìm kiếm:', e); }
                    finally { setLoading(false); }
                };
                // Debounce 300ms: đợi người dùng ngừng gõ mới thật sự truy vấn, tránh gọi liên tục khi đang gõ
                const timer = setTimeout(fetchAll, 300);
                return () => clearTimeout(timer);
            }, [query]);

            const highlightText = (text, q) => {
                if (!text || !q) return text;
                // So khớp theo bản chuẩn hóa (không dấu) để việc gõ có dấu/không dấu đều bôi vàng đúng vị trí
                const normText = normalizeVN(text);
                const normQ = normalizeVN(q);
                const idx = normText.indexOf(normQ);
                if (idx === -1) return text;
                return <span>{text.slice(0, idx)}<mark className="bg-yellow-200 text-yellow-900 rounded px-0.5 font-bold">{text.slice(idx, idx + normQ.length)}</mark>{text.slice(idx + normQ.length)}</span>;
            };

            const totalCount = results.events.length + results.todos.length + results.notes.length + results.timetable.length + results.dateEvents.length;
            const hasQuery = query.trim().length > 0;

            const handleResultClick = (type, item) => {
                onNavigate(type, item, query.trim());
                onClose();
            };
            const handleGoToDate = (date) => {
                onNavigate('calendar', { date: { seconds: Math.floor(date.getTime() / 1000) } });
                onClose();
            };

            return (
                <>
                    {/* Overlay mờ — chỉ bên dưới header, bấm vào đóng */}
                    <div className="fixed inset-0 z-[58] bg-black/30" style={{top: 0}} onClick={onClose} />

                    {/* Thanh search — thay thế toàn bộ header, z cao hơn overlay */}
                    <div className="fixed top-0 left-1/2 z-[59] bg-blue-600 flex items-center gap-2 px-3 shadow-lg"
                        style={{ width: '100%', maxWidth: '448px', transform: 'translateX(-50%)', height: headerH + 'px' }}
                        onClick={e => e.stopPropagation()}>
                        <Search size={18} className="text-blue-200 shrink-0" />
                        <input
                            ref={inputRef}
                            type="text"
                            value={query}
                            onChange={e => setQuery(e.target.value)}
                            onKeyDown={e => { if (e.key === 'Enter' && query.trim()) { e.preventDefault(); setShowAISmart(true); } }}
                            placeholder="Nhập từ khóa, hoặc Enter để ra lệnh bằng AI..."
                            className="flex-1 bg-transparent text-white placeholder-blue-300 outline-none text-sm font-medium"
                        />
                        {query && (
                            <button onClick={() => setQuery('')} className="text-blue-200 hover:text-white transition shrink-0 p-1">
                                <X size={16} />
                            </button>
                        )}
                        <button
                            onClick={() => { if (query.trim()) setShowAISmart(true); }}
                            disabled={!query.trim()}
                            aria-label="Tìm kiếm/ra lệnh thông minh bằng AI"
                            title="Tìm kiếm/ra lệnh thông minh bằng AI"
                            className="text-blue-200 hover:text-white transition shrink-0 p-1 disabled:opacity-40 disabled:hover:text-blue-200"
                        >
                            <Sparkles size={17} />
                        </button>
                        <button onClick={onClose} className="text-blue-200 hover:text-white transition shrink-0 p-1 ml-1 font-medium text-xs border border-blue-400 rounded-lg px-2">
                            Đóng
                        </button>
                    </div>

                    {showAISmart && (
                        <AISmartCommandModal
                            db={db}
                            appId={appId}
                            user={user}
                            initialText={query}
                            onClose={() => setShowAISmart(false)}
                            onDone={() => { setShowAISmart(false); onClose(); }}
                        />
                    )}

                    {/* Gợi ý mặc định (chưa gõ chữ): tối đa 20 mục sắp tới, hạn ngắn hơn lên trên */}
                    {!hasQuery && (
                        <div className="fixed z-[59] bg-white overflow-y-auto shadow-[0_8px_30px_rgba(0,0,0,0.18)]"
                            style={{ top: headerH + 'px', left: '50%', transform: 'translateX(-50%)', width: '100%', maxWidth: '448px', maxHeight: 'calc(100vh - ' + headerH + 'px - 56px)' }}
                            onClick={e => e.stopPropagation()}>

                            {loadingSuggestions && <InlineSkeleton lines={5} />}

                            {!loadingSuggestions && suggestions.length === 0 && (
                                <div className="text-center text-gray-400 py-10 px-4">
                                    <Clock size={36} className="mx-auto mb-3 opacity-20" />
                                    <p className="text-sm">Không có việc/sự kiện nào sắp tới</p>
                                </div>
                            )}

                            {!loadingSuggestions && suggestions.length > 0 && (
                                <div className="p-3 space-y-1.5">
                                    <div className="flex items-center gap-2 mb-1 px-1"><Clock size={14} className="text-slate-400" /><span className="text-xs font-black uppercase tracking-wider text-slate-400">Sắp tới</span></div>
                                    {suggestions.map(s => {
                                        const icon = s.kind === 'calendar' ? <Calendar size={16} className="text-blue-400 shrink-0"/> : s.kind === 'todo' ? <CheckSquare size={16} className="text-green-400 shrink-0"/> : <StickyNote size={16} className="text-orange-400 shrink-0"/>;
                                        const bg = s.kind === 'calendar' ? 'bg-blue-50 hover:bg-blue-100 border-blue-100' : s.kind === 'todo' ? 'bg-green-50 hover:bg-green-100 border-green-100' : 'bg-orange-50 hover:bg-orange-100 border-orange-100';
                                        const title = s.kind === 'calendar' ? s.item.title : s.kind === 'todo' ? s.item.text : (s.item.title || 'Không có tiêu đề');
                                        const remainLabel = s.diffDays === 1 ? 'Còn 1 ngày' : `Còn ${s.diffDays} ngày`;
                                        // Với Sự kiện: hiển thị ngày/tháng/năm GỐC (ngày tạo ban đầu), không phải ngày
                                        // lặp lại sắp tới — countdown "Còn X ngày" vẫn tính theo lần lặp sắp tới đó.
                                        const displayDate = (s.kind === 'calendar' && s.item.date) ? new Date(s.item.date.seconds * 1000) : s.dueDate;
                                        return (
                                            <button key={s.kind + '_' + s.item.id} onClick={() => handleResultClick(s.kind, s.item)} className={`w-full text-left p-3 rounded-xl border transition flex items-center gap-2.5 ${bg}`}>
                                                {icon}
                                                <div className="min-w-0 flex-1">
                                                    <div className="font-semibold text-sm text-slate-800 truncate">{title}</div>
                                                    <div className="text-[10px] text-slate-500 mt-0.5">{displayDate.toLocaleDateString('vi-VN')} · {remainLabel}</div>
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    )}

                    {/* Dropdown kết quả — sát dưới header, full width, không bo góc */}
                    {hasQuery && (
                        <div className="fixed z-[59] bg-white overflow-y-auto shadow-[0_8px_30px_rgba(0,0,0,0.18)]"
                            style={{ top: headerH + 'px', left: '50%', transform: 'translateX(-50%)', width: '100%', maxWidth: '448px', maxHeight: 'calc(100vh - ' + headerH + 'px - 56px)' }}
                            onClick={e => e.stopPropagation()}>

                            {/* Đang tải */}
                            {loading && <div className="text-center text-gray-400 py-8 text-sm animate-pulse">Đang tìm kiếm...</div>}

                            {/* Không có kết quả */}
                            {!loading && hasQuery && totalCount === 0 && !results.dateTarget && (
                                <div className="text-center text-gray-400 py-10 px-4">
                                    <Search size={36} className="mx-auto mb-3 opacity-20" />
                                    <p className="text-sm">Không tìm thấy kết quả cho <b className="text-gray-600">"{query}"</b></p>
                                </div>
                            )}

                            {/* Tìm theo ngày — không có sự kiện */}
                            {!loading && results.dateTarget && totalCount === 0 && (
                                <div className="p-4">
                                    <div className="bg-teal-50 border border-teal-200 rounded-2xl p-4 text-center">
                                        <CalendarDays size={28} className="mx-auto mb-2 text-teal-400" />
                                        <p className="text-sm font-bold text-teal-700">{results.dateTarget.toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</p>
                                        <p className="text-xs text-teal-500 mt-1">Không có sự kiện nào vào ngày này</p>
                                        <button onClick={() => handleGoToDate(results.dateTarget)} className="mt-3 text-xs bg-teal-600 text-white px-4 py-1.5 rounded-full hover:bg-teal-700 transition font-bold">→ Mở ngày này trên lịch</button>
                                    </div>
                                </div>
                            )}

                            {/* Kết quả */}
                            {!loading && (results.dateTarget || totalCount > 0) && (
                                <div className="p-4 space-y-5">

                                    {/* Ngày cụ thể */}
                                    {results.dateTarget && (
                                        <div>
                                            <div className="flex items-center gap-2 mb-2">
                                                <CalendarDays size={14} className="text-teal-500" />
                                                <span className="text-xs font-black uppercase tracking-wider text-teal-500">Ngày {results.dateTarget.toLocaleDateString('vi-VN')}</span>
                                                <button onClick={() => handleGoToDate(results.dateTarget)} className="ml-auto text-[9px] text-teal-500 hover:text-teal-700 border border-teal-300 rounded-full px-2 py-0.5 transition">Mở lịch →</button>
                                            </div>
                                            {results.dateEvents.length > 0
                                                ? <div className="space-y-1.5">{results.dateEvents.map(ev => (
                                                    <button key={ev.id} onClick={() => handleResultClick('calendar', ev)} className="w-full text-left p-3 bg-teal-50 hover:bg-teal-100 rounded-xl border border-teal-200 transition">
                                                        <div className="font-semibold text-sm text-slate-800 flex items-center gap-1.5"><Calendar size={12} className="text-teal-400 shrink-0"/>{ev.title}</div>
                                                    </button>
                                                ))}</div>
                                                : <p className="text-xs text-gray-400 italic pl-1">Không có sự kiện nào</p>
                                            }
                                        </div>
                                    )}

                                    {(() => {
                                        // Ưu tiên hẳn CẢ 1 NHÓM (Sự kiện/Việc cần làm/Ghi chú/Lịch biểu) lên trên nếu nhóm đó
                                        // có ít nhất 1 kết quả khớp ĐÚNG THẬT SỰ (giữ nguyên dấu như đã gõ) với từ khóa —
                                        // nhóm nào chỉ có khớp sau khi bỏ dấu (gần đúng) hoặc khớp mờ thì xếp xuống dưới.
                                        // Lưu ý: không dùng normalizeVN().includes() làm tiêu chí "khớp đúng", vì bỏ dấu
                                        // khiến "Hoàn"/"Hòa"/"Khóa" đều chứa "hoa" giống hệt "Hoa" — sẽ bị tính sai thành
                                        // khớp đúng dù dấu khác hẳn (đúng lỗi thực tế gặp phải).
                                        const qLower = query.trim().toLowerCase();
                                        const hasExactMatch = (list, getText) => qLower.length > 0 && list.some(item => (getText(item) || '').toLowerCase().includes(qLower));

                                        const eventsSection = results.events.length > 0 && (
                                            <div key="events">
                                                <div className="flex items-center gap-2 mb-2"><Calendar size={14} className="text-blue-500" /><span className="text-xs font-black uppercase tracking-wider text-blue-500">Sự kiện ({results.events.length})</span></div>
                                                <div className="space-y-1.5">{results.events.map(ev => {
                                                    const subInfo = getEventSearchSubInfo(ev);
                                                    return (
                                                    <button key={ev.id} onClick={() => handleResultClick('calendar', ev)} className="w-full text-left p-3 bg-blue-50 hover:bg-blue-100 rounded-xl border border-blue-100 transition flex items-center gap-2.5">
                                                        <Calendar size={16} className="text-blue-400 shrink-0"/>
                                                        <div className="min-w-0 flex-1">
                                                            <div className="font-semibold text-sm text-slate-800">{highlightText(ev.title, query)}</div>
                                                            {ev.date && (
                                                                <div className="text-[10px] text-blue-400 mt-0.5 flex items-center gap-1 flex-wrap">
                                                                    {new Date(ev.date.seconds * 1000).toLocaleDateString('vi-VN')}
                                                                    {subInfo && <span className="text-blue-500 font-semibold">· {subInfo}</span>}
                                                                </div>
                                                            )}
                                                        </div>
                                                    </button>
                                                    );
                                                })}</div>
                                            </div>
                                        );

                                        const todosSection = results.todos.length > 0 && (
                                            <div key="todos">
                                                <div className="flex items-center gap-2 mb-2"><CheckSquare size={14} className="text-green-500" /><span className="text-xs font-black uppercase tracking-wider text-green-500">Việc cần làm ({results.todos.length})</span></div>
                                                <div className="space-y-1.5">{results.todos.map(td => (
                                                    <button key={td.id} onClick={() => handleResultClick('todo', td)} className="w-full text-left p-3 bg-green-50 hover:bg-green-100 rounded-xl border border-green-100 transition flex items-center gap-2.5">
                                                        <CheckSquare size={16} className="text-green-400 shrink-0"/>
                                                        <div className="min-w-0 flex-1">
                                                            <div className={`font-semibold text-sm ${td.completed ? 'line-through text-gray-400' : 'text-slate-800'}`}>{highlightText(td.text, query)}</div>
                                                            {td.deadlineTime && <div className="text-[10px] text-green-400 mt-0.5">{new Date(td.deadlineTime.seconds * 1000).toLocaleDateString('vi-VN')}</div>}
                                                        </div>
                                                    </button>
                                                ))}</div>
                                            </div>
                                        );

                                        const notesSection = results.notes.length > 0 && (
                                            <div key="notes">
                                                <div className="flex items-center gap-2 mb-2"><StickyNote size={14} className="text-orange-500" /><span className="text-xs font-black uppercase tracking-wider text-orange-500">Ghi chú ({results.notes.length})</span></div>
                                                <div className="space-y-1.5">{results.notes.map(nt => (
                                                    <button key={nt.id} onClick={() => handleResultClick('notes', nt)} className="w-full text-left p-3 rounded-xl border border-orange-100 hover:opacity-90 transition flex items-center gap-2.5" style={{ backgroundColor: nt.color || '#FEFCE8' }}>
                                                        <StickyNote size={16} className="text-orange-400 shrink-0"/>
                                                        <div className="min-w-0 flex-1">
                                                            <div className="font-semibold text-sm text-slate-800 truncate">{highlightText(stripHtml(nt.title) || 'Không có tiêu đề', query)}</div>
                                                            {nt.content && <div className="text-[11px] text-slate-500 mt-0.5 truncate">{highlightText(nt.content, query)}</div>}
                                                        </div>
                                                    </button>
                                                ))}</div>
                                            </div>
                                        );

                                        const timetableSection = results.timetable.length > 0 && (
                                            <div key="timetable">
                                                <div className="flex items-center gap-2 mb-2"><Table size={14} className="text-purple-500" /><span className="text-xs font-black uppercase tracking-wider text-purple-500">Lịch biểu ({results.timetable.length})</span></div>
                                                <div className="space-y-1.5">{results.timetable.map(tk => (
                                                    <button key={tk.id} onClick={() => handleResultClick('timetable', tk)} className="w-full text-left p-3 bg-purple-50 hover:bg-purple-100 rounded-xl border border-purple-100 transition">
                                                        <div className="font-semibold text-sm text-slate-800 flex items-center gap-1.5"><Table size={12} className="text-purple-400 shrink-0"/>{highlightText(tk.text, query)}</div>
                                                        <div className="text-[10px] text-purple-400 mt-0.5 flex items-center gap-1"><CalendarDays size={10}/>{tk.day} · {tk.period} · {tk.col}</div>
                                                    </button>
                                                ))}</div>
                                            </div>
                                        );

                                        const sections = [
                                            { exact: hasExactMatch(results.events, e => e.title), node: eventsSection },
                                            { exact: hasExactMatch(results.todos, t => t.text), node: todosSection },
                                            { exact: hasExactMatch(results.notes, n => (n.title || '') + ' ' + (n.content || '')), node: notesSection },
                                            { exact: hasExactMatch(results.timetable, t => t.text), node: timetableSection },
                                        ];
                                        // sort ổn định (stable) — giữ nguyên thứ tự mặc định giữa các nhóm cùng mức độ khớp
                                        sections.sort((a, b) => (b.exact ? 1 : 0) - (a.exact ? 1 : 0));
                                        return sections.map(s => s.node);
                                    })()}
                                </div>
                            )}

                            {/* Footer đếm kết quả */}
                            {!loading && totalCount > 0 && (
                                <div className="sticky bottom-0 border-t px-4 py-2 text-center bg-white/90 backdrop-blur-sm">
                                    <span className="text-xs text-gray-400">Tìm thấy <b className="text-gray-600">{totalCount}</b> kết quả</span>
                                </div>
                            )}
                        </div>
                    )}
                </>
            );
        };

        // ==============================================================
        // TIỆN ÍCH: XUẤT / NHẬP DỮ LIỆU (Excel, PDF, JSON) — dùng chung cho ExportDataModal & ImportDataModal
        // ==============================================================

        // Danh sách loại dữ liệu có thể chọn để xuất/nhập, khớp với tên collection trên Firestore
        const DATA_TYPES = [
            { key: 'events',    label: 'Sự kiện (Lịch)',           icon: CalendarDays, color: 'text-blue-500' },
            { key: 'todos',     label: 'Việc cần làm',              icon: CheckSquare,  color: 'text-emerald-500' },
            { key: 'notes',     label: 'Ghi chú',                   icon: StickyNote,   color: 'text-amber-500' },
            { key: 'timetable', label: 'Thời khóa biểu',            icon: Table,        color: 'text-purple-500' },
            { key: 'vault',     label: 'Kho bảo mật (đã mã hóa)',   icon: Shield,       color: 'text-slate-700' },
            { key: 'all',       label: 'Tất cả dữ liệu',            icon: Download,     color: 'text-rose-500' },
        ];
        const ALL_COLLECTIONS = ['events', 'todos', 'notes', 'timetable', 'vault'];

        // Chuyển 1 giá trị field bất kỳ (kể cả Firestore Timestamp) thành dạng hiển thị được cho Excel/PDF
        const formatCellValue = (v) => {
            if (v === null || v === undefined) return '';
            if (typeof v === 'object') {
                if (typeof v.seconds === 'number') {
                    try {
                        const d = new Date(v.seconds * 1000 + Math.floor((v.nanoseconds || 0) / 1e6));
                        return d.toLocaleString('vi-VN');
                    } catch (e) { /* rơi xuống JSON.stringify bên dưới nếu lỗi */ }
                }
                try { return JSON.stringify(v); } catch (e) { return String(v); }
            }
            return v;
        };

        // Lấy dữ liệu 1 hoặc nhiều loại từ Firestore. keys có thể chứa 'all' để lấy hết.
        const fetchDataForKeys = async (db, appId, uid, keys) => {
            const cols = keys.includes('all') ? ALL_COLLECTIONS : keys.filter(k => ALL_COLLECTIONS.includes(k));
            const out = {};
            for (const col of cols) {
                const ref = collection(db, 'artifacts', appId, 'users', uid, col);
                const snap = await getDocs(ref);
                out[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            }
            return out;
        };

        const triggerDownloadBlob = (blob, filename) => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.click();
            URL.revokeObjectURL(url);
        };

        // ---- XUẤT JSON: giữ nguyên cấu trúc gốc 100%, dùng để nhập lại chính xác nhất ----
        const exportAsJSON = (dataByCol, filenameBase) => {
            const blob = new Blob([JSON.stringify(dataByCol, null, 2)], { type: 'application/json' });
            triggerDownloadBlob(blob, `${filenameBase}.json`);
        };

        // ---- XUẤT EXCEL: mỗi loại dữ liệu là 1 sheet riêng, kèm cột ẩn "_raw_json" để nhập lại chính xác 100% ----
        const exportAsExcel = (dataByCol, filenameBase) => {
            const wb = XLSX.utils.book_new();
            Object.entries(dataByCol).forEach(([col, items]) => {
                const rows = items.length ? items.map(item => {
                    const row = {};
                    Object.keys(item).forEach(k => {
                        if (k === 'id') { row['ID'] = item.id; return; }
                        row[k] = formatCellValue(item[k]);
                    });
                    row['_raw_json'] = JSON.stringify(item);
                    return row;
                }) : [{ 'Thông báo': 'Không có dữ liệu' }];
                const ws = XLSX.utils.json_to_sheet(rows);
                XLSX.utils.book_append_sheet(wb, ws, col.slice(0, 31));
            });
            XLSX.writeFile(wb, `${filenameBase}.xlsx`);
        };

        // ---- XUẤT PDF: dựng bảng HTML tạm ngoài màn hình rồi chụp lại bằng html2canvas ----
        // (đảm bảo tiếng Việt có dấu hiển thị đúng, vì font chuẩn của PDF không hỗ trợ đầy đủ dấu tiếng Việt)
        const exportAsPDF = async (dataByCol, filenameBase, titleMap) => {
            const container = document.createElement('div');
            container.style.position = 'fixed';
            container.style.top = '0';
            container.style.left = '-99999px';
            container.style.width = '1000px';
            container.style.background = '#ffffff';
            container.style.padding = '24px';
            container.style.fontFamily = "Arial, 'Segoe UI', sans-serif";

            Object.entries(dataByCol).forEach(([col, items]) => {
                const section = document.createElement('div');
                section.style.marginBottom = '28px';
                const title = document.createElement('h2');
                title.textContent = `${titleMap[col] || col} (${items.length} mục)`;
                title.style.fontSize = '18px';
                title.style.margin = '0 0 10px 0';
                title.style.color = '#1e293b';
                section.appendChild(title);

                if (!items.length) {
                    const p = document.createElement('p');
                    p.textContent = 'Không có dữ liệu.';
                    p.style.color = '#94a3b8'; p.style.fontSize = '13px';
                    section.appendChild(p);
                } else {
                    const keySet = new Set();
                    items.forEach(it => Object.keys(it).forEach(k => { if (k !== 'id') keySet.add(k); }));
                    const keys = Array.from(keySet);
                    const table = document.createElement('table');
                    table.style.borderCollapse = 'collapse';
                    table.style.width = '100%';
                    table.style.fontSize = '11px';
                    const thead = document.createElement('thead');
                    const headRow = document.createElement('tr');
                    ['ID', ...keys].forEach(h => {
                        const th = document.createElement('th');
                        th.textContent = h;
                        th.style.border = '1px solid #cbd5e1';
                        th.style.background = '#1e293b';
                        th.style.color = '#fff';
                        th.style.padding = '5px 7px';
                        th.style.textAlign = 'left';
                        headRow.appendChild(th);
                    });
                    thead.appendChild(headRow);
                    table.appendChild(thead);
                    const tbody = document.createElement('tbody');
                    items.forEach((it, i) => {
                        const tr = document.createElement('tr');
                        tr.style.background = i % 2 === 0 ? '#ffffff' : '#f8fafc';
                        const idTd = document.createElement('td');
                        idTd.textContent = it.id || '';
                        idTd.style.border = '1px solid #e2e8f0'; idTd.style.padding = '5px 7px';
                        tr.appendChild(idTd);
                        keys.forEach(k => {
                            const td = document.createElement('td');
                            td.textContent = String(formatCellValue(it[k]));
                            td.style.border = '1px solid #e2e8f0'; td.style.padding = '5px 7px';
                            tr.appendChild(td);
                        });
                        tbody.appendChild(tr);
                    });
                    table.appendChild(tbody);
                    section.appendChild(table);
                }
                container.appendChild(section);
            });

            document.body.appendChild(container);
            try {
                const canvas = await html2canvas(container, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
                const pdf = new jsPDF({ orientation: 'p', unit: 'pt', format: 'a4' });
                const pageW = pdf.internal.pageSize.getWidth();
                const pageH = pdf.internal.pageSize.getHeight();
                const imgW = pageW;
                const pxPerPt = canvas.width / imgW;
                const pageHInCanvasPx = pageH * pxPerPt;
                let renderedH = 0;
                let first = true;
                while (renderedH < canvas.height) {
                    const sliceH = Math.min(pageHInCanvasPx, canvas.height - renderedH);
                    const sliceCanvas = document.createElement('canvas');
                    sliceCanvas.width = canvas.width;
                    sliceCanvas.height = sliceH;
                    const ctx = sliceCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, renderedH, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
                    const sliceImgData = sliceCanvas.toDataURL('image/jpeg', 0.92);
                    if (!first) pdf.addPage();
                    pdf.addImage(sliceImgData, 'JPEG', 0, 0, imgW, (sliceH * imgW) / canvas.width);
                    renderedH += sliceH;
                    first = false;
                }
                pdf.save(`${filenameBase}.pdf`);
            } finally {
                document.body.removeChild(container);
            }
        };

        // ---- NHẬP DỮ LIỆU: ghi đè các collection có trong dữ liệu nhập (giữ đúng logic gốc của ứng dụng) ----
        const applyImportData = async (db, appId, uid, dataByCol) => {
            for (const key of Object.keys(dataByCol)) {
                if (!ALL_COLLECTIONS.includes(key)) {
                    throw new Error(`File chứa loại dữ liệu không hợp lệ: "${key}".`);
                }
            }
            const batch = writeBatch(db);
            for (const [col, items] of Object.entries(dataByCol)) {
                const ref = collection(db, 'artifacts', appId, 'users', uid, col);
                const snap = await getDocs(ref);
                snap.docs.forEach(d => batch.delete(d.ref));
                (items || []).forEach(item => {
                    const { id, ...rest } = item;
                    const docRef = doc(ref, id || undefined);
                    batch.set(docRef, rest);
                });
            }
            await batch.commit();
        };

        // Đọc 1 file JSON và trả về { collection: [items] }
        const parseJSONImportFile = async (file, selectedKey) => {
            const text = await file.text();
            const data = JSON.parse(text);
            if (Array.isArray(data)) {
                if (selectedKey === 'all') throw new Error('File JSON này chỉ chứa 1 loại dữ liệu dạng danh sách — vui lòng chọn đúng loại dữ liệu tương ứng thay vì "Tất cả dữ liệu".');
                return { [selectedKey]: data };
            }
            if (data && typeof data === 'object') {
                if (selectedKey !== 'all') {
                    if (!(selectedKey in data)) throw new Error(`File JSON không chứa dữ liệu loại "${selectedKey}".`);
                    return { [selectedKey]: data[selectedKey] };
                }
                return data;
            }
            throw new Error('File JSON không đúng định dạng.');
        };

        // Đọc 1 file Excel (.xlsx) và trả về { collection: [items] }.
        // Ưu tiên đọc cột ẩn "_raw_json" (do chính ứng dụng tạo ra khi xuất) để khôi phục dữ liệu chính xác 100%.
        const parseExcelImportFile = async (file, selectedKey) => {
            const buf = await file.arrayBuffer();
            const wb = XLSX.read(buf, { type: 'array' });
            const sheetNames = selectedKey === 'all'
                ? wb.SheetNames.filter(n => ALL_COLLECTIONS.includes(n))
                : wb.SheetNames.filter(n => n === selectedKey);
            if (!sheetNames.length) {
                throw new Error('Không tìm thấy sheet dữ liệu phù hợp trong file Excel. Vui lòng dùng file Excel do chính ứng dụng này xuất ra.');
            }
            const out = {};
            sheetNames.forEach(name => {
                const ws = wb.Sheets[name];
                const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
                const items = rows.map(row => {
                    if (row['_raw_json']) {
                        try { return JSON.parse(row['_raw_json']); } catch (e) { /* rơi xuống dự phòng bên dưới */ }
                    }
                    // Dự phòng khi thiếu cột "_raw_json" (ví dụ file bị chỉnh sửa thủ công): dựng lại object best-effort
                    const item = {};
                    Object.entries(row).forEach(([k, v]) => {
                        if (k === '_raw_json') return;
                        if (k === 'ID') { item.id = v; return; }
                        item[k] = v;
                    });
                    return item;
                });
                out[name] = items;
            });
            return out;
        };

        const EXPORT_IMPORT_TITLE_MAP = {
            events: 'Sự kiện (Lịch)', todos: 'Việc cần làm', notes: 'Ghi chú',
            timetable: 'Thời khóa biểu', vault: 'Kho bảo mật (đã mã hóa)'
        };

        // ==============================================================
        // COMPONENT: POPUP XUẤT DỮ LIỆU (Excel / PDF / JSON)
        // ==============================================================
        const ExportDataModal = ({ onClose, db, appId, auth }) => {
            const [selectedType, setSelectedType] = useState('all');
            const [format, setFormat] = useState('excel');
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState('');

            const handleExport = async () => {
                setError(''); setBusy(true);
                try {
                    const uid = auth.currentUser.uid;
                    const dataByCol = await fetchDataForKeys(db, appId, uid, [selectedType]);
                    const base = `${selectedType}_${new Date().toISOString().slice(0, 10)}`;
                    if (format === 'json') exportAsJSON(dataByCol, base);
                    else if (format === 'excel') exportAsExcel(dataByCol, base);
                    else await exportAsPDF(dataByCol, base, EXPORT_IMPORT_TITLE_MAP);
                    toast.success('Xuất dữ liệu thành công!', { position: 'top-center' });
                    onClose();
                } catch (err) {
                    console.error('Lỗi xuất dữ liệu:', err);
                    setError('Lỗi xuất dữ liệu: ' + err.message);
                    toast.error('Lỗi xuất dữ liệu: ' + err.message, { position: 'top-center' });
                } finally {
                    setBusy(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/50 z-[65] flex items-center justify-center p-4" onClick={onClose}>
                    <div className="bg-white w-full max-w-sm rounded-xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col" onClick={e => e.stopPropagation()}>
                        <div className="bg-gray-800 text-white p-4 flex justify-between items-center shrink-0">
                            <h3 className="font-bold flex items-center gap-2"><Download size={18}/> Xuất dữ liệu</h3>
                            <button onClick={onClose} aria-label="Đóng"><X size={20}/></button>
                        </div>
                        <div className="p-5 space-y-5 overflow-y-auto flex-1 no-scrollbar text-slate-800">
                            <div>
                                <p className="text-xs font-bold text-slate-500 uppercase mb-2">Chọn loại dữ liệu cần xuất:</p>
                                <div className="space-y-1.5">
                                    {DATA_TYPES.map(dt => (
                                        <label key={dt.key} className={`flex items-center gap-2.5 p-2.5 rounded-lg border cursor-pointer transition ${selectedType === dt.key ? 'border-blue-500 bg-blue-50' : 'border-slate-200 hover:bg-slate-50'}`}>
                                            <input type="radio" name="export-type" checked={selectedType === dt.key} onChange={() => setSelectedType(dt.key)} className="accent-blue-600" />
                                            <dt.icon size={16} className={dt.color} />
                                            <span className="text-sm font-medium">{dt.label}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                            <div>
                                <p className="text-xs font-bold text-slate-500 uppercase mb-2">Định dạng xuất:</p>
                                <div className="grid grid-cols-3 gap-2">
                                    <button type="button" onClick={() => setFormat('excel')} className={`flex flex-col items-center gap-1 py-2.5 rounded-lg border text-xs font-bold transition ${format === 'excel' ? 'border-emerald-500 bg-emerald-50 text-emerald-700' : 'border-slate-200 text-slate-500 hover:bg-slate-50'}`}>
                                        <FileSpreadsheet size={18}/> Excel
                                    </button>
                                    <button type="button" onClick={() => setFormat('pdf')} className={`flex flex-col items-center gap-1 py-2.5 rounded-lg border text-xs font-bold transition ${format === 'pdf' ? 'border-red-500 bg-red-50 text-red-700' : 'border-slate-200 text-slate-500 hover:bg-slate-50'}`}>
                                        <FileText size={18}/> PDF
                                    </button>
                                    <button type="button" onClick={() => setFormat('json')} className={`flex flex-col items-center gap-1 py-2.5 rounded-lg border text-xs font-bold transition ${format === 'json' ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-slate-200 text-slate-500 hover:bg-slate-50'}`}>
                                        <FileJson size={18}/> JSON
                                    </button>
                                </div>
                                {format === 'json' && <p className="text-[10px] text-slate-400 mt-2">💡 JSON giữ nguyên cấu trúc gốc — nên dùng nếu bạn định nhập (import) lại sau này.</p>}
                                {format === 'excel' && <p className="text-[10px] text-slate-400 mt-2">💡 File Excel có kèm dữ liệu gốc ẩn, có thể nhập lại chính xác 100% sau này.</p>}
                                {format === 'pdf' && <p className="text-[10px] text-slate-400 mt-2">💡 PDF chỉ để xem/in — không thể nhập (import) ngược lại.</p>}
                            </div>
                            {error && <p className="text-red-500 text-xs">{error}</p>}
                        </div>
                        <div className="p-4 border-t flex gap-2 shrink-0">
                            <button onClick={onClose} className="flex-1 border border-slate-300 text-slate-600 py-2.5 rounded-lg text-sm font-bold hover:bg-slate-50">Hủy</button>
                            <button onClick={handleExport} disabled={busy} className="flex-1 bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-lg text-sm font-bold transition disabled:opacity-50 flex items-center justify-center gap-2">
                                {busy && <RefreshCw size={14} className="animate-spin"/>} {busy ? 'Đang xuất...' : 'Xuất'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // ==============================================================
        // COMPONENT: POPUP NHẬP DỮ LIỆU (Excel / JSON)
        // ==============================================================
        const ImportDataModal = ({ onClose, db, appId, auth }) => {
            const [selectedType, setSelectedType] = useState('all');
            const [format, setFormat] = useState('json');
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState('');
            const fileInputRef = React.useRef(null);

            const handlePickFile = () => { if (fileInputRef.current) fileInputRef.current.click(); };

            const handleFileChange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setError(''); setBusy(true);
                try {
                    const dataByCol = format === 'json'
                        ? await parseJSONImportFile(file, selectedType)
                        : await parseExcelImportFile(file, selectedType);
                    const colNames = Object.keys(dataByCol);
                    if (!colNames.length) throw new Error('Không tìm thấy dữ liệu để nhập trong file.');
                    const total = colNames.reduce((s, c) => s + ((dataByCol[c] || []).length), 0);
                    const labelList = colNames.map(c => EXPORT_IMPORT_TITLE_MAP[c] || c).join(', ');
                    const confirmMsg = `CẢNH BÁO: Thao tác này sẽ GHI ĐÈ toàn bộ dữ liệu hiện tại của: ${labelList} (tổng ${total} mục). Vault vẫn giữ nguyên mã hóa nếu có. Bạn có chắc chắn muốn tiếp tục?`;
                    if (!window.confirm(confirmMsg)) { setBusy(false); e.target.value = ''; return; }
                    const uid = auth.currentUser.uid;
                    await applyImportData(db, appId, uid, dataByCol);
                    toast.success('Nhập dữ liệu thành công!', { position: 'top-center' });
                    onClose();
                } catch (err) {
                    console.error('Lỗi nhập dữ liệu:', err);
                    setError('Lỗi nhập dữ liệu: ' + err.message);
                    toast.error('Lỗi nhập dữ liệu: ' + err.message, { position: 'top-center' });
                } finally {
                    setBusy(false);
                    e.target.value = '';
                }
            };

            return (
                <div className="fixed inset-0 bg-black/50 z-[65] flex items-center justify-center p-4" onClick={onClose}>
                    <div className="bg-white w-full max-w-sm rounded-xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col" onClick={e => e.stopPropagation()}>
                        <div className="bg-gray-800 text-white p-4 flex justify-between items-center shrink-0">
                            <h3 className="font-bold flex items-center gap-2"><FileUp size={18}/> Nhập dữ liệu</h3>
                            <button onClick={onClose} aria-label="Đóng"><X size={20}/></button>
                        </div>
                        <div className="p-5 space-y-5 overflow-y-auto flex-1 no-scrollbar text-slate-800">
                            <div>
                                <p className="text-xs font-bold text-slate-500 uppercase mb-2">Chọn loại dữ liệu cần nhập:</p>
                                <div className="space-y-1.5">
                                    {DATA_TYPES.map(dt => (
                                        <label key={dt.key} className={`flex items-center gap-2.5 p-2.5 rounded-lg border cursor-pointer transition ${selectedType === dt.key ? 'border-blue-500 bg-blue-50' : 'border-slate-200 hover:bg-slate-50'}`}>
                                            <input type="radio" name="import-type" checked={selectedType === dt.key} onChange={() => setSelectedType(dt.key)} className="accent-blue-600" />
                                            <dt.icon size={16} className={dt.color} />
                                            <span className="text-sm font-medium">{dt.label}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                            <div>
                                <p className="text-xs font-bold text-slate-500 uppercase mb-2">Định dạng file nhập:</p>
                                <div className="grid grid-cols-2 gap-2">
                                    <button type="button" onClick={() => setFormat('json')} className={`flex flex-col items-center gap-1 py-2.5 rounded-lg border text-xs font-bold transition ${format === 'json' ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-slate-200 text-slate-500 hover:bg-slate-50'}`}>
                                        <FileJson size={18}/> JSON
                                    </button>
                                    <button type="button" onClick={() => setFormat('excel')} className={`flex flex-col items-center gap-1 py-2.5 rounded-lg border text-xs font-bold transition ${format === 'excel' ? 'border-emerald-500 bg-emerald-50 text-emerald-700' : 'border-slate-200 text-slate-500 hover:bg-slate-50'}`}>
                                        <FileSpreadsheet size={18}/> Excel
                                    </button>
                                </div>
                                <p className="text-[10px] text-slate-400 mt-2">⚠️ Chỉ nhập được file JSON hoặc Excel do chính ứng dụng này xuất ra. Không hỗ trợ nhập từ PDF vì PDF không lưu dữ liệu ở dạng có cấu trúc.</p>
                            </div>
                            {error && <p className="text-red-500 text-xs">{error}</p>}
                            <input ref={fileInputRef} type="file" accept={format === 'json' ? '.json' : '.xlsx,.xls'} onChange={handleFileChange} className="hidden" disabled={busy} />
                        </div>
                        <div className="p-4 border-t flex gap-2 shrink-0">
                            <button onClick={onClose} className="flex-1 border border-slate-300 text-slate-600 py-2.5 rounded-lg text-sm font-bold hover:bg-slate-50">Hủy</button>
                            <button onClick={handlePickFile} disabled={busy} className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-sm font-bold transition disabled:opacity-50 flex items-center justify-center gap-2">
                                {busy && <RefreshCw size={14} className="animate-spin"/>} {busy ? 'Đang nhập...' : 'Chọn file & Nhập'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // ==============================================================
        // COMPONENT: LOCK SCREEN với giới hạn số lần thử sai (khóa tăng dần)
        // ==============================================================
        const LockScreen = ({ onUnlock, correctPassword, lockKey, db, appId, user }) => {
            const [pin, setPin] = useState('');
            const [error, setError] = useState('');
            const [attempts, setAttempts] = useState(0);
            const [lockedUntil, setLockedUntil] = useState(null);
            const [remaining, setRemaining] = useState(0);
            const [loading, setLoading] = useState(true);
            const [actionDisabled, setActionDisabled] = useState(false);

            // Đọc trạng thái khóa từ Firestore
            useEffect(() => {
                if (!user) return;
                const attemptsRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'attempts');
                const fetchAttempts = async () => {
                    try {
                        const snap = await getDoc(attemptsRef);
                        if (snap.exists()) {
                            const data = snap.data();
                            setAttempts(data.attempts || 0);
                            if (data.lockedUntil && data.lockedUntil.toMillis) {
                                const lockTime = data.lockedUntil.toMillis();
                                if (lockTime > Date.now()) {
                                    setLockedUntil(lockTime);
                                } else {
                                    // Quá hạn, reset
                                    await setDoc(attemptsRef, { attempts: 0, lockedUntil: null }, { merge: true });
                                    setAttempts(0);
                                    setLockedUntil(null);
                                }
                            }
                        } else {
                            // Chưa có document, tạo mới
                            await setDoc(attemptsRef, { attempts: 0, lockedUntil: null });
                        }
                        setLoading(false);
                    } catch (e) {
                        console.warn('Lỗi đọc attempts:', e);
                        setLoading(false);
                    }
                };
                fetchAttempts();
            }, [db, appId, user]);

            // Timer đếm ngược khi bị khóa
            useEffect(() => {
                if (!lockedUntil) return;
                const interval = setInterval(() => {
                    const now = Date.now();
                    if (now >= lockedUntil) {
                        setLockedUntil(null);
                        setAttempts(0);
                        // Reset trên Firestore
                        const attemptsRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'attempts');
                        setDoc(attemptsRef, { attempts: 0, lockedUntil: null }, { merge: true }).catch(console.warn);
                        clearInterval(interval);
                        setRemaining(0);
