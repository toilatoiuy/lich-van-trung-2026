                    setLockError("Vui lòng nhập mã bảo vệ nếu muốn bật tính năng này.");
                    return;
                }
                try {
                    const settingsRef = doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'settings', 'lock');
                    const payload = { appPassword: appPassword.trim(), enableLock: enableLock };
                    await setDoc(settingsRef, payload, { merge: true });
                    localStorage.setItem('vt_app_password', appPassword.trim());
                    localStorage.setItem('vt_enable_lock', enableLock ? 'true' : 'false');
                    setLockSuccess("Đã cập nhật tính năng bảo vệ thành công!");
                } catch (err) { setLockError("Lỗi lưu cấu hình bảo vệ: " + err.message); }
            };

            const handleChangePassword = async (e) => {
                e.preventDefault();
                setPasswordMessage('');
                setPasswordError('');
                if (!newPassword.trim()) {
                    setPasswordError("Vui lòng nhập mật khẩu mới.");
                    return;
                }
                try {
                    if (auth.currentUser) {
                        await updatePassword(auth.currentUser, newPassword);
                        setPasswordMessage("Đổi mật khẩu thành công!");
                        setNewPassword('');
                    } else { setPasswordError("Không tìm thấy thông tin phiên đăng nhập."); }
                } catch (err) {
                    if (err.code === 'auth/requires-recent-login') {
                        setPasswordError("⚠️ Hãy Đăng xuất và Đăng nhập lại để xác thực danh tính trước khi đổi mật khẩu.");
                    } else { setPasswordError("Lỗi: " + err.message); }
                }
            };

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div className="bg-white w-full max-w-sm rounded-xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
                        <div className="bg-gray-800 text-white p-4 flex justify-between items-center shrink-0">
                            <h3 className="font-bold flex items-center gap-2"><Palette size={18}/> Giao Diện & Bảo Mật</h3>
                            <button onClick={onClose}><X size={20}/></button>
                        </div>
                        <div className="p-6 space-y-6 overflow-y-auto flex-1 no-scrollbar text-slate-800">
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2">Màu Nền Ứng Dụng</label>
                                <input type="color" className="w-full h-12 rounded cursor-pointer border-2 border-gray-200 bg-white" value={localTheme.bgColor} onChange={e => setLocalTheme({...localTheme, bgColor: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2">Màu Nền Ghi Chú</label>
                                <input type="color" className="w-full h-12 rounded cursor-pointer border-2 border-gray-200 bg-white" value={localTheme.noteColor} onChange={e => setLocalTheme({...localTheme, noteColor: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2">Màu Chữ Chính</label>
                                <input type="color" className="w-full h-12 rounded cursor-pointer border-2 border-gray-200 bg-white" value={localTheme.textColor} onChange={e => setLocalTheme({...localTheme, textColor: e.target.value})} />
                            </div>
                            <button onClick={() => onSave(localTheme)} className="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700 shadow-md">Lưu & Đồng Bộ Màu</button>
                            <button onClick={() => onSave({ bgColor: '#f3f4f6', noteColor: '#FEFCE8', textColor: '#1F2937' })} className="w-full border border-gray-300 text-gray-600 py-2 rounded-lg text-sm">Khôi phục màu mặc định</button>
                            
                            <div className="border-t pt-4 mt-4">
                                <h4 className="font-bold text-sm text-slate-800 flex items-center gap-2 mb-3"><Lock size={16} /> Bảo vệ Ghi chú & Việc cần làm</h4>
                                <form onSubmit={handleSaveLockSettings} className="space-y-3 p-3 bg-slate-50 rounded-lg border border-slate-200">
                                    <div className="flex items-center justify-between mb-1">
                                        <span className="text-xs font-semibold text-slate-600">Trạng thái khóa bảo vệ:</span>
                                        <label className="relative inline-flex items-center cursor-pointer">
                                            <input type="checkbox" className="sr-only peer" checked={enableLock} onChange={e => setEnableLock(e.target.checked)} />
                                            <div className="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                                        </label>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="block text-[10px] font-bold text-slate-500 uppercase">Mã PIN bảo mật</label>
                                        <input type="password" maxLength={12} className="w-full px-3 py-1.5 border rounded-lg text-sm text-slate-800 focus:ring-1 focus:ring-blue-500 outline-none" placeholder="Nhập mã bảo vệ cá nhân..." value={appPassword} onChange={e => setAppPassword(e.target.value)} />
                                    </div>
                                    {lockError && <p className="text-red-500 text-xs">{lockError}</p>}
                                    {lockSuccess && <p className="text-green-600 text-xs font-medium">{lockSuccess}</p>}
                                    <button type="submit" className="w-full bg-slate-800 text-white text-xs font-bold py-2 rounded-lg hover:bg-slate-700 transition">Cập nhật mật khẩu bảo vệ</button>
                                </form>
                            </div>

                            <div className="border-t pt-4 mt-4">
                                <button type="button" onClick={() => setShowChangePassword(!showChangePassword)} className="w-full flex items-center justify-center gap-2 border border-slate-300 text-slate-700 py-2 rounded-lg text-sm font-bold hover:bg-slate-50 transition" >
                                    <Key size={16} /> {showChangePassword ? "Ẩn đổi mật khẩu" : "Đổi mật khẩu tài khoản"}
                                </button>
                                {showChangePassword && (
                                    <form onSubmit={handleChangePassword} className="mt-4 space-y-3 p-3 bg-slate-50 rounded-lg border border-slate-200 animate-in fade-in">
                                        <label className="block text-xs font-bold text-slate-600">Mật khẩu mới</label>
                                        <input type="password" className="w-full px-3 py-2 border rounded-lg text-sm text-slate-800 focus:ring-1 focus:ring-blue-500 outline-none" placeholder="Nhập mật khẩu mới..." value={newPassword} onChange={e => setNewPassword(e.target.value)} />
                                        {passwordError && <p className="text-red-500 text-xs">{passwordError}</p>}
                                        {passwordMessage && <p className="text-green-600 text-xs font-medium">{passwordMessage}</p>}
                                        <button type="submit" className="w-full bg-slate-800 text-white text-xs font-bold py-2 rounded-lg hover:bg-slate-700 transition">Xác nhận đổi mật khẩu</button>
                                    </form>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AuthScreen = ({ auth, appId }) => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [message, setMessage] = useState('');
            const [showPassword, setShowPassword] = useState(false);

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                setMessage('');
                try {
                    if (isLogin) await signInWithEmailAndPassword(auth, email, password);
                    else await createUserWithEmailAndPassword(auth, email, password);
                } catch (err) { setError("Lỗi: " + err.message); }
            };

            const handleForgotPassword = async () => {
                setError('');
                setMessage('');
                if (!email.trim()) {
                    setError("Vui lòng nhập Email để nhận liên kết đặt lại mật khẩu.");
                    return;
                }
                try {
                    await sendPasswordResetEmail(auth, email);
                    setMessage("Liên kết đặt lại mật khẩu đã được gửi vào Email của bạn!");
                } catch (err) { setError("Lỗi khi gửi email khôi phục: " + err.message); }
            };

            return (
                <div className="flex h-screen items-center justify-center bg-blue-50 p-6 font-sans">
                    <div className="w-full max-w-sm bg-white rounded-2xl shadow-xl p-8 border border-blue-100">
                        <div className="flex justify-center mb-6"><div className="bg-blue-100 p-4 rounded-full"><User className="text-blue-600" size={32} /></div></div>
                        <h2 className="text-2xl font-bold text-center text-gray-800 mb-2">{isLogin ? 'Đăng Nhập' : 'Đăng Ký'}</h2>
                        <div className="text-center mb-6"><span className="text-[10px] px-2 py-1 rounded font-mono border bg-green-100 text-green-700 border-green-200">Server: <b>{appId}</b></span></div>
                        <form onSubmit={handleAuth} className="space-y-4">
                            <input type="email" required className="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} />
                            <div className="relative w-full">
                                <input type={showPassword ? "text" : "password"} required className="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 pr-12" placeholder="Mật khẩu" value={password} onChange={e => setPassword(e.target.value)} />
                                <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1" >
                                    {showPassword ? <EyeOff size={18} /> : <Eye size={18} />}
                                </button>
                            </div>
                            {error && <p className="text-red-500 text-sm text-center bg-red-50 p-2 rounded">{error}</p>}
                            {message && <p className="text-green-600 text-sm text-center bg-green-50 p-2 rounded font-medium">{message}</p>}
                            <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-blue-700 transition">{isLogin ? 'Vào Ứng Dụng' : 'Tạo Tài Khoản'}</button>
                        </form>
                        <div className="mt-6 flex flex-col items-center gap-3 text-sm">
                            {isLogin && (
                                <button type="button" onClick={handleForgotPassword} className="text-slate-500 hover:text-blue-600 text-xs transition" >
                                    Quên mật khẩu?
                                </button>
                            )}
                            <button onClick={() => { setIsLogin(!isLogin); setError(''); setMessage(''); }} className="text-blue-600 hover:underline font-medium">{isLogin ? 'Chưa có tài khoản? Đăng ký ngay' : 'Đã có tài khoản? Đăng nhập'}</button>
                        </div>
                    </div>
                </div>
            );
        };

        const TimeTableView = ({ user, db, appId, theme }) => {
            const [schedule, setSchedule] = useState({});
            const [headers, setHeaders] = useState({ col1: 'Môn - Lớp', col2: 'Ghi chú' });
            const [startOfWeekDate, setStartOfWeekDate] = useState(() => {
                const now = new Date();
                const day = now.getDay();
                const diff = now.getDate() - day + (day === 0 ? -6 : 1);
                const monday = new Date(now.setDate(diff));
                monday.setHours(0, 0, 0, 0);
                return monday;
            });
            const periods = [1, 2, 3, 4, 5];

            const weekKey = useMemo(() => {
                const yyyy = startOfWeekDate.getFullYear();
                const target = new Date(startOfWeekDate.valueOf());
                const dayNr = (startOfWeekDate.getDay() + 6) % 7;
                target.setDate(target.getDate() - dayNr + 3);
                const firstThursday = target.valueOf();
                target.setMonth(0, 1);
                if (target.getDay() !== 4) { target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7); }
                const weekNum = 1 + Math.ceil((firstThursday - target) / 604800000);
                return `${yyyy}_w${weekNum}`;
            }, [startOfWeekDate]);

            const tkbRef = useMemo(() => doc(db, 'artifacts', appId, 'users', user.uid, 'timetable', `main_${weekKey}`), [db, appId, user.uid, weekKey]);

            useEffect(() => {
                const unsub = onSnapshot(tkbRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setSchedule(data.schedule || {});
                        if(data.headers) setHeaders(data.headers);
                    } else {
                        setSchedule({});
                        setHeaders({ col1: 'Môn - Lớp', col2: 'Ghi chú' });
                    }
                }, err => { console.warn("Tải thời khóa biểu offline warning (Sử dụng dữ liệu cached):", err); });
                return unsub;
            }, [tkbRef]);

            const changeWeek = (weeks) => {
                const nextMon = new Date(startOfWeekDate.getTime());
                nextMon.setDate(nextMon.getDate() + (weeks * 7));
                setStartOfWeekDate(nextMon);
            };

            const handleCellChange = async (day, period, field, value) => {
                const updatedSchedule = { ...schedule };
                const cellKey = `${day}_${period}`;
                if (!updatedSchedule[cellKey]) updatedSchedule[cellKey] = { sub: '', note: '' };
                updatedSchedule[cellKey][field] = value;
                setSchedule(updatedSchedule);
                try { await setDoc(tkbRef, { schedule: updatedSchedule, headers }, { merge: true }); } 
                catch (e) { toast.error("Lỗi đồng bộ dữ liệu TKB!"); }
            };

            const handleHeaderChange = async (field, value) => {
                const updatedHeaders = { ...headers, [field]: value };
                setHeaders(updatedHeaders);
                try { await setDoc(tkbRef, { schedule, headers: updatedHeaders }, { merge: true }); } 
                catch (e) { toast.error("Lỗi đồng bộ tiêu đề TKB!"); }
            };

            const getDayDateString = (dayIndex) => {
                const d = new Date(startOfWeekDate.getTime());
                d.setDate(d.getDate() + (dayIndex - 2));
                return `${d.getDate()}/${d.getMonth() + 1}`;
            };

            return (
                <div className="space-y-4 max-w-4xl mx-auto p-1 font-sans">
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-wrap justify-between items-center gap-3">
                        <div className="flex items-center gap-2">
                            <Table className="text-blue-600" size={22} />
                            <h2 className="text-base font-bold text-slate-800">Thời Khóa Biểu Giảng Dạy</h2>
                        </div>
                        <div className="flex items-center gap-1.5 bg-slate-100 p-1 rounded-lg border text-xs">
                            <button onClick={() => changeWeek(-1)} className="p-1.5 hover:bg-white rounded transition shadow-sm"><ChevronLeft size={16}/></button>
                            <span className="font-bold px-2 text-slate-700 uppercase">Tuần {weekKey.split('_w')[1]} ({startOfWeekDate.getFullYear()})</span>
                            <button onClick={() => changeWeek(1)} className="p-1.5 hover:bg-white rounded transition shadow-sm"><ChevronRight size={16}/></button>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-x-auto no-scrollbar">
                        <table className="w-full text-left border-collapse min-w-[700px]">
                            <thead>
                                <tr className="bg-slate-800 text-white text-xs font-bold uppercase tracking-wider">
                                    <th className="p-3 border border-slate-700 w-24 text-center">Thứ / Ngày</th>
                                    <th className="p-3 border border-slate-700 w-16 text-center">Tiết</th>
                                    <th className="p-3 border border-slate-700">
                                        <input type="text" className="bg-transparent font-bold w-full focus:bg-slate-700 px-1 py-0.5 rounded outline-none border border-transparent focus:border-slate-500 text-white text-xs uppercase" value={headers.col1} onChange={e => handleHeaderChange('col1', e.target.value)} />
                                    </th>
                                    <th className="p-3 border border-slate-700">
                                        <input type="text" className="bg-transparent font-bold w-full focus:bg-slate-700 px-1 py-0.5 rounded outline-none border border-transparent focus:border-slate-500 text-white text-xs uppercase" value={headers.col2} onChange={e => handleHeaderChange('col2', e.target.value)} />
                                    </th>
                                </tr>
                            </thead>
                            <tbody className="text-xs text-slate-700">
                                {[2, 3, 4, 5, 6, 7].map((day) => (
                                    <React.Fragment key={day}>
                                        {periods.map((period, pIdx) => {
                                            const cellKey = `${day}_${period}`;
                                            const cellData = schedule[cellKey] || { sub: '', note: '' };
                                            return (
                                                <tr key={period} className={`hover:bg-blue-50/40 transition border-b border-gray-100 ${day % 2 === 0 ? 'bg-slate-50/50' : 'bg-white'}`}>
                                                    {pIdx === 0 && (
                                                        <td rowSpan={5} className="p-3 border font-bold text-center bg-slate-100 text-slate-700 align-middle w-24 border-gray-200">
                                                            <div className="text-sm">Thứ {day}</div>
                                                            <div className="text-[10px] text-slate-400 font-normal mt-0.5">({getDayDateString(day)})</div>
                                                        </td>
                                                    )}
                                                    <td className="p-2 border text-center font-bold text-slate-500 bg-slate-50/30 w-16 border-gray-200">Tiết {period}</td>
                                                    <td className="p-1.5 border border-gray-200">
                                                        <input type="text" className="w-full bg-transparent px-2 py-1 rounded focus:bg-white focus:shadow-sm outline-none border border-transparent focus:border-blue-400 text-slate-800" placeholder="Môn - Lớp..." value={cellData.sub} onChange={e => handleCellChange(day, period, 'sub', e.target.value)} />
                                                    </td>
                                                    <td className="p-1.5 border border-gray-200">
                                                        <input type="text" className="w-full bg-transparent px-2 py-1 rounded focus:bg-white focus:shadow-sm outline-none border border-transparent focus:border-blue-400 text-slate-500" placeholder="Phòng, bài giảng, ghi chú nhanh..." value={cellData.note} onChange={e => handleCellChange(day, period, 'note', e.target.value)} />
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </React.Fragment>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // --- POP-UP NỔI HIỂN THỊ ĐẦY ĐỦ VIỆC CẦN LÀM VÀO BUỔI SÁNG (2-LAYER REMINDER) ---
        const ReminderModal = ({ isOpen, onClose, todos, events }) => {
            if (!isOpen) return null;

            const todayStr = new Date().toLocaleDateString('en-CA');
            
            // Lọc ra các sự kiện hôm nay
            const todayEvents = events.filter(e => e.date === todayStr);
            
            // Lọc ra các việc cần làm hôm nay
            const todayTodos = todos.filter(t => t.date === todayStr && !t.completed);
            
            // Lọc ra các việc của ngày hôm trước bị quá hạn nhưng chưa hoàn thành
            const overdueTodos = todos.filter(t => t.date && t.date < todayStr && !t.completed);

            if (todayEvents.length === 0 && todayTodos.length === 0 && overdueTodos.length === 0) return null;

            return (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 font-sans animate-in fade-in">
                    <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-blue-100 overflow-hidden flex flex-col max-h-[85vh]">
                        <div className="bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-5 text-center relative shrink-0">
                            <Bell className="mx-auto mb-2 text-yellow-300 animate-bounce" size={32} />
                            <h3 className="text-lg font-bold">Lịch Trình & Nhắc Việc Buổi Sáng</h3>
                            <p className="text-xs text-blue-100 mt-1">Hệ thống tổng hợp các công việc quan trọng trong ngày của bạn</p>
                            <button onClick={onClose} className="absolute right-4 top-4 text-white/80 hover:text-white"><X size={20}/></button>
                        </div>
                        
                        <div className="p-5 overflow-y-auto flex-1 space-y-5 text-slate-700 no-scrollbar">
                            {/* CẢNH BÁO QUÁ HẠN TỪ HÔM QUA */}
                            {overdueTodos.length > 0 && (
                                <div className="bg-amber-50 border border-amber-200 rounded-xl p-3.5">
                                    <h4 className="text-amber-800 font-bold text-xs flex items-center gap-1.5 uppercase mb-2">
                                        <AlertCircle size={15} className="text-amber-600 animate-pulse" /> Việc Chưa Xong Quá Hạn
                                    </h4>
                                    <ul className="space-y-1.5">
                                        {overdueTodos.map((t, idx) => (
                                            <li key={idx} className="text-xs text-amber-900 bg-white/60 p-2 rounded border border-amber-100 flex justify-between">
                                                <span>• {t.text}</span>
                                                <span className="text-[10px] font-mono bg-amber-200 px-1.5 py-0.5 rounded text-amber-800">{t.date}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            )}

                            {/* SỰ KIỆN / LỊCH HỌP HÔM NAY */}
                            {todayEvents.length > 0 && (
                                <div className="bg-blue-50 border border-blue-200 rounded-xl p-3.5">
                                    <h4 className="text-blue-800 font-bold text-xs flex items-center gap-1.5 uppercase mb-2">
                                        <CalendarDays size={15} className="text-blue-600" /> Sự Kiện & Lịch Họp Hôm Nay
                                    </h4>
                                    <div className="space-y-1.5">
                                        {todayEvents.map((e, idx) => (
                                            <div key={idx} className="text-xs text-slate-800 bg-white p-2 rounded border border-blue-100 shadow-sm">
                                                <div className="font-bold text-blue-900">{e.title}</div>
                                                {e.desc && <p className="text-[11px] text-slate-500 mt-0.5">{e.desc}</p>}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* VIỆC CẦN LÀM HÔM NAY */}
                            {todayTodos.length > 0 && (
                                <div className="bg-green-50 border border-green-200 rounded-xl p-3.5">
                                    <h4 className="text-green-800 font-bold text-xs flex items-center gap-1.5 uppercase mb-2">
                                        <CheckSquare size={15} className="text-green-600" /> Kế Hoạch Cần Làm Hôm Nay
                                    </h4>
                                    <ul className="space-y-1.5">
                                        {todayTodos.map((t, idx) => (
                                            <li key={idx} className="text-xs text-green-900 bg-white p-2 rounded border border-green-100 flex items-center gap-2">
                                                <span className="w-1.5 h-1.5 bg-green-500 rounded-full shrink-0"></span>
                                                <span>{t.text}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            )}
                        </div>

                        <div className="p-4 bg-slate-50 border-t flex shrink-0">
                            <button onClick={onClose} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-2.5 rounded-xl shadow-md transition transform active:scale-95">
                                Đã hiểu, bắt đầu ngày mới
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- CẤU PHẦN CHÍNH ỨNG DỤNG (APP) ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('calendar');
            const [currentDate, setCurrentDate] = useState(new Date());
            const [viewingMonth, setViewingMonth] = useState(new Date());
            const [theme, setTheme] = useState({ bgColor: '#f3f4f6', noteColor: '#FEFCE8', textColor: '#1F2937' });
            
            const [todos, setTodos] = useState([]);
            const [notes, setNotes] = useState([]);
            const [events, setEvents] = useState([]);
            
            const [newTodo, setNewTodo] = useState('');
            const [newNoteText, setNewNoteText] = useState('');
            const [newNoteColor, setNewNoteColor] = useState('#FEFCE8');
            const [newEventTitle, setNewEventTitle] = useState('');
            const [newEventDesc, setNewEventDesc] = useState('');
            
            const [searchQuery, setSearchQuery] = useState('');
            const [showSettings, setShowSettings] = useState(false);
            const [showMenu, setShowMenu] = useState(false);
            const [connectionError, setConnectionError] = useState(false);
            const [animClass, setAnimClass] = useState('');
            
            // Khóa bảo vệ PIN cục bộ
            const [isLocked, setIsLocked] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [pinConfig, setPinConfig] = useState({ enableLock: false, appPassword: '' });

            // State điều khiển Pop-up nổi thông minh buổi sáng
            const [showReminder, setShowReminder] = useState(false);

            const firebaseApp = useMemo(() => initializeApp(MANUAL_CONFIG), []);
            const auth = useMemo(() => getAuth(firebaseApp), [firebaseApp]);
            const db = useMemo(() => getFirestore(firebaseApp), [firebaseApp]);
            const appId = MANUAL_CONFIG.projectId;

            // 1. KÍCH HOẠT CHẾ ĐỘ OFFLINE PERSISTENCE CỦA FIREBASE FIRESTORE
            useEffect(() => {
                enableIndexedDbPersistence(db).catch((err) => {
                    if (err.code === 'failed-precondition') {
                        console.warn("Chế độ Offline không thể bật do có nhiều tab đang chạy.");
                    } else if (err.code === 'unimplemented') {
                        console.warn("Trình duyệt không hỗ trợ lưu trữ cơ sở dữ liệu ngoại tuyến.");
                    }
                });
            }, [db]);

            // 2. ĐĂNG KÝ SERVICE WORKER CHẠY OFFLINE & XIN QUYỀN THÔNG BÁO HỆ THỐNG
            useEffect(() => {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./sw.js')
                    .then((reg) => {
                        console.log('Đã cấu hình Service Worker PWA thành công với scope:', reg.scope);
                        
                        // Yêu cầu quyền thông báo đẩy ngoài màn hình khóa
                        if ('Notification' in window && Notification.permission === 'default') {
                            Notification.requestPermission().then(permission => {
                                if (permission === 'granted') {
                                    console.log('Người dùng đã cấp quyền Notification!');
                                }
                            });
                        }
                    })
                    .catch((err) => console.error('Lỗi thiết lập Service Worker:', err));
                }
            }, []);

            // Lắng nghe trạng thái mạng để thông báo Toast thân thiện
            useEffect(() => {
                const handleOnline = () => {
                    setConnectionError(false);
                    toast.success("Đã kết nối mạng trở lại! Dữ liệu đang đồng bộ...", { position: "top-center" });
                };
                const handleOffline = () => {
                    setConnectionError(true);
                    toast.warning("Bạn đang chạy ở chế độ Ngoại tuyến. Các tác vụ vẫn hoạt động bình thường.", { position: "top-center", autoClose: 4000 });
                };

                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                if (!navigator.onLine) setConnectionError(true);

                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);

            useEffect(() => {
                return onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    setLoading(false);
                    if (!u) {
                        setTodos([]); setNotes([]); setEvents([]);
                        setIsLocked(false);
                    }
                });
            }, [auth]);

            // Kiểm tra tham số URL (?open_reminder=true) từ thông báo đẩy hoặc tự quét bật Pop-up nổi buổi sáng
            useEffect(() => {
                if (user && !loading) {
                    const urlParams = new URLSearchParams(window.location.search);
                    const forceOpen = urlParams.get('open_reminder') === 'true';
                    
                    // Nếu bấm từ thông báo hoặc mở app vào khung giờ sáng (5h-10h sáng) thì kích hoạt Pop-up nổi
                    const currentHour = new Date().getHours();
                    if (forceOpen || (currentHour >= 5 && currentHour <= 10)) {
                        // Trì hoãn một chút đợi dữ liệu Firestore nạp xong dưới local
                        setTimeout(() => {
                            setShowReminder(true);
                        }, 1500);
                    }
                }
            }, [user, loading]);

            useEffect(() => {
                if (!user) return;
                const unsub = onSnapshot(doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'lock'), (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        setPinConfig({ enableLock: data.enableLock || false, appPassword: data.appPassword || '' });
                        if (data.enableLock && data.appPassword) { setIsLocked(true); } 
                        else { setIsLocked(false); }
                    } else {
                        const savedPassword = localStorage.getItem('vt_app_password') || '';
                        const savedEnable = localStorage.getItem('vt_enable_lock') === 'true';
                        setPinConfig({ enableLock: savedEnable, appPassword: savedPassword });
                        setIsLocked(savedEnable && savedPassword !== '');
                    }
                }, () => {
                    // Dùng dự phòng offline nếu mất mạng hoàn toàn
                    const savedPassword = localStorage.getItem('vt_app_password') || '';
                    const savedEnable = localStorage.getItem('vt_enable_lock') === 'true';
                    setPinConfig({ enableLock: savedEnable, appPassword: savedPassword });
                    setIsLocked(savedEnable && savedPassword !== '');
                });
                return unsub;
            }, [user, db, appId]);

            useEffect(() => {
                if (!user) return;
                const unsub = onSnapshot(doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'theme'), (snap) => {
                    if (snap.exists()) setTheme(snap.data());
                }, () => {
                    const savedBg = localStorage.getItem('vt_theme_bg') || '#f3f4f6';
                    const savedText = localStorage.getItem('vt_theme_text') || '#1F2937';
                    setTheme({ bgColor: savedBg, noteColor: '#FEFCE8', textColor: savedText });
                });
                return unsub;
            }, [user, db, appId]);

            useEffect(() => {
                if (!user) return;
                const qTodo = query(collection(db, 'artifacts', appId, 'users', user.uid, 'todos'), orderBy('createdAt', 'desc'));
                const unsub = onSnapshot(qTodo, (snap) => {
                    setTodos(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                }, err => { console.warn("Lấy danh sách Todos offline: sử dụng bộ đệm máy."); });
                return unsub;
            }, [user, db, appId]);

            useEffect(() => {
                if (!user) return;
                const qNote = query(collection(db, 'artifacts', appId, 'users', user.uid, 'notes'), orderBy('createdAt', 'desc'));
                const unsub = onSnapshot(qNote, (snap) => {
                    setNotes(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                }, err => { console.warn("Lấy danh sách Ghi chú offline: sử dụng bộ đệm máy."); });
                return unsub;
            }, [user, db, appId]);

            useEffect(() => {
                if (!user) return;
                const qEvent = query(collection(db, 'artifacts', appId, 'users', user.uid, 'events'), orderBy('createdAt', 'desc'));
                const unsub = onSnapshot(qEvent, (snap) => {
                    setEvents(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                }, err => { console.warn("Lấy danh sách Sự kiện offline: sử dụng bộ đệm máy."); });
                return unsub;
            }, [user, db, appId]);

            const handleSaveTheme = async (newTheme) => {
                setTheme(newTheme);
                setShowSettings(false);
                localStorage.setItem('vt_theme_bg', newTheme.bgColor);
                localStorage.setItem('vt_theme_text', newTheme.textColor);
                if (user) {
                    try { await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'theme'), newTheme); } 
                    catch (e) { console.error(e); }
                }
            };

            const handleAddTodo = async (e) => {
                e.preventDefault();
                if (!newTodo.trim()) return;
                const text = newTodo.trim();
                setNewTodo('');
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'todos'), {
                        text, completed: false, date: new Date().toLocaleDateString('en-CA'), createdAt: serverTimestamp()
                    });
                    toast.success("Đã thêm việc cần làm thành công!");
                } catch (err) { toast.error("Lỗi khi thêm dữ liệu!"); }
            };

            const toggleTodo = async (id, currentStatus) => {
                try { await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'todos', id), { completed: !currentStatus }); } 
                catch (err) { toast.error("Lỗi đồng bộ dữ liệu!"); }
            };

            const deleteTodo = async (id) => {
                try { await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'todos', id)); toast.success("Đã xóa công việc!"); } 
                catch (err) { toast.error("Lỗi xóa dữ liệu!"); }
            };

            const handleAddNote = async (e) => {
                e.preventDefault();
                if (!newNoteText.trim()) return;
                const text = newNoteText.trim();
                const color = newNoteColor;
                setNewNoteText('');
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'notes'), {
                        text, color, createdAt: serverTimestamp()
                    });
                    toast.success("Đã lưu ghi chú mới!");
                } catch (err) { toast.error("Lỗi lưu ghi chú!"); }
            };

            const deleteNote = async (id) => {
                try { await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'notes', id)); toast.success("Đã xóa ghi chú!"); } 
                catch (err) { toast.error("Lỗi xóa ghi chú!"); }
            };

            const handleAddEvent = async (e) => {
                e.preventDefault();
                if (!newEventTitle.trim()) return;
                const title = newEventTitle.trim();
                const desc = newEventDesc.trim();
                const dateStr = currentDate.toLocaleDateString('en-CA');
                setNewEventTitle(''); setNewEventDesc('');
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'events'), {
                        title, desc, date: dateStr, createdAt: serverTimestamp()
                    });
                    sendNotification("Sự kiện mới", title);
                    toast.success("Đã thêm sự kiện vào lịch!");
                } catch (err) { toast.error("Lỗi thêm sự kiện!"); }
            };

            const deleteEvent = async (id) => {
                try { await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'events', id)); toast.success("Đã xóa sự kiện!"); } 
                catch (err) { toast.error("Lỗi xóa sự kiện!"); }
            };

            const handleUnlock = (e) => {
                e.preventDefault();
                if (pinInput === pinConfig.appPassword) { setIsLocked(false); setPinInput(''); } 
                else { toast.error("Mã PIN bảo mật không chính xác!"); }
            };

            const handleLogout = () => {
                signOut(auth).then(() => { toast.info("Đã đăng xuất tài khoản."); });
            };

            const handleMonthChange = (direction) => {
                setAnimClass(direction > 0 ? 'anim-next' : 'anim-prev');
                const next = new Date(viewingMonth.getFullYear(), viewingMonth.getMonth() + direction, 1);
                setViewingMonth(next);
            };

            const calendarCells = useMemo(() => {
                const year = viewingMonth.getFullYear();
                const month = viewingMonth.getMonth();
                const firstDay = new Date(year, month, 1);
                const startDayOfWeek = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
                const totalDays = new Date(year, month + 1, 0).getDate();
                const cells = [];
                for (let i = 0; i < startDayOfWeek; i++) { cells.push(null); }
                for (let day = 1; day <= totalDays; day++) { cells.push(new Date(year, month, day)); }
                return cells;
            }, [viewingMonth]);

            const selectedDateEvents = useMemo(() => {
                const dStr = currentDate.toLocaleDateString('en-CA');
                return events.filter(e => e.date === dStr);
            }, [events, currentDate]);

            const versesCount = DEFAULT_VERSES.length;
            const dailyVerseIdx = useMemo(() => {
                const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
                return dayOfYear % versesCount;
            }, [versesCount]);

            if (loading) {
                return (
                    <div className="flex h-screen items-center justify-center bg-gray-50 text-slate-500 text-sm font-sans gap-2">
                        <RefreshCw className="animate-spin text-blue-600" size={20} />
                        Đang đồng bộ dữ liệu bảo mật...
                    </div>
                );
            }

            if (!user) return <AuthScreen auth={auth} appId={appId} />;

            if (isLocked) {
                return (
                    <div className="flex h-screen items-center justify-center bg-slate-900 text-white p-6 font-sans">
                        <form onSubmit={handleUnlock} className="w-full max-w-sm bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl text-center space-y-4">
                            <Lock className="mx-auto text-amber-500" size={40} />
                            <div>
                                <h3 className="text-lg font-bold">Ứng Dụng Đang Khóa</h3>
                                <p className="text-xs text-slate-400 mt-1">Vui lòng nhập mã PIN bảo mật cá nhân để truy cập Ghi chú & Lịch</p>
                            </div>
                            <input type="password" maxLength={12} required autoFocus className="w-full text-center px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500 text-xl font-bold tracking-widest text-white" placeholder="••••••" value={pinInput} onChange={e => setPinInput(e.target.value)} />
                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg text-sm transition">Xác Nhận Mở Khóa</button>
                            <button type="button" onClick={handleLogout} className="text-xs text-slate-500 hover:text-slate-400">Đăng xuất tài khoản</button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col pb-20 font-sans transition-colors duration-300" style={{ backgroundColor: theme.bgColor }}>
                    <header className="bg-slate-900 text-white shadow-md sticky top-0 z-40">
                        <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                            <h1 className="font-extrabold text-base tracking-tight flex items-center gap-2">
                                <CalendarDays className="text-red-500" size={20} /> Lịch Xuân Lai PWA
                            </h1>
                            <div className="flex items-center gap-2 relative">
                                <button onClick={() => setShowSettings(true)} className="p-2 hover:bg-slate-800 rounded-full text-slate-300 hover:text-white transition"><Settings size={18} /></button>
                                <button onClick={() => setShowMenu(!showMenu)} className="p-2 hover:bg-slate-800 rounded-full text-slate-300 hover:text-white transition"><MoreVertical size={18} /></button>
                                {showMenu && (
                                    <div className="absolute right-0 top-11 bg-white rounded-xl shadow-xl py-1 w-44 border border-gray-100 fade-in text-xs">
                                        <div className="px-4 py-2 border-b border-gray-100 bg-slate-50 text-slate-400 font-mono truncate text-[10px]">{user.email}</div>
                                        <button onClick={() => { setActiveTab('verses'); setShowMenu(false); }} className="w-full px-4 py-2.5 hover:bg-slate-50 text-left flex items-center gap-2 text-slate-700"><BookOpen size={14}/> Kinh Pháp Cú</button>
                                        <button onClick={() => { setActiveTab('timetable'); setShowMenu(false); }} className="w-full px-4 py-2.5 hover:bg-slate-50 text-left flex items-center gap-2 text-slate-700"><Table size={14}/> Thời Khóa Biểu</button>
                                        <button onClick={handleLogout} className="w-full px-4 py-2.5 hover:bg-red-50 text-left flex items-center gap-2 text-red-600 font-bold border-t"><LogOut size={14}/> Đăng Xuất</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-4xl w-full mx-auto px-3 py-4">
                        {activeTab === 'calendar' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="md:col-span-2 space-y-4">
                                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                        <div className="bg-slate-800 text-white p-4 flex justify-between items-center select-none">
                                            <button onClick={() => handleMonthChange(-1)} className="p-1.5 hover:bg-slate-700 rounded-lg transition"><ChevronLeft size={18} /></button>
                                            <h2 className="font-bold text-sm uppercase tracking-wider font-sans">Tháng {viewingMonth.getMonth() + 1} / {viewingMonth.getFullYear()}</h2>
                                            <button onClick={() => handleMonthChange(1)} className="p-1.5 hover:bg-slate-700 rounded-lg transition"><ChevronRight size={18} /></button>
                                        </div>
                                        <div className="p-3 grid grid-cols-7 gap-1 text-center font-bold text-slate-400 text-[11px] uppercase tracking-wider bg-slate-50 border-b border-gray-100">
                                            {['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map((d, i) => <div key={d} className={i === 6 ? 'text-red-500' : ''}>{d}</div>)}
                                        </div>
                                        <div 
                                            className={`p-3 grid grid-cols-7 gap-1.5 perspective-container ${animClass}`}
                                            onAnimationEnd={() => setAnimClass('')}
                                        >
                                            {calendarCells.map((date, idx) => {
                                                if (!date) return <div key={`empty-${idx}`} className="aspect-square"></div>;
                                                const isToday = date.toDateString() === new Date().toDateString();
                                                const isSelected = date.toDateString() === currentDate.toDateString();
                                                const hasEvent = events.some(e => e.date === date.toLocaleDateString('en-CA'));
                                                const lunar = getLunarDate(date);
                                                const isSunday = date.getDay() === 0;

                                                return (
                                                    <button
                                                        key={date.toISOString()}
                                                        onClick={() => setCurrentDate(date)}
                                                        className={`aspect-square rounded-xl flex flex-col items-center justify-center p-1 relative transition border text-slate-800 ${
                                                            isSelected ? 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-200' :
                                                            isToday ? 'bg-red-50 border-red-300 text-red-600 font-bold' : 'bg-white border-gray-100 hover:bg-slate-50'
                                                        }`}
                                                    >
                                                        <span className={`text-xs font-bold font-sans ${isSunday && !isSelected ? 'text-red-500' : ''}`}>{date.getDate()}</span>
                                                        <span className={`text-[9px] mt-0.5 opacity-70 font-sans ${isSelected ? 'text-blue-100' : 'text-slate-400'}`}>{lunar}</span>
                                                        {hasEvent && <span className={`absolute bottom-1 w-1 h-1 rounded-full ${isSelected ? 'bg-white' : 'bg-blue-600'}`}></span>}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 font-sans">
                                        <div className="flex items-center gap-1.5 text-xs text-blue-600 font-bold uppercase tracking-wider mb-2">
                                            <BookOpen size={14} /> Pháp Cú Ngày Hôm Nay
                                        </div>
                                        <p className="text-slate-700 italic text-xs leading-relaxed whitespace-pre-line border-l-2 border-blue-500 pl-3 py-1 bg-slate-50 rounded-r-lg">
                                            {DEFAULT_VERSES[dailyVerseIdx]}
                                        </p>
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center text-center">
                                        <div className="text-red-600 font-extrabold text-sm uppercase tracking-wider">{getDayOfWeek(currentDate)}</div>
                                        <div className="text-4xl font-black text-slate-800 my-1 font-sans">{currentDate.getDate()}</div>
                                        <div className="text-xs font-bold text-slate-500">Tháng {currentDate.getMonth() + 1} năm {currentDate.getFullYear()}</div>
                                        
                                        <div className="w-full border-t border-dashed my-3"></div>
                                        
                                        <div className="bg-red-50 text-red-700 w-full py-2 rounded-xl text-xs font-bold">
                                            Âm Lịch: Ngày {getLunarDetails(currentDate).day} tháng {getLunarDetails(currentDate).month}
                                        </div>
                                    </div>

                                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                                        <h3 className="font-bold text-xs text-slate-800 uppercase tracking-wider flex items-center gap-1.5"><Clock size={15} className="text-blue-600" /> Sự Kiện Trong Ngày</h3>
                                        <form onSubmit={handleAddEvent} className="space-y-2">
                                            <input type="text" required placeholder="Tên cuộc họp, sự kiện..." className="w-full text-xs px-3 py-2 border rounded-xl outline-none focus:border-blue-400 bg-slate-50 text-slate-800" value={newEventTitle} onChange={e => setNewEventTitle(e.target.value)} />
                                            <input type="text" placeholder="Mô tả hoặc địa điểm (nếu có)..." className="w-full text-xs px-3 py-2 border rounded-xl outline-none focus:border-blue-400 bg-slate-50 text-slate-800" value={newEventDesc} onChange={e => setNewEventDesc(e.target.value)} />
                                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-2 rounded-xl flex items-center justify-center gap-1 shadow-md"><Plus size={14}/> Thêm Sự Kiện</button>
                                        </form>

                                        <div className="space-y-2 max-h-48 overflow-y-auto no-scrollbar pt-1">
                                            {selectedDateEvents.length === 0 ? (
                                                <div className="text-slate-400 text-center py-4 text-xs">Chưa có sự kiện nào được ghi nhận.</div>
                                            ) : (
                                                selectedDateEvents.map(e => (
                                                    <div key={e.id} className="p-2.5 bg-slate-50 rounded-xl border border-gray-100 flex justify-between items-start gap-2 group animate-in fade-in">
                                                        <div className="min-w-0">
                                                            <div className="font-bold text-xs text-slate-800 truncate">{e.title}</div>
                                                            {e.desc && <div className="text-[10px] text-slate-500 mt-0.5 truncate">{e.desc}</div>}
                                                        </div>
                                                        <button onClick={() => deleteEvent(e.id)} className="text-slate-300 hover:text-red-500 p-0.5 shrink-0 transition"><Trash2 size={13}/></button>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'todos' && (
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 max-w-md mx-auto space-y-4">
                                <div className="flex items-center gap-2 border-b pb-3">
                                    <CheckSquare className="text-blue-600" size={20} />
                                    <h2 className="font-bold text-sm text-slate-800">Kế Hoạch & Việc Cần Làm</h2>
                                </div>
                                <form onSubmit={handleAddTodo} className="flex gap-2">
                                    <input type="text" required placeholder="Nhập nhiệm vụ, nội dung văn bản chỉ đạo..." className="flex-1 text-xs px-3 py-2.5 border rounded-xl outline-none focus:border-blue-400 bg-slate-50 text-slate-800" value={newTodo} onChange={e => setNewTodo(e.target.value)} />
                                    <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-4 rounded-xl flex items-center gap-1 shadow-md"><Plus size={14}/> Thêm</button>
                                </form>
                                <div className="space-y-2 max-h-[50vh] overflow-y-auto no-scrollbar pr-1">
                                    {todos.length === 0 ? (
                                        <div className="text-slate-400 text-center py-8 text-xs">Tuyệt vời! Không còn việc nào chưa hoàn thành.</div>
                                    ) : (
                                        todos.map(t => (
                                            <div key={t.id} className="flex items-center justify-between p-2.5 bg-slate-50 hover:bg-slate-100/70 rounded-xl border border-gray-100 transition gap-3 animate-in fade-in">
                                                <button onClick={() => toggleTodo(t.id, t.completed)} className="flex items-center gap-2.5 min-w-0 text-left">
                                                    <span className={`w-4 h-4 rounded-md border flex items-center justify-center shrink-0 transition ${t.completed ? 'bg-green-500 border-green-500 text-white' : 'bg-white border-gray-300'}`}>
                                                        {t.completed && <Check size={12} strokeWidth={3} />}
                                                    </span>
                                                    <span className={`text-xs truncate ${t.completed ? 'line-through text-slate-400' : 'text-slate-800 font-medium'}`}>{t.text}</span>
                                                </button>
                                                <button onClick={() => deleteTodo(t.id)} className="text-slate-300 hover:text-red-500 p-1 shrink-0 transition"><Trash2 size={14}/></button>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'notes' && (
                            <div className="space-y-4">
                                <form onSubmit={handleAddNote} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-wrap gap-3 items-end justify-between">
                                    <div className="flex-1 min-w-[200px] space-y-2">
                                        <label className="block text-xs font-bold text-slate-700 uppercase">Nội dung ghi chú mới</label>
                                        <input type="text" required placeholder="Ghi chú nhanh thông tin, sự kiện phát sinh..." className="w-full text-xs px-3 py-2 border rounded-xl outline-none focus:border-blue-400 bg-slate-50 text-slate-800" value={newNoteText} onChange={e => setNewNoteText(e.target.value)} />
                                    </div>
                                    <div className="space-y-1.5 shrink-0">
                                        <span className="block text-[10px] font-bold text-slate-400 uppercase">Màu thẻ</span>
                                        <div className="flex gap-1 bg-slate-50 p-1.5 rounded-xl border">
                                            {NOTE_COLORS.slice(0,6).map(c => (
                                                <button key={c} type="button" onClick={() => setNewNoteColor(c)} className={`w-5 h-5 rounded-full border transition relative ${newNoteColor === c ? 'scale-110 ring-2 ring-blue-400' : 'hover:scale-105'}`} style={{ backgroundColor: c }}></button>
                                            ))}
                                        </div>
                                    </div>
                                    <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-2.5 px-4 rounded-xl flex items-center justify-center gap-1 shadow-md shrink-0 w-full sm:w-auto"><Plus size={14}/> Lưu thẻ</button>
                                </form>

                                {notes.length === 0 ? (
                                    <div className="text-slate-400 text-center py-12 text-xs bg-white rounded-2xl border border-dashed">Chưa có ghi chú nào được lưu trữ.</div>
                                ) : (
                                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3.5">
                                        {notes.map(n => (
                                            <div key={n.id} className="p-3.5 rounded-2xl shadow-sm border border-black/5 relative min-h-[90px] flex flex-col justify-between group text-slate-800 transition transform hover:-translate-y-0.5 animate-in fade-in" style={{ backgroundColor: n.color || '#FEFCE8' }}>
                                                <p className="text-xs leading-relaxed break-words font-medium pr-4">{n.text}</p>
                                                <button onClick={() => deleteNote(n.id)} className="absolute right-2.5 top-2.5 text-slate-400 hover:text-red-500 p-0.5 transition"><X size={13}/></button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'verses' && (
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4 max-w-lg mx-auto font-sans">
                                <div className="flex items-center justify-between border-b pb-3 flex-wrap gap-2">
                                    <div className="flex items-center gap-2">
                                        <BookOpen className="text-blue-600" size={20} />
                                        <h2 className="font-bold text-sm text-slate-800">Kinh Pháp Cú Trọn Bộ</h2>
                                    </div>
                                    <div className="relative text-xs">
                                        <Search className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400" size={14} />
                                        <input type="text" placeholder="Tìm kiếm câu kinh..." className="pl-8 pr-3 py-1.5 bg-slate-100 rounded-lg outline-none text-slate-800 focus:bg-slate-200 border border-transparent focus:border-slate-300 max-w-[160px]" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                                    </div>
                                </div>
                                <div className="space-y-3 max-h-[60vh] overflow-y-auto no-scrollbar pr-1">
                                    {DEFAULT_VERSES.map((v, i) => {
                                        if (searchQuery.trim() && !v.toLowerCase().includes(searchQuery.toLowerCase())) return null;
                                        return (
                                            <div key={i} className={`p-3 rounded-xl border text-xs leading-relaxed whitespace-pre-line text-slate-700 ${i === dailyVerseIdx ? 'bg-blue-50/70 border-blue-200 font-medium' : 'bg-slate-50/50 border-gray-100'}`}>
                                                <div className="text-[10px] font-bold text-blue-600 font-mono mb-1 uppercase">Bài số {i + 1} {i === dailyVerseIdx && "• [ Bài học hôm nay ]"}</div>
                                                {v}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {activeTab === 'timetable' && <TimeTableView user={user} db={db} appId={appId} theme={theme} />}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 shadow-2xl z-40 select-none">
                        <div className="max-w-4xl mx-auto flex justify-around text-slate-400 py-1.5">
                            <button onClick={() => { setActiveTab('calendar'); window.scrollTo(0,0); }} className={`flex flex-col items-center gap-0.5 px-3 py-1 transition ${activeTab === 'calendar' ? 'text-blue-400 font-bold' : 'hover:text-white'}`}>
                                <Calendar size={18} />
                                <span className="text-[9px]">Lịch</span>
                            </button>
                            <button onClick={() => { setActiveTab('todos'); window.scrollTo(0,0); }} className={`flex flex-col items-center gap-0.5 px-3 py-1 transition ${activeTab === 'todos' ? 'text-blue-400 font-bold' : 'hover:text-white'}`}>
                                <CheckSquare size={18} />
                                <span className="text-[9px]">Kế Hoạch</span>
                            </button>
                            <button onClick={() => { setActiveTab('notes'); window.scrollTo(0,0); }} className={`flex flex-col items-center gap-0.5 px-3 py-1 transition ${activeTab === 'notes' ? 'text-blue-400 font-bold' : 'hover:text-white'}`}>
                                <StickyNote size={18} />
                                <span className="text-[9px]">Ghi Chú</span>
                            </button>
                        </div>
                    </nav>

                    {showSettings && <SettingsModal theme={theme} onSave={handleSaveTheme} onClose={() => setShowSettings(false)} auth={auth} db={db} appId={appId} />}
                    
                    {/* POP-UP NỔI HIỂN THỊ TRANG THÁI MẤT KẾT NỐI MẠNG NHƯNG CHO PHÉP BỎ QUA ĐỂ CHẠY OFFLINE */}
                    {connectionError && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 font-sans animate-in fade-in">
                            <div className="bg-white p-6 rounded-2xl shadow-2xl text-center max-w-xs border text-slate-800">
                                <WifiOff size={44} className="text-amber-500 mx-auto mb-2 animate-pulse" />
                                <h3 className="font-bold text-sm">Trạng Thái Ngoại Tuyến</h3>
                                <p className="text-xs text-slate-500 my-2 leading-relaxed">Chúng tôi tạm thời không kết nối được với đám mây. Bạn vẫn có thể tiếp tục sử dụng ứng dụng ở chế độ Offline bình thường.</p>
                                <div className="flex gap-2 mt-4 text-xs font-bold">
                                    <button onClick={() => setConnectionError(false)} className="flex-1 bg-gray-100 hover:bg-gray-200 text-slate-700 py-2.5 rounded-xl border transition">Bỏ qua</button>
                                    <button onClick={() => window.location.reload()} className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl shadow transition">Thử lại</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* BẬT HIỂN THỊ POP-UP NỔI BÁO CÔNG VIỆC CHỦ ĐỘNG */}
                    <ReminderModal isOpen={showReminder} onClose={() => setShowReminder(false)} todos={todos} events={events} />

                    <ToastContainer position="top-center" autoClose={3000} hideProgressBar={false} newestOnTop={false} closeOnClick rtl={false} />
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker đã đăng ký thành công!', reg.scope))
                    .catch(err => console.log('Đăng ký Service Worker thất bại:', err));
            });
        }
    </script>
</body>
</html>
</body>
</html>
